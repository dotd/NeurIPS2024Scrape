  .facet .panel { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; width: max-content;

<div id="add" style="flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;
border-bottom:1px solid #ddd;background:#fffbea">
  <b>➕ Add a paper</b>

         style="flex:1;min-width:240px;padding:5px 8px;border:1px solid #bbb;border-radius:6px">
  <button id="addGo" style="padding:5px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer">Add link</button>
  <span>or</span>
  <label style="padding:5px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer">📄 Upload PDFs
    <input id="addFile" type="file" accept="application/pdf,.pdf" multiple hidden></label>
  <span id="addMsg" style="color:#666"></span>
</div>
<script>
async function addPaper(opts, what) {
  const msg = document.getElementById('addMsg');
  if (!location.protocol.startsWith('http'))
    return msg.textContent = 'run: uv run python website/serve.py, then open http://127.0.0.1:8026/Papers/';
  msg.textContent = `⏳ Adding ${what}: downloading, extracting figures, robots, backbones, affiliations… (~30 s)`;
  try {
    const r = await fetch('add', {method: 'POST', ...opts}), j = await r.json();
    if (!r.ok) throw new Error(j.error);
    if (j.exists) {  // nothing added: say so and scroll to it, no Claude calls
      const i = rows.findIndex(x => x[0] === j.id);
      msg.textContent = 'ℹ️ Already in the list: ' + (i >= 0 ? rows[i][1] : j.id);
      if (i >= 0 && dets[i].isConnected) dets[i].scrollIntoView();
      return;
    }
    location.hash = 'claude:' + j.id; location.reload();  // show it now; Claude runs after the reload (below)
  } catch (e) { msg.textContent = '⚠️ ' + e.message; }
}
// after an add the page reloads with #claude:<id>[,<id>…]: show the first paper, then press 📝 Summarize and the
// Claude HTML button for each, one paper at a time; the server finishes a paper even if the tab closes.
// Runs before the page script reads the #.
if (location.hash.startsWith('#claude:')) (async () => {
  const ids = decodeURIComponent(location.hash.slice(8)).split(','), msg = document.getElementById('addMsg'), errs = [];
  history.replaceState(null, '', '#' + encodeURIComponent(ids[0]));  // the page script scrolls to it, then clears it
  for (const [n, pid] of ids.entries()) {
    msg.textContent = `⏳ Added. Claude is summarizing and making the HTML version${ids.length > 1 ? ` of ${n + 1}/${ids.length}` : ''}… (a few minutes each)`;
    errs.push(...(await Promise.all(['summarize/', 'html_claude/'].map(p => fetch(p + pid, {method: 'POST'})
      .then(async x => x.ok ? '' : `${pid}: ${(await x.json()).error}`).catch(e => e.message)))).filter(Boolean));
  }
  if (errs.length) alert('Added, but: ' + errs.join('; '));
  location.hash = ids[0]; location.reload();  // rebuilt with the summaries and HTML links
})();
document.getElementById('addGo').onclick = () => {
  const u = document.getElementById('addUrl').value.trim();
  if (u) addPaper({headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: u})}, 'the link');
};
document.getElementById('addUrl').onkeydown = e => { if (e.key === 'Enter') document.getElementById('addGo').click(); };
document.getElementById('addFile').onchange = async e => {
  const files = [...e.target.files], msg = document.getElementById('addMsg');
  if (files.length === 1) return addPaper({headers: {'Content-Type': 'application/pdf', 'X-Filename': encodeURIComponent(files[0].name)}, body: files[0]}, files[0].name);
  if (!files.length) return;
  if (!location.protocol.startsWith('http'))
    return msg.textContent = 'run: uv run python website/serve.py, then open http://127.0.0.1:8026/Papers/';
  const added = [], errs = [];
  for (const [n, f] of files.entries()) {  // one at a time: the server adds one paper at a time anyway
    msg.textContent = `⏳ Adding ${n + 1}/${files.length}: ${f.name} (~30 s each)`;
    try {
      const r = await fetch('add', {method: 'POST', body: f,
                                    headers: {'Content-Type': 'application/pdf', 'X-Filename': encodeURIComponent(f.name)}});
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      if (!j.exists) added.push(j.id);
    } catch (err) { errs.push(`${f.name}: ${err.message}`); }
  }
  e.target.value = '';  // picking the same files again fires onchange again
  if (errs.length) alert(`Added ${added.length} of ${files.length}. Failed: ` + errs.join('; '));
  if (!added.length) return msg.textContent = 'ℹ️ Nothing new added (already in the list or failed)';
  location.hash = 'claude:' + added.join(','); location.reload();
};
</script>

<script id="data" type="application/json">{"columns": ["id", "title", "authors", "abstract", "🏷️ keywords", "source", "pdf", "local_pdf", "💻 github", "🎬 youtube", "added", "🤖 robots", "🧠 backbones", "🏢 companies", "🎓 universities"], "rows": [["arxiv-2604-23073", "RL Token: Bootstrapping Online RL with Vision-Language-Action Models", "Charles Xu, Jost Tobias Springenberg, Michael Equi, Ali Amin, Adnan Esmail, Sergey Levine, Liyiming Ke", "Vision-language-action (VLA) models can learn to perform diverse manipulation skills \"out of the box,\" but achieving the precision and speed that real-world tasks demand requires further fine-tuning -- for example, via reinforcement learning (RL). We introduce a lightweight method that enables sample-efficient online RL fine-tuning of pretrained VLAs using just a few hours of real-world practice. We (1) adapt the VLA to expose an \"RL token,\" a compact readout representation that preserves task-relevant pretrained knowledge while serving as an efficient interface for online RL, and (2) train a small actor-critic head on this RL token to refine the actions, while anchoring the learned policy to the VLA. Online RL with the RL token (RLT) makes it possible to fine-tune even large VLAs with RL quickly and efficiently. Across four real-robot tasks (screw installation, zip tie fastening, charger insertion, and Ethernet insertion), RLT improves the speed on the hardest part of the task by up to 3x and raises success rates significantly within minutes to a few hours of practice. It can even surpass the speed of human teleoperation on some of the tasks.", "vision-language-action models; reinforcement learning; robotic manipulation; robotic insertion; robot foundation models", "https://arxiv.org/abs/2604.23073", "https://arxiv.org/pdf/2604.23073", "pdfs/arxiv-2604-23073_RL Token  Bootstrapping Online RL with Vision-Language-Action Models.pdf", "https://github.com/yknxh/rlt-openpi https://github.com/Zhengsw03/RL-Token-Pi05-open https://gith zation, for example enabling a robot to fold laundry without seeing the task before, and perform challenging tasks such as operating an espresso machine out of the box at a level of performance that matches much more specialized RL-finetuned models. The main idea behind $π_{0.7}$ is to use diverse context conditioning during training. This conditioning information, contained in the prompt, makes it possible to steer the model precisely to perform many tasks with different strategies. It is conditioned not just on a language command that describes what it should do, but on additional multimodal information that also describes the manner or strategy in which it should do it, including metadata about task performance and subgoal images. This enables $π_{0.7}$ to use very diverse data, including demonstrations, potentially suboptimal (autonomous) data including failures, and data from non-robot sources. Our experiments evaluate $π_{0.7}$ across numerous tasks with multiple robot platforms, on tasks that require speed and dexterity, language following, and compositional task generalization.", "robot foundation models; vision-language-action models; instruction following; zero-shot generalization; robotic manipulation; multimodal learning", "https://arxiv.org/abs/2604.15483", "https://arxiv.org/pdf/2604.15483", "pdfs/arxiv-2604-15483_π_ 0.7    a Steerable Generalist Robotic Foundation Model with Emergent Capabilities.pdf", "", "https://www.youtube.com/watch?v=w0W4ICCMWRI", "2026-11-12 15:23", "UR5 / UR5e", "ViT; Gemma; Gemini; π0 / π0.5; Octo; RT-1 / RT-2 / RT-X", "Physical Intelligence", ""], ["arxiv-2512-22414", "Emergence of Human to Robot Transfer in Vision-Language-Action Models", "Simar Kareer, Karl Pertsch, James Darpinian, Judy Hoffman, Danfei Xu, Sergey Levine, Chelsea Finn, Suraj Nair", "Vision-language-action (VLA) models can enable broad open world generalization, but require large and diverse datasets. It is appealing to consider whether some of this data can come from human videos, which cover diverse real-world situations and are easy to obtain. However, it is difficult to train VLAs with human videos alone, and establishing a mapping between humans and robots requires manual engineering and presents a major research challenge. Drawing inspiration from advances in large language models, where the ability to learn from diverse supervision emerges with scale, we ask whether a similar phenomenon holds for VLAs that incorporate human video data. We introduce a simple co-training recipe, and find that human-to-robot transfer emerges once the VLA is pre-trained on sufficient scenes, tasks, and embodiments. Our analysis suggests that this emergent capability arises because diverse pretraining produces embodiment-agnostic representations for human and robot data. We validate these findings through a series of experiments probing human to robot skill transfer and find that with sufficiently diverse robot pre-training our method can nearly double the performance on generalization settings seen only in human data.", "vision-language-action models; human video demonstration; co-training; generalization; robot foundation models; representation alignment", "https://arxiv.org/abs/2512.22414", "https://arxiv.org/pdf/2512.22414", "pdfs/arxiv-2512-22414_Emergence of Human to Robot Transfer in Vision-Language-Action Models.pdf", "", "", "2026-11-12 15:21", "UR5 / UR5e; ARX arm", "Gemini; π0 / π0.5; Octo", "Physical Intelligence", "Georgia Institute of Technology"], ["arxiv-2511-14759", "π*0.6: a VLA That Learns From Experience", "Physical Intelligence, Ali Amin, Raichelle Aniceto, Ashwin Balakrishna, Kevin Black, Ken Conley, Grace Connors, James Darpinian, Karan Dhabalia, Jared DiCarlo, Danny Driess, Michael Equi, Adnan Esmail, Yunhao Fang, Chelsea Finn, Catherine Glossop, Thomas Godden, Ivan Goryachev, Lachy Groom, Hunter Hancock, Karol Hausman, Gashon Hussein, Brian Ichter, Szymon Jakubczak, Rowan Jen, Tim Jones, Ben Katz, Liyiming Ke, Chandra Kuchi, Marinda Lamb, Devin LeBlanc, Sergey Levine, Adrian Li-Bell, Yao Lu, Vishnu Mano, Mohith Mothukuri, Suraj Nair, Karl Pertsch, Allen Z. Ren, Charvi Sharma, Lucy Xiaoyang Shi, Laura Smith, Jost Tobias Springenberg, Kyle Stachowicz, Will Stoeckle, Alex Swerdlow, James Tanner, Marcel Torne, Quan Vuong, Anna Walling, Haohuan Wang, Blake Williams, Sukwon Yoo, Lili Yu, Ury Zhilinsky, Zhiyuan Zhou", "We study how vision-language-action (VLA) models can improve through real-world deployments via reinforcement learning (RL). We present a general-purpose method, RL with Experience and Corrections via Advantage-conditioned Policies (RECAP), that provides for RL training of VLAs via advantage conditioning. Our method incorporates heterogeneous data into the self-improvement process, including demonstrations, data from on-policy collection, and expert teleoperated interventions provided during autonomous execution. RECAP starts by pre-training a generalist VLA with offline RL, which we call $π^{*}_{0.6}$, that can then be specialized to attain high performance on downstream tasks through on-robot data collection. We show that the $π^{*}_{0.6}$ model trained with the full RECAP method can fold laundry in real homes, reliably assemble boxes, and make espresso drinks using a professional espresso machine. On some of the hardest tasks, RECAP more than doubles task throughput and roughly halves the task failure rate.", "vision-language-action models; reinforcement learning; offline q-learning; robotic manipulation; teleoperation; robot foundation models", "https://arxiv.org/abs/2511.14759", "https://arxiv.org/pdf/2511.14759", "pdfs/arxiv-2511-14759_π    _ 0.6    a VLA That Learns From Experience.pdf", "", "", "2026-11-12 15:20", "", "Gemma; π0 / π0.5", "Physical Intelligence", ""], ["arxiv-2506-07339", "Real-Time Execution of Action Chunking Flow Policies", "Kevin Black, Manuel Y. Galliker, Sergey Levine", "Modern AI systems, especially those interacting with the physical world, increasingly require real-time performance. However, the high latency of state-of-the-art generalist models, including recent vision-language action models (VLAs), poses a significant challenge. While action chunking has enabled temporal consistency in high-frequency control tasks, it does not fully address the latency problem, leading to pauses or out-of-distribution jerky movements at chunk boundaries. This paper presents a novel inference-time algorithm that enables smooth asynchronous execution of action chunking policies. Our method, real-time chunking (RTC), is applicable to any diffusion- or flow-based VLA out of the box with no re-training. It generates the next action chunk while executing the current one, \"freezing\" actions guaranteed to execute and \"inpainting\" the rest. To test RTC, we introduce a new benchmark of 12 highly dynamic tasks in the Kinetix simulator, as well as evaluate 6 challenging real-world bimanual manipulation tasks. Results demonstrate that RTC is fast, performant, and uniquely robust to inference delay, significantly improving task throughput and enabling high success rates in precise tasks $\\unicode{x2013}$ such as lighting a match $\\unicode{x2013}$ even in the presence of significant latency. See https://pi.website/research/real_time_chunking for videos.", "vision-language-action models; flow matching; efficient inference; action chunking; robotic manipulation; benchmark design", "https://arxiv.org/abs/2506.07339", "https://arxiv.org/pdf/2506.07339", "pdfs/arxiv-2506-07339_Real-Time Execution of Action Chunking Flow Policies.pdf", "", "", "2026-11-12 15:18", "", "π0 / π0.5; OpenVLA / OpenVLA-OFT", "Physical Intelligence", "University of California, Berkeley"], ["arxiv-2504-16054", "π0.5: a Vision-Language-Action Model with Open-World Generalization", "Physical Intelligence, Kevin Black, Noah Brown, James Darpinian, Karan Dhabalia, Danny Driess, Adnan Esmail, Michael Equi, Chelsea Finn, Niccolo Fusai, Manuel Y. Galliker, Dibya Ghosh, Lachy Groom, Karol Hausman, Brian Ichter, Szymon Jakubczak, Tim Jones, Liyiming Ke, Devin LeBlanc, Sergey Levine, Adrian Li-Bell, Mohith Mothukuri, Suraj Nair, Karl Pertsch, Allen Z. Ren, Lucy Xiaoyang Shi, Laura Smith, Jost Tobias Springenberg, Kyle Stachowicz, James Tanner, Quan Vuong, Homer Walke, Anna Walling, Haohuan Wang, Lili Yu, Ury Zhilinsky", "In order for robots to be useful, they must perform practically relevant tasks in the real world, outside of the lab. While vision-language-action (VLA) models have demonstrated impressive results for end-to-end robot control, it remains an open question how far such models can generalize in the wild. We describe $π_{0.5}$, a new model based on $π_{0}$ that uses co-training on heterogeneous tasks to enable broad generalization. $π_{0.5}$\\ uses data from multiple robots, high-level semantic prediction, web data, and other sources to enable broadly generalizable real-world robotic manipulation. Our system uses a combination of co-training and hybrid multi-modal examples that combine image observations, language commands, object detections, semantic subtask prediction, and low-level actions. Our experiments show that this kind of knowledge transfer is essential for effective generalization, and we demonstrate for the first time that an end-to-end learning-enabled robotic system can perform long-horizon and dexterous manipulation skills, such as cleaning a kitchen or bedroom, in entirely new homes.", "vision-language-action models; co-training; generalization; mobile manipulation; hierarchical policies; long-horizon reasoning", "https://arxiv.org/abs/2504.16054", "https://arxiv.org/pdf/2504.16054", "pdfs/arxiv-2504-16054_π_ 0.5    a Vision-Language-Action Model with Open-World Generalization.pdf", "https://github.com/Physical-Intelligence/openpi", "https://www.youtube.com/watch?v=kUu8wXcBDyY", "2026-11-12 15:17", "", "SigLIP; PaliGemma; Gemma; GPT-4 / GPT-4o / GPT-5; Gemini; π0 / π0.5; Octo; RT-1 / RT-2 / RT-X", "Physical Intelligence", ""], ["arxiv-2505-23705", "Knowledge Insulating Vision-Language-Action Models: Train Fast, Run Fast, Generalize Better", "Danny Driess, Jost Tobias Springenberg, Brian Ichter, Lili Yu, Adrian Li-Bell, Karl Pertsch, Allen Z. Ren, Homer Walke, Quan Vuong, Lucy Xiaoyang Shi, Sergey Levine", "Vision-language-action (VLA) models provide a powerful approach to training control policies for physical systems, such as robots, by combining end-to-end learning with transfer of semantic knowledge from web-scale vision-language model (VLM) training. However, the constraints of real-time control are often at odds with the design of VLMs: the most powerful VLMs have tens or hundreds of billions of parameters, presenting an obstacle to real-time inference, and operate on discrete tokens rather than the continuous-valued outputs that are required for controlling robots. To address this challenge, recent VLA models have used specialized modules for efficient continuous control, such as action experts or continuous output heads, which typically require adding new untrained parameters to the pretrained VLM backbone. While these modules improve real-time and control capabilities, it remains an open question whether they preserve or degrade the semantic knowledge contained in the pretrained VLM, and what effect they have on the VLA training dynamics. In this paper, we study this question in the context of VLAs that include a continuous diffusion or flow matching action expert, showing that naively including such experts significantly harms both training speed and knowledge transfer. We provide an extensive analysis of various design choices, their impact on performance and knowledge transfer, and propose a technique for insulating the VLM backbone during VLA training that mitigates this issue. Videos are available at https://pi.website/research/knowledge_insulation.", "vision-language-action models; flow matching; action tokenization; co-training; efficient inference; generalization", "https://arxiv.org/abs/2505.23705", "https://arxiv.org/pdf/2505.23705", "pdfs/arxiv-2505-23705_Knowledge Insulating Vision-Language-Action Models  Train Fast, Run Fast, Generalize Better.pdf", "", "", "2026-11-12 15:17", "", "π0 / π0.5; OpenVLA / OpenVLA-OFT", "Physical Intelligence", ""], ["arxiv-2502-19417", "Hi Robot: Open-Ended Instruction Following with Hierarchical Vision-Language-Action Models", "Lucy Xiaoyang Shi, Brian Ichter, Michael Equi, Liyiming Ke, Karl Pertsch, Quan Vuong, James Tanner, Anna Walling, Haohuan Wang, Niccolo Fusai, Adrian Li-Bell, Danny Driess, Lachy Groom, Sergey Levine, Chelsea Finn", "Generalist robots that can perform a range of different tasks in open-world settings must be able to not only reason about the steps needed to accomplish their goals, but also process complex instructions, prompts, and even feedback during task execution. Intricate instructions (e.g., \"Could you make me a vegetarian sandwich?\" or \"I don't like that one\") require not just the ability to physically perform the individual steps, but the ability to situate complex commands and feedback in the physical world. In this work, we describe a system that uses vision-language models in a hierarchical structure, first reasoning over complex prompts and user feedback to deduce the most appropriate next step to fulfill the task, and then performing that step with low-level actions. In contrast to direct instruction following methods that can fulfill simple commands (\"pick up the cup\"), our system can reason through complex prompts and incorporate situated feedback during task execution (\"that's not trash\"). We evaluate our system across three robotic platforms, including single-arm, dual-arm, and dual-arm mobile robots, demonstrating its ability to handle tasks such as cleaning messy tables, making sandwiches, and grocery shopping. Videos are available at https://www.pi.website/research/hirobot", "vision-language-action models; vision-language models; hierarchical policies; instruction following; robotic manipulation; long-horizon reasoning", "https://arxiv.org/abs/2502.19417", "https://arxiv.org/pdf/2502.19417", "pdfs/arxiv-2502-19417_Hi Robot  Open-Ended Instruction Following with Hierarchical Vision-Language-Action Models.pdf", "", "", "2026-11-12 15:16", "", "PaliGemma; GPT-4 / GPT-4o / GPT-5; π0 / π0.5", "Physical Intelligence", "Stanford University; University of California, Berkeley"], ["arxiv-2501-09747", "FAST: Efficient Action Tokenization for Vision-Language-Action Models", "Karl Pertsch, Kyle Stachowicz, Brian Ichter, Danny Driess, Suraj Nair, Quan Vuong, Oier Mees, Chelsea Finn, Sergey Levine", "Autoregressive sequence models, such as Transformer-based vision-language action (VLA) policies, can be tremendously effective for capturing complex and generalizable robotic behaviors. However, such models require us to choose a tokenization of our continuous action signals, which determines how the discrete symbols predicted by the model map to continuous robot actions. We find that current approaches for robot action tokenization, based on simple per-dimension, per-timestep binning schemes, typically perform poorly when learning dexterous skills from high-frequency robot data. To address this challenge, we propose a new compression-based tokenization scheme for robot actions, based on the discrete cosine transform. Our tokenization approach, Frequency-space Action Sequence Tokenization (FAST), enables us to train autoregressive VLAs for highly dexterous and high-frequency tasks where standard discretization methods fail completely. Based on FAST, we release FAST+, a universal robot action tokenizer, trained on 1M real robot action trajectories. It can be used as a black-box tokenizer for a wide range of robot action sequences, with diverse action spaces and control frequencies. Finally, we show that, when combined with the pi0 VLA, our method can scale to training on 10k hours of robot data and match the performance of diffusion VLAs, while reducing training time by up to 5x.", "action tokenization; vision-language-action models; robot foundation models; robotic manipulation; scalable training; imitation learning", "https://arxiv.org/abs/2501.09747", "https://arxiv.org/pdf/2501.09747", "pdfs/arxiv-2501-09747_FAST  Efficient Action Tokenization for Vision-Language-Action Models.pdf", "https://github.com/Stanford-ILIAD/openvla-mini https://github.com/Physical-Intelligence/openpi", "https://www.youtube.com/watch?v=v7-RSX24CGM", "2026-11-12 15:15", "Franka (Panda / FR3); Unitree H1; UR5 / UR5e; ViperX; ALOHA / Mobile ALOHA; ARX arm", "π0 / π0.5; OpenVLA / OpenVLA-OFT; Octo; RT-1 / RT-2 / RT-X", "Physical Intelligence", "University of California, Berkeley"], ["arxiv-2410-24164", "π0: A Vision-Language-Action Flow Model for General Robot Control", "Kevin Black, Noah Brown, Danny Driess, Adnan Esmail, Michael Equi, Chelsea Finn, Niccolo Fusai, Lachy Groom, Karol Hausman, Brian Ichter, Szymon Jakubczak, Tim Jones, Liyiming Ke, Sergey Levine, Adrian Li-Bell, Mohith Mothukuri, Suraj Nair, Karl Pertsch, Lucy Xiaoyang Shi, James Tanner, Quan Vuong, Anna Walling, Haohuan Wang, Ury Zhilinsky", "Robot learning holds tremendous promise to unlock the full potential of flexible, general, and dexterous robot systems, as well as to address some of the deepest questions in artificial intelligence. However, bringing robot learning to the level of generality required for effective real-world systems faces major obstacles in terms of data, generalization, and robustness. In this paper, we discuss how generalist robot policies (i.e., robot foundation models) can address these challenges, and how we can design effective generalist robot policies for complex and highly dexterous tasks. We propose a novel flow matching architecture built on top of a pre-trained vision-language model (VLM) to inherit Internet-scale semantic knowledge. We then discuss how this model can be trained on a large and diverse dataset from multiple dexterous robot platforms, including single-arm robots, dual-arm robots, and mobile manipulators. We evaluate our model in terms of its ability to perform tasks in zero shot after pre-training, follow language instructions from people and from a high-level VLM policy, and its ability to acquire new skills via fine-tuning. Our results cover a wide variety of tasks, such as laundry folding, table cleaning, and assembling boxes.", "vision-language models; robotic manipulation; imitation learning; flow matching; robot foundation models; zero-shot generalization", "https://arxiv.org/abs/2410.24164", "https://arxiv.org/pdf/2410.24164", "pdfs/arxiv-2410-24164_π_0   A Vision-Language-Action Flow Model for General Robot Control.pdf", "https://github.com/Physical-Intelligence/openpi https://github.com/allenzren/open-pi-zero", "https://www.youtube.com/watch?v=CnnkU-9MWT4", "2026-11-12 15:14", "Franka (Panda / FR3); UR5 / UR5e; ViperX; ALOHA / Mobile ALOHA; ARX arm", "ViT; PaliGemma; Gemma; Gemini; π0 / π0.5; OpenVLA / OpenVLA-OFT; Octo; Diffusion Policy; ACT (Action Chunking Transformer)", "Physical Intelligence", ""], ["pdf-556e228a43", "Q-SFT: Q-Learning for Language Models via Supervised Fine-Tuning", "Joey Hong, Anca Dragan, Sergey Levine", "Value-based reinforcement learning (RL) can in principle learn effective policies for a wide range of multi-turn problems, from games to dialogue to robotic control, including via offline RL from static previously collected datasets. However, despite the widespread use of policy gradient methods to train large language models for single turn tasks (e.g., question answering), value-based methods for multi-turn RL in an off-policy or offline setting have proven particularly challenging to scale to the setting of large language models. This setting requires effectively leveraging pretraining, scaling to large architectures with billions of parameters, and training on large datasets, all of which represent major challenges for current value-based RL methods. In this work, we propose a novel offline RL algorithm that addresses these drawbacks, casting Q-learning as a modified supervised fine-tuning (SFT) problem where the probabilities of tokens directly translate to Q-values. In this way we obtain an algorithm that smoothly transitions from maximizing the likelihood of the data during pretraining to learning a near-optimal Q-function during finetuning. Our algorithm has strong theoretical foundations, enjoying performance bounds similar to state-of-the-art Q-learning methods, while in practice utilizing an objective that closely resembles SFT. Because of this, our approach can enjoy the full benefits of the pretraining of language models, without the need to reinitialize any weights before RL finetuning, and without the need to initialize new heads for predicting values or advantages. Empirically, we evaluate our method on both pretrained LLMs and VLMs, on a variety of tasks including both natural language dialogue and robotic manipulation and navigation from images.", "reinforcement learning; language models; vision-language models; robotic manipulation; long-horizon reasoning; offline q-learning", "uploaded: 2025_Q-SFT_Q-Learning_for_Language_Models_via_Supervised_Fine-Tuning.pdf", "", "pdfs/pdf-556e228a43_arXiv 2411.05193v2   cs.LG   27 Nov 2024.pdf", "", "", "2026-11-12 15:02", "", "GPT-4 / GPT-4o / GPT-5", "", "University of California, Berkeley"], ["pdf-a8dfbb77a3", "What Do Learning Dynamics Reveal About Generalization in LLM Reasoning?", "Katie Kang, Amrith Setlur, Dibya Ghosh, Jacob Steinhardt, Claire Tomlin, Sergey Levine, Aviral Kumar", "Despite the remarkable capabilities of modern large language models (LLMs), the mechanisms behind their problem-solving abilities remain elusive. In this work, we aim to better understand how the learning dynamics of LLM finetuning shapes downstream generalization. Our analysis focuses on reasoning tasks, whose problem structure allows us to distinguish between memorization (the exact replication of reasoning steps from the training data) and performance (the correctness of the final solution). We find that a model's generalization behavior can be effectively characterized by a training metric we call pre-memorization train accuracy: the accuracy of model samples on training queries before they begin to copy the exact reasoning steps from the training set. On the dataset level, this metric is able to reliably predict test accuracy, achieving $R^2$ of around or exceeding 0.9 across various models (Llama3 8, Gemma2 9B), datasets (GSM8k, MATH), and training configurations. On a per-example level, this metric is also indicative of whether individual model predictions are robust to perturbations in the training query. By connecting a model's learning behavior to its generalization, pre-memorization train accuracy can guide targeted improvements to training strategies. We focus on data curation as an example, and show that prioritizing examples with low pre-memorization accuracy leads to 1.5-2x improvements in data efficiency compared to i.i.d. data scaling, and outperforms other standard data curation techniques.", "language models; math reasoning; data selection; memorization; generalization; learning dynamics", "uploaded: 2025_What_Do_Learning_Dynamics_Reveal_About_Generalization_in_LLM_Mathematical_Reasoning.pdf", "", "pdfs/pdf-a8dfbb77a3_arXiv 2411.07681v2   cs.LG   18 Nov 2024.pdf", "https://github.com/katiekang1998/reasoning_generalization", "", "2026-11-12 15:02", "", "Gemma; Llama", "", "Carnegie Mellon University; University of California, Berkeley"], ["pdf-a4184160bb", "Long-Horizon Language Model Reinforcement Learning via Progressive Point Matching", "Preston Fu, Kevin Frans, Oleh Rybkin, Sergey Levine, Aviral Kumar", "Current paradigms for training language models via reinforcement learning rely heavily on sparse outcome rewards. However, as we pursue tasks that require longer and more complicated trajectories, such strategies result in slow learning. Prior work has attempted to address this problem by rewarding partial progress; however, naive formulations are often biased and converge to suboptimal policies. We show that a simple and unbiased dense reward formulation, which we term progressive point matching, scales exponentially more efficiently to long-horizon tasks by rewarding partial progress on a segment level, both theoretically and empirically via synthetic environments. We then show how progressive point matching can be practically instantiated using a single reference trajectory per task. On extremely hard math reasoning problems, sparse outcome rewards cannot make any progress, whereas segment-level rewards enable improvements at larger test-time token budgets when measured by success rate or pass@k.", "reinforcement learning; dense rewards; reward shaping; language models; long-horizon reasoning; math reasoning", "uploaded: 2026_Long-Horizon_Language_Model_Reinforcement_Learning_via_Progressive_Point_Matching.pdf", "", "pdfs/pdf-a4184160bb_arXiv 2609.07303v1   cs.LG   7 Sep 2026.pdf", "", "", "2026-11-12 15:01", "", "Qwen (Qwen-VL / Qwen2.5-VL); Gemini", "", "Carnegie Mellon University; University of California, Berkeley"], ["pdf-08009bbec2", "Precise and Dexterous Robotic Manipulation via Human-in-the-Loop Reinforcement Learning", "", "", "reinforcement learning; robotic manipulation; robot learning; teleoperation; imitation learning; robotic insertion", "uploaded: 2025_Precise_and_dexterous_robotic_manipulation_via_human-in-the-loop_reinforcement_learning.pdf", "", "pdfs/pdf-08009bbec2_Precise and Dexterous Robotic Manipulation via Human-in-the-Loop Reinforcement Learning.pdf", "", "https://www.youtube.com/watch?v=GoJSW8e2qbI", "2026-11-12 15:01", "", "ResNet; Diffusion Policy", "", "University of California, Berkeley"], ["pdf-beb8536dd7", "Evaluating Beneﬁt-Risk in Robotic Medical Devices with Autonomous or Remote Teleoperation Capabilities November 2026", "", "", "medical robotics; regulatory evaluation; benefit-risk assessment; teleoperation; autonomous surgery; robotic manipulation", "uploaded: evaluatingbenefitrisk_discussionpaper.pdf", "", "pdfs/pdf-beb8536dd7_Evaluating Beneﬁt-Risk in Robotic Medical Devices with Autonomous or Remote Teleoperation Capabiliti.pdf", "", "", "2026-11-12 14:53", "", "", "", ""], ["arxiv-2611-06881", "VABAR: A Variational Automation Benchmark for Agentic Robotics", "Shuangyu Xie, Kaiyuan Chen, Uksang Yoo, Xinyue Zhu, Meadow Shen, Jaimyn Drake, Eugen Solowjow, Lionel Gulich, Alexander Millane, Rafael Cathomen, Tuur Stuyck, Sangeeta Subramanian, Yichao Pan, Bruce McGowan, Michael Benedict, Linxi Fan, Yuke Zhu, Spencer Huang, Ken Goldberg", "For robots to operate reliably in commercial and industrial applications, they must persistently perform specific tasks with known variations in object shape and pose. We call this Variational Automation (VA) to differentiate these settings from fixed automation. Inspired by recent papers on Agentic Robotics, where pretrained LLM and VLM coding agents combine interpretable robot programming with the open-world adaptability of model free policies, we propose a general set of agentic robotics benchmark design criteria that includes accessibility, repeatability, diversity, relevance to agentic robotics and practical applications, physical realizability, resistance to benchmark saturation, and computational efficiency. We instantiate these principles in six manipulation task classes spanning industrial, medical, and infrastructure applications: tool sorting, tool hanging, gear meshing, syringe packing, cable insertion, and cable routing. We introduce the Variational Automation Benchmark for Agentic Robotics (VABAR), an open, easily replicable, simulation-based manipulation benchmark to systematically evaluating agentic robotics systems. Built fully on open-source tools, VABAR features detailed implementations using the Newton physics engine, standardized task variations, difficulty tiers, success metrics, and a library of 33 generalizable skills with human-authored programmatic reference solutions. We provide initial baseline evaluations using an open agentic manipulation harness, Graph-as-Policy (GaP), and Isaac Lab Arena.", "robotic manipulation; vision-language models; benchmark design; agentic robotics; simulation; robotic insertion", "https://arxiv.org/pdf/2611.06881", "https://arxiv.org/pdf/2611.06881", "pdfs/arxiv-2611-06881_VABAR  A Variational Automation Benchmark for Agentic Robotics.pdf", "https://github.com/BerkeleyAutomation/vabar-website", "", "2026-11-10 11:30", "Franka (Panda / FR3); I2RT YAM", "Claude", "", ""], ["arxiv-2506-15847", "SafeMimic: Towards Safe and Autonomous Human-to-Robot Imitation for Mobile Manipulation", "Arpit Bahety, Arnav Balaji, Ben Abbatematteo, Roberto Martín-Martín", "For robots to become efficient helpers in the home, they must learn to perform new mobile manipulation tasks simply by watching humans perform them. Learning from a single video demonstration from a human is challenging as the robot needs to first extract from the demo what needs to be done and how, translate the strategy from a third to a first-person perspective, and then adapt it to be successful with its own morphology. Furthermore, to mitigate the dependency on costly human monitoring, this learning process should be performed in a safe and autonomous manner. We present SafeMimic, a framework to learn new mobile manipulation skills safely and autonomously from a single third-person human video. Given an initial human video demonstration of a multi-step mobile manipulation task, SafeMimic first parses the video into segments, inferring both the semantic changes caused and the motions the human executed to achieve them and translating them to an egocentric reference. Then, it adapts the behavior to the robot's own morphology by sampling candidate actions around the human ones, and verifying them for safety before execution in a receding horizon fashion using an ensemble of safety Q-functions trained in simulation. When safe forward progression is not possible, SafeMimic backtracks to previous states and attempts a different sequence of actions, adapting both the trajectory and the grasping modes when required for its morphology. As a result, SafeMimic yields a strategy that succeeds in the demonstrated behavior and learns task-specific actions that reduce exploration in future attempts. Our experiments show that our method allows robots to safely and efficiently learn multi-step mobile manipulation behaviors from a single human demonstration, from different users, and in different environments, with improvements over state-of-the-art baselines across seven tasks", "imitation learning; one-shot learning; mobile manipulation; safe exploration; human video demonstration; robot learning", "https://arxiv.org/abs/2506.15847", "https://arxiv.org/pdf/2506.15847", "pdfs/arxiv-2506-15847_SafeMimic  Towards Safe and Autonomous Human-to-Robot Imitation for Mobile Manipulation.pdf", "", "", "2026-11-10 10:44", "PAL TIAGo", "PointNet / PointNet++", "", "University of Texas at Austin"], ["arxiv-2611-05368", "GUILD: Guided Iterative Data Collection for Imitation Learning", "Shivin Dass, Kevin Nguyen, Rohan Yelandur, Junhong Xu, Roberto Martín-Martín", "Imitation learning policies in robotics are trained on datasets collected through costly real-world teleoperation. Often, the data-collection process is unguided, relying on the teleoperator's intuition, resulting in data that contributes little to overall policy performance. Recent work has shown that curating such unguided datasets can substantially improve policy performance, but these approaches operate by filtering existing datasets after collection and therefore do not prevent the acquisition of uninformative data. In this work, we propose GUILD, a novel Guided Data Collection (GDC) method that actively reasons about which data should be collected to maximize downstream policy performance. We introduce an iterative framework that alternates between 1) task proposal and data collection and 2) data evaluation to close the loop. For task proposal, we leverage semantic priors from vision-language models to identify relevant environments, object configurations, and goals for data collection. However, since semantic relevance does not imply policy improvement, we perform data evaluation. By leveraging predictive data attribution we approximate how the collected trajectories influence policy performance on a target deployment setting. This signal is then used as feedback to guide subsequent data collection, closing the data collection loop. We evaluate our approach in simulation and real robot settings, demonstrating that guided data collection substantially improves sample efficiency and deployment performance compared to passive data collection strategies, multiple baselines and experienced roboticists. More information at https://robin-lab.cs.utexas.edu/guild2026/", "imitation learning; data selection; datamodels; robotic manipulation; vision-language models; data collection", "https://arxiv.org/abs/2611.05368", "https://arxiv.org/pdf/2611.05368", "pdfs/arxiv-2611-05368_GUILD  Guided Iterative Data Collection for Imitation Learning.pdf", "", "", "2026-11-10 10:33", "", "", "", ""], ["arxiv-2505-09603", "DataMIL: Selecting Data for Robot Imitation Learning with Datamodels", "Shivin Dass, Alaa Khaddaj, Logan Engstrom, Aleksander Madry, Andrew Ilyas, Roberto Martín-Martín", "Recently, the robotics community has amassed ever larger and more diverse datasets to train generalist policies. However, while these policies achieve strong mean performance across a variety of tasks, they often underperform on individual, specialized tasks and require further tuning on newly acquired task-specific data. Combining task-specific data with carefully curated subsets of large prior datasets via co-training can produce better specialized policies, but selecting data naively may actually harm downstream performance. To address this, we introduce DataMIL, a data selection framework built on the datamodels paradigm that reasons about data selection in an end-to-end manner, using the policy itself to identify which data points will most improve performance. Unlike standard practices that filter data using human notions of quality (e.g., based on semantic or visual similarity), DataMIL directly optimizes data selection for task success, allowing us to select data that improves the policy while dropping data that degrade it. To avoid performing expensive rollouts in the environment during selection, we introduce a surrogate loss function on task-specific data, allowing us to use DataMIL in the real world without degrading performance. We validate our approach on 60+ simulation and real-world manipulation tasks, notably showing successful data selection from the largest open collections of robot datasets (OXE); demonstrating consistent gains in success rates over prior works. Our results underscore the importance of end-to-end, performance-aware data selection for unlocking the potential of large prior datasets in robotics. More information at https://robin-lab.cs.utexas.edu/datamodels4imitation/", "robot learning; imitation learning; data selection; datamodels; co-training; robotic manipulation", "https://arxiv.org/abs/2505.09603", "https://arxiv.org/pdf/2505.09603", "pdfs/arxiv-2505-09603_DataMIL  Selecting Data for Robot Imitation Learning with Datamodels.pdf", "https://github.com/UT-Austin-RobIn/datamil", "", "2026-11-10 10:30", "Franka (Panda / FR3); Kinova (Gen3 / Jaco); PAL TIAGo", "Octo; RT-1 / RT-2 / RT-X", "", "Massachusetts Institute of Technology; Stanford University"], ["arxiv-2511-08544", "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics", "Randall Balestriero, Yann LeCun", "Learning manipulable representations of the world and its dynamics is central to AI. Joint-Embedding Predictive Architectures (JEPAs) offer a promising blueprint, but lack of practical guidance and theory has led to ad-hoc R&D. We present a comprehensive theory of JEPAs and instantiate it in {\\bf LeJEPA}, a lean, scalable, and theoretically grounded training objective. First, we identify the isotropic Gaussian as the optimal distribution that JEPAs' embeddings should follow to minimize downstream prediction risk. Second, we introduce a novel objective--{\\bf Sketched Isotropic Gaussian Regularization} (SIGReg)--to constrain embeddings to reach that ideal distribution. Combining the JEPA predictive loss with SIGReg yields LeJEPA with numerous theoretical and practical benefits: (i) single trade-off hyperparameter, (ii) linear time and memory complexity, (iii) stability across hyper-parameters, architectures (ResNets, ViTs, ConvNets) and domains, (iv) heuristics-free, e.g., no stop-gradient, no teacher-student, no hyper-parameter schedulers, and (v) distributed training-friendly implementation requiring only $\\approx$50 lines of code. Our empirical validation covers 10+ datasets, 60+ architectures, all with varying scales and domains. As an example, using imagenet-1k for pretraining and linear evaluation with frozen backbone, LeJEPA reaches 79\\% with a ViT-H/14. We hope that the simplicity and theory-friendly ecosystem offered by LeJEPA will reestablish self-supervised pre-training as a core pillar of AI research (\\href{https://github.com/rbalestr-lab/lejepa}{GitHub repo}).", "self-supervised learning; joint-embedding predictive architectures; representation collapse; isotropic gaussian regularization; scalable training", "https://arxiv.org/pdf/2511.08544", "https://arxiv.org/pdf/2511.08544", "pdfs/arxiv-2511-08544_LeJEPA  Provable and Scalable Self-Supervised Learning Without the Heuristics.pdf", "https://github.com/rbalestr-lab/lejepa", "https://www.youtube.com/watch?v=5ARoR4YfQg4", "2026-11-06 15:58", "", "ResNet; ViT; DINO / DINOv2 / DINOv3", "", ""], ["arxiv-2606-24457", "Lite Any Stereo V2: Faster and Stronger Efficient Zero-Shot Stereo Matching", "Junpeng Jing, Ronglai Zuo, Zhelun Shen, Shangchen Zhou, Rolandos Alexandros Potamias, Stefanos Zafeiriou, Krystian Mikolajczyk, Jiankang Deng", "Recent advances in stereo matching have achieved remarkable accuracy, but often rely on large models, heavy computation, or additional foundation-model priors, making them difficult to deploy on resource-constrained platforms. In contrast, efficient stereo models offer faster inference but are commonly considered less capable of strong zero-shot generalization. In this paper, we challenge this assumption by introducing Lite Any Stereo V2 (LAS2), an ultra-fast model series designed for efficient zero-shot stereo matching. LAS2 is developed from both architecture and training perspectives. Architecturally, we revisit efficient stereo design under practical deployment settings and propose a 2D-only cost aggregation framework, optimized for real inference latency rather than theoretical MACs alone. For training, we develop a three-stage strategy that combines synthetic supervision, self-distillation, and real-world knowledge distillation. To improve the reliability of real-world pseudo supervision, we further introduce pseudo-label filtering and an error-clamping operation, enabling smoother synthetic-to-real transfer. We instantiate LAS2 as a family of models, including feed-forward variants for different efficiency budgets and an iterative variant for higher accuracy. Extensive experiments show that LAS2 achieves state-of-the-art accuracy among efficient stereo methods while maintaining significantly lower latency. Specifically, LAS2-H achieves stronger overall zero-shot performance than the iterative method Fast-FoundationStereo, with 1.8x and 2.7x faster inference on H200 and Orin, respectively. The project page, demos, and code are available at https://tomtomtommi.github.io/LiteAnyStereoV2/.", "stereo matching; zero-shot generalization; knowledge distillation; efficient inference; depth estimation; pseudo-labeling", "https://arxiv.org/pdf/2606.24457", "https://arxiv.org/pdf/2606.24457", "pdfs/arxiv-2606-24457_Lite Any Stereo V2  Faster and Stronger Efficient Zero-Shot Stereo Matching.pdf", "", "", "2026-11-05 10:00", "", "Depth Anything; EfficientNet", "", "Imperial College London"], ["arxiv-2203-01153", "InsertionNet 2.0: Minimal Contact Multi-Step Insertion Using Multimodal Multiview Sensory Input", "Oren Spector, Vladimir Tchuiev, Dotan Di Castro", "We address the problem of devising the means for a robot to rapidly and safely learn insertion skills with just a few human interventions and without hand-crafted rewards or demonstrations. Our InsertionNet version 2.0 provides an improved technique to robustly cope with a wide range of use-cases featuring different shapes, colors, initial poses, etc. In particular, we present a regression-based method based on multimodal input from stereo perception and force, augmented with contrastive learning for the efficient learning of valuable features. In addition, we introduce a one-shot learning technique for insertion, which relies on a relation network scheme to better exploit the collected data and to support multi-step insertion tasks. Our method improves on the results obtained with the original InsertionNet, achieving an almost perfect score (above 97.5$\\%$ on 200 trials) in 16 real-life insertion tasks while minimizing the execution time and contact during insertion. We further demonstrate our method's ability to tackle a real-life 3-step insertion task and perfectly solve an unseen insertion task without learning.", "robot learning; multimodal learning; robotic insertion; contrastive learning; one-shot learning; force sensing", "https://arxiv.org/abs/2203.01153", "https://arxiv.org/pdf/2203.01153", "pdfs/arxiv-2203-01153_InsertionNet 2.0  Minimal Contact Multi-Step Insertion Using Multimodal Multiview Sensory Input.pdf", "", "", "2026-11-04 09:12", "Franka (Panda / FR3); UR5 / UR5e", "ResNet", "Bosch", ""], ["arxiv-2611-04492", "Hybrid Particle-Voxel Dynamics for Multimodal 3D World Simulation", "Jimmy Wang, Yifan Chou, Kaifeng Zhang, Yixuan Wang, Binghao Huang, Tao Yu, Saleh Nabi, Yunzhu Li", "Predicting how the world evolves in response to robot actions is central to policy learning, evaluation, and planning. However, many action-conditioned world models predict future observations in 2D image or video space without explicitly modeling the underlying 3D scene, making spatial consistency across viewpoints and over long-horizon interactions challenging. We introduce 3D World Simulator, an action-conditioned multimodal world modeling framework that jointly predicts appearance, geometry, and tactile observations from a unified 3D representation. Our approach combines a hybrid particle-voxel autoencoder that compresses point clouds into compact 3D voxel latents with an action-conditioned latent dynamics model that predicts their evolution. The shared 3D representation supports geometrically consistent rendering from arbitrary viewpoints and flexible integration of spatially aligned tactile signals. Our experiments demonstrate interactive, long-horizon, multimodal prediction at 50 Hz. We then show how our model enables scalable data generation for policy training and evaluation using tactile and multi-view visual observations, including wrist-mounted and novel camera views. Furthermore, we scale our method to large datasets containing diverse objects and demonstrate model-based planning with unseen objects and robot configurations. Together, these results highlight the potential of hybrid particle-voxel dynamics as a foundation for multimodal 3D world simulation.", "world models; multimodal learning; robot learning; tactile sensing; 3d representations; model-based planning", "https://jwang771.github.io/3dworldsimulator/", "https://arxiv.org/pdf/2611.04492", "pdfs/arxiv-2611-04492_Hybrid Particle-Voxel Dynamics for Multimodal 3D World Simulation.pdf", "https://github.com/jwang771/3d-world-simulator", "", "2026-11-04 09:09", "ALOHA / Mobile ALOHA", "ResNet; U-Net; π0 / π0.5; Diffusion Policy; ACT (Action Chunking Transformer); Cosmos", "NVIDIA", "Columbia University; University of California, Berkeley; University of Michigan"], ["arxiv-2610-39302", "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "Randall Balestriero, Yann LeCun", "Whether models trained on different modalities converge to the same representation of the world is central to AI. The Platonic Representation Hypothesis (PRH) conjectures that they do as they scale, but without a proof it offers neither a guarantee nor a recipe. We turn the hypothesis into a theorem. First, we prove a \\emph{Platonic Representation Theorem}: Joint-Embedding Predictive Architectures (JEPAs) trained separately on any number of modalities learn the same representation up to one rotation whenever their positive pairs are two observations of one scene--\\emph{good views}--and their misalignment is bounded otherwise. Second, we show that next-token prediction is a JEPA with \\emph{bad views}, parts of a single document, which explains why language models align with vision only through scale. Third, we validate the theory from 145k captions to the texts of 940M web images, and uncover a scaling law of alignment that predicts unseen runs within seed noise. Good views need 42 times fewer training samples than next-token prediction on the same corpus to reach the same alignment, and a 109M-parameter text JEPA aligns with DINOv2 and CLIP's image encoders better than every language model we evaluated, up to 72B parameters, and than CLIP's text encoder: next-token prediction is a remarkably inefficient route to platonic representations. As a showcase, one rotation turns separately trained encoders into an image captioner (CIDEr .838 on COCO). Even that rotation needs no pair: on the latest pair-free benchmark, our text JEPA beats every zero-shot accuracy reported with language models up to 8B parameters, e.g., 64\\% against at most 56\\% top-5 on ImageNet-100. Positive views, and not scale alone, are thus the lever to build platonic representations.", "platonic representation hypothesis; joint-embedding predictive architectures; representation alignment; self-supervised learning; multimodal learning; scaling laws", "https://arxiv.org/abs/2610.39302", "https://arxiv.org/pdf/2610.39302", "pdfs/arxiv-2610-39302_Proving and Improving the Platonic Representation Hypothesis with JEPAs.pdf", "https://github.com/galilai-group/prh-proof", "https://www.youtube.com/watch?v=hFA57nwAc7s", "2026-11-03 16:27", "", "ViT; DINO / DINOv2 / DINOv3; CLIP; Llama; LLaVA; Qwen (Qwen-VL / Qwen2.5-VL)", "", "Brown University"]], "firstPage": {"arxiv-2610-39302": {"title": "arXiv:2610.39302v1  [cs.AI]  29 Oct 2026", "abstract": "", "figure": "figs/arxiv-2610-39302.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2610-39302/fig1.png", "w": 1377, "h": 859}, {"n": 2, "page": 4, "src": "figs/arxiv-2610-39302/fig2.png", "w": 1418, "h": 888}, {"n": 3, "page": 6, "src": "figs/arxiv-2610-39302/fig3.png", "w": 1424, "h": 650}, {"n": 4, "page": 6, "src": "figs/arxiv-2610-39302/fig4.png", "w": 692, "h": 825}, {"n": 5, "page": 8, "src": "figs/arxiv-2610-39302/fig5.png", "w": 1440, "h": 634}, {"n": 6, "page": 8, "src": "figs/arxiv-2610-39302/fig6.png", "w": 701, "h": 570}, {"n": 7, "page": 9, "src": "figs/arxiv-2610-39302/fig7.png", "w": 1418, "h": 1136}, {"n": 8, "page": 9, "src": "figs/arxiv-2610-39302/fig8.png", "w": 703, "h": 1028}, {"n": 9, "page": 10, "src": "figs/arxiv-2610-39302/fig9.png", "w": 1441, "h": 848}, {"n": 10, "page": 11, "src": "figs/arxiv-2610-39302/fig10.png", "w": 1441, "h": 580}, {"n": 11, "page": 12, "src": "figs/arxiv-2610-39302/fig11.png", "w": 700, "h": 879}, {"n
