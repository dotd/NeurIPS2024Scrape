<div id="add" style="flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;
border-bottom:1px solid #ddd;background:#fffbea">
  <b>➕ Add a paper</b>

         style="flex:1;min-width:240px;padding:5px 8px;border:1px solid #bbb;border-radius:6px">

  <label style="padding:5px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer">📄 Upload PDF
    <input id="addFile" type="file" accept="application/pdf,.pdf" hidden></label>
  <span id="addMsg" style="color:#666"></span>
</div>
<script>
async function addPaper(opts, what) {
  const msg = document.getElementById('addMsg');
  if (!location.protocol.startsWith('http'))
    return msg.textContent = 'run: uv run python website/serve.py, then open http://127.0.0.1:8026/Papers/';
  msg.textContent = `⏳ Adding ${what}: downloading, extracting figures, robots, backbones, affiliations… (~30 s)`;
  try {
    const r = await fetch('add', {method: 'POST', ...opts}), j = await r.json();
    if (!r.ok) throw new Error(j.error);
    if (j.exists) {  // nothing added: say so and scroll to it, no Claude calls
      const i = rows.findIndex(x => x[0] === j.id);
      msg.textContent = 'ℹ️ Already in the list: ' + (i >= 0 ? rows[i][1] : j.id);
      if (i >= 0 && dets[i].isConnected) dets[i].scrollIntoView();
      return;
    }
    location.hash = 'claude:' + j.id; location.reload();  // show it now; Claude runs after the reload (below)
  } catch (e) { msg.textContent = '⚠️ ' + e.message; }
}
// after an add the page reloads with #claude:<id>: show the paper, then press 📝 Summarize and the Claude HTML
// button for it; the server finishes them even if the tab closes. Runs before the page script reads the #.
if (location.hash.startsWith('#claude:')) (async () => {
  const pid = decodeURIComponent(location.hash.slice(8)), msg = document.getElementById('addMsg');
  history.replaceState(null, '', '#' + encodeURIComponent(pid));  // the page script scrolls to it, then clears it
  msg.textContent = '⏳ Added. Claude is summarizing it and making the HTML version… (a few minutes)';
  const errs = (await Promise.all(['summarize/', 'html_claude/'].map(p => fetch(p + pid, {method: 'POST'})
    .then(async x => x.ok ? '' : (await x.json()).error).catch(e => e.message)))).filter(Boolean);
  if (errs.length) alert('Added, but: ' + errs.join('; '));
  location.hash = pid; location.reload();  // rebuilt with the summary and HTML link
})();
document.getElementById('addGo').onclick = () => {
  const u = document.getElementById('addUrl').value.trim();
  if (u) addPaper({headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: u})}, 'the link');
};
document.getElementById('addUrl').onkeydown = e => { if (e.key === 'Enter') document.getElementById('addGo').click(); };
document.getElementById('addFile').onchange = e => {
  const f = e.target.files[0];
  if (f) addPaper({headers: {'Content-Type': 'application/pdf', 'X-Filename': encodeURIComponent(f.name)}, body: f}, f.name);
};
</script>

<script id="data" type="application/json">{"columns": ["id", "title", "authors", "abstract", "🏷️ keywords", "source", "pdf", "local_pdf", "💻 github", "🎬 youtube", "added", "🤖 robots", "🧠 backbones", "🏢 companies", "🎓 universities"], "rows": [["arxiv-2511-08544", "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics", "Randall Balestriero, Yann LeCun", "Learning manipulable representations of the world and its dynamics is central to AI. Joint-Embedding Predictive Architectures (JEPAs) offer a promising blueprint, but lack of practical guidance and theory has led to ad-hoc R&D. We present a comprehensive theory of JEPAs and instantiate it in {\\bf LeJEPA}, a lean, scalable, and theoretically grounded training objective. First, we identify the isotropic Gaussian as the optimal distribution that JEPAs' embeddings should follow to minimize downstream prediction risk. Second, we introduce a novel objective--{\\bf Sketched Isotropic Gaussian Regularization} (SIGReg)--to constrain embeddings to reach that ideal distribution. Combining the JEPA predictive loss with SIGReg yields LeJEPA with numerous theoretical and practical benefits: (i) single trade-off hyperparameter, (ii) linear time and memory complexity, (iii) stability across hyper-parameters, architectures (ResNets, ViTs, ConvNets) and domains, (iv) heuristics-free, e.g., no stop-gradient, no teacher-student, no hyper-parameter schedulers, and (v) distributed training-friendly implementation requiring only $\\approx$50 lines of code. Our empirical validation covers 10+ datasets, 60+ architectures, all with varying scales and domains. As an example, using imagenet-1k for pretraining and linear evaluation with frozen backbone, LeJEPA reaches 79\\% with a ViT-H/14. We hope that the simplicity and theory-friendly ecosystem offered by LeJEPA will reestablish self-supervised pre-training as a core pillar of AI research (\\href{https://github.com/rbalestr-lab/lejepa}{GitHub repo}).", "self-supervised learning; joint-embedding predictive architectures; representation collapse; isotropic gaussian regularization; scalable training", "https://arxiv.org/pdf/2511.08544", "https://arxiv.org/pdf/2511.08544", "pdfs/arxiv-2511-08544_LeJEPA  Provable and Scalable Self-Supervised Learning Without the Heuristics.pdf", "https://github.com/rbalestr-lab/lejepa", "https://www.youtube.com/watch?v=5ARoR4YfQg4", "2026-11-06 15:58", "", "ResNet; ViT; DINO / DINOv2 / DINOv3", "", ""], ["arxiv-2606-24457", "Lite Any Stereo V2: Faster and Stronger Efficient Zero-Shot Stereo Matching", "Junpeng Jing, Ronglai Zuo, Zhelun Shen, Shangchen Zhou, Rolandos Alexandros Potamias, Stefanos Zafeiriou, Krystian Mikolajczyk, Jiankang Deng", "Recent advances in stereo matching have achieved remarkable accuracy, but often rely on large models, heavy computation, or additional foundation-model priors, making them difficult to deploy on resource-constrained platforms. In contrast, efficient stereo models offer faster inference but are commonly considered less capable of strong zero-shot generalization. In this paper, we challenge this assumption by introducing Lite Any Stereo V2 (LAS2), an ultra-fast model series designed for efficient zero-shot stereo matching. LAS2 is developed from both architecture and training perspectives. Architecturally, we revisit efficient stereo design under practical deployment settings and propose a 2D-only cost aggregation framework, optimized for real inference latency rather than theoretical MACs alone. For training, we develop a three-stage strategy that combines synthetic supervision, self-distillation, and real-world knowledge distillation. To improve the reliability of real-world pseudo supervision, we further introduce pseudo-label filtering and an error-clamping operation, enabling smoother synthetic-to-real transfer. We instantiate LAS2 as a family of models, including feed-forward variants for different efficiency budgets and an iterative variant for higher accuracy. Extensive experiments show that LAS2 achieves state-of-the-art accuracy among efficient stereo methods while maintaining significantly lower latency. Specifically, LAS2-H achieves stronger overall zero-shot performance than the iterative method Fast-FoundationStereo, with 1.8x and 2.7x faster inference on H200 and Orin, respectively. The project page, demos, and code are available at https://tomtomtommi.github.io/LiteAnyStereoV2/.", "stereo matching; zero-shot generalization; knowledge distillation; efficient inference; depth estimation; pseudo-labeling", "https://arxiv.org/pdf/2606.24457", "https://arxiv.org/pdf/2606.24457", "pdfs/arxiv-2606-24457_Lite Any Stereo V2  Faster and Stronger Efficient Zero-Shot Stereo Matching.pdf", "", "", "2026-11-05 10:00", "", "Depth Anything; EfficientNet", "", "Imperial College London"], ["arxiv-2203-01153", "InsertionNet 2.0: Minimal Contact Multi-Step Insertion Using Multimodal Multiview Sensory Input", "Oren Spector, Vladimir Tchuiev, Dotan Di Castro", "We address the problem of devising the means for a robot to rapidly and safely learn insertion skills with just a few human interventions and without hand-crafted rewards or demonstrations. Our InsertionNet version 2.0 provides an improved technique to robustly cope with a wide range of use-cases featuring different shapes, colors, initial poses, etc. In particular, we present a regression-based method based on multimodal input from stereo perception and force, augmented with contrastive learning for the efficient learning of valuable features. In addition, we introduce a one-shot learning technique for insertion, which relies on a relation network scheme to better exploit the collected data and to support multi-step insertion tasks. Our method improves on the results obtained with the original InsertionNet, achieving an almost perfect score (above 97.5$\\%$ on 200 trials) in 16 real-life insertion tasks while minimizing the execution time and contact during insertion. We further demonstrate our method's ability to tackle a real-life 3-step insertion task and perfectly solve an unseen insertion task without learning.", "robot learning; multimodal learning; robotic insertion; contrastive learning; one-shot learning; force sensing", "https://arxiv.org/abs/2203.01153", "https://arxiv.org/pdf/2203.01153", "pdfs/arxiv-2203-01153_InsertionNet 2.0  Minimal Contact Multi-Step Insertion Using Multimodal Multiview Sensory Input.pdf", "", "", "2026-11-04 09:12", "Franka (Panda / FR3); UR5 / UR5e", "ResNet", "Bosch", ""], ["arxiv-2611-04492", "Hybrid Particle-Voxel Dynamics for Multimodal 3D World Simulation", "Jimmy Wang, Yifan Chou, Kaifeng Zhang, Yixuan Wang, Binghao Huang, Tao Yu, Saleh Nabi, Yunzhu Li", "Predicting how the world evolves in response to robot actions is central to policy learning, evaluation, and planning. However, many action-conditioned world models predict future observations in 2D image or video space without explicitly modeling the underlying 3D scene, making spatial consistency across viewpoints and over long-horizon interactions challenging. We introduce 3D World Simulator, an action-conditioned multimodal world modeling framework that jointly predicts appearance, geometry, and tactile observations from a unified 3D representation. Our approach combines a hybrid particle-voxel autoencoder that compresses point clouds into compact 3D voxel latents with an action-conditioned latent dynamics model that predicts their evolution. The shared 3D representation supports geometrically consistent rendering from arbitrary viewpoints and flexible integration of spatially aligned tactile signals. Our experiments demonstrate interactive, long-horizon, multimodal prediction at 50 Hz. We then show how our model enables scalable data generation for policy training and evaluation using tactile and multi-view visual observations, including wrist-mounted and novel camera views. Furthermore, we scale our method to large datasets containing diverse objects and demonstrate model-based planning with unseen objects and robot configurations. Together, these results highlight the potential of hybrid particle-voxel dynamics as a foundation for multimodal 3D world simulation.", "world models; multimodal learning; robot learning; tactile sensing; 3d representations; model-based planning", "https://jwang771.github.io/3dworldsimulator/", "https://arxiv.org/pdf/2611.04492", "pdfs/arxiv-2611-04492_Hybrid Particle-Voxel Dynamics for Multimodal 3D World Simulation.pdf", "https://github.com/jwang771/3d-world-simulator", "", "2026-11-04 09:09", "ALOHA / Mobile ALOHA", "ResNet; U-Net; π0 / π0.5; Diffusion Policy; ACT (Action Chunking Transformer); Cosmos", "NVIDIA", "Columbia University; University of California, Berkeley; University of Michigan"], ["arxiv-2610-39302", "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "Randall Balestriero, Yann LeCun", "Whether models trained on different modalities converge to the same representation of the world is central to AI. The Platonic Representation Hypothesis (PRH) conjectures that they do as they scale, but without a proof it offers neither a guarantee nor a recipe. We turn the hypothesis into a theorem. First, we prove a \\emph{Platonic Representation Theorem}: Joint-Embedding Predictive Architectures (JEPAs) trained separately on any number of modalities learn the same representation up to one rotation whenever their positive pairs are two observations of one scene--\\emph{good views}--and their misalignment is bounded otherwise. Second, we show that next-token prediction is a JEPA with \\emph{bad views}, parts of a single document, which explains why language models align with vision only through scale. Third, we validate the theory from 145k captions to the texts of 940M web images, and uncover a scaling law of alignment that predicts unseen runs within seed noise. Good views need 42 times fewer training samples than next-token prediction on the same corpus to reach the same alignment, and a 109M-parameter text JEPA aligns with DINOv2 and CLIP's image encoders better than every language model we evaluated, up to 72B parameters, and than CLIP's text encoder: next-token prediction is a remarkably inefficient route to platonic representations. As a showcase, one rotation turns separately trained encoders into an image captioner (CIDEr .838 on COCO). Even that rotation needs no pair: on the latest pair-free benchmark, our text JEPA beats every zero-shot accuracy reported with language models up to 8B parameters, e.g., 64\\% against at most 56\\% top-5 on ImageNet-100. Positive views, and not scale alone, are thus the lever to build platonic representations.", "platonic representation hypothesis; joint-embedding predictive architectures; representation alignment; self-supervised learning; multimodal learning; scaling laws", "https://arxiv.org/abs/2610.39302", "https://arxiv.org/pdf/2610.39302", "pdfs/arxiv-2610-39302_Proving and Improving the Platonic Representation Hypothesis with JEPAs.pdf", "https://github.com/galilai-group/prh-proof", "https://www.youtube.com/watch?v=hFA57nwAc7s", "2026-11-03 16:27", "", "ViT; DINO / DINOv2 / DINOv3; CLIP; Llama; LLaVA; Qwen (Qwen-VL / Qwen2.5-VL)", "", "Brown University"]], "firstPage": {"arxiv-2610-39302": {"title": "arXiv:2610.39302v1  [cs.AI]  29 Oct 2026", "abstract": "", "figure": "figs/arxiv-2610-39302.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2610-39302/fig1.png", "w": 1377, "h": 859}, {"n": 2, "page": 4, "src": "figs/arxiv-2610-39302/fig2.png", "w": 1418, "h": 888}, {"n": 3, "page": 6, "src": "figs/arxiv-2610-39302/fig3.png", "w": 1424, "h": 650}, {"n": 4, "page": 6, "src": "figs/arxiv-2610-39302/fig4.png", "w": 692, "h": 825}, {"n": 5, "page": 8, "src": "figs/arxiv-2610-39302/fig5.png", "w": 1440, "h": 634}, {"n": 6, "page": 8, "src": "figs/arxiv-2610-39302/fig6.png", "w": 701, "h": 570}, {"n": 7, "page": 9, "src": "figs/arxiv-2610-39302/fig7.png", "w": 1418, "h": 1136}, {"n": 8, "page": 9, "src": "figs/arxiv-2610-39302/fig8.png", "w": 703, "h": 1028}, {"n": 9, "page": 10, "src": "figs/arxiv-2610-39302/fig9.png", "w": 1441, "h": 848}, {"n": 10, "page": 11, "src": "figs/arxiv-2610-39302/fig10.png", "w": 1441, "h": 580}, {"n": 11, "page": 12, "src": "figs/arxiv-2610-39302/fig11.png", "w": 700, "h": 879}, {"n": 12, "page": 26, "src": "figs/arxiv-2610-39302/fig12.png", "w": 1439, "h": 737}, {"n": 13, "page": 28, "src": "figs/arxiv-2610-39302/fig13.png", "w": 1440, "h": 1090}, {"n": 14, "page": 36, "src": "figs/arxiv-2610-39302/fig14.png", "w": 1224, "h": 804}, {"n": 15, "page": 37, "src": "figs/arxiv-2610-39302/fig15.png", "w": 536, "h": 1240}]}, "arxiv-2611-04492": {"title": "arXiv:2611.04492v1  [cs.RO]  3 Nov 2026", "abstract": "", "figure": "figs/arxiv-2611-04492.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2611-04492/fig1.png", "w": 1161, "h": 664}, {"n": 2, "page": 4, "src": "figs/arxiv-2611-04492/fig2.png", "w": 1134, "h": 912}, {"n": 3, "page": 6, "src": "figs/arxiv-2611-04492/fig3.png", "w": 1134, "h": 958}, {"n": 4, "page": 6, "src": "figs/arxiv-2611-04492/fig4.png", "w": 1134, "h": 538}, {"n": 5, "page": 7, "src": "figs/arxiv-2611-04492/fig5.png", "w": 1134, "h": 986}, {"n": 6, "page": 8, "src": "figs/arxiv-2611-04492/fig6.png", "w": 1134, "h": 826}, {"n": 7, "page": 9, "src": "figs/arxiv-2611-04492/fig7.png", "w": 1134, "h": 394}, {"n": 8, "page": 9, "src": "figs/arxiv-2611-04492/fig8.png", "w": 1134, "h": 921}, {"n": 9, "page": 20, "src": "figs/arxiv-2611-04492/fig9.png", "w": 1134, "h": 744}, {"n": 10, "page": 21, "src": "figs/arxiv-2611-04492/fig10.png", "w": 724, "h": 743}, {"n": 11, "page": 21, "src": "figs/arxiv-2611-04492/fig11.png", "w": 724, "h": 743}, {"n": 12, "page": 22, "src": "figs/arxiv-2611-04492/fig12.png", "w": 678, "h": 743}, {"n": 13, "page": 22, "src": "figs/arxiv-2611-04492/fig13.png", "w": 678, "h": 746}, {"n": 14, "page": 23, "src": "figs/arxiv-2611-04492/fig14.png", "w": 1134, "h": 743}, {"n": 16, "page": 25, "src": "figs/arxiv-2611-04492/fig16.png", "w": 1134, "h": 343}, {"n": 17, "page": 25, "src": "figs/arxiv-2611-04492/fig17.png", "w": 1134, "h": 556}, {"n": 18, "page": 25, "src": "figs/arxiv-2611-04492/fig18.png", "w": 1134, "h": 345}]}, "arxiv-2203-01153": {"title": "arXiv:2203.01153v1  [cs.RO]  2 Mar 2022", "abstract": "— We address the problem of devising the means for a robot to rapidly and safely learn insertion skills with just a few human interventions and without hand-crafted rewards or demonstrations. Our InsertionNet version 2.0 provides an improved technique to robustly cope with a wide range of use-cases featuring different shapes, colors, initial poses, etc. In particular, we present a regression-based method based on multimodal input from stereo perception and force, augmented with contrastive learning for the efﬁcient learning of valuable features. In addition, we introduce a one-shot learning technique for insertion, which relies on a relation network scheme to better exploit the collected data and to support multi-step insertion tasks. Our method improves on the results obtained with the original InsertionNet, achieving an almost perfect score (above 97.5% on 200 trials) in 16 real-life insertion tasks while minimizing the execution time and contact during insertion. We further demonstrate our method’s ability to tackle a real-life 3-step insertion task and perfectly solve an unseen insertion task without learning. arXiv:2203.01153v1  [cs.RO]  2 Mar 2022 I. INTRODUCTION Constructing a robot that reliably inserts diverse objects (e.g., plugs, engine gears) is a grand challenge in the design of manufacturing, inspection, and home-service robots. Minimizing action time, maximizing reliability, and minimizing contact between the grasped object and the target component is difﬁcult due to the inherent uncertainty concerning sensing, control, sensitivity to applied forces, and occlusions.", "figure": "figs/arxiv-2203-01153.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2203-01153/fig1.png", "w": 704, "h": 740}, {"n": 2, "page": 2, "src": "figs/arxiv-2203-01153/fig2.png", "w": 332, "h": 712}, {"n": 3, "page": 4, "src": "figs/arxiv-2203-01153/fig3.png", "w": 684, "h": 411}, {"n": 4, "page": 4, "src": "figs/arxiv-2203-01153/fig4.png", "w": 684, "h": 250}, {"n": 5, "page": 4, "src": "figs/arxiv-2203-01153/fig5.png", "w": 704, "h": 344}, {"n": 6, "page": 5, "src": "figs/arxiv-2203-01153/fig6.png", "w": 1434, "h": 559}, {"n": 7, "page": 6, "src": "figs/arxiv-2203-01153/fig7.png", "w": 704, "h": 304}, {"n": 8, "page": 6, "src": "figs/arxiv-2203-01153/fig8.png", "w": 642, "h": 299}]}, "arxiv-2606-24457": {"title": "I. INTRODUCTION F", "abstract": "—Recent advances in stereo matching have achieved remarkable accuracy, but often rely on large models, heavy computation, or additional foundation priors, making them difficult to deploy on resource-constrained platforms. In contrast, efficient stereo models offer faster inference but are commonly considered less capable of strong zero-shot generalization. In this paper, we challenge this assumption by introducing Lite Any Stereo V2 (LAS2), an ultra-fast model series designed for efficient zero-shot stereo matching. LAS2 is developed from both architecture and training perspectives. Architecturally, we revisit efficient stereo design under practical deployment settings and propose a 2D-only cost aggregation framework, optimized for real inference latency rather than theoretical MACs alone. For training, we develop a three-stage strategy that combines synthetic supervision, self-distillation, and realworld knowledge distillation. To improve the reliability of realworld pseudo supervision, we further introduce pseudo-label filtering and an error-clamping operation, enabling smoother synthetic-to-real transfer. We instantiate LAS2 as a family of models, including feed-forward variants for different efficiency budgets and an iterative variant for higher accuracy. Extensive experiments show that LAS2 achieves state-of-the-art accuracy among efficient stereo methods while maintaining significantly lower latency. Specifically, LAS2-M consistently outperforms our previous SOTA feed-forward efficient method LAS across four real-world benchmarks, while running 1.6× faster on H200 and 1.9× faster on Orin 8G. LAS2-H further achieves stronger overall zero-shot performance than the iterative method FastFoundationStereo, with 1.8× and 2.7× faster inference on H200 and Orin, respectively. The project page, demos, and code are available at https://tomtomtommi.github.io/LiteAnyStereoV2/.", "figure": "figs/arxiv-2606-24457.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2606-24457/fig1.png", "w": 721, "h": 857}, {"n": 2, "page": 2, "src": "figs/arxiv-2606-24457/fig2.png", "w": 1462, "h": 855}, {"n": 3, "page": 4, "src": "figs/arxiv-2606-24457/fig3.png", "w": 1462, "h": 844}, {"n": 7, "page": 9, "src": "figs/arxiv-2606-24457/fig7.png", "w": 1462, "h": 776}, {"n": 8, "page": 10, "src": "figs/arxiv-2606-24457/fig8.png", "w": 1462, "h": 890}, {"n": 9, "page": 13, "src": "figs/arxiv-2606-24457/fig9.png", "w": 721, "h": 492}]}, "arxiv-2511-08544": {"title": "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics", "abstract": "", "figure": "figs/arxiv-2511-08544.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2511-08544/fig1.png", "w": 1407, "h": 995}, {"n": 2, "page": 3, "src": "figs/arxiv-2511-08544/fig2.png", "w": 1481, "h": 674}, {"n": 3, "page": 6, "src": "figs/arxiv-2511-08544/fig3.png", "w": 1458, "h": 609}, {"n": 4, "page": 7, "src": "figs/arxiv-2511-08544/fig4.png", "w": 1458, "h": 603}, {"n": 5, "page": 8, "src": "figs/arxiv-2511-08544/fig5.png", "w": 1481, "h": 503}, {"n": 6, "page": 9, "src": "figs/arxiv-2511-08544/fig6.png", "w": 1481, "h": 854}, {"n": 7, "page": 10, "sr l learning", "robotic insertion", "contrastive learning", "one-shot learning", "force sensing"], "r": [], "cites": null, "h": null}, {"c": ["NVIDIA"], "u": ["Columbia University", "University of California, Berkeley", "University of Michigan"], "t": [], "d": [], "b": ["ALOHA / Mobile ALOHA"], "m": ["ResNet", "U-Net", "π0 / π0.5", "Diffusion Policy", "ACT (Action Chunking Transformer)", "Cosmos"], "k": ["world models", "multimodal learning", "robot learning", "tactile sensing", "3d representations", "model-based planning"], "r": [], "cites": null, "h": null}, {"c": [], "u": ["Brown University"], "t": [], "d": [], "b": [], "m": ["ViT", "DINO / DINOv2 / DINOv3", "CLIP", "Llama", "LLaVA", "Qwen (Qwen-VL / Qwen2.5-VL)"], "k": ["platonic representation hypothesis", "joint-embedding predictive architectures", "representation alignment", "self-supervised learning", "multimodal learning", "scaling laws"], "r": [], "cites": null, "h": null}], "facets": {"d": [], "c": [{"id": "Bosch", "name": "Bosch", "note": "1 📄"}, {"id": "NVIDIA", "name": "NVIDIA", "note": "1 📄"}], "u": [{"id": "Imperial College London", "name": "Imperial College London", "note": "1 📄"}, {"id": "Columbia University", "name": "Columbia University", "note": "1 📄"}, {"id": "University of California, Berkeley", "name": "University of California, Berkeley", "note": "1 📄"}, {"id": "University of Michigan", "name": "University of Michigan", "note": "1 📄"}, {"id": "Brown University", "name": "Brown University", "note": "1 📄"}], "r": [], "b": [{"id": "Franka (Panda / FR3)", "name": "Franka (Panda / FR3)", "note": "1 📄"}, {"id": "UR5 / UR5e", "name": "UR5 / UR5e", "note": "1 📄"}, {"id": "ALOHA / Mobile ALOHA", "name": "ALOHA / Mobile ALOHA", "note": "1 📄"}], "m": [{"id": "ResNet", "name": "ResNet", "note": "3 📄"}, {"id": "ViT", "name": "ViT", "note": "2 📄"}, {"id": "DINO / DINOv2 / DINOv3", "name": "DINO / DINOv2 / DINOv3", "note": "2 📄"}, {"id": "Depth Anything", "name": "Depth Anything", "note": "1 📄"}, {"id": "EfficientNet", "name": "EfficientNet", "note": "1 📄"}, {"id": "U-Net", "name": "U-Net", "note": "1 📄"}, {"id": "π0 / π0.5", "name": "π0 / π0.5", "note": "1 📄"}, {"id": "Diffusion Policy", "name": "Diffusion Policy", "note": "1 📄"}, {"id": "ACT (Action Chunking Transformer)", "name": "ACT (Action Chunking Transformer)", "note": "1 📄"}, {"id": "Cosmos", "name": "Cosmos", "note": "1 📄"}, {"id": "CLIP", "name": "CLIP", "note": "1 📄"}, {"id": "Llama", "name": "Llama", "note": "1 📄"}, {"id": "LLaVA", "name": "LLaVA", "note": "1 📄"}, {"id": "Qwen (Qwen-VL / Qwen2.5-VL)", "name": "Qwen (Qwen-VL / Qwen2.5-VL)", "note": "1 📄"}], "k": [{"id": "multimodal learning", "name": "multimodal learning", "note": "3 📄"}, {"id": "self-supervised learning", "name": "self-supervised learning", "note": "2 📄"}, {"id": "joint-embedding predictive architectures", "name": "joint-embedding predictive architectures", "note": "2 📄"}, {"id": "robot learning", "name": "robot learning", "note": "2 📄"}, {"id": "representation collapse", "name": "representation collapse", "note": "1 📄"}, {"id": "isotropic gaussian regularization", "name": "isotropic gaussian regularization", "note": "1 📄"}, {"id": "scalable training", "name": "scalable training", "note": "1 📄"}, {"id": "stereo matching", "name": "stereo matching", "note": "1 📄"}, {"id": "zero-shot generalization", "name": "zero-shot generalization", "note": "1 📄"}, {"id": "knowledge distillation", "name": "knowledge distillation", "note": "1 📄"}, {"id": "efficient inference", "name": "efficient inference", "note": "1 📄"}, {"id": "depth estimation", "name": "depth estimation", "note": "1 📄"}, {"id": "pseudo-labeling", "name": "pseudo-labeling", "note": "1 📄"}, {"id": "robotic insertion", "name": "robotic insertion", "note": "1 📄"}, {"id": "contrastive learning", "name": "contrastive learning", "note": "1 📄"}, {"id": "one-shot learning", "name": "one-shot learning", "note": "1 📄"}, {"id": "force sensing", "name": "force sensing", "note": "1 📄"}, {"id": "world models", "name": "world models", "note": "1 📄"}, {"id": "tactile sensing", "name": "tactile sensing", "note": "1 📄"}, {"id": "3d representations", "name": "3d representations", "note": "1 📄"}, {"id": "model-based planning", "name": "model-based planning", "note": "1 📄"}, {"id": "platonic representation hypothesis", "name": "platonic representation hypothesis", "note": "1 📄"}, {"id": "representation alignment", "name": "representation alignment", "note": "1 📄"}, {"id": "scaling laws", "name": "scaling laws", "note": "1 📄"}], "t": []}, "summaries": {"arxiv-2610-39302": {"text": "Gist: Despite the request framing, this is not a robotics paper. It is a representation-learning paper. It turns the Platonic Representation Hypothesis (PRH) into a theorem for Joint-Embedding Predictive Architectures (JEPAs). Encoders trained separately on different modalities learn the same embedding up to one rotation when their positive pairs are two observations of the same scene (\"good views\"). The paper also argues that next-token prediction is a \"bad-view\" JEPA, and shows empirically that a 109M-parameter text JEPA aligns with vision models better than language models up to 72B parameters.\n\nQuestion: The PRH, the claim that vision and language models converge to a shared representation as they scale, has so far been an empirical observation without a proof. The paper asks when models trained separately on different modalities provably learn the same representation. It also asks whether that answer gives a training recipe, rather than relying on scale alone.\n\nMethod: The world is modeled as a finite set of states, each modality renders it injectively, and the JEPA loss is a prediction term plus a rotation-invariant anti-collapse term. The predictor is the identity; the paper explicitly does not cover learned or action-conditioned predictors. The main results are:\n- Renderings only change coordinates, so if all modalities share one positive-pair distribution and the minimizers are unique up to rotation, every encoder recovers the same world embedding up to a rotation (Theorem 1).\n- With MSE plus whitening, the minimizer is the spectral embedding of the positive-pair graph, unique under an eigengap (Proposition 1).\n- If positives differ across modalities, a Davis–Kahan-style bound limits misalignment by the kernel mismatch divided by the eigengap (Theorem 2). On 300 synthetic worlds the measured error stays at or below 18% of the bound.\n- With per-observation nuisance (wording, viewpoint), any embedding direction spent on nuisance is lost for alignment (Theorem 3). Corruptions of a single observation spend directions on nuisance whenever they preserve it more than the world's k-th direction (Proposition 3).\n- Views and data together determine an induced world kernel (Theorem 4).\n- Next-token prediction is cast as a JEPA whose positives are a prefix and its continuation and whose anti-collapse term is the softmax log-partition, identified only up to an invertible linear map (Proposition 4).\n\nIn practice, good-view training uses LeJEPA/SIGReg (λ=0.02). Text views are drawn from different captions of the same image, each trimmed to a random span with 15% masking.\n\nRobots and setup: There are no robots, robot sensors, simulators or control tasks. The data are:\n- Flickr30k: 29k images with 5 captions each.\n- MSR-VTT video: 7k training clips with 20 captions each, the only setting where the image side gets good views (different frames).\n- COCO.\n- Recap-DataComp: each image's alt-text plus two LLaVA (LLaMA-3-8B) recaptions, scaled up to the texts of 940M images.\n- The PRH paper's WIT-1024 benchmark.\n\nThe models are a ViT-S/16 image JEPA and BERT text encoders of 11M–335M parameters trained from scratch, scored against frozen DINOv2/DINOv3, CLIP, MAE and I-JEPA. Baselines are Qwen2.5 (0.5–72B), Llama-3 8B/70B, Mistral-7B, Qwen3-8B, CLIP's text encoder and all-mpnet-base-v2. Metrics are mutual 10-NN, unbiased linear CKA, and retrieval R@1 through a single orthogonal map fitted on pairs.\n\nResults:\n- Flickr, separately trained image JEPA: the good-view text JEPA reaches mutual 10-NN .062 versus .047 (bad views) and .042 (next-token), and R@1 .044 versus .027 and .021.\n- Flickr, frozen DINOv2: R@1 is .246 versus .133 and .118.\n- Nuisance measurement: the scene explains a fraction .804 of the good-view embedding, against .655 and .608, matching the theory's predicted ordering.\n- Scale on WIT-1024: the 109M good-view JEPA trained on the texts of 940M images reaches .184 with DINOv2 ViT-B. This beats Qwen2.5-72B (.154), Llama-3-70B (.151) and CLIP's text encoder (.124). Its CKA is .507 versus .418, and with CLIP ViT-H it scores .230 versus .210.\n- Sample efficiency: on the same corpus, good views reach next-token's 900M-sample alignment with 21.6M samples (.109 vs .111), 42 times fewer.\n- Scaling law: an alignment law in the good-view fraction and samples seen predicted 85 unseen runs with RMSE .0093, versus .0096 seed-to-seed. It overestimates good-view runs at 320M samples.\n- Captioning: a captioner whose only part fitted on pairs is one orthonormal map (30k Flickr pairs) reaches COCO CIDEr .838 and MSR-VTT video CIDEr .246.\n- Pair-free alignment (Schnaus et al. protocol): ImageNet-100 top-5 is 64.4% versus 47.6% for Qwen3-8B rerun and 56% for the best they reported. CLIP's text encoder still gets 68.7%.\n\nAblations: Trimming captions into spans is the knob that matters. Using whole captions as views drops R@1 from .246 to .185. Masking, number of views, batch size, width and schedule move the mean by at most .016. Without gradient clipping, some runs collapse abruptly. On MSR-VTT, good views on both sides give mutual 10-NN .067, against .039 when neither side has them, with the text side contributing most.\n\nLimitations: The theory assumes a finite world, injective renderings, population optima and an identity predictor. Uniqueness up to rotation is not proven for SIGReg, and no experiment meets Theorem 1's hypotheses exactly. Good views require knowing which texts describe the same scene. On Recap, two of three texts come from a CLIP-based captioner; without it, good views reach only .060 on WIT versus .107. At the 940M scale, the SIGReg weight was chosen after seeing WIT results, and a seed at the other weight scored .121. There is minor benchmark overlap with the training data. The image side is mostly bad-view crops, and hyperparameters were tuned only for the good-view JEPA.\n\nTakeaway for a robotics researcher: Read it only if you care about JEPA theory or about aligning separately trained sensor or modality encoders. The transferable lesson is to define positives as multiple observations of the same state, such as different cameras or frames, rather than augmentations of one observation. The paper's world-model analysis is limited: it excludes action-conditioned predictors and notes that camera viewpoint, a nuisance for cross-modal alignment, is something an acting agent must track. Section 2 (theory) and Sections 3.2–3.3 (view ablations, video) are the most relevant; the LLM-scaling and captioning sections can be skimmed.", "cost": 0.5992, "input_tokens": 129320, "output_tokens": 4096}, "arxiv-2611-04492": {"text": "Gist: The paper presents \"3D World Simulator,\" an action-conditioned world model that predicts the future of a manipulation scene in a shared 3D latent space instead of in image space. A hybrid particle-voxel autoencoder compresses RGB-D point clouds, with optional tactile points, into a compact voxel latent. A latent dynamics model rolls that latent forward given robot actions, and the decoded output is a set of 3D Gaussian particles plus tactile particles. Because the output is explicitly 3D, the model can render consistent RGB-D from arbitrary viewpoints, including moving wrist cameras, and its tactile predictions stay geometrically aligned with contact surfaces. The authors use it for synthetic policy-training data, policy evaluation, and zero-shot MPC on unseen objects, and claim interactive rollout at 50 Hz.\n\nQuestion: Most action-conditioned world models, such as Cosmos, IWS and video diffusion models, operate in 2D pixel space. This makes multi-view consistency and long-horizon spatial coherence hard to maintain, and it makes contact-geometry relationships hard to represent. Existing 3D dynamics models like PGND, PointWorld and ParticleFormer have their own limits: they rely on point-tracking supervision or object-specific state representations, and they usually do not target photorealistic rendering for visuomotor policies. The paper asks whether a correspondence-free, scene-level 3D latent can provide geometry, appearance and touch in one interface while staying stable over long open-loop horizons.\n\nMethod: The autoencoder works in three steps.\n- The point cloud has 7 channels per point (xyz, RGB, tactile). It is voxelized and averaged per occupied cell.\n- Strided sparse 3D convolutions downsample it to a unit-normalized 8-channel latent grid: 32×16×32 for ALOHA and 32³ for Deform360.\n- A coarse-to-fine decoder upsamples with transposed convolutions, predicting occupancy at three resolutions. A lightweight MLP then turns each occupied voxel into continuous particles over two refinement stages. Each particle carries Gaussian parameters (color via degree-1 spherical harmonics, anisotropic scale, rotation, opacity).\n\nThe autoencoder is trained with four losses: per-level occupancy BCE, local bidirectional Chamfer plus color L1, rendered RGB-D loss (L1/SSIM/LPIPS plus depth L1), and a consistency loss between latents of two independent subsamples of the same cloud.\n\nThe dynamics model is a 3D U-Net. It takes 5 history latents and encodes each frame with shared 3D convolutions. At an 8×4×8 coarse grid it alternates spatial attention with causal temporal attention, and it injects action, timestamp and noise-level embeddings via an MLP. It directly regresses the next latent in one forward pass. For stability, training uses three measures: K-step autoregressive rollouts with a discounted L2 loss (γ=0.95), a curriculum on K, and history-latent noise with standard deviation up to 0.4.\n\nEach model trains in about 16 hours on a single RTX 5090. Wrist-camera rendering requires a separately fine-tuned decoder head. Separating robot, object and table, which is needed to compose the output with other Gaussian backgrounds or new kinematic robot models, also requires fine-tuning.\n\nRobots and setup: The main platform is an ALOHA bimanual robot with FlexiTac tactile sensors on each fingertip. Sensing comes from three static RealSense D455 stereo cameras (one top-down and two forward-facing) and two wrist-mounted RealSense D405s. Depth is computed with FoundationStereo, and tactile pad positions come from forward kinematics.\n\nThere are six tasks, each with about 200 teleoperated episodes (about 2 hours): Part Assembly, Cloth Folding, T Pushing, Box Packing, Rope Threading and Marker Insertion. Together they cover rigid, articulated and deformable objects.\n\nFor scaling, the model is trained on Deform360. That dataset contains 198 objects, 1,980 sequences, more than 215 hours of footage from 41 cameras, and bimanual tactile grippers. Training on it uses object points only, because the dataset provides only object-centric depth.\n\nBaselines:\n- 2D video models: Cosmos, Robot4DGen and IWS, adapted for multi-view and depth.\n- 3D particle models: PGND, PointWorld and ParticleFormer, supervised with CoTracker tracks.\n\nDownstream policies are ACT, Diffusion Policy, π0.5 (LoRA) and Cosmos Policy. Planning uses MPPI borrowed from PGND on an unseen single-arm ALOHA setup.\n\nResults: On ALOHA, metrics are averaged over 6 tasks and 200-step open-loop rollouts. The proposed model leads on every metric:\n\n| Metric | Ours | Best baseline |\n|---|---|---|\n| PSNR | 23.24 | 20.59 (Robot4DGen) |\n| LPIPS | 0.240 | 0.340 (Robot4DGen) |\n| Depth Abs Rel | 0.097 | 0.147 (Cosmos) |\n| δ<1.25 | 0.913 | 0.833 (Cosmos) |\n| Scene Chamfer | 7.72 | 10.43 (Robot4DGen) |\n| Object Chamfer | 11.52 | 15.97 (Robot4DGen) |\n| Tactile L1 | 0.081 | 0.128 (Robot4DGen) |\n\nThe 3D particle baselines do worse on geometry than the video models (Chamfer 13.78–17.11).\n\nOn Deform360, with 150-step rollouts, the picture is mixed:\n- Training objects: the model beats ParticleFormer on PSNR (18.6 vs 18.0), LPIPS (0.26 vs 0.30) and Chamfer (9.6 vs 10.5 mm).\n- Held-out objects: it keeps the geometry lead (12.1 vs 13.4 mm) but loses on appearance (PSNR 14.8 vs 15.6, LPIPS 0.43 vs 0.31). The authors attribute this to the baselines moving pre-fitted Gaussian splats, whereas this model generates appearance from scratch.\n\nPolicy training and evaluation: Each task uses 100 demos, and success rates are averaged over the four policy architectures. Values below are read approximately from a bar chart, since exact numbers are not tabulated:\n\n| Task | Real-data policies | Simulator-data policies |\n|---|---|---|\n| Part Assembly, visuo-tactile | ~0.8 | ~0.68 |\n| Part Assembly, vision-only (real) | ~0.17 | — |\n| Cloth Folding, front plus wrist views | ~0.95 | ~1.0 |\n| T Pushing, novel viewpoint | ~0.8 | ~0.68 |\n\nFor policy evaluation, checkpoints were each evaluated 20 times in the simulator and 20 times in the real world. Simulator and real success rates correlate at r = 0.958 (Part Assembly), 0.965 (Cloth Folding) and 0.859 (T Pushing).\n\nZero-shot MPC with the Deform360-trained model on four unseen objects reaches final Chamfer distances of 0.031 (cloth), 0.024 (rope), 0.035 (foam) and 0.047 (sloth). These results are presented without baseline comparisons.\n\nLimitations and caveats: The paper reports no ablations. It does not isolate the contributions of the particle stage, the consistency loss, history noise, the K-step curriculum or the tactile channel, beyond the tactile-versus-no-tactile policy comparison. The 50 Hz claim is not broken down by component.\n\nThe model is bounded to a fixed cropped workspace. Composition with backgrounds and new robots, as well as wrist views, depends on extra fine-tuning. Appearance generalization to unseen objects lags behind splat-based baselines.\n\nPolicy experiments rest on small samples (20 trials, wide Clopper-Pearson intervals), and the success rates are shown only graphically. It is not fully clear how the simulator demonstrations were produced. The particle baselines were trained on CoTracker pseudo-tracks, which may handicap them relative to their original setups.\n\nTakeaways: The paper is worth reading if you work on world models for policy evaluation or data generation, especially with wrist cameras, novel viewpoints or tactile sensing. Its main idea is a correspondence-free voxel latent decoded to Gaussians, which gives multi-view consistency and spatially grounded touch at interactive rates. That idea is simple, and the comparison against both 2D video and 3D particle families is fairly broad. Read it with skepticism about the lack of ablations and the small-sample policy results. Readers mainly interested in open-world generalization should note the weaker held-out appearance results.", "cost": 0.3555, "input_tokens": 68647, "output_tokens": 4045}, "arxiv-2203-01153": {"text": "Gist: InsertionNet 2.0 is a supervised residual policy for peg-in-hole style insertion. It regresses pose corrections from stereo wrist images plus force/torque direction, and it learns from about 150 self-collected samples per plug, with no RL, demonstrations or reward engineering. It extends the authors' earlier InsertionNet in four ways: two wrist cameras, data collected along free-space trajectories so the robot no longer has to touch the socket surface first, an auxiliary contrastive loss, and a relation-network head that enables one-shot transfer and simple multi-step tasks. It reports near-perfect success on 16 real connectors and threads.\n\nQuestion: Online RL and Sim2Real approaches to contact-rich insertion are expensive, risky for hardware, and limited by simulation fidelity. The original InsertionNet avoided these problems with backward-learned regression, but it used a single wrist camera. That camera could not resolve depth ambiguity, so the robot had to touch the socket before correcting. The paper asks three things: whether a multiview, multimodal regression approach can remove that contact requirement, whether it can cut sample needs using unlabeled data, and whether it can generalize to unseen plugs and multi-step sequences.\n\nMethod: Data collection uses \"general backward learning.\" A human first inserts the plug and the final pose L_final is registered. The robot then repeatedly moves under impedance control to random targets drawn from a normal distribution around L_final (r0 = 10 mm, θ0 = 10°). These alternate between a \"high\" target, up to 50 mm above the hole, and a \"low\" target at hole height. Along each trajectory it logs stereo images, force and moment, labeled with L_final minus the current pose. The authors report that uniform sampling put too many points far from the hole.\n\nMethod (network and policy): A single ResNet18 encoder is trained jointly on three losses.\n- An InfoNCE contrastive loss with a Polyak-averaged momentum encoder (m = 0.999), in the style of CURL, applied to the stacked 6-channel stereo image.\n- A \"Delta\" regression loss predicting the 6-DoF correction from images and force.\n- A \"Relation\" loss that takes two images of the same task and predicts the difference in their corrections.\n\nForce and moment are fed in as unit direction vectors only. The images get heavy augmentation, including random convolution, erasing and color jitter, applied consistently within each batch. At runtime, a coarse main policy from InsertionNet 1 brings the gripper near the hole. Within a radius R, the residual policy outputs (Δx, Δy, Δθx, Δθy, Δθz) while z is lowered at a fixed rate. The Delta head is used for standard tasks. The Relation head is conditioned on a stored goal image and is used for one-shot and multi-step tasks.\n\nRobots and setup: The robot is a UR5e arm with two Intel RealSense D435 wrist cameras, each tilted 45° and aimed between the fingers. Force/torque comes from the UR5e's built-in estimate, sampled at 500 Hz over RTDE, with commands sent at 125 Hz. There is no simulator; everything is on the real robot. The 16 tasks reuse the InsertionNet 1 set: AC 2-pin and 3-pin, AUX, DC12V, RJ45, HDMI, keys, power cord, USB, USB-C, VGA, and circle, half-circle, triangle, cube, cylinder and rectangle \"pulley\"/thread pieces. Each plug gets 150 collected samples, which are expanded via augmentation and pairing to about 192k training samples. Training takes 5–15 minutes on two RTX 2080 Ti GPUs.\n\nEvaluation: For each task, test start poses are sampled uniformly in a box around the hole, and 200 consecutive trials are run with the peg not fixed in the gripper, so misalignment accumulates. Success means reaching z − z0 < 1 mm within 10 s.\n\nResults: The Delta policy's worst success rate is 97.5%, on the cylindrical thread, and most tasks score 100%. The largest gains over InsertionNet 1.0 are:\n- VGA: 78.5% to 100%\n- HDMI: 90.5% to 99.5%\n- USB-C: 91.5% to 100%\n- Keys: 90.5% to 100%\n- Power cord: 94% to 98%\n\nA few tasks dropped slightly, for example triangular thread from 100% to 99.5% and cylindrical thread from 100% to 97.5%. Reported mean times are 0–1.54 s, versus 1.3–5 s for v1. However, v2 times subtract the mean reaching time, so the time comparison is not apples-to-apples. The v1 baseline also ran on a Franka Panda, and the authors themselves credit part of the gain to the UR5e's controller.\n\nAblations and sample efficiency: On AC 2-pin (50 trials per point), success reaches 100% at about 40 samples, and completion time approaches its minimum at about 150 samples. With 20 labeled plus 150 unlabeled samples, the contrastive term raised Relation-policy success from 20% to 100% and Delta-policy success from 70% to 100%. In a separate ablation on AC 2-pin, USB and yellow thread, contrastive loss made no noticeable difference for the Delta policy but gave the Relation policy roughly 20% higher success and lower time variance, mostly with small datasets.\n\nRobustness: The Delta policy was trained on 300 samples with grasp angles of 0° and ±15°. It went 50/50 under grasp errors up to 45°, room lights switched on and off, random obstacles, and the board being moved during execution. The Relation policy failed with obstacles unless extra data was collected, and it needed more data to handle large grasp changes.\n\nTransfer and multi-step: A model trained on 15 plugs was tested on the held-out red half-circle thread. Given only a goal image, the Relation policy went 50/50, while the Delta policy went 0/50. The Delta policy recovers with about 20 new samples, versus 150 from scratch. The multi-step task was inserting a key, turning the lock, and turning it back, using a pre-stored stereo goal image for each step and similarity-based step switching. It scored 50/50, even though the training data never visited the inserted or turned states.\n\nLimitations: There is no comparison against RL, LfD or other contemporary insertion methods, only against the authors' own prior system on a different robot. The \"minimal contact\" claim is not quantified with contact-force statistics. Policies are trained per plug and require a human-registered final pose. The test-region bounds B_xy, B_θ and B_z are not specified. Robustness, transfer and multi-step results rest on 50 trials each, with a single held-out object described as \"somewhat similar\" to the training set. Several reported effects, such as the stability gains and the robustness comparisons, are only qualitative.\n\nTakeaway: Read it if you want a practical, low-data, fast-to-train recipe for real-world tight-tolerance insertion. Useful details include the stereo wrist-camera placement, trajectory-wide backward data collection, direction-only force inputs, and a relation head for goal-image-conditioned transfer. Skim it if you need rigorous baselines or analysis of generalization limits.", "cost": 0.1628, "input_tokens": 23056, "output_tokens": 3530}, "arxiv-2606-24457": {"text": "Gist: The paper presents Lite Any Stereo V2 (LAS2), a family of lightweight stereo disparity networks (S, M, L feed-forward and H iterative) meant to generalize zero-shot to unseen real scenes while running fast on GPUs and embedded hardware. It is relevant to robotics because it targets dense metric depth from a stereo pair on a Jetson-class device without per-domain fine-tuning. The authors report state-of-the-art accuracy among efficient stereo methods along with clearly lower measured latency.\n\nQuestion: The paper challenges the common assumption that small, fast stereo networks cannot match the zero-shot generalization of large, foundation-prior models such as FoundationStereo or MonSter++. Those large models run out of memory on edge devices. The paper also addresses two further gaps. First, prior efficient designs were optimized for theoretical MACs rather than real latency. Second, recent \"real-time\" iterative methods such as Fast-FoundationStereo and RT-MonSter++ are only fast on high-end GPUs.\n\nMethod: The architecture uses a FasterNet ImageNet-pretrained encoder producing multi-scale features, which are fused at 1/4 resolution.\n- A correlation cost volume is built with a maximum disparity of 192.\n- Cost aggregation is a 2D-only U-Net built from FasterNet-style blocks, replacing the hybrid 3D-2D aggregation of the earlier LAS. Variants scale the aggregation depth (1/2/4, 4/8/16 and 8/16/32 layers per level for S, M and L).\n- Disparity comes from soft-argmax followed by convex upsampling.\n- LAS2-H reuses LAS2-M as the initializer and adds a group-wise correlation volume and an all-pairs volume, refined over 4 selective-ConvGRU iterations.\n\nTraining happens in three stages:\n- Stage 1 is supervised training on about 1.8M synthetic pairs (SceneFlow, FallingThings, FSD, CREStereo, VKITTI2, TartanAir, Dynamic Replica).\n- Stage 2 is self-distillation: a frozen teacher sees clean inputs while the student sees strongly perturbed ones (color jitter, blur, gamma), with a cosine feature-alignment loss.\n- Stage 3 trains on about 0.5M unlabeled real pairs with dense pseudo-labels from FoundationStereo. The labels are filtered by a left-right consistency mask, an edge mask (disparity edges without image edges) and a SAM 3 sky mask. The loss is clamped per pixel at 10 so that a few high-error pixels cannot dominate early adaptation.\n\nRobots and setup: No robot platform or robotic task is used; this is a pure perception paper.\n- Hardware: latency is measured in PyTorch with torch.compile disabled at 384×1248 on RTX 4090, A5000, A100 and H200 GPUs, and on an NVIDIA Jetson Orin NX 8G at 10W, 20W and MAXN power modes.\n- Real-world training data: Flickr1024, InStereo2k, Holopix50K, DrivingStereo, SouthKenSV and UASOL.\n- Zero-shot evaluation: KITTI 2012/2015, ETH3D, Middlebury (half resolution) and the DrivingStereo weather split.\n- Baselines: efficient feed-forward baselines were retrained on the same synthetic data.\n\nResults: LAS2-M versus the prior LAS on zero-shot benchmarks (lower is better):\n\n| Benchmark | LAS2-M | LAS |\n|---|---|---|\n| KITTI 2012 D1 | 2.88 | 3.04 |\n| KITTI 2015 D1 | 3.61 | 3.87 |\n| ETH3D Bad1 | 2.59 | 3.53 |\n| Middlebury Bad2 | 5.47 | 7.51 |\n| Latency, H200 / Orin MAXN | 8.1 / 101 ms | 12.7 / 193 ms |\n\nLAS2-S runs at 6.6 ms on H200 and 81 ms on Orin. LAS2-L is the most accurate feed-forward model (KITTI 2015 D1 3.38, ETH3D 1.83).\n\nLAS2-H versus Fast-FoundationStereo: KITTI 2012 D1 is 2.64 vs 2.90, KITTI 2015 D1 3.31 vs 3.66, ETH3D ties at 1.83, and Middlebury Bad2 is 3.71 vs 3.73. LAS2-H runs at 15.1 vs 27.3 ms on H200 and 344 vs 918 ms on Orin.\n\nFoundationStereo remains far more accurate on ETH3D (0.49) and Middlebury (1.12), but needs 292 ms on H200 and runs out of memory on Orin.\n\nOn DrivingStereo weather, overall D1 is 7.23 for LAS2-S, 8.74 for LAS and 7.44 for LAS2-H. LAS2-H beats Fast-FoundationStereo (9.15) and even its teacher FoundationStereo (10.71), though MonSter++ is better at 5.21. On the KITTI 2015 test leaderboard, LAS2-M (fine-tuned on KITTI raw pseudo-labels) reaches D1-all 1.61, best among efficient methods; on KITTI 2012 it trails RT-MonSter++ and LAS.\n\nAblations: Architecture choices were selected by measured Orin latency, not MACs. FasterNet aggregation took 107 ms versus 162 ms for ConvNeXt, even though ConvNeXt had fewer MACs.\n\nFor training, the stage progression on LAS2-M moved KITTI 2012 D1 from 4.21 to 3.59 to 2.88 and Middlebury Bad2 from 7.95 to 6.91 to 5.47.\n- Removing error clamping hurt every benchmark (e.g., ETH3D 3.22 vs 2.59).\n- The LR mask gave the largest filtering gain, while the sky mask's effect was mixed.\n- A fixed teacher beat EMA and hard-copy teachers in Stage 2.\n- Adding Stereo4D or Xperience data, or using multiple teachers, did not help.\n- The same recipe substantially improved LightStereo-M and BANet-2D (e.g., Middlebury Bad2 for LightStereo-M fell from 10.29 to 7.08), suggesting it is a reusable training recipe.\n\nLimitations and takeaways: A clear accuracy gap remains to foundation-prior models, especially on ETH3D and Middlebury. The authors attribute this partly to the limited scale of high-quality real stereo data. The model still fails on reflective or transparent surfaces and under severe illumination changes. For roboticists, note three things:\n- Orin latencies are measured in plain PyTorch without TensorRT or compile. Real-time rates on Orin (about 10 Hz for M at 384×1248) may improve with deployment tooling, but this is untested.\n- There is no downstream robotic evaluation such as navigation or grasping.\n- The strongest gains come from the pseudo-label distillation recipe, which is cheap to adopt for other lightweight stereo networks.\n\nThe paper is worth reading if you need an off-the-shelf stereo depth model on Jetson-class hardware or want a practical recipe for distilling a large stereo teacher into a small model.", "cost": 0.3207, "input_tokens": 62885, "output_tokens": 3460}, "arxiv-2511-08544": {"text": "Gist: This is not a robotics paper. It is a self-supervised visual representation learning paper from Balestriero and LeCun (Brown/NYU/Meta-FAIR). It proposes LeJEPA, a Joint-Embedding Predictive Architecture (JEPA) objective built on one claim: embeddings should follow an isotropic Gaussian distribution. A new regularizer, SIGReg, enforces that distribution and replaces the usual anti-collapse heuristics (stop-gradient, teacher–student EMA, predictors, whitening, register tokens). For a robotics researcher, the relevance is indirect. It offers a simple, stable, single-hyperparameter recipe for pretraining encoders, possibly on your own in-domain data, which could serve as a backbone for JEPA-style world models or policies.\n\nQuestion: JEPA training is brittle because nothing principled stops representation collapse, so practitioners stack under-specified tricks and tune many hyperparameters. The paper asks two things. Which embedding distribution minimizes downstream risk when the downstream task is unknown? And can that distribution be enforced in a way that is provable, scales to high dimensions and large batches, and is distributed-friendly?\n\nMethod: On the theory side, the authors argue that anisotropic embeddings increase both the bias of ridge-regularized linear probes and the variance of unregularized OLS probes. For nonlinear probes (radius k-NN and Nadaraya–Watson kernel regression), the integrated squared bias scales with the Fisher information of the embedding density. Under a fixed scalar covariance constraint, the isotropic Gaussian uniquely minimizes that Fisher information. SIGReg then enforces this target in three steps:\n- It projects the batch of embeddings onto M random unit directions, resampled every step and synced across GPUs.\n- On each 1D projection, it runs the Epps–Pulley goodness-of-fit test, a weighted L2 distance between the empirical characteristic function and that of N(0,1), integrated with a 17-point trapezoid rule over [-5,5].\n- It averages the per-direction statistics.\n\nA Cramér–Wold argument justifies testing via 1D projections. Characteristic-function tests are preferred over two alternatives: moment-matching tests, which are non-identifiable with finitely many moments and have unbounded gradients, and CDF tests, which need sorting and are non-differentiable. The Epps–Pulley statistic has provably bounded gradients and curvature, runs in O(N) time and memory, and needs only an all_reduce under data-parallel training. The minibatch estimate carries an O(1/N) bias. The full loss is (1−λ) times a prediction term plus λ times SIGReg applied per view. The prediction term is the squared distance of every view's embedding to the mean of the global-view embeddings, DINO-style multi-crop with no predictor network. The core code is about 50 lines of PyTorch. With a mean/variance-only test, the objective reduces to VICReg, which the authors argue against.\n\nRobots and setup: No robots, robot sensors, simulators or control tasks appear anywhere. The paper mentions action-conditioned robot data (DROID) only to motivate when a predictor network is justified, and never tests it. All experiments are image classification pretraining:\n- Pretraining datasets: ImageNet-1K, ImageNet-100 and ImageNet-10, plus small in-domain sets (Galaxy10 with about 11k galaxy images, Flowers102 with about 1k, CIFAR-10/100, Food101).\n- Transfer evaluation: DTD, Aircraft, Cars and Pets in addition to the above.\n- Backbones: about 60 timm architectures, including ResNets, ViTs (up to ViT-H/14 and a 1.8B ViT-g), ConvNeXt-V2, Swin, MaxViT, LeViT and EfficientNet.\n- Recipe: AdamW, 2 global 224px views plus 6 local 96px views, λ≈0.05.\n- Evaluation: mostly frozen-backbone linear probes, with some full fine-tuning.\n- Qualitative only: PCA feature maps and thresholded [CLS]-attention video object segmentation.\n\nResults: On ImageNet-1K, frozen linear probing reaches 77.1% for ViT-L, 78.5% for ConvNeXtV2-H and 79% for ViT-H/14. There is no same-budget head-to-head against DINOv2-style training on ImageNet-1K.\n\nIn-domain Galaxy10 pretraining is the most striking result: small LeJEPA models beat transfer from frontier natural-image models.\n\n| Galaxy10 setting | Best LeJEPA | DINOv3 ViT-S/16 | DINOv2 ViT-S |\n|---|---|---|---|\n| Frozen probe, all labels | 78.17 (ResNet-34) | 71.38 | 67.62 |\n| Full fine-tuning, all labels | 83.28 (ResNet-34) | 81.60 | 78.34 |\n| Full fine-tuning, 1-shot | 29.42 (ConvNeXt-V2 Nano) | 24.71 | — |\n\nThe flip side appears in Table 5: on natural-image datasets, an I-JEPA ViT-H pretrained on ImageNet-22k still clearly beats small in-domain LeJEPA models (e.g., CIFAR-100 86.9 vs about 70).\n\nTransfer from ImageNet-1K (Table 2, averages over 8 datasets, all-shot):\n\n| Model | Avg accuracy | Pretraining epochs |\n|---|---|---|\n| LeJEPA ViT-L | 79.48 | 100 |\n| I-JEPA ViT-H | 78.50 | 300 |\n| I-JEPA ViT-H + STOP | 80.70 | 300 |\n\nLeJEPA beats plain I-JEPA with a smaller model and a third of the epochs, but I-JEPA+STOP wins on average at 1, 10 and all shots. The text's claim of \"consistently outperform\" is therefore overstated.\n\nAcross about 50 small timm models on ImageNet-10, all train without collapse and reach 91.5–95%. The training loss correlates with downstream linear-probe accuracy, with Spearman of roughly 85–99% depending on setting. Rescaling the loss by λ^0.4 pushes it to about 0.93–0.99. This enables label-free model selection, which is a practical plus.\n\nAblations: Performance is fairly flat over λ, with peaks around 0.01–0.05 that shift with the number of views. A single global view hurts badly (53% vs 72% at 4 views on ViT-L/IN-1K). On ViT-L/IN-1K:\n- Batch size 128 works at 72.2%, versus 74.7% at 512.\n- Shrinking the integration range to [-1,1] costs about 2 points.\n- More slices help modestly; resampling directions each step matters far more than using many fixed ones.\n- Register tokens make no difference.\n\nRemoving the predictor and teacher network does not cause collapse. Adding SWA or an EMA-teacher-like encoder gives small gains for ViTs, e.g., ViT-S 76.6→80.0 with a 1-layer projector. SIGReg costs under 1 ms per call for typical sizes on a V100.\n\nLimitations: The optimality theory relies on strong assumptions, including an isotropic prior on target-function gradients, asymptotic small-bandwidth regimes and Sobolev smoothness of the embedding density. It addresses probe bias and variance rather than representation content. The empirical scope is image classification only. There are no video-prediction, action-conditioned, or robot experiments, and the 1.8B model is shown only through a training curve. There are some presentation sloppinesses, such as a Figure 17 caption with the colors swapped, and claims slightly ahead of the tables.\n\nTakeaway: Read it if you pretrain your own visual encoders, especially on non-standard in-domain robot camera data where DINOv2/v3 transfer may underperform. Also read it if you want a collapse-proof, low-tuning JEPA regularizer to drop into a world-model pipeline. Algorithms 1–2 and Section 4 are the useful parts. Skip it if you are looking for robot learning results; there are none.", "cost": 0.7328, "input_tokens": 164252, "output_tokens": 3790}}, "ratings": {}, "links": {}, "htmlv": {"claude": {"arxiv-2511-08544": {"path": "htmls_claude/arxiv-2511-08544_LeJEPA  Provable and Scalable Self-Supervised Learning Without the Heuristics/index.html", "cost": 0.8129, "input_tokens": 164303, "output_tokens": 7784}, "arxiv-2610-39302": {"path": "htmls_claude/arxiv-2610-39
