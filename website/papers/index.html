r 2022", "abstract": "— We address the problem of devising the means for a robot to rapidly and safely learn insertion skills with just a few human interventions and without hand-crafted rewards or demonstrations. Our InsertionNet version 2.0 provides an improved technique to robustly cope with a wide range of use-cases featuring different shapes, colors, initial poses, etc. In particular, we present a regression-based method based on multimodal input from stereo perception and force, augmented with contrastive learning for the efﬁcient learning of valuable features. In addition, we introduce a one-shot learning technique for insertion, which relies on a relation network scheme to better exploit the collected data and to support multi-step insertion tasks. Our method improves on the results obtained with the original InsertionNet, achieving an almost perfect score (above 97.5% on 200 trials) in 16 real-life insertion tasks while minimizing the execution time and contact during insertion. We further demonstrate our method’s ability to tackle a real-life 3-step insertion task and perfectly solve an unseen insertion task without learning. arXiv:2203.01153v1  [cs.RO]  2 Mar 2022 I. INTRODUCTION Constructing a robot that reliably inserts diverse objects (e.g., plugs, engine gears) is a grand challenge in the design of manufacturing, inspection, and home-service robots. Minimizing action time, maximizing reliability, and minimizing contact between the grasped object and the target component is difﬁcult due to the inherent uncertainty concerning sensing, control, sensitivity to applied forces, and occlusions.", "figure": "figs/arxiv-2203-01153.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2203-01153/fig1.png", "w": 704, "h": 740}, {"n": 2, "page": 2, "src": "figs/arxiv-2203-01153/fig2.png", "w": 332, "h": 712}, {"n": 3, "page": 4, "src": "figs/arxiv-2203-01153/fig3.png", "w": 684, "h": 411}, {"n": 4, "page": 4, "src": "figs/arxiv-2203-01153/fig4.png", "w": 684, "h": 250}, {"n": 5, "page": 4, "src": "figs/arxiv-2203-01153/fig5.png", "w": 704, "h": 344}, {"n": 6, "page": 5, "src": "figs/arxiv-2203-01153/fig6.png", "w": 1434, "h": 559}, {"n": 7, "page": 6, "src": "figs/arxiv-2203-01153/fig7.png", "w": 704, "h": 304}, {"n": 8, "page": 6, "src": "figs/arxiv-2203-01153/fig8.png", "w": 642, "h": 299}]}, "arxiv-2606-24457": {"title": "I. INTRODUCTION F", "abstract": "—Recent advances in stereo matching have achieved remarkable accuracy, but often rely on large models, heavy computation, or additional foundation priors, making them difficult to deploy on resource-constrained platforms. In contrast, efficient stereo models offer faster inference but are commonly considered less capable of strong zero-shot generalization. In this paper, we challenge this assumption by introducing Lite Any Stereo V2 (LAS2), an ultra-fast model series designed for efficient zero-shot stereo matching. LAS2 is developed from both architecture and training perspectives. Architecturally, we revisit efficient stereo design under practical deployment settings and propose a 2D-only cost aggregation framework, optimized for real inference latency rather than theoretical MACs alone. For training, we develop a three-stage strategy that combines synthetic supervision, self-distillation, and realworld knowledge distillation. To improve the reliability of realworld pseudo supervision, we further introduce pseudo-label filtering and an error-clamping operation, enabling smoother synthetic-to-real transfer. We instantiate LAS2 as a family of models, including feed-forward variants for different efficiency budgets and an iterative variant for higher accuracy. Extensive experiments show that LAS2 achieves state-of-the-art accuracy among efficient stereo methods while maintaining significantly lower latency. Specifically, LAS2-M consistently outperforms our previous SOTA feed-forward efficient method LAS across four real-world benchmarks, while running 1.6× faster on H200 and 1.9× faster on Orin 8G. LAS2-H further achieves stronger overall zero-shot performance than the iterative method FastFoundationStereo, with 1.8× and 2.7× faster inference on H200 and Orin, respectively. The project page, demos, and code are available at https://tomtomtommi.github.io/LiteAnyStereoV2/.", "figure": "figs/arxiv-2606-24457.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2606-24457/fig1.png", "w": 721, "h": 857}, {"n": 2, "page": 2, "src": "figs/arxiv-2606-24457/fig2.png", "w": 1462, "h": 855}, {"n": 3, "page": 4, "src": "figs/arxiv-2606-24457/fig3.png", "w": 1462, "h": 844}, {"n": 7, "page": 9, "src": "figs/arxiv-2606-24457/fig7.png", "w": 1462, "h": 776}, {"n": 8, "page": 10, "src": "figs/arxiv-2606-24457/fig8.png", "w": 1462, "h": 890}, {"n": 9, "page": 13, "src": "figs/arxiv-2606-24457/fig9.png", "w": 721, "h": 492}]}, "arxiv-2511-08544": {"title": "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics", "abstract": "", "figure": "figs/arxiv-2511-08544.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2511-08544/fig1.png", "w": 1407, "h": 995}, {"n": 2, "page": 3, "src": "figs/arxiv-2511-08544/fig2.png", "w": 1481, "h": 674}, {"n": 3, "page": 6, "src": "figs/arxiv-2511-08544/fig3.png", "w": 1458, "h": 609}, {"n": 4, "page": 7, "src": "figs/arxiv-2511-08544/fig4.png", "w": 1458, "h": 603}, {"n": 5, "page": 8, "src": "figs/arxiv-2511-08544/fig5.png", "w": 1481, "h": 503}, {"n": 6, "page": 9, "src": "figs/arxiv-2511-08544/fig6.png", "w": 1481, "h": 854}, {"n": 7, "page": 10, "src": "figs/arxiv-2511-08544/fig7.png", "w": 1461, "h": 702}, {"n": 8, "page": 13, "src": "figs/arxiv-2511-08544/fig8.png", "w": 1459, "h": 709}, {"n": 9, "page": 14, "src": "figs/arxiv-2511-08544/fig9.png", "w": 1480, "h": 648}, {"n": 10, "page": 15, "src": "figs/arxiv-2511-08544/fig10.png", "w": 1480, "h": 540}, {"n": 11, "page": 15, "src": "figs/arxiv-2511-08544/fig11.png", "w": 721, "h": 789}, {"n": 12, "page": 16, "src": "figs/arxiv-2511-08544/fig12.png", "w": 1478, "h": 673}, {"n": 13, "page": 16, "src": "figs/arxiv-2511-08544/fig13.png", "w": 1478, "h": 378}, {"n": 14, "page": 17, "src": "figs/arxiv-2511-08544/fig14.png", "w": 1458, "h": 1375}, {"n": 15, "page": 42, "src": "figs/arxiv-2511-08544/fig15.png", "w": 1474, "h": 619}, {"n": 16, "page": 47, "src": "figs/arxiv-2511-08544/fig16.png", "w": 1259, "h": 1870}, {"n": 17, "page": 48, "src": "figs/arxiv-2511-08544/fig17.png", "w": 1475, "h": 1917}, {"n": 18, "page": 49, "src": "figs/arxiv-2511-08544/fig18.png", "w": 1474, "h": 863}, {"n": 19, "page": 49, "src": "figs/arxiv-2511-08544/fig19.png", "w": 1474, "h": 793}, {"n": 20, "page": 50, "src": "figs/arxiv-2511-08544/fig20.png", "w": 1474, "h": 471}, {"n": 21, "page": 50, "src": "figs/arxiv-2511-08544/fig21.png", "w": 1474, "h": 428}]}, "arxiv-2505-09603": {"title": "arXiv:2505.09603v2  [cs.RO]  19 Jun 2026", "abstract": "Recently, the robotics community has amassed ever larger and more diverse datasets to train generalist policies. However, while these policies achieve strong mean performance across a variety of tasks, they often underperform on individual, specialized tasks and require further tuning on newly acquired taskspecific data. Combining task-specific data with carefully curated subsets of large prior datasets via co-training can produce better specialized policies, but selecting data naively may actually harm downstream performance. To address this, we introduce DataMIL, a data selection framework built on the datamodels paradigm that reasons about data selection in an end-to-end manner, using the policy itself to identify which data points will most improve performance. Unlike standard practices that filter data using human notions of quality (e.g., based on semantic or visual similarity), DataMIL directly optimizes data selection for task success, allowing us to select data that improves the policy while dropping data that degrade it. To avoid performing expensive rollouts in the environment during selection, we introduce a surrogate loss function on task-specific data, allowing us to use DataMIL in the real world without degrading performance. We validate our approach on 60+ simulation and real-world manipulation tasks, notably showing successful data selection from the largest open collections of robot datasets (OXE); demonstrating consistent gains in success rates over prior works. Our results underscore the importance of end-to-end, performance-aware data selection for unlocking the potential of large prior datasets in robotics. Code and more information at our website.", "figure": "figs/arxiv-2505-09603.png", "figure_page": 3, "figures": [{"n": 1, "page": 3, "src": "figs/arxiv-2505-09603/fig1.png", "w": 1134, "h": 538}, {"n": 2, "page": 6, "src": "figs/arxiv-2505-09603/fig2.png", "w": 409, "h": 520}, {"n": 3, "page": 7, "src": "figs/arxiv-2505-09603/fig3.png", "w": 299, "h": 172}, {"n": 4, "page": 8, "src": "figs/arxiv-2505-09603/fig4.png", "w": 1134, "h": 575}, {"n": 5, "page": 9, "src": "figs/arxiv-2505-09603/fig5.png", "w": 1134, "h": 407}, {"n": 6, "page": 9, "src": "figs/arxiv-2505-09603/fig6.png", "w": 1134, "h": 401}, {"n": 7, "page": 15, "src": "figs/arxiv-2505-09603/fig7.png", "w": 1134, "h": 653}, {"n": 8, "page": 15, "src": "figs/arxiv-2505-09603/fig8.png", "w": 1134, "h": 308}, {"n": 9, "page": 16, "src": "figs/arxiv-2505-09603/fig9.png", "w": 1134, "h": 309}, {"n": 10, "page": 16, "src": "figs/arxiv-2505-09603/fig10.png", "w": 1134, "h": 793}, {"n": 11, "page": 19, "src": "figs/arxiv-2505-09603/fig11.png", "w": 1134, "h": 384}, {"n": 12, "page": 19, "src": "figs/arxiv-2505-09603/fig12.png", "w": 326, "h": 561}, {"n": 13, "page": 20, "src": "figs/arxiv-2505-09603/fig13.png", "w": 1134, "h": 494}]}, "arxiv-2611-05368": {"title": "arXiv:2611.05368v1  [cs.RO]  3 Nov 2026", "abstract": "Imitation learning policies in robotics are trained on datasets collected through costly real-world teleoperation. Often, the data-collection process is unguided, relying on the teleoperator’s intuition, resulting in data that contributes little to overall policy performance. Recent work has shown that curating such unguided datasets can substantially improve policy performance, but these approaches operate by filtering existing datasets after collection and therefore do not prevent the acquisition of uninformative data. In this work, we propose GUILD, a novel Guided Data Collection (GDC) method that actively reasons about which data should be collected to maximize downstream policy performance. We introduce an iterative framework that alternates between 1) task proposal and data collection and 2) data evaluation to close the loop. For task proposal, we leverage semantic priors from vision–language models to identify relevant environments, object configurations, and goals for data collection. However, since semantic relevance does not imply policy improvement, we perform data evaluation. By leveraging predictive data attribution we approximate how the collected trajectories influence policy performance on a target deployment setting. This signal is then used as feedback to guide subsequent data collection, closing the data collection loop. We evaluate our approach in simulation and real robot settings, demonstrating that guided data collection substantially improves sample efficiency and deployment performance compared to passive data collection strategies, multiple baselines and experienced roboticists. More info at our website.", "figure": "figs/arxiv-2611-05368.png", "figure_page": 3, "figures": [{"n": 1, "page": 3, "src": "figs/arxiv-2611-05368/fig1.png", "w": 1134, "h": 539}, {"n": 2, "page": 7, "src": "figs/arxiv-2611-05368/fig2.png", "w": 1134, "h": 743}, {"n": 3, "page": 8, "src": "figs/arxiv-2611-05368/fig3.png", "w": 1134, "h": 549}, {"n": 4, "page": 8, "src": "figs/arxiv-2611-05368/fig4.png", "w": 332, "h": 425}, {"n": 5, "page": 9, "src": "figs/arxiv-2611-05368/fig5.png", "w": 1134, "h": 433}, {"n": 6, "page": 15, "src": "figs/arxiv-2611-05368/fig6.png", "w": 519, "h": 618}, {"n": 7, "page": 18, "src": "figs/arxiv-2611-05368/fig7.png", "w": 1134, "h": 599}, {"n": 8, "page": 19, "src": "figs/arxiv-2611-05368/fig8.png", "w": 1134, "h": 381}, {"n": 9, "page": 21, "src": "figs/arxiv-2611-05368/fig9.png", "w": 1134, "h": 741}]}, "arxiv-2506-15847": {"title": "SafeMimic: Towards Safe and Autonomous Human-to-Robot Imitation for Mobile Manipulation", "abstract": "—For robots to become efficient helpers in the home, they must learn to perform new mobile manipulation tasks simply by watching humans perform them. Learning from a single video demonstration from a human is challenging as the robot needs to first extract from the demo what needs to be done and how, translate the strategy from a third to a first-person perspective, and then adapt it to be successful with its own morphology. Furthermore, to mitigate the dependency on costly human monitoring, this learning process should be performed in a safe and autonomous manner. We present SAFEMIMIC, a framework to learn new mobile manipulation skills safely and autonomously from a single third-person human video. Given an initial human video demonstration of a multi-step mobile manipulation task, SAFEMIMIC first parses the video into segments, inferring both the semantic changes caused and the motions the human executed to achieve them and translating them to an egocentric reference. Then, it adapts the behavior to the robot’s own morphology by sampling candidate actions around the human ones, and verifying them for safety before execution in a receding horizon fashion using an ensemble of safety Q-functions trained in simulation. When safe forward progression is not possible, SAFEMIMIC backtracks to previous states and attempts a different sequence of actions, adapting both the trajectory and the grasping modes when required for its morphology. As a result, SAFEMIMIC yields a strategy that succeeds in the demonstrated behavior and learns task-specific actions that reduce exploration in future attempts. Our experiments show that our method allows robots to safely and efficiently learn multi-step mobile manipulation behaviors from a single human demonstration, from different users, and in different environments, with improvements over state-of-theart baselines across seven tasks. For more information and video results, https://robin-lab.cs.utexas.edu/SafeMimic/ arXiv:2506.15847v1  [cs.RO]  18 Jun 2025 Unsafe  Predicted Actions Backtracking Successful Adaptation", "figure": null, "figure_page": null, "figures": [{"n": 2, "page": 3, "src": "figs/arxiv-2506-15847/fig2.png", "w": 1462, "h": 884}, {"n": 3, "page": 5, "src": "figs/arxiv-2506-15847/fig3.png", "w": 1462, "h": 311}, {"n": 4, "page": 6, "src": "figs/arxiv-2506-15847/fig4.png", "w": 1462, "h": 694}, {"n": 5, "page": 7, "src": "figs/arxiv-2506-15847/fig5.png", "w": 1096, "h": 1234}, {"n": 6, "page": 7, "src": "figs/arxiv-2506-15847/fig6.png", "w": 882, "h": 974}, {"n": 7, "page": 8, "src": "figs/arxiv-2506-15847/fig7.png", "w": 721, "h": 528}, {"n": 8, "page": 14, "src": "figs/arxiv-2506-15847/fig8.png", "w": 721, "h": 954}, {"n": 9, "page": 14, "src": "figs/arxiv-2506-15847/fig9.png", "w": 721, "h": 481}, {"n": 10, "page": 14, "src": "figs/arxiv-2506-15847/fig10.png", "w": 721, "h": 1207}, {"n": 11, "page": 15, "src": "figs/arxiv-2506-15847/fig11.png", "w": 732, "h": 372}, {"n": 12, "page": 15, "src": "figs/arxiv-2506-15847/fig12.png", "w": 732, "h": 806}]}, "arxiv-2611-06881": {"title": "VABAR: A Variational Automation Benchmark for Agentic Robotics", "abstract": "", "figure": "figs/arxiv-2611-06881.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2611-06881/fig1.png", "w": 1441, "h": 785}, {"n": 2, "page": 4, "src": "figs/arxiv-2611-06881/fig2.png", "w": 1439, "h": 900}, {"n": 3, "page": 5, "src": "figs/arxiv-2611-06881/fig3.png", "w": 1440, "h": 160}, {"n": 4, "page": 6, "src": "figs/arxiv-2611-06881/fig4.png", "w": 1436, "h": 737}, {"n": 5, "page": 7, "src": "figs/arxiv-2611-06881/fig5.png", "w": 707, "h": 586}]}, "pdf-beb8536dd7": {"title": "Evaluating Beneﬁt-Risk in Robotic Medical Devices with Autonomous or Remote Teleoperation Capabilities November 2026", "abstract": "", "figure": null, "figure_page": null, "figures": []}, "pdf-a4184160bb": {"title": "arXiv:2609.07303v1  [cs.LG]  7 Sep 2026", "abstract": "Current paradigms for training language models via reinforcement learning rely heavily on sparse outcome rewards. However, as we pursue tasks that require longer and more complicated trajectories, such strategies result in slow learning. Prior work has attempted to address this problem by rewarding partial progress; however, naive formulations are often biased and converge to suboptimal policies. We show that a simple and unbiased dense reward formulation, which we term progressive point matching, scales exponentially more efficiently to long-horizon tasks by rewarding partial progress on a segment level, both theoretically and empirically via synthetic environments. We then show how progressive point matching can be practically instantiated using a single reference trajectory per task. On extremely hard math reasoning problems, sparse outcome rewards cannot make any progress, whereas segment-level rewards enable improvements at larger test-time token budgets when measured by success rate or pass@k.", "figure": null, "figure_page": null, "figures": [{"n": 2, "page": 4, "src": "figs/pdf-a4184160bb/fig2.png", "w": 1143, "h": 672}, {"n": 3, "page": 5, "src": "figs/pdf-a4184160bb/fig3.png", "w": 1139, "h": 277}, {"n": 5, "page": 9, "src": "figs/pdf-a4184160bb/fig5.png", "w": 578, "h": 476}, {"n": 6, "page": 21, "src": "figs/pdf-a4184160bb/fig6.png", "w": 1140, "h": 441}, {"n": 7, "page": 25, "src": "figs/pdf-a4184160bb/fig7.png", "w": 578, "h": 164}, {"n": 8, "page": 27, "src": "figs/pdf-a4184160bb/fig8.png", "w": 1140, "h": 482}, {"n": 9, "page": 28, "src": "figs/pdf-a4184160bb/fig9.png", "w": 1140, "h": 705}, {"n": 10, "page": 29, "src": "figs/pdf-a4184160bb/fig10.png", "w": 1141, "h": 408}]}, "pdf-08009bbec2": {"title": "Precise and Dexterous Robotic Manipulation via Human-in-the-Loop Reinforcement Learning", "abstract": "", "figure": "figs/pdf-08009bbec2.png", "figure_page": 2, "figures": [{"n": 1, "page": 2, "src": "figs/pdf-08009bbec2/fig1.png", "w": 1346, "h": 1420}, {"n": 2, "page": 6, "src": "figs/pdf-08009bbec2/fig2.png", "w": 1348, "h": 1145}, {"n": 3, "page": 8, "src": "figs/pdf-08009bbec2/fig3.png", "w": 1347, "h": 956}, {"n": 4, "page": 10, "src": "figs/pdf-08009bbec2/fig4.png", "w": 1347, "h": 1796}, {"n": 5, "page": 14, "src": "figs/pdf-08009bbec2/fig5.png", "w": 1347, "h": 1232}, {"n": 6, "page": 16, "src": "figs/pdf-08009bbec2/fig6.png", "w": 1347, "h": 771}, {"n": 7, "page": 18, "src": "figs/pdf-08009bbec2/fig7.png", "w": 1347, "h": 1091}, {"n": 8, "page": 20, "src": "figs/pdf-08009bbec2/fig8.png", "w": 1348, "h": 1234}, {"n": 9, "page": 32, "src": "figs/pdf-08009bbec2/fig9.png", "w": 1342, "h": 944}, {"n": 10, "page": 32, "src": "figs/pdf-08009bbec2/fig10.png", "w": 1342, "h": 416}, {"n": 11, "page": 34, "src": "figs/pdf-08009bbec2/fig11.png", "w": 1342, "h": 520}, {"n": 12, "page": 35, "src": "figs/pdf-08009bbec2/fig12.png", "w": 1342, "h": 425}, {"n": 13, "page": 36, "src": "figs/pdf-08009bbec2/fig13.png", "w": 1342, "h": 485}, {"n": 14, "page": 37, "src": "figs/pdf-08009bbec2/fig14.png", "w": 1341, "h": 936}, {"n": 15, "page": 40, "src": "figs/pdf-08009bbec2/fig15.png", "w": 1342, "h": 934}, {"n": 16, "page": 41, "src": "figs/pdf-08009bbec2/fig16.png", "w": 1203, "h": 600}, {"n": 17, "page": 42, "src": "figs/pdf-08009bbec2/fig17.png", "w": 1342, "h": 941}, {"n": 18, "page": 42, "src": "figs/pdf-08009bbec2/fig18.png", "w": 1342, "h": 425}, {"n": 19, "page": 44, "src": "figs/pdf-08009bbec2/fig19.png", "w": 1342, "h": 945}, {"n": 20, "page": 44, "src": "figs/pdf-08009bbec2/fig20.png", "w": 1342, "h": 425}, {"n": 21, "page": 46, "src": "figs/pdf-08009bbec2/fig21.png", "w": 1342, "h": 938}, {"n": 22, "page": 46, "src": "figs/pdf-08009bbec2/fig22.png", "w": 1342, "h": 416}, {"n": 23, "page": 48, "src": "figs/pdf-08009bbec2/fig23.png", "w": 1346, "h": 1052}, {"n": 24, "page": 48, "src": "figs/pdf-08009bbec2/fig24.png", "w": 1346, "h": 416}, {"n": 25, "page": 50, "src": "figs/pdf-08009bbec2/fig25.png", "w": 1342, "h": 1047}, {"n": 26, "page": 54, "src": "figs/pdf-08009bbec2/fig26.png", "w": 1347, "h": 953}]}, "pdf-556e228a43": {"title": "arXiv:2411.05193v2  [cs.LG]  27 Nov 2024", "abstract": "", "figure": "figs/pdf-556e228a43.png", "figure_page": 2, "figures": [{"n": 1, "page": 2, "src": "figs/pdf-556e228a43/fig1.png", "w": 1140, "h": 418}, {"n": 2, "page": 8, "src": "figs/pdf-556e228a43/fig2.png", "w": 1141, "h": 629}, {"n": 3, "page": 10, "src": "figs/pdf-556e228a43/fig3.png", "w": 545, "h": 567}, {"n": 4, "page": 10, "src": "figs/pdf-556e228a43/fig4.png", "w": 541, "h": 569}]}, "pdf-a8dfbb77a3": {"title": "arXiv:2411.07681v2  [cs.LG]  18 Nov 2024", "abstract": "Despite the remarkable capabilities of modern large language models (LLMs), the mechanisms behind their problem-solving abilities remain elusive. In this work, we aim to better understand how the learning dynamics of LLM finetuning shapes downstream generalization. Our analysis focuses on reasoning tasks, whose problem structure allows us to distinguish between memorization (the exact replication of reasoning steps from the training data) and performance (the correctness of the final solution). We find that a model’s generalization behavior can be effectively characterized by a training metric we call pre-memorization train accuracy: the accuracy of model samples on training queries before they begin to copy the exact reasoning steps from the training set. On the dataset level, this metric is able to reliably predict test accuracy, achieving R2 of around or exceeding 0.9 across various models (Llama3 8B, Gemma2 9B), datasets (GSM8k, MATH), and training configurations. On a per-example level, this metric is also indicative of whether individual model predictions are robust to perturbations in the training query. By connecting a model’s learning behavior to its generalization, pre-memorization train accuracy can guide targeted improvements to training strategies. We focus on data curation as an example, and show that prioritizing examples with low pre-memorization accuracy leads to 1.5-2x improvements in data efficiency compared to i.i.d. data scaling, and outperforms other standard data curation techniques.", "figure": "figs/pdf-a8dfbb77a3.png", "figure_page": 2, "figures": [{"n": 1, "page": 2, "src": "figs/pdf-a8dfbb77a3/fig1.png", "w": 1262, "h": 557}, {"n": 2, "page": 4, "src": "figs/pdf-a8dfbb77a3/fig2.png", "w": 1262, "h": 779}, {"n": 3, "page": 4, "src": "figs/pdf-a8dfbb77a3/fig3.png", "w": 1262, "h": 462}, {"n": 4, "page": 6, "src": "figs/pdf-a8dfbb77a3/fig4.png", "w": 1262, "h": 960}, {"n": 5, "page": 6, "src": "figs/pdf-a8dfbb77a3/fig5.png", "w": 1262, "h": 368}, {"n": 6, "page": 7, "src": "figs/pdf-a8dfbb77a3/fig6.png", "w": 1262, "h": 500}, {"n": 7, "page": 8, "src": "figs/pdf-a8dfbb77a3/fig7.png", "w": 1262, "h": 907}, {"n": 8, "page": 9, "src": "figs/pdf-a8dfbb77a3/fig8.png", "w": 1262, "h": 611}, {"n": 10, "page": 12, "src": "figs/pdf-a8dfbb77a3/fig10.png", "w": 1262, "h": 748}]}, "arxiv-2410-24164": {"title": "π0: A Vision-Language-Action Flow Model for", "abstract": "—Robot learning holds tremendous promise to unlock the full potential of flexible, general, and dexterous robot systems, as well as to address some of the deepest questions in artificial intelligence. However, bringing robot learning to the level of generality required for effective real-world systems faces major obstacles in terms of data, generalization, and robustness. In this paper, we discuss how generalist robot policies (i.e., robot foundation models) can address these challenges, and how we can design effective generalist robot policies for complex and highly dexterous tasks. We propose a novel flow matching architecture built on top of a pre-trained vision-language model (VLM) to inherit Internet-scale semantic knowledge. We then discuss how this model can be trained on a large and diverse dataset from multiple dexterous robot platforms, including single-arm robots, dual-arm robots, and mobile manipulators. We evaluate our model in terms of its ability to perform tasks via direct prompting, follow language instructions from people and from a high-level VLM policy, and its ability to acquire new skills via fine-tuning. Our results cover a wide variety of tasks, such as laundry folding, table cleaning, and assembling boxes.", "figure": "figs/arxiv-2410-24164.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2410-24164/fig1.png", "w": 1462, "h": 1090}, {"n": 2, "page": 2, "src": "figs/arxiv-2410-24164/fig2.png", "w": 1462, "h": 353}, {"n": 3, "page": 4, "src": "figs/arxiv-2410-24164/fig3.png", "w": 1462, "h": 589}, {"n": 4, "page": 5, "src": "figs/arxiv-2410-24164/fig4.png", "w": 721, "h": 545}, {"n": 5, "page": 6, "src": "figs/arxiv-2410-24164/fig5.png", "w": 721, "h": 629}, {"n": 6, "page": 7, "src": "figs/arxiv-2410-24164/fig6.png", "w": 874, "h": 680}, {"n": 7, "page": 8, "src": "figs/arxiv-2410-24164/fig7.png", "w": 770, "h": 866}, {"n": 8, "page": 8, "src": "figs/arxiv-2410-24164/fig8.png", "w": 721, "h": 498}, {"n": 9, "page": 9, "src": "figs/arxiv-2410-24164/fig9.png", "w": 721, "h": 770}, {"n": 10, "page": 9, "src": "figs/arxiv-2410-24164/fig10.png", "w": 726, "h": 751}, {"n": 11, "page": 10, "src": "figs/arxiv-2410-24164/fig11.png", "w": 1462, "h": 824}, {"n": 12, "page": 11, "src": "figs/arxiv-2410-24164/fig12.png", "w": 962, "h": 854}, {"n": 13, "page": 11, "src": "figs/arxiv-2410-24164/fig13.png", "w": 1446, "h": 877}, {"n": 14, "page": 16, "src": "figs/arxiv-2410-24164/fig14.png", "w": 721, "h": 565}]}, "arxiv-2501-09747": {"title": "FAST: Efficient Action Tokenization for Vision-Language-Action Models", "abstract": "—Autoregressive sequence models, such as Transformer-based vision-language action (VLA) policies, can be tremendously effective for capturing complex and generalizable robotic behaviors. However, such models require us to choose a tokenization of our continuous action signals, which determines how the discrete symbols predicted by the model map to continuous robot actions. We find that current approaches for robot action tokenization, based on simple per-dimension, per-timestep binning schemes, typically perform poorly when learning dexterous skills from high-frequency robot data. To address this challenge, we propose a new compression-based tokenization scheme for robot actions, based on the discrete cosine transform. Our tokenization approach, Frequency-space Action Sequence Tokenization (FAST), enables us to train autoregressive VLAs for highly dexterous and high-frequency tasks where standard discretization methods fail completely. Based on FAST, we release FAST+, a universal robot action tokenizer, trained on 1M real robot action trajectories. It can be used as a black-box tokenizer for a wide range of robot action sequences, with diverse action spaces and control frequencies. Finally, we show that, when combined with the π0 VLA, our method can scale to training on 10k hours of robot data and match the performance of diffusion VLAs, while reducing training time by up to 5x. I. INTRODUCTION Large, high-capacity Transformer models can be tremendously effective for capturing complex and generalizable robotic behaviors both from scratch [8, 69, 51, 6, 20, 62] and using models pre-trained for next-token prediction on Internet-scale image-text corpora [10, 39, 63, 7, 65]. However, these models require choosing a tokenization of the continuous action signal, which determines how the discrete symbols predicted by the model map to continuous robot actions [64, 34, 41, 12]. It is widely known that a good choice of tokenization can be critical to the performance of sequence models [55, 57]. Prior robotic policies of this sort typically use na¨ıve tokenization strategies based on a per-dimension, per-timestep binning scheme [9, 10, 39]. We find that such methods perform poorly when learning dexterous skills with high-frequency control (see Figure 2, right). We observe that correlations between time steps are a major challenge for na¨ıve tokenization strategies when predicting sequences of", "figure": "figs/arxiv-2501-09747.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2501-09747/fig1.png", "w": 721, "h": 1391}, {"n": 2, "page": 2, "src": "figs/arxiv-2501-09747/fig2.png", "w": 721, "h": 848}, {"n": 3, "page": 3, "src": "figs/arxiv-2501-09747/fig3.png", "w": 721, "h": 1250}, {"n": 4, "page": 5, "src": "figs/arxiv-2501-09747/fig4.png", "w": 1462, "h": 660}, {"n": 5, "page": 6, "src": "figs/arxiv-2501-09747/fig5.png", "w": 721, "h": 1375}, {"n": 6, "page": 8, "src": "figs/arxiv-2501-09747/fig6.png", "w": 1462, "h": 557}, {"n": 7, "page": 8, "src": "figs/arxiv-2501-09747/fig7.png", "w": 721, "h": 768}, {"n": 8, "page": 8, "src": "figs/arxiv-2501-09747/fig8.png", "w": 721, "h": 518}, {"n": 9, "page": 9, "src": "figs/arxiv-2501-09747/fig9.png", "w": 721, "h": 687}, {"n": 10, "page": 10, "src": "figs/arxiv-2501-09747/fig10.png", "w": 1462, "h": 536}, {"n": 11, "page": 10, "src": "figs/arxiv-2501-09747/fig11.png", "w": 721, "h": 628}, {"n": 12, "page": 16, "src": "figs/arxiv-2501-09747/fig12.png", "w": 721, "h": 1546}, {"n": 13, "page": 17, "src": "figs/arxiv-2501-09747/fig13.png", "w": 709, "h": 1585}, {"n": 14, "page": 18, "src": "figs/arxiv-2501-09747/fig14.png", "w": 709, "h": 394}, {"n": 15, "page": 18, "src": "figs/arxiv-2501-09747/fig15.png", "w": 721, "h": 661}]}, "arxiv-2502-19417": {"title": "Hi Robot: Open-Ended Instruction Following with Hierarchical Vision-Language-Action Models", "abstract": "inputs, corrections, and feedback. Achieving this kind of flexibility is essential for robots in open-ended, humancentric environments. For instance, consider a robot tasked with tidying up a table after a meal: instead of rigidly following a single predefined set of steps, the robot would need to interpret dynamic prompts like “only take away someone’s dishes if they are done eating,” respond to corrections like “leave it alone,” and adapt when faced with unfamiliar challenges, such as a delicate object that requires special handling. This paper aims to advance robotic intelligence by enabling robots to interpret and act on diverse natural language commands, feedback, and corrections – a step towards creating agents that reason through tasks, integrate human feedback seamlessly, and operate with humanlike adaptability. If we can enable a robot to process and engage with complex natural language interaction, we can unlock not only better instruction following, but also the ability for users to guide a robot through new tasks and correct the robot in real time. Generalist robots that can perform a range of different tasks in open-world settings must be able to not only reason about the steps needed to accomplish their goals, but also process complex instructions, prompts, and even feedback during task execution. Intricate instructions (e.g., “Could you make me a vegetarian sandwich?” or “I don’t like that one”) require not just the ability to physically perform the individual steps, but the ability to situate complex commands and feedback in the physical world. In this work, we describe a system that uses vision-language models in a hierarchical structure, first reasoning over complex prompts and user feedback to deduce the most appropriate next step to fulfill the task, and then performing that step with low-level actions. In contrast to direct instruction following methods that can fulfill simple commands (“pick up the cup”), our system can reason through complex prompts and incorporate situated feedback during task execution (“that’s not trash”). We evaluate our system across three robotic platforms, including single-arm, dual-arm, and dualarm mobile robots, demonstrating its ability to handle tasks such as cleaning messy tables, making sandwiches, and grocery shopping. Achieving this level of flexibility and steerability in robotic systems is challenging. While standard languageconditioned imitation learning can follow simple, atomic instructions such as “pick up the coke can” (Brohan et al., 2022), real-world tasks are rarely so straightforward. Imagine a more realistic prompt, such as: “Could you make me a vegetarian sandwich? I’d prefer it without tomatoes. Also, if you have ham or roast beef, could you make a separate sandwich with one of those for my friend?” This requires not only understanding the language, but also the ability to situate commands within the current context and compose existing skills (e.g., picking up the roast beef) to solve a new task. If the robot further receives corrections and feedback (“that’s not how you do it, you have to get lower, otherwise you’ll keep missing”), these must also be integrated dynamically into task execution. This challenge resembles the distinction between Kahneman’s “System 1” and “System 2” cognitive processes (Kahneman, 2011). The “automatic” System 1 corresponds to a policy capable of executing straightforward commands by triggering pre-learned skills, while the more deliberative 1. Introduction A defining feature of intelligence is its flexibility: people not only excel at complex tasks but also adapt to new situations, modify behaviors in real time, and respond to diverse 1Physical Intelligence 2Stanford University 3University of California, Berkeley. Correspondence to: Physical Intelligence <research@physicalintelligence.company>. Proceedings of the 42 nd International Conference on Machine Learning, Vancouver, Canada. PMLR 267, 2025. Copyright 2025 by the author(s). 1", "figure": "figs/arxiv-2502-19417.png", "figure_page": 2, "figures": [{"n": 1, "page": 2, "src": "figs/arxiv-2502-19417/fig1.png", "w": 1384, "h": 599}, {"n": 2, "page": 4, "src": "figs/arxiv-2502-19417/fig2.png", "w": 1368, "h": 692}, {"n": 3, "page": 5, "src": "figs/arxiv-2502-19417/fig3.png", "w": 1368, "h": 881}, {"n": 4, "page": 6, "src": "figs/arxiv-2502-19417/fig4.png", "w": 1384, "h": 1564}, {"n": 5, "page": 7, "src": "figs/arxiv-2502-19417/fig5.png", "w": 1384, "h": 499}, {"n": 6, "page": 8, "src": "figs/arxiv-2502-19417/fig6.png", "w": 1384, "h": 602}, {"n": 7, "page": 9, "src": "figs/arxiv-2502-19417/fig7.png", "w": 1368, "h": 664}, {"n": 8, "page": 9, "src": "figs/arxiv-2502-19417/fig8.png", "w": 674, "h": 628}]}, "arxiv-2504-16054": {"title": "π0.5: a Vision-Language-Action Model with", "abstract": "—In order for robots to be useful, they must perform practically relevant tasks in the real world, outside of the lab. While vision-language-action (VLA) models have demonstrated impressive results for end-to-end robot control, it remains an open question how far such models can generalize in the wild. We describe π0.5, a new model based on π0 that uses co-training on heterogeneous tasks to enable broad generalization. π0.5 uses data from multiple robots, high-level semantic prediction, web data, and other sources to enable broadly generalizable realworld robotic manipulation. Our system uses a combination of co-training and hybrid multi-modal examples that combine image observations, language commands, object detections, semantic subtask prediction, and low-level actions. Our experiments show that this kind of knowledge transfer is essential for effective generalization, and we demonstrate for the first time that an end-to-end learning-enabled robotic system can perform long- horizon and dexterous manipulation skills, such as cleaning a kitchen or bedroom, in entirely new homes. I. INTRODUCTION Stuff your eyes with wonder... See the world. It’s more fantastic than any dream made or paid for in factories. Ray Bradbury, Fahrenheit 451 Open-world generalization represents one of the biggest open problems in physical intelligence: embodied systems such as robotic arms, humanoids, and autonomous vehicles only truly become useful when they can leave the lab and handle the diverse situations and unexpected events that occur in the real world. Learning-based systems offer a path to en-", "figure": "figs/arxiv-2504-16054.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2504-16054/fig1.png", "w": 1462, "h": 980}, {"n": 2, "page": 2, "src": "figs/arxiv-2504-16054/fig2.png", "w": 1462, "h": 357}, {"n": 3, "page": 4, "src": "figs/arxiv-2504-16054/fig3.png", "w": 1462, "h": 769}, {"n": 4, "page": 6, "src": "figs/arxiv-2504-16054/fig4.png", "w": 1462, "h": 984}, {"n": 5, "page": 7, "src": "figs/arxiv-2504-16054/fig5.png", "w": 721, "h": 569}, {"n": 6, "page": 8, "src": "figs/arxiv-2504-16054/fig6.png", "w": 1462, "h": 486}, {"n": 7, "page": 8, "src": "figs/arxiv-2504-16054/fig7.png", "w": 1462, "h": 1066}, {"n": 8, "page": 9, "src": "figs/arxiv-2504-16054/fig8.png", "w": 721, "h": 603}, {"n": 9, "page": 9, "src": "figs/arxiv-2504-16054/fig9.png", "w": 721, "h": 485}, {"n": 10, "page": 10, "src": "figs/arxiv-2504-16054/fig10.png", "w": 721, "h": 591}, {"n": 11, "page": 10, "src": "figs/arxiv-2504-16054/fig11.png", "w": 721, "h": 1192}, {"n": 12, "page": 10, "src": "figs/arxiv-2504-16054/fig12.png", "w": 721, "h": 415}, {"n": 13, "page": 11, "src": "figs/arxiv-2504-16054/fig13.png", "w": 721, "h": 731}, {"n": 14, "page": 18, "src": "figs/arxiv-2504-16054/fig14.png", "w": 709, "h": 272}, {"n": 15, "page": 18, "src": "figs/arxiv-2504-16054/fig15.png", "w": 721, "h": 420}, {"n": 16, "page": 18, "src": "figs/arxiv-2504-16054/fig16.png", "w": 721, "h": 545}, {"n": 17, "page": 19, "src": "figs/arxiv-2504-16054/fig17.png", "w": 1462, "h": 510}, {"n": 18, "page": 19, "src": "figs/arxiv-2504-16054/fig18.png", "w": 709, "h": 751}]}, "arxiv-2505-23705": {"title": "Knowledge Insulating Vision-Language-Action Models: Train Fast, Run Fast, Generalize Better", "abstract": "Vision-language-action (VLA) models provide a powerful approach to training control policies for physical systems, such as robots, by combining end-to-end learning with transfer of semantic knowledge from web-scale vision-language model (VLM) training. However, the constraints of real-time control are often at odds with the design of VLMs: the most powerful VLMs have tens or hundreds of billions of parameters, presenting an obstacle to real-time inference, and operate on discrete tokens rather than the continuous-valued outputs that are required for controlling robots. To address this challenge, recent VLA models have used specialized modules for efficient continuous control, such as action experts or continuous output heads, which typically require adding new untrained parameters to the pretrained VLM backbone. While these modules improve real-time and control capabilities, it remains an open question whether they preserve or degrade the semantic knowledge contained in the pretrained VLM, and what effect they have on the VLA training dynamics. In this paper, we study this question in the context of VLAs that include a continuous diffusion or flow matching action expert, showing that naively including such experts significantly harms both training speed and knowledge transfer. We provide an extensive analysis of various design choices, their impact on performance and knowledge transfer, and propose a technique for insulating the VLM backbone during VLA training that mitigates this issue. Videos are available at https://pi.website/research/knowledge_insulation.", "figure": "figs/arxiv-2505-23705.png", "figure_page": 2, "figures": [{"n": 1, "page": 2, "src": "figs/arxiv-2505-23705/fig1.png", "w": 1140, "h": 533}, {"n": 2, "page": 5, "src": "figs/arxiv-2505-23705/fig2.png", "w": 688, "h": 400}, {"n": 3, "page": 6, "src": "figs/arxiv-2505-23705/fig3.png", "w": 1139, "h": 240}, {"n": 5, "page": 8, "src": "figs/arxiv-2505-23705/fig5.png", "w": 1140, "h": 567}, {"n": 7, "page": 9, "src": "figs/arxiv-2505-23705/fig7.png", "w": 1140, "h": 359}, {"n": 8, "page": 9, "src": "figs/arxiv-2505-23705/fig8.png", "w": 1140, "h": 297}, {"n": 9, "page": 10, "src": "figs/arxiv-2505-23705/fig9.png", "w": 464, "h": 330}, {"n": 10, "page": 16, "src": "figs/arxiv-2505-23705/fig10.png", "w": 1140, "h": 506}]}, "arxiv-2506-07339": {"title": "Real-Time Execution of Action Chunking Flow Policies", "abstract": "Modern AI systems, especially those interacting with the physical world, increasingly require real-time performance. However, the high latency of state-of-the-art generalist models, including recent vision-language-action models (VLAs), poses a significant challenge. While action chunking has enabled temporal consistency in high-frequency control tasks, it does not fully address the latency problem, leading to pauses or out-of-distribution jerky movements at chunk boundaries. This paper presents a novel inference-time algorithm that enables smooth asynchronous execution of action chunking policies. Our method, real-time chunking (RTC), is applicable to any diffusion- or flow-based VLA out of the box with no re-training. It generates the next action chunk while executing the current one, “freezing” actions guaranteed to execute and “inpainting” the rest. To test RTC, we introduce a new benchmark of 12 highly dynamic tasks in the Kinetix simulator, as well as evaluate 6 challenging real-world bimanual manipulation tasks. Results demonstrate that RTC is fast, performant, and uniquely robust to inference delay, significantly improving task throughput and enabling high success rates in precise tasks—such as lighting a match—even in the presence of significant latency. See https://pi.website/research/real_time_chunking for videos.", "figure": "figs/arxiv-2506-07339.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2506-07339/fig1.png", "w": 1137, "h": 683}, {"n": 2, "page": 3, "src": "figs/arxiv-2506-07339/fig2.png", "w": 568, "h": 539}, {"n": 3, "page": 4, "src": "figs/arxiv-2506-07339/fig3.png", "w": 1143, "h": 605}, {"n": 4, "page": 5, "src": "figs/arxiv-2506-07339/fig4.png", "w": 391, "h": 466}, {"n": 5, "page": 7, "src": "figs/arxiv-2506-07339/fig5.png", "w": 1144, "h": 742}, {"n": 6, "page": 8, "src": "figs/arxiv-2506-07339/fig6.png", "w": 1139, "h": 812}, {"n": 7, "page": 23, "src": "figs/arxiv-2506-07339/fig7.png", "w": 1140, "h": 1057}, {"n": 8, "page": 25, "src": "figs/arxiv-2506-07339/fig8.png", "w": 1138, "h": 614}]}, "arxiv-2511-14759": {"title": "π∗", "abstract": "—We study how vision-language-action (VLA) models can improve through real-world deployments via reinforcement learning (RL). We present a general-purpose method, RL with Experience and Corrections via Advantage-conditioned Policies (RECAP), that provides for RL training of VLAs via advantage conditioning. Our method incorporates heterogeneous data into the self-improvement process, including demonstrations, data from on-policy collection, and expert teleoperated interventions provided during autonomous execution. RECAP starts by pretraining a generalist VLA with offline RL, which we call π∗ 0.6, that can then be specialized to attain high performance on downstream tasks through on-robot data collection. We show that the π∗ 0.6 model trained with the full RECAP method can fold laundry in real homes, reliably assemble boxes, and make espresso drinks using a professional espresso machine. On some of the hardest tasks, RECAP more than doubles task throughput and roughly halves the task failure rate. I. INTRODUCTION In this paper, we present RECAP, a method that enables VLA models to incorporate reward feedback in all stages of the training pipeline, from pre-training all the way to training on data from autonomous execution. RECAP aims to address this problem with a general-purpose recipe that combines demonstrations, autonomous experience, and expert interventions. Starting from the training recipe for a general- It’s amazing what you can learn if you’re not afraid to try. Robert A. Heinlein, Have Space Suit–Will Travel Practice makes perfect: while people are remarkably flexible in acquiring new skills, mastery invariably requires learning from repeated attempts. With general-purpose robotic foundation models, such as vision-language-action (VLA) models,", "figure": "figs/arxiv-2511-14759.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2511-14759/fig1.png", "w": 1462, "h": 856}, {"n": 2, "page": 2, "src": "figs/arxiv-2511-14759/fig2.png", "w": 1462, "h": 579}, {"n": 3, "page": 4, "src": "figs/arxiv-2511-14759/fig3.png", "w": 721, "h": 734}, {"n": 4, "page": 5, "src": "figs/arxiv-2511-14759/fig4.png", "w": 1462, "h": 480}, {"n": 5, "page": 7, "src": "figs/arxiv-2511-14759/fig5.png", "w": 721, "h": 597}, {"n": 6, "page": 8, "src": "figs/arxiv-2511-14759/fig6.png", "w": 1462, "h": 579}, {"n": 7, "page": 9, "src": "figs/arxiv-2511-14759/fig7.png", "w": 1462, "h": 474}, {"n": 8, "page": 9, "src": "figs/arxiv-2511-14759/fig8.png", "w": 1462, "h": 920}, {"n": 9, "page": 10, "src": "figs/arxiv-2511-14759/fig9.png", "w": 1462, "h": 479}, {"n": 10, "page": 10, "src": "figs/arxiv-2511-14759/fig10.png", "w": 721, "h": 909}, {"n": 11, "page": 10, "src": "figs/arxiv-2511-14759/fig11.png", "w": 1462, "h": 394}, {"n": 12, "page": 10, "src": "figs/arxiv-2511-14759/fig12.png", "w": 721, "h": 994}, {"n": 13, "page": 17, "src": "figs/arxiv-2511-14759/fig13.png", "w": 767, "h": 1435}]}, "arxiv-2512-22414": {"title": "Emergence of Human to Robot Transfer in Vision-Language-Action Models", "abstract": "—Vision-language-action (VLA) models can enable broad open world generalization, but require large and diverse datasets. It is appealing to consider whether some of this data can come from human videos, which cover diverse real-world situations and are easy to obtain. However, it is difficult to train VLAs with human videos alone, and establishing a mapping between humans and robots requires manual engineering and presents a major research challenge. Drawing inspiration from advances in large language models, where the ability to learn from diverse supervision emerges with scale, we ask whether a similar phenomenon holds for VLAs that incorporate human video data. We introduce a simple co-training recipe, and find that human-to-robot transfer emerges once the VLA is pretrained on sufficient scenes, tasks, and embodiments. Our analysis suggests that this emergent capability arises because diverse pretraining produces embodiment-agnostic representations for human and robot data. We validate these findings through a series of experiments probing human to robot skill transfer and find that with sufficiently diverse robot pre-training our method can nearly double the performance on generalization settings seen only in human data. Drawing inspiration from language models, recent work has found that the ability to leverage certain sources of data is intrinsically tied to model scale [47, 49, 48]. For instance, while smaller models fail to leverage diverse instruction tuning datasets, larger models become generalists that soak up diverse data and generalize to new tasks. This leads us to ask: does learning skills from human video data, with no explicit alignment, emerge with scale? To test this hypothesis, we introduce a simple co-training recipe, that treats human videos as an additional embodiment with the same objectives used for robot data. Specifically, we predict low level end effector trajectories using 3D hand tracks and high-level sub-tasks using dense language annotations, mirroring the objectives used during robot pretraining. We then co-finetune on a mix of this human data with the relevant robot data, and evaluate in a setting present only in the human data. For example one such setting involves sorting eggs, where the robot data covers placing eggs in cartons, while human data specifies how differently colored eggs should be sorted across multiple cartons. I. INTRODUCTION Human knowledge provides the foundation to instill physical intelligence in robots. This manifests in many forms, from bootstrapping robot policies with human generated text and images via vision-language models, to mimicking human generated actions via robot teleoperation. While such techniques indirectly imbue the model with human experience, the right recipe to directly learn from human experience, for instance With this recipe, we uncover our key finding: human to robot transfer is an emergent property of diverse VLA pretraining (Figure 1). As we expand the diversity of robot data – across tasks, scenes, and embodiments – the pretrained VLA", "figure": "figs/arxiv-2512-22414.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2512-22414/fig1.png", "w": 1462, "h": 633}, {"n": 2, "page": 2, "src": "figs/arxiv-2512-22414/fig2.png", "w": 1462, "h": 781}, {"n": 3, "page": 3, "src": "figs/arxiv-2512-22414/fig3.png", "w": 1462, "h": 864}, {"n": 4, "page": 4, "src": "figs/arxiv-2512-22414/fig4.png", "w": 721, "h": 518}, {"n": 5, "page": 5, "src": "figs/arxiv-2512-22414/fig5.png", "w": 1462, "h": 561}, {"n": 6, "page": 5, "src": "figs/arxiv-2512-22414/fig6.png", "w": 1446, "h": 969}, {"n": 7, "page": 6, "src": "figs/arxiv-2512-22414/fig7.png", "w": 721, "h": 499}, {"n": 8, "page": 6, "src": "figs/arxiv-2512-22414/fig8.png", "w": 721, "h": 592}, {"n": 9, "page": 7, "src": "figs/arxiv-2512-22414/fig9.png", "w": 1462, "h": 499}, {"n": 10, "page": 7, "src": "figs/arxiv-2512-22414/fig10.png", "w": 721, "h": 649}, {"n": 11, "page": 7, "src": "figs/arxiv-2512-22414/fig11.png", "w": 721, "h": 1106}, {"n": 12, "page": 8, "src": "figs/arxiv-2512-22414/fig12.png", "w": 721, "h": 499}, {"n": 13, "page": 13, "src": "figs/arxiv-2512-22414/fig13.png", "w": 1462, "h": 483}]}, "arxiv-2604-15483": {"title": "π0.7: a Steerable Generalist Robotic Foundation", "abstract": "—We present a new robotic foundation model, called π0.7, that can enable strong out-of-the-box performance in a wide range of scenarios. π0.7 can follow diverse language instructions in unseen environments, including multi-stage tasks with various kitchen appliances, provide zero-shot cross-embodiment generalization, for example enabling a robot to fold laundry without seeing the task before, and perform challenging tasks such as operating an espresso machine out of the box at a level of performance that matches much more specialized", "figure": "figs/arxiv-2604-15483.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2604-15483/fig1.png", "w": 1462, "h": 1248}, {"n": 2, "page": 4, "src": "figs/arxiv-2604-15483/fig2.png", "w": 1462, "h": 841}, {"n": 3, "page": 6, "src": "figs/arxiv-2604-15483/fig3.png", "w": 1462, "h": 915}, {"n": 4, "page": 7, "src": "figs/arxiv-2604-15483/fig4.png", "w": 736, "h": 627}, {"n": 5, "page": 8, "src": "figs/arxiv-2604-15483/fig5.png", "w": 1462, "h": 702}, {"n": 6, "page": 9, "src": "figs/arxiv-2604-15483/fig6.png", "w": 1462, "h": 1127}, {"n": 7, "page": 9, "src": "figs/arxiv-2604-15483/fig7.png", "w": 1462, "h": 1634}, {"n": 8, "page": 10, "src": "figs/arxiv-2604-15483/fig8.png", "w": 721, "h": 325}, {"n": 9, "page": 11, "src": "figs/arxiv-2604-15483/fig9.png", "w": 1462, "h": 571}, {"n": 10, "page": 11, "src": "figs/arxiv-2604-15483/fig10.png", "w": 1451, "h": 1158}, {"n": 11, "page": 11, "src": "figs/arxiv-2604-15483/fig11.png", "w": 1451, "h": 1639}, {"n": 12, "page": 12, "src": "figs/arxiv-2604-15483/fig12.png", "w": 1462, "h": 837}, {"n": 13, "page": 12, "src": "figs/arxiv-2604-15483/fig13.png", "w": 1462, "h": 1589}, {"n": 14, "page": 13, "src": "figs/arxiv-2604-15483/fig14.png", "w": 1462, "h": 325}, {"n": 15, "page": 13, "src": "figs/arxiv-2604-15483/fig15.png", "w": 1451, "h": 973}, {"n": 16, "page": 13, "src": "figs/arxiv-2604-15483/fig16.png", "w": 1451, "h": 1472}, {"n": 17, "page": 13, "src": "figs/arxiv-2604-15483/fig17.png", "w": 1446, "h": 862}, {"n": 18, "page": 14, "src": "figs/arxiv-2604-15483/fig18.png", "w": 1462, "h": 516}, {"n": 19, "page": 22, "src": "figs/arxiv-2604-15483/fig19.png", "w": 721, "h": 1083}, {"n": 20, "page": 23, "src": "figs/arxiv-2604-15483/fig20.png", "w": 1462, "h": 552}, {"n": 21, "page": 23, "src": "figs/arxiv-2604-15483/fig21.png", "w": 1303, "h": 1124}, {"n": 22, "page": 23, "src": "figs/arxiv-2604-15483/fig22.png", "w": 1303, "h": 1528}]}, "arxiv-2604-23073": {"title": "RL Token: Bootstrapping Online RL with Vision-Language-Action Models", "abstract": "—Vision-language-action (VLA) models can learn to perform diverse manipulation skills “out of the box,” but achieving the precision and speed that real-world tasks demand requires further fine-tuning – for example, via reinforcement learning (RL). We introduce a lightweight method that enables sampleefficient online RL fine-tuning of pretrained VLAs using just a few hours of real-world practice. We (1) adapt the VLA to expose an “RL token,” a compact readout representation that preserves task-relevant pretrained knowledge while serving as an efficient interface for online RL, and (2) train a small actor-critic head on this RL token to refine the actions, while anchoring the learned policy to the VLA. Online RL with the RL token (RLT) makes it possible to fine-tune even large VLAs with RL quickly and efficiently. Across four real-robot tasks (screw installation, zip tie fastening, charger insertion, and Ethernet insertion) RLT improves the speed on the hardest part of the task by up to 3× and raises success rates significantly within minutes to a few hours of practice. It can even surpass the speed of human teleoperation on some of the tasks. Sample-efficient fine-tuning of VLAs, however, presents major challenges. On one hand, conventional methods for RL training of foundation models [1–3] rely on large-scale data and can be inefficient for rapid online adaptation. On the other hand, data-efficient real-world RL methods [4, 5] typically train much smaller models, which can improve within hours but sacrifice the generalization capabilities of the VLA. The central question, then, is how to leverage the VLA’s generalization while achieving the speed and sample efficiency of lightweight online RL. We introduce a practical recipe that bootstraps fast online reinforcement learning with representations obtained from a pretrained VLA policy. Our key idea is to adapt the VLA so that it exposes a compact interface that can be used for sampleefficient online RL. We achieve this by training the VLA to expose an RL token, a compressed representation that makes task-relevant pretrained knowledge accessible to a lightweight online RL policy. Running RL with this RL token (RLT) creates a simple division of labor: the frozen VLA provides broad perceptual understanding and action recommendations, while the lightweight actor and critic adapt the policy to succeed at the hardest parts of a task online. To make this I. INTRODUCTION General-purpose vision-language-action (VLA) models can learn a wide range of diverse manipulation skills from data. Yet they often struggle in the last millimeter of execution: motions can be slow, successful completion may require pauses and retries, and small errors at critical stages of precise tasks can compound into failure. A natural way to address this challenge is to fine-tune VLAs with reinforcement learning (RL). By practicing on the target task, RL can improve precisely the stages of the task that are most critical for success, which are", "figure": "figs/arxiv-2604-23073.png", "figure_page": 1, "figures": [{"n": 1, "page": 1, "src": "figs/arxiv-2604-23073/fig1.png", "w": 1462, "h": 507}, {"n": 2, "page": 4, "src": "figs/arxiv-2604-23073/fig2.png", ame": "imitation learning", "note": "6 📄"}, {"id": "reinforcement learning", "name": "reinforcement learning", "note": "5 📄"}, {"id": "vision-language models", "name": "vision-language models", "note": "5 📄"}, {"id": "robot learning", "name": "robot learning", "note": "5 📄"}, {"id": "robotic insertion", "name": "robotic insertion", "note": "4 📄"}, {"id": "multimodal learning", "name": "multimodal learning", "note": "4 📄"}, {"id": "co-training", "name": "co-training", "note": "4 📄"}, {"id": "generalization", "name": "generalization", "note": "4 📄"}, {"id": "long-horizon reasoning", "name": "long-horizon reasoning", "note": "4 📄"}, {"id": "zero-shot generalization", "name": "zero-shot generalization", "note": "3 📄"}, {"id": "teleoperation", "name": "teleoperation", "note": "3 📄"}, {"id": "flow matching", "name": "flow matching", "note": "3 📄"}, {"id": "efficient inference", "name": "efficient inference", "note": "3 📄"}, {"id": "language models", "name": "language models", "note": "3 📄"}, {"id": "data selection", "name": "data selection", "note": "3 📄"}, {"id": "instruction following", "name": "instruction following", "note": "2 📄"}, {"id": "human video demonstration", "name": "human video demonstration", "note": "2 📄"}, {"id": "representation alignment", "name": "representation alignment", "note": "2 📄"}, {"id": "offline q-learning", "name": "offline q-learning", "note": "2 📄"}, {"id": "benchmark design", "name": "benchmark design", "note": "2 📄"}, {"id": "mobile manipulation", "name": "mobile manipulation", "note": "2 📄"}, {"id": "hierarchical policies", "name": "hierarchical policies", "note": "2 📄"}, {"id": "action tokenization", "name": "action tokenization", "note": "2 📄"}, {"id": "scalable training", "name": "scalable training", "note": "2 📄"}, {"id": "math reasoning", "name": "math reasoning", "note": "2 📄"}, {"id": "one-shot learning", "name": "one-shot learning", "note": "2 📄"}, {"id": "datamodels", "name": "datamodels", "note": "2 📄"}, {"id": "self-supervised learning", "name": "self-supervised learning", "note": "2 📄"}, {"id": "joint-embedding predictive architectures", "name": "joint-embedding predictive architectures", "note": "2 📄"}, {"id": "action chunking", "name": "action chunking", "note": "1 📄"}, {"id": "memorization", "name": "memorization", "note": "1 📄"}, {"id": "learning dynamics", "name": "learning dynamics", "note": "1 📄"}, {"id": "dense rewards", "name": "dense rewards", "note": "1 📄"}, {"id": "reward shaping", "name": "reward shaping", "note": "1 📄"}, {"id": "medical robotics", "name": "medical robotics", "note": "1 📄"}, {"id": "regulatory evaluation", "name": "regulatory evaluation", "note": "1 📄"}, {"id": "benefit-risk assessment", "name": "benefit-risk assessment", "note": "1 📄"}, {"id": "autonomous surgery", "name": "autonomous surgery", "note": "1 📄"}, {"id": "agentic robotics", "name": "agentic robotics", "note": "1 📄"}, {"id": "simulation", "name": "simulation", "note": "1 📄"}, {"id": "safe exploration", "name": "safe exploration", "note": "1 📄"}, {"id": "data collection", "name": "data collection", "note": "1 📄"}, {"id": "representation collapse", "name": "representation collapse", "note": "1 📄"}, {"id": "isotropic gaussian regularization", "name": "isotropic gaussian regularization", "note": "1 📄"}, {"id": "stereo matching", "name": "stereo matching", "note": "1 📄"}, {"id": "knowledge distillation", "name": "knowledge distillation", "note": "1 📄"}, {"id": "depth estimation", "name": "depth estimation", "note": "1 📄"}], "t": []}, "summaries": {"arxiv-2610-39302": {"text": "Gist: Despite the request framing, this is not a robotics paper. It is a representation-learning paper. It turns the Platonic Representation Hypothesis (PRH) into a theorem for Joint-Embedding Predictive Architectures (JEPAs). Encoders trained separately on different modalities learn the same embedding up to one rotation when their positive pairs are two observations of the same scene (\"good views\"). The paper also argues that next-token prediction is a \"bad-view\" JEPA, and shows empirically that a 109M-parameter text JEPA aligns with vision models better than language models up to 72B parameters.\n\nQuestion: The PRH, the claim that vision and language models converge to a shared representation as they scale, has so far been an empirical observation without a proof. The paper asks when models trained separately on different modalities provably learn the same representation. It also asks whether that answer gives a training recipe, rather than relying on scale alone.\n\nMethod: The world is modeled as a finite set of states, each modality renders it injectively, and the JEPA loss is a prediction term plus a rotation-invariant anti-collapse term. The predictor is the identity; the paper explicitly does not cover learned or action-conditioned predictors. The main results are:\n- Renderings only change coordinates, so if all modalities share one positive-pair distribution and the minimizers are unique up to rotation, every encoder recovers the same world embedding up to a rotation (Theorem 1).\n- With MSE plus whitening, the minimizer is the spectral embedding of the positive-pair graph, unique under an eigengap (Proposition 1).\n- If positives differ across modalities, a Davis–Kahan-style bound limits misalignment by the kernel mismatch divided by the eigengap (Theorem 2). On 300 synthetic worlds the measured error stays at or below 18% of the bound.\n- With per-observation nuisance (wording, viewpoint), any embedding direction spent on nuisance is lost for alignment (Theorem 3). Corruptions of a single observation spend directions on nuisance whenever they preserve it more than the world's k-th direction (Proposition 3).\n- Views and data together determine an induced world kernel (Theorem 4).\n- Next-token prediction is cast as a JEPA whose positives are a prefix and its continuation and whose anti-collapse term is the softmax log-partition, identified only up to an invertible linear map (Proposition 4).\n\nIn practice, good-view training uses LeJEPA/SIGReg (λ=0.02). Text views are drawn from different captions of the same image, each trimmed to a random span with 15% masking.\n\nRobots and setup: There are no robots, robot sensors, simulators or control tasks. The data are:\n- Flickr30k: 29k images with 5 captions each.\n- MSR-VTT video: 7k training clips with 20 captions each, the only setting where the image side gets good views (different frames).\n- COCO.\n- Recap-DataComp: each image's alt-text plus two LLaVA (LLaMA-3-8B) recaptions, scaled up to the texts of 940M images.\n- The PRH paper's WIT-1024 benchmark.\n\nThe models are a ViT-S/16 image JEPA and BERT text encoders of 11M–335M parameters trained from scratch, scored against frozen DINOv2/DINOv3, CLIP, MAE and I-JEPA. Baselines are Qwen2.5 (0.5–72B), Llama-3 8B/70B, Mistral-7B, Qwen3-8B, CLIP's text encoder and all-mpnet-base-v2. Metrics are mutual 10-NN, unbiased linear CKA, and retrieval R@1 through a single orthogonal map fitted on pairs.\n\nResults:\n- Flickr, separately trained image JEPA: the good-view text JEPA reaches mutual 10-NN .062 versus .047 (bad views) and .042 (next-token), and R@1 .044 versus .027 and .021.\n- Flickr, frozen DINOv2: R@1 is .246 versus .133 and .118.\n- Nuisance measurement: the scene explains a fraction .804 of the good-view embedding, against .655 and .608, matching the theory's predicted ordering.\n- Scale on WIT-1024: the 109M good-view JEPA trained on the texts of 940M images reaches .184 with DINOv2 ViT-B. This beats Qwen2.5-72B (.154), Llama-3-70B (.151) and CLIP's text encoder (.124). Its CKA is .507 versus .418, and with CLIP ViT-H it scores .230 versus .210.\n- Sample efficiency: on the same corpus, good views reach next-token's 900M-sample alignment with 21.6M samples (.109 vs .111), 42 times fewer.\n- Scaling law: an alignment law in the good-view fraction and samples seen predicted 85 unseen runs with RMSE .0093, versus .0096 seed-to-seed. It overestimates good-view runs at 320M samples.\n- Captioning: a captioner whose only part fitted on pairs is one orthonormal map (30k Flickr pairs) reaches COCO CIDEr .838 and MSR-VTT video CIDEr .246.\n- Pair-free alignment (Schnaus et al. protocol): ImageNet-100 top-5 is 64.4% versus 47.6% for Qwen3-8B rerun and 56% for the best they reported. CLIP's text encoder still gets 68.7%.\n\nAblations: Trimming captions into spans is the knob that matters. Using whole captions as views drops R@1 from .246 to .185. Masking, number of views, batch size, width and schedule move the mean by at most .016. Without gradient clipping, some runs collapse abruptly. On MSR-VTT, good views on both sides give mutual 10-NN .067, against .039 when neither side has them, with the text side contributing most.\n\nLimitations: The theory assumes a finite world, injective renderings, population optima and an identity predictor. Uniqueness up to rotation is not proven for SIGReg, and no experiment meets Theorem 1's hypotheses exactly. Good views require knowing which texts describe the same scene. On Recap, two of three texts come from a CLIP-based captioner; without it, good views reach only .060 on WIT versus .107. At the 940M scale, the SIGReg weight was chosen after seeing WIT results, and a seed at the other weight scored .121. There is minor benchmark overlap with the training data. The image side is mostly bad-view crops, and hyperparameters were tuned only for the good-view JEPA.\n\nTakeaway for a robotics researcher: Read it only if you care about JEPA theory or about aligning separately trained sensor or modality encoders. The transferable lesson is to define positives as multiple observations of the same state, such as different cameras or frames, rather than augmentations of one observation. The paper's world-model analysis is limited: it excludes action-conditioned predictors and notes that camera viewpoint, a nuisance for cross-modal alignment, is something an acting agent must track. Section 2 (theory) and Sections 3.2–3.3 (view ablations, video) are the most relevant; the LLM-scaling and captioning sections can be skimmed.", "cost": 0.5992, "input_tokens": 129320, "output_tokens": 4096}, "arxiv-2611-04492": {"text": "Gist: The paper presents \"3D World Simulator,\" an action-conditioned world model that predicts the future of a manipulation scene in a shared 3D latent space instead of in image space. A hybrid particle-voxel autoencoder compresses RGB-D point clouds, with optional tactile points, into a compact voxel latent. A latent dynamics model rolls that latent forward given robot actions, and the decoded output is a set of 3D Gaussian particles plus tactile particles. Because the output is explicitly 3D, the model can render consistent RGB-D from arbitrary viewpoints, including moving wrist cameras, and its tactile predictions stay geometrically aligned with contact surfaces. The authors use it for synthetic policy-training data, policy evaluation, and zero-shot MPC on unseen objects, and claim interactive rollout at 50 Hz.\n\nQuestion: Most action-conditioned world models, such as Cosmos, IWS and video diffusion models, operate in 2D pixel space. This makes multi-view consistency and long-horizon spatial coherence hard to maintain, and it makes contact-geometry relationships hard to represent. Existing 3D dynamics models like PGND, PointWorld and ParticleFormer have their own limits: they rely on point-tracking supervision or object-specific state representations, and they usually do not target photorealistic rendering for visuomotor policies. The paper asks whether a correspondence-free, scene-level 3D latent can provide geometry, appearance and touch in one interface while staying stable over long open-loop horizons.\n\nMethod: The autoencoder works in three steps.\n- The point cloud has 7 channels per point (xyz, RGB, tactile). It is voxelized and averaged per occupied cell.\n- Strided sparse 3D convolutions downsample it to a unit-normalized 8-channel latent grid: 32×16×32 for ALOHA and 32³ for Deform360.\n- A coarse-to-fine decoder upsamples with transposed convolutions, predicting occupancy at three resolutions. A lightweight MLP then turns each occupied voxel into continuous particles over two refinement stages. Each particle carries Gaussian parameters (color via degree-1 spherical harmonics, anisotropic scale, rotation, opacity).\n\nThe autoencoder is trained with four losses: per-level occupancy BCE, local bidirectional Chamfer plus color L1, rendered RGB-D loss (L1/SSIM/LPIPS plus depth L1), and a consistency loss between latents of two independent subsamples of the same cloud.\n\nThe dynamics model is a 3D U-Net. It takes 5 history latents and encodes each frame with shared 3D convolutions. At an 8×4×8 coarse grid it alternates spatial attention with causal temporal attention, and it injects action, timestamp and noise-level embeddings via an MLP. It directly regresses the next latent in one forward pass. For stability, training uses three measures: K-step autoregressive rollouts with a discounted L2 loss (γ=0.95), a curriculum on K, and history-latent noise with standard deviation up to 0.4.\n\nEach model trains in about 16 hours on a single RTX 5090. Wrist-camera rendering requires a separately fine-tuned decoder head. Separating robot, object and table, which is needed to compose the output with other Gaussian backgrounds or new kinematic robot models, also requires fine-tuning.\n\nRobots and setup: The main platform is an ALOHA bimanual robot with FlexiTac tactile sensors on each fingertip. Sensing comes from three static RealSense D455 stereo cameras (one top-down and two forward-facing) and two wrist-mounted RealSense D405s. Depth is computed with FoundationStereo, and tactile pad positions come from forward kinematics.\n\nThere are six tasks, each with about 200 teleoperated episodes (about 2 hours): Part Assembly, Cloth Folding, T Pushing, Box Packing, Rope Threading and Marker Insertion. Together they cover rigid, articulated and deformable objects.\n\nFor scaling, the model is trained on Deform360. That dataset contains 198 objects, 1,980 sequences, more than 215 hours of footage from 41 cameras, and bimanual tactile grippers. Training on it uses object points only, because the dataset provides only object-centric depth.\n\nBaselines:\n- 2D video models: Cosmos, Robot4DGen and IWS, adapted for multi-view and depth.\n- 3D particle models: PGND, PointWorld and ParticleFormer, supervised with CoTracker tracks.\n\nDownstream policies are ACT, Diffusion Policy, π0.5 (LoRA) and Cosmos Policy. Planning uses MPPI borrowed from PGND on an unseen single-arm ALOHA setup.\n\nResults: On ALOHA, metrics are averaged over 6 tasks and 200-step open-loop rollouts. The proposed model leads on every metric:\n\n| Metric | Ours | Best baseline |\n|---|---|---|\n| PSNR | 23.24 | 20.59 (Robot4DGen) |\n| LPIPS | 0.240 | 0.340 (Robot4DGen) |\n| Depth Abs Rel | 0.097 | 0.147 (Cosmos) |\n| δ<1.25 | 0.913 | 0.833 (Cosmos) |\n| Scene Chamfer | 7.72 | 10.43 (Robot4DGen) |\n| Object Chamfer | 11.52 | 15.97 (Robot4DGen) |\n| Tactile L1 | 0.081 | 0.128 (Robot4DGen) |\n\nThe 3D particle baselines do worse on geometry than the video models (Chamfer 13.78–17.11).\n\nOn Deform360, with 150-step rollouts, the picture is mixed:\n- Training objects: the model beats ParticleFormer on PSNR (18.6 vs 18.0), LPIPS (0.26 vs 0.30) and Chamfer (9.6 vs 10.5 mm).\n- Held-out objects: it keeps the geometry lead (12.1 vs 13.4 mm) but loses on appearance (PSNR 14.8 vs 15.6, LPIPS 0.43 vs 0.31). The authors attribute this to the baselines moving pre-fitted Gaussian splats, whereas this model generates appearance from scratch.\n\nPolicy training and evaluation: Each task uses 100 demos, and success rates are averaged over the four policy architectures. Values below are read approximately from a bar chart, since exact numbers are not tabulated:\n\n| Task | Real-data policies | Simulator-data policies |\n|---|---|---|\n| Part Assembly, visuo-tactile | ~0.8 | ~0.68 |\n| Part Assembly, vision-only (real) | ~0.17 | — |\n| Cloth Folding, front plus wrist views | ~0.95 | ~1.0 |\n| T Pushing, novel viewpoint | ~0.8 | ~0.68 |\n\nFor policy evaluation, checkpoints were each evaluated 20 times in the simulator and 20 times in the real world. Simulator and real success rates correlate at r = 0.958 (Part Assembly), 0.965 (Cloth Folding) and 0.859 (T Pushing).\n\nZero-shot MPC with the Deform360-trained model on four unseen objects reaches final Chamfer distances of 0.031 (cloth), 0.024 (rope), 0.035 (foam) and 0.047 (sloth). These results are presented without baseline comparisons.\n\nLimitations and caveats: The paper reports no ablations. It does not isolate the contributions of the particle stage, the consistency loss, history noise, the K-step curriculum or the tactile channel, beyond the tactile-versus-no-tactile policy comparison. The 50 Hz claim is not broken down by component.\n\nThe model is bounded to a fixed cropped workspace. Composition with backgrounds and new robots, as well as wrist views, depends on extra fine-tuning. Appearance generalization to unseen objects lags behind splat-based baselines.\n\nPolicy experiments rest on small samples (20 trials, wide Clopper-Pearson intervals), and the success rates are shown only graphically. It is not fully clear how the simulator demonstrations were produced. The particle baselines were trained on CoTracker pseudo-tracks, which may handicap them relative to their original setups.\n\nTakeaways: The paper is worth reading if you work on world models for policy evaluation or data generation, especially with wrist cameras, novel viewpoints or tactile sensing. Its main idea is a correspondence-free voxel latent decoded to Gaussians, which gives multi-view consistency and spatially grounded touch at interactive rates. That idea is simple, and the comparison against both 2D video and 3D particle families is fairly broad. Read it with skepticism about the lack of ablations and the small-sample policy results. Readers mainly interested in open-world generalization should note the weaker held-out appearance results.", "cost": 0.3555, "input_tokens": 68647, "output_tokens": 4045}, "arxiv-2203-01153": {"text": "Gist: InsertionNet 2.0 is a supervised residual policy for peg-in-hole style insertion. It regresses pose corrections from stereo wrist images plus force/torque direction, and it learns from about 150 self-collected samples per plug, with no RL, demonstrations or reward engineering. It extends the authors' earlier InsertionNet in four ways: two wrist cameras, data collected along free-space trajectories so the robot no longer has to touch the socket surface first, an auxiliary contrastive loss, and a relation-network head that enables one-shot transfer and simple multi-step tasks. It reports near-perfect success on 16 real connectors and threads.\n\nQuestion: Online RL and Sim2Real approaches to contact-rich insertion are expensive, risky for hardware, and limited by simulation fidelity. The original InsertionNet avoided these problems with backward-learned regression, but it used a single wrist camera. That camera could not resolve depth ambiguity, so the robot had to touch the socket before correcting. The paper asks three things: whether a multiview, multimodal regression approach can remove that contact requirement, whether it can cut sample needs using unlabeled data, and whether it can generalize to unseen plugs and multi-step sequences.\n\nMethod: Data collection uses \"general backward learning.\" A human first inserts the plug and the final pose L_final is registered. The robot then repeatedly moves under impedance control to random targets drawn from a normal distribution around L_final (r0 = 10 mm, θ0 = 10°). These alternate between a \"high\" target, up to 50 mm above the hole, and a \"low\" target at hole height. Along each trajectory it logs stereo images, force and moment, labeled with L_final minus the current pose. The authors report that uniform sampling put too many points far from the hole.\n\nMethod (network and policy): A single ResNet18 encoder is trained jointly on three losses.\n- An InfoNCE contrastive loss with a Polyak-averaged momentum encoder (m = 0.999), in the style of CURL, applied to the stacked 6-channel stereo image.\n- A \"Delta\" regression loss predicting the 6-DoF correction from images and force.\n- A \"Relation\" loss that takes two images of the same task and predicts the difference in their corrections.\n\nForce and moment are fed in as unit direction vectors only. The images get heavy augmentation, including random convolution, erasing and color jitter, applied consistently within each batch. At runtime, a coarse main policy from InsertionNet 1 brings the gripper near the hole. Within a radius R, the residual policy outputs (Δx, Δy, Δθx, Δθy, Δθz) while z is lowered at a fixed rate. The Delta head is used for standard tasks. The Relation head is conditioned on a stored goal image and is used for one-shot and multi-step tasks.\n\nRobots and setup: The robot is a UR5e arm with two Intel RealSense D435 wrist cameras, each tilted 45° and aimed between the fingers. Force/torque comes from the UR5e's built-in estimate, sampled at 500 Hz over RTDE, with commands sent at 125 Hz. There is no simulator; everything is on the real robot. The 16 tasks reuse the InsertionNet 1 set: AC 2-pin and 3-pin, AUX, DC12V, RJ45, HDMI, keys, power cord, USB, USB-C, VGA, and circle, half-circle, triangle, cube, cylinder and rectangle \"pulley\"/thread pieces. Each plug gets 150 collected samples, which are expanded via augmentation and pairing to about 192k training samples. Training takes 5–15 minutes on two RTX 2080 Ti GPUs.\n\nEvaluation: For each task, test start poses are sampled uniformly in a box around the hole, and 200 consecutive trials are run with the peg not fixed in the gripper, so misalignment accumulates. Success means reaching z − z0 < 1 mm within 10 s.\n\nResults: The Delta policy's worst success rate is 97.5%, on the cylindrical thread, and most tasks score 100%. The largest gains over InsertionNet 1.0 are:\n- VGA: 78.5% to 100%\n- HDMI: 90.5% to 99.5%\n- USB-C: 91.5% to 100%\n- Keys: 90.5% to 100%\n- Power cord: 94% to 98%\n\nA few tasks dropped slightly, for example triangular thread from 100% to 99.5% and cylindrical thread from 100% to 97.5%. Reported mean times are 0–1.54 s, versus 1.3–5 s for v1. However, v2 times subtract the mean reaching time, so the time comparison is not apples-to-apples. The v1 baseline also ran on a Franka Panda, and the authors themselves credit part of the gain to the UR5e's controller.\n\nAblations and sample efficiency: On AC 2-pin (50 trials per point), success reaches 100% at about 40 samples, and completion time approaches its minimum at about 150 samples. With 20 labeled plus 150 unlabeled samples, the contrastive term raised Relation-policy success from 20% to 100% and Delta-policy success from 70% to 100%. In a separate ablation on AC 2-pin, USB and yellow thread, contrastive loss made no noticeable difference for the Delta policy but gave the Relation policy roughly 20% higher success and lower time variance, mostly with small datasets.\n\nRobustness: The Delta policy was trained on 300 samples with grasp angles of 0° and ±15°. It went 50/50 under grasp errors up to 45°, room lights switched on and off, random obstacles, and the board being moved during execution. The Relation policy failed with obstacles unless extra data was collected, and it needed more data to handle large grasp changes.\n\nTransfer and multi-step: A model trained on 15 plugs was tested on the held-out red half-circle thread. Given only a goal image, the Relation policy went 50/50, while the Delta policy went 0/50. The Delta policy recovers with about 20 new samples, versus 150 from scratch. The multi-step task was inserting a key, tu
