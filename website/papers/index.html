rning the lock, and turning it back, using a pre-stored stereo goal image for each step and similarity-based step switching. It scored 50/50, even though the training data never visited the inserted or turned states.\n\nLimitations: There is no comparison against RL, LfD or other contemporary insertion methods, only against the authors' own prior system on a different robot. The \"minimal contact\" claim is not quantified with contact-force statistics. Policies are trained per plug and require a human-registered final pose. The test-region bounds B_xy, B_θ and B_z are not specified. Robustness, transfer and multi-step results rest on 50 trials each, with a single held-out object described as \"somewhat similar\" to the training set. Several reported effects, such as the stability gains and the robustness comparisons, are only qualitative.\n\nTakeaway: Read it if you want a practical, low-data, fast-to-train recipe for real-world tight-tolerance insertion. Useful details include the stereo wrist-camera placement, trajectory-wide backward data collection, direction-only force inputs, and a relation head for goal-image-conditioned transfer. Skim it if you need rigorous baselines or analysis of generalization limits.", "cost": 0.1628, "input_tokens": 23056, "output_tokens": 3530}, "arxiv-2606-24457": {"text": "Gist: The paper presents Lite Any Stereo V2 (LAS2), a family of lightweight stereo disparity networks (S, M, L feed-forward and H iterative) meant to generalize zero-shot to unseen real scenes while running fast on GPUs and embedded hardware. It is relevant to robotics because it targets dense metric depth from a stereo pair on a Jetson-class device without per-domain fine-tuning. The authors report state-of-the-art accuracy among efficient stereo methods along with clearly lower measured latency.\n\nQuestion: The paper challenges the common assumption that small, fast stereo networks cannot match the zero-shot generalization of large, foundation-prior models such as FoundationStereo or MonSter++. Those large models run out of memory on edge devices. The paper also addresses two further gaps. First, prior efficient designs were optimized for theoretical MACs rather than real latency. Second, recent \"real-time\" iterative methods such as Fast-FoundationStereo and RT-MonSter++ are only fast on high-end GPUs.\n\nMethod: The architecture uses a FasterNet ImageNet-pretrained encoder producing multi-scale features, which are fused at 1/4 resolution.\n- A correlation cost volume is built with a maximum disparity of 192.\n- Cost aggregation is a 2D-only U-Net built from FasterNet-style blocks, replacing the hybrid 3D-2D aggregation of the earlier LAS. Variants scale the aggregation depth (1/2/4, 4/8/16 and 8/16/32 layers per level for S, M and L).\n- Disparity comes from soft-argmax followed by convex upsampling.\n- LAS2-H reuses LAS2-M as the initializer and adds a group-wise correlation volume and an all-pairs volume, refined over 4 selective-ConvGRU iterations.\n\nTraining happens in three stages:\n- Stage 1 is supervised training on about 1.8M synthetic pairs (SceneFlow, FallingThings, FSD, CREStereo, VKITTI2, TartanAir, Dynamic Replica).\n- Stage 2 is self-distillation: a frozen teacher sees clean inputs while the student sees strongly perturbed ones (color jitter, blur, gamma), with a cosine feature-alignment loss.\n- Stage 3 trains on about 0.5M unlabeled real pairs with dense pseudo-labels from FoundationStereo. The labels are filtered by a left-right consistency mask, an edge mask (disparity edges without image edges) and a SAM 3 sky mask. The loss is clamped per pixel at 10 so that a few high-error pixels cannot dominate early adaptation.\n\nRobots and setup: No robot platform or robotic task is used; this is a pure perception paper.\n- Hardware: latency is measured in PyTorch with torch.compile disabled at 384×1248 on RTX 4090, A5000, A100 and H200 GPUs, and on an NVIDIA Jetson Orin NX 8G at 10W, 20W and MAXN power modes.\n- Real-world training data: Flickr1024, InStereo2k, Holopix50K, DrivingStereo, SouthKenSV and UASOL.\n- Zero-shot evaluation: KITTI 2012/2015, ETH3D, Middlebury (half resolution) and the DrivingStereo weather split.\n- Baselines: efficient feed-forward baselines were retrained on the same synthetic data.\n\nResults: LAS2-M versus the prior LAS on zero-shot benchmarks (lower is better):\n\n| Benchmark | LAS2-M | LAS |\n|---|---|---|\n| KITTI 2012 D1 | 2.88 | 3.04 |\n| KITTI 2015 D1 | 3.61 | 3.87 |\n| ETH3D Bad1 | 2.59 | 3.53 |\n| Middlebury Bad2 | 5.47 | 7.51 |\n| Latency, H200 / Orin MAXN | 8.1 / 101 ms | 12.7 / 193 ms |\n\nLAS2-S runs at 6.6 ms on H200 and 81 ms on Orin. LAS2-L is the most accurate feed-forward model (KITTI 2015 D1 3.38, ETH3D 1.83).\n\nLAS2-H versus Fast-FoundationStereo: KITTI 2012 D1 is 2.64 vs 2.90, KITTI 2015 D1 3.31 vs 3.66, ETH3D ties at 1.83, and Middlebury Bad2 is 3.71 vs 3.73. LAS2-H runs at 15.1 vs 27.3 ms on H200 and 344 vs 918 ms on Orin.\n\nFoundationStereo remains far more accurate on ETH3D (0.49) and Middlebury (1.12), but needs 292 ms on H200 and runs out of memory on Orin.\n\nOn DrivingStereo weather, overall D1 is 7.23 for LAS2-S, 8.74 for LAS and 7.44 for LAS2-H. LAS2-H beats Fast-FoundationStereo (9.15) and even its teacher FoundationStereo (10.71), though MonSter++ is better at 5.21. On the KITTI 2015 test leaderboard, LAS2-M (fine-tuned on KITTI raw pseudo-labels) reaches D1-all 1.61, best among efficient methods; on KITTI 2012 it trails RT-MonSter++ and LAS.\n\nAblations: Architecture choices were selected by measured Orin latency, not MACs. FasterNet aggregation took 107 ms versus 162 ms for ConvNeXt, even though ConvNeXt had fewer MACs.\n\nFor training, the stage progression on LAS2-M moved KITTI 2012 D1 from 4.21 to 3.59 to 2.88 and Middlebury Bad2 from 7.95 to 6.91 to 5.47.\n- Removing error clamping hurt every benchmark (e.g., ETH3D 3.22 vs 2.59).\n- The LR mask gave the largest filtering gain, while the sky mask's effect was mixed.\n- A fixed teacher beat EMA and hard-copy teachers in Stage 2.\n- Adding Stereo4D or Xperience data, or using multiple teachers, did not help.\n- The same recipe substantially improved LightStereo-M and BANet-2D (e.g., Middlebury Bad2 for LightStereo-M fell from 10.29 to 7.08), suggesting it is a reusable training recipe.\n\nLimitations and takeaways: A clear accuracy gap remains to foundation-prior models, especially on ETH3D and Middlebury. The authors attribute this partly to the limited scale of high-quality real stereo data. The model still fails on reflective or transparent surfaces and under severe illumination changes. For roboticists, note three things:\n- Orin latencies are measured in plain PyTorch without TensorRT or compile. Real-time rates on Orin (about 10 Hz for M at 384×1248) may improve with deployment tooling, but this is untested.\n- There is no downstream robotic evaluation such as navigation or grasping.\n- The strongest gains come from the pseudo-label distillation recipe, which is cheap to adopt for other lightweight stereo networks.\n\nThe paper is worth reading if you need an off-the-shelf stereo depth model on Jetson-class hardware or want a practical recipe for distilling a large stereo teacher into a small model.", "cost": 0.3207, "input_tokens": 62885, "output_tokens": 3460}, "arxiv-2511-08544": {"text": "Gist: This is not a robotics paper. It is a self-supervised visual representation learning paper from Balestriero and LeCun (Brown/NYU/Meta-FAIR). It proposes LeJEPA, a Joint-Embedding Predictive Architecture (JEPA) objective built on one claim: embeddings should follow an isotropic Gaussian distribution. A new regularizer, SIGReg, enforces that distribution and replaces the usual anti-collapse heuristics (stop-gradient, teacher–student EMA, predictors, whitening, register tokens). For a robotics researcher, the relevance is indirect. It offers a simple, stable, single-hyperparameter recipe for pretraining encoders, possibly on your own in-domain data, which could serve as a backbone for JEPA-style world models or policies.\n\nQuestion: JEPA training is brittle because nothing principled stops representation collapse, so practitioners stack under-specified tricks and tune many hyperparameters. The paper asks two things. Which embedding distribution minimizes downstream risk when the downstream task is unknown? And can that distribution be enforced in a way that is provable, scales to high dimensions and large batches, and is distributed-friendly?\n\nMethod: On the theory side, the authors argue that anisotropic embeddings increase both the bias of ridge-regularized linear probes and the variance of unregularized OLS probes. For nonlinear probes (radius k-NN and Nadaraya–Watson kernel regression), the integrated squared bias scales with the Fisher information of the embedding density. Under a fixed scalar covariance constraint, the isotropic Gaussian uniquely minimizes that Fisher information. SIGReg then enforces this target in three steps:\n- It projects the batch of embeddings onto M random unit directions, resampled every step and synced across GPUs.\n- On each 1D projection, it runs the Epps–Pulley goodness-of-fit test, a weighted L2 distance between the empirical characteristic function and that of N(0,1), integrated with a 17-point trapezoid rule over [-5,5].\n- It averages the per-direction statistics.\n\nA Cramér–Wold argument justifies testing via 1D projections. Characteristic-function tests are preferred over two alternatives: moment-matching tests, which are non-identifiable with finitely many moments and have unbounded gradients, and CDF tests, which need sorting and are non-differentiable. The Epps–Pulley statistic has provably bounded gradients and curvature, runs in O(N) time and memory, and needs only an all_reduce under data-parallel training. The minibatch estimate carries an O(1/N) bias. The full loss is (1−λ) times a prediction term plus λ times SIGReg applied per view. The prediction term is the squared distance of every view's embedding to the mean of the global-view embeddings, DINO-style multi-crop with no predictor network. The core code is about 50 lines of PyTorch. With a mean/variance-only test, the objective reduces to VICReg, which the authors argue against.\n\nRobots and setup: No robots, robot sensors, simulators or control tasks appear anywhere. The paper mentions action-conditioned robot data (DROID) only to motivate when a predictor network is justified, and never tests it. All experiments are image classification pretraining:\n- Pretraining datasets: ImageNet-1K, ImageNet-100 and ImageNet-10, plus small in-domain sets (Galaxy10 with about 11k galaxy images, Flowers102 with about 1k, CIFAR-10/100, Food101).\n- Transfer evaluation: DTD, Aircraft, Cars and Pets in addition to the above.\n- Backbones: about 60 timm architectures, including ResNets, ViTs (up to ViT-H/14 and a 1.8B ViT-g), ConvNeXt-V2, Swin, MaxViT, LeViT and EfficientNet.\n- Recipe: AdamW, 2 global 224px views plus 6 local 96px views, λ≈0.05.\n- Evaluation: mostly frozen-backbone linear probes, with some full fine-tuning.\n- Qualitative only: PCA feature maps and thresholded [CLS]-attention video object segmentation.\n\nResults: On ImageNet-1K, frozen linear probing reaches 77.1% for ViT-L, 78.5% for ConvNeXtV2-H and 79% for ViT-H/14. There is no same-budget head-to-head against DINOv2-style training on ImageNet-1K.\n\nIn-domain Galaxy10 pretraining is the most striking result: small LeJEPA models beat transfer from frontier natural-image models.\n\n| Galaxy10 setting | Best LeJEPA | DINOv3 ViT-S/16 | DINOv2 ViT-S |\n|---|---|---|---|\n| Frozen probe, all labels | 78.17 (ResNet-34) | 71.38 | 67.62 |\n| Full fine-tuning, all labels | 83.28 (ResNet-34) | 81.60 | 78.34 |\n| Full fine-tuning, 1-shot | 29.42 (ConvNeXt-V2 Nano) | 24.71 | — |\n\nThe flip side appears in Table 5: on natural-image datasets, an I-JEPA ViT-H pretrained on ImageNet-22k still clearly beats small in-domain LeJEPA models (e.g., CIFAR-100 86.9 vs about 70).\n\nTransfer from ImageNet-1K (Table 2, averages over 8 datasets, all-shot):\n\n| Model | Avg accuracy | Pretraining epochs |\n|---|---|---|\n| LeJEPA ViT-L | 79.48 | 100 |\n| I-JEPA ViT-H | 78.50 | 300 |\n| I-JEPA ViT-H + STOP | 80.70 | 300 |\n\nLeJEPA beats plain I-JEPA with a smaller model and a third of the epochs, but I-JEPA+STOP wins on average at 1, 10 and all shots. The text's claim of \"consistently outperform\" is therefore overstated.\n\nAcross about 50 small timm models on ImageNet-10, all train without collapse and reach 91.5–95%. The training loss correlates with downstream linear-probe accuracy, with Spearman of roughly 85–99% depending on setting. Rescaling the loss by λ^0.4 pushes it to about 0.93–0.99. This enables label-free model selection, which is a practical plus.\n\nAblations: Performance is fairly flat over λ, with peaks around 0.01–0.05 that shift with the number of views. A single global view hurts badly (53% vs 72% at 4 views on ViT-L/IN-1K). On ViT-L/IN-1K:\n- Batch size 128 works at 72.2%, versus 74.7% at 512.\n- Shrinking the integration range to [-1,1] costs about 2 points.\n- More slices help modestly; resampling directions each step matters far more than using many fixed ones.\n- Register tokens make no difference.\n\nRemoving the predictor and teacher network does not cause collapse. Adding SWA or an EMA-teacher-like encoder gives small gains for ViTs, e.g., ViT-S 76.6→80.0 with a 1-layer projector. SIGReg costs under 1 ms per call for typical sizes on a V100.\n\nLimitations: The optimality theory relies on strong assumptions, including an isotropic prior on target-function gradients, asymptotic small-bandwidth regimes and Sobolev smoothness of the embedding density. It addresses probe bias and variance rather than representation content. The empirical scope is image classification only. There are no video-prediction, action-conditioned, or robot experiments, and the 1.8B model is shown only through a training curve. There are some presentation sloppinesses, such as a Figure 17 caption with the colors swapped, and claims slightly ahead of the tables.\n\nTakeaway: Read it if you pretrain your own visual encoders, especially on non-standard in-domain robot camera data where DINOv2/v3 transfer may underperform. Also read it if you want a collapse-proof, low-tuning JEPA regularizer to drop into a world-model pipeline. Algorithms 1–2 and Section 4 are the useful parts. Skip it if you are looking for robot learning results; there are none.", "cost": 0.7328, "input_tokens": 164252, "output_tokens": 3790}, "arxiv-2505-09603": {"text": "Gist: DataMIL adapts the datamodels framework from ML data attribution to robot imitation learning. It scores chunks of a large prior dataset by their estimated effect on a target task's performance, then co-trains a policy on the top-scoring chunks plus a few target demos. The pitch is that this \"performance-aware\" selection beats similarity heuristics, especially with heterogeneous data (OXE), unseen embodiments, and multi-task targets. It does so without running any policy rollouts during selection.\n\nQuestion: Given a handful of task-specific demos and a big prior corpus, which prior data should you co-train on? Existing robotics methods retrieve data by similarity to the target demos: Behavior Retrieval (state-action VAE latents), FlowRetrieval (optical-flow VAE), STRAP (DinoV2 features plus dynamic time warping), or language. These proxies ignore whether a sample actually helps the policy. Datamodels address that in NLP and vision, but they normally require many train-and-evaluate cycles. In robotics, evaluation means real-world rollouts, so the open problem is making datamodels usable here.\n\nMethod: A linear datamodel assigns each prior cluster a score τ(z) for its additive effect on a target metric, and selection keeps the top x%. Two estimators are used:\n1. A regression estimator: train many policies on random subsets and regress performance onto inclusion indicators. In MetaWorld this used m = 10^4 subsets with inclusion probability p = 0.1.\n2. A metagradient estimator based on Metagradient Descent (Engstrom et al. 2025): differentiate exactly through the last k = 100 training steps with respect to per-sample weights, iterate T = 20 to 30 times, and average the gradients. This is used for the larger Octo policy.\n\nThe key robotics adaptation is the proxy metric. Instead of rollout success, it uses the negative behavior-cloning loss on held-out target demos, which needs no rollouts and is differentiable. The loss depends on the setting: L1 for the regression estimator, Gaussian NLL for the metagradient estimator in MetaWorld, and the diffusion denoising loss for Octo. In LIBERO, pre-grasp states are optionally upweighted 2x. Two further tricks reduce noise and shift:\n- Prior data is clustered into sub-trajectories (length 15 in LIBERO) or whole trajectories (MetaWorld, OXE) to reduce estimate variance.\n- For OXE, half of the target demos are mixed into datamodel training to reduce distribution shift, and the other half is used for the proxy.\n\nThe final policy is co-trained with a target sampling probability α = 0.5. MetaWorld is the exception: there it trains on selected data only, since co-training gave negligible gains.\n\nRobots and setup: There are three settings.\n- MetaWorld (simulated): all 50 tasks, using state-based goal-conditioned MLP Gaussian policies (a no-goal variant is in the appendix). The prior data is about 350K steps of scripted expert data plus 1M steps from a multi-task SAC replay buffer (21% average success), with 5 expert target demos per task.\n- LIBERO (simulated): the 10 LIBERO-10 long-horizon tasks, with LIBERO-90 (4,500 teleoperated demos) as the prior and 5 target demos per task. The policy is Octo-small, a transformer diffusion policy on RGB images, with 10% of the prior selected.\n- Real world: a Franka Panda and a PAL Tiago (an embodiment absent from the prior data). The prior data is subsets of 13, 23 or 24 OXE datasets from Octo's training mix, roughly 300k trajectories. There are four task settings: Franka-Ball (OXE-13, 10 demos, 1% selected), Franka-Pouch (OXE-23, 30 demos, 0.75%), Tiago-Sink (OXE-24, 20 demos, 0.5%), and Droid-Multitask (open drawer, bread in bowl, napkin in drawer; 40 demos, 1%). Target demos were collected with the TeleMoMa teleoperation system, and real-world policies are fine-tuned from Octo-small for 50k steps. The paper gives little sensor detail beyond RGB observations.\n\nResults: Validating the proxy on MetaWorld pick-place-wall, top-10% selection reached roughly 88% success with true rollouts, about 86% with proxy plus regression, and about 81% with proxy plus metagradients. All-data reached about 13% and target-only about 2%; this pattern held on three more tasks. Averaged over 50 MetaWorld tasks, DataMIL is about 10 points above the best baseline (roughly 90% vs low 80s for BR/Flow) and also about 10 points better without goal conditioning.\n\nOn LIBERO-10 the gains are modest, with DataMIL averaging 37.76%:\n\n| Method | LIBERO-10 avg. success |\n|---|---|\n| DataMIL | 37.76% |\n| BR | 36.4% |\n| Flow | 35.42% |\n| STRAP | 34.96% |\n| AR | 30.52% |\n| All-Data | 27.72% |\n| Target-only | 21.5% |\n\nPer task, DataMIL is not uniformly best. STRAP wins Stove-Moka, Bowl-Cabinet, Book-Caddy and Mug-Pudding.\n\nThe real-robot results are the strongest claim, with DataMIL averaging 61.0%:\n\n| Method | Real-robot avg. success |\n|---|---|\n| DataMIL | 61.0% |\n| Flow | 40.0% |\n| STRAP | 39.8% |\n| BR | 39.4% |\n| Random | 30.9% |\n| AR | 24.1% |\n| Target-only | 20.4% |\n\nPer task:\n- Franka-Pouch: 70.6% vs 41.2% for BR.\n- Tiago-Sink: 64.1% vs 46.2%.\n- Droid-Multitask: 59.4% vs 50.0% for Flow.\n- Franka-Ball: STRAP's 57.1% beats DataMIL's 50.0%.\n\nQualitatively, DataMIL selects a broader mix of OXE sources, and its top five sources for Franka-Pouch are all Franka data. The baselines concentrate on single datasets, for example AR selects mostly RT-1 for Tiago and Flow selects mostly BC-Z for Franka-Pouch.\n\nAblations: All ablations are on LIBERO-5.\n- Selection ratio: DataMIL's advantage is largest at 5 to 10% selection and disappears at 20% or more.\n- Cluster size: length-15 sub-trajectories beat length 30 and whole trajectories.\n- Co-training ratio: α = 0.5 was best.\n- Longer training: training All-Data 2x or 4x longer did not help (43.36, 44.13, 38.40).\n- STRAP setup: the authors note that their STRAP numbers are lower than the original paper's. They attribute this to final-checkpoint-only evaluation and using Octo instead of a Robomimic policy. They also modified STRAP to retrieve 10% of the data, which raised it from 24.72% to 34.96%.\n\nLimitations and cost: Selection is expensive.\n- Regression in MetaWorld took about 8 hours on 8×A100, amortized across the 50 tasks.\n- The metagradient estimator runs 3 to 5x slower than normal training: 16 to 20 hours on 4 A5000s for LIBERO and 3 to 4 days on 4 A100s for OXE.\n\nHyperparameters such as selection ratio and cluster granularity lack principled defaults. The real-world evidence is thin: one seed and 14 to 39 trials per task, with partial credit given in Droid-Multitask. Targets are mostly single-task.\n\nTakeaways: Read it if you curate co-training data from large heterogeneous corpora or care about cross-embodiment transfer. The main transferable insight is that held-out BC loss on a few target demos is a good enough, differentiable stand-in for rollout success to drive influence-based selection. The second is that this pays off most when similarity heuristics break down. Skim the LIBERO results, which are near-parity, and treat the large real-robot gaps as promising but statistically light.", "cost": 0.3728, "input_tokens": 73134, "output_tokens": 4014}, "arxiv-2611-05368": {"text": "Gist: GUILD is a closed-loop method for deciding which robot demonstrations to collect next. It is aimed at the case where the deployment environment is hard to access but auxiliary environments are not. A VLM proposes candidate data-collection tasks (scene, object configuration, goal). Then predictive data attribution (metagradients via MAGIC/REPLAY) estimates how much each task's trajectories help a small target-domain dataset, and the next teleoperation batch goes to the highest-utility task. It matters because it moves data curation from post-hoc filtering, where the cost of useless data has already been paid, to deciding upfront what to collect.\n\nQuestion: Given an initial dataset, a learner, a target metric and a fixed collection budget, how should one choose a distribution over task parameters to collect so that training on the union maximizes deployment performance under distribution shift? Prior curation work (DataMIL, CUPID, STRAP, ReMix) assumes the data already exists. The closest guided-collection work, Factored Scaling Curves (FSC), needs predefined factors and trains many policies per factor. GUILD targets open-ended task spaces using only one attribution computation per iteration.\n\nMethod: There are two timescales. In the outer loop, a VLM (GPT-5.2) receives target-task video frames, a language description and the available assets, and proposes m candidate tasks. A uniform seed of demos is collected for each. At scheduled points (LIBERO after iterations 2, 4, 8, 16; real world after 3 and 9), the VLM proposes new tasks conditioned on a utility-ranked list of previous tasks. An explore/exploit split mixes ranking-conditioned and context-only proposals.\n\nIn the inner loop, the policy's data weights are treated as meta-parameters, and the gradient of an offline proxy metric (validation loss on the target demos) with respect to per-trajectory weights is computed exactly via REPLAY metagradients. Trajectory scores are averaged per task to give a marginal utility U(φ). The argmax task then receives the next batch of b demos (hard selection), and utilities are recomputed. A softmax \"soft-sampling\" variant is also studied.\n\nRobots and setup: The simulation uses LIBERO-90, holding out one of 17 scenes per target and collecting from the other 16 with scripted pick-and-place policies. Tasks are parameterized as (scene, pick object, place region). The three targets are book-caddy, soup-butter-tray and bowl-ketchup-drawer (also called ketchup-bowl-cabinet in places). The real-world setup has six environments: two kitchens, two bathrooms and two offices, built with tablecloths, appliances and green-screen backgrounds. Demonstrations are collected by human teleoperation with TeleMoMa, with 1–3 distractors per trajectory. The paper does not name the exact robot model or camera/sensor configuration. The four real targets are pink-cup-sink, towel-drawer-close, bowl-pour and lemon-drawer-close, using 15–50 target demos. Two real settings are evaluated:\n- Closed-World: selection from a pre-collected pool of 49 tasks.\n- Open-World: the VLM writes free-form scene configurations and instructions, given 11 movable objects.\n\nThe policy is language-conditioned Octo-Small fine-tuned from the released checkpoint, co-trained 50/50 with the target data (10k steps in sim, 25k in real). Baselines are Random, VLM-Uniform, STRAP (DINOv2 + DTW similarity), FSC (Group-t, offline embedding-similarity variant), All-Data and Target-Only.\n\nResults: On LIBERO (3 collection seeds × 5 policy seeds × 100 rollouts), GUILD matches or beats the best baseline at all budgets. Final success is 68.2 / 69.6 / 56.9% (average 64.9%). Read from the plots, FSC averages about 61%, VLM-Uniform and STRAP about 54–55%, and Random about 36%.\n\nIn real Closed-World (20 rollouts per policy), GUILD averages roughly 58% versus about 38% for FSC and VLM-Uniform, and also beats All-Data. All-Data includes target-environment data and reaches roughly 42%. In Open-World, only GUILD and VLM-Uniform were run; GUILD reaches roughly 72% versus 47%, the \"~25%\" average gain the authors cite. Both methods do better in Open-World than in Closed-World.\n\nAgainst humans, about six LIBERO participants are plotted, although the text says 8 roboticists were surveyed. They average roughly 55%, about the same as VLM-Uniform and below GUILD's ~65%, with some individuals beating GUILD on single tasks. Two real-world experts with 4–5 years of experience score roughly 50–55% average in Open-World, and their results are inconsistent across tasks.\n\nAblations: Removing ranking feedback from support expansion drops the LIBERO average to 59.2%, mostly on soup-butter-tray (55.3 vs 69.6). Soft-sampling gives 61.3%. Swapping in Gemini-2.5-Flash gives 61.1% on average, with large per-task swings (−17 points on soup-butter-tray, +7 on bowl-ketchup-drawer). Explore-exploit beats pure exploitation on bowl-ketchup-drawer (56.9 vs 50.7%). Dataset-level utility correlates with downstream success on two tasks (Spearman 0.78 and 0.75) but weakly negatively on book-caddy (−0.23). Many high-allocation tasks were introduced in later expansion rounds, and the final allocations range from concentrated to diffuse depending on the target.\n\nLimitations and caveats: Each attribution step takes 10–15 minutes on four A5000 GPUs. A full run takes 7–8 hours for LIBERO and 10–15 hours in the real world, and smaller batches trade compute for adaptivity. The VLM can propose infeasible or unoriginal tasks. The task space is discretized by the VLM rather than treated as continuous. Several limitations are not emphasized by the authors:\n- Real-world evaluation is 20 rollouts per policy, and Open-World comparisons are limited to two methods plus two experts.\n- The validation-loss proxy is only loosely validated against success.\n- The human study sizes are small.\n- Some task names are inconsistent across the paper.\n\nTakeaway: Read it if you work on data collection, curation or co-training for imitation learning. Its main contribution is a practical recipe that uses exact metagradient attribution as an online acquisition signal on top of VLM task proposals. The evidence is consistent but modest in scale, and its most interesting claim is beating experienced roboticists' intuition.", "cost": 0.407, "input_tokens": 86773, "output_tokens": 2993}, "arxiv-2611-06881": {"text": "Gist: The paper introduces VABAR, a simulation benchmark of six industrial, medical and infrastructure manipulation tasks. It targets \"agentic robotics\" systems, in which LLM coding agents compose and parameterize skill programs, rather than end-to-end visuomotor policies. It frames these tasks as \"Variational Automation\": a fixed operational objective that must hold across a structured, bounded distribution of object, pose and layout variations. The benchmark comes with assets, a skill library, human-authored reference solutions and initial baselines. It is mainly worth reading if you build LLM-driven program-synthesis or skill-composition systems for manipulation and want a harder, application-flavored testbed than household pick-and-place suites.\n\nQuestion: Existing benchmarks such as LIBERO, ManiSkill and SimplerEnv focus on household pick-and-place, evaluate language-conditioned learned policies, and are increasingly saturated. They also tend to treat variation as a perturbation around a nominal task rather than as the intended operating range. The authors ask how to fairly evaluate agentic systems that differ widely in internal representations, tools and controllers. Their answer is to measure only externally observable task success under controlled variation tiers. They also ask how success, cycle time and failure modes change as variation increases.\n\nMethod: A VA task class is formalized as a tuple of environment frames, robot spec, admissible assets, admissible configuration space, a sampling distribution over configurations, and a success condition. Variations are constrained to preserve:\n- the identity of the task,\n- physical and robot-reachability feasibility,\n- a graded difficulty,\n- solvability with the same skill set.\n\nThe authors list seven benchmark design criteria: agentic relevance, application relevance, accessibility, controlled diversity, repeatability via seeds, computational efficiency, and versioned durability. They also define a diagnostic execution record that separates errors into four stages:\n- perception (observation to estimated state),\n- decision (estimated state to action),\n- physical interaction (action to next state and contacts),\n- verification.\n\nThis record uses privileged simulator state and contact logs. Success conditions are written in an extended BDDL covering both rigid and deformable objects. The authors also extend their Modular Open Robot Skill Library (MORSL) to 33 skills, 25 of them new, covering:\n- functional-feature localization,\n- source-destination correspondence,\n- in-hand registration,\n- staged feature mating,\n- cable centerline tracking, anchoring and routing,\n- verification checks.\n\nRobots and setup: The single-arm Franka (model not further specified) is used for the rigid tasks, including gear meshing. A bimanual YAM platform is used for cable insertion and cable routing. The six tasks are:\n- tool sorting into labeled bins,\n- tool hanging on a pegboard,\n- gear meshing onto axles followed by a button press,\n- syringe packing into a disposal box with distractors,\n- USB-C cable insertion,\n- cable routing around an ordered peg sequence.\n\nEach task has two difficulty levels, for example singulated versus cluttered objects, two versus three gears, or 2–3 versus 4–6 pegs. The asset library has over 55 assets. Two implementations exist: one on the NVIDIA Newton physics engine (rigid plus deformable multiphysics) and one on Isaac Lab Arena, run on NVIDIA L40 GPU nodes; the two differ in textures, lighting, assets and robot setup. Perception uses SAM3-based segmentation. Camera and sensor configurations are not described in detail, and there is no real-robot component or dataset of demonstrations. Each task-difficulty condition uses 30 generated instances. The Isaac Lab Arena numbers fall on multiples of 2.5%, which hints at a different trial count. Tool sorting and hanging are scored per object; sequential tasks such as gear meshing are scored per episode.\n\nResults: Four systems are compared:\n- a human-authored GaP computation graph over MORSL skills, run on Newton and on Isaac Lab Arena,\n- Claude Code with Claude Opus 5 and no robotics harness or skills,\n- GaP with the graph generated autonomously by the same model.\n\nThe human graphs on Newton set the reference, for example:\n\n| Task | Level 1 success | Level 2 success |\n|---|---|---|\n| Tool sorting | 47.1% | 33.7% |\n| Tool hanging | 86.7% | 81.7% |\n| Gear meshing | 100% | 90% |\n| Syringe packing | 87% | 63% |\n| Cable insertion | 86.7% | 30% |\n| Cable routing | 46.7% | 46.7% |\n\nBare Claude Code is near zero everywhere. Its only nonzero results are 16.7% and 10% on tool hanging and 3.3% on Level 1 cable routing. Autonomous GaP lands in between:\n\n| Task | Level 1 success | Level 2 success |\n|---|---|---|\n| Tool sorting | 26.7% | 13.3% |\n| Tool hanging | 33.3% | 10% |\n| Gear meshing | 70% | 60% |\n| Syringe packing | 33.3% | 12.1% |\n| Cable insertion | 36.7% | 23.3% |\n| Cable routing | 36.7% | 13.3% |\n\nGaP beats Claude Code in 11 of 12 conditions and ties at 10% on Level 2 tool hanging, but trails the human graphs in every condition. The human graph transferred to Isaac Lab Arena generally degrades. Examples are syringe packing Level 1 (52.5% at a 939 s median cycle time) and cable routing Level 2 (5%). The Level 2 tool sorting cell is missing. Cycle times are medians over successful trials only, so they are confounded by which instances succeed. For example, autonomous GaP shows a shorter tool-sorting cycle (134 s) than the human graph (422 s). In the failure breakdown, motion and insertion errors dominate in many settings, reaching 96% on Level 2 cable insertion. Perception failures rise in clutter, for example 56% on Level 2 tool sorting and 58% on Level 2 syringe packing. A Newton ground-truth inspection of jammed syringes is shown as a qualitative diagnosis example.\n\nLimitations: The evaluation is preliminary.\n- There are only two difficulty tiers and one LLM.\n- There are no learned-policy, VLA or non-GaP agentic baselines, despite the stated aim of comparing architectures.\n- There is no ablation separating harness from skill library, which the authors acknowledge.\n- There is no sim-to-real validation, despite \"physical realizability\" and \"predictive of real-world success\" being listed as criteria.\n- The GaP harness and MORSL come from the same group, so the main agentic baseline is the authors' own system.\n\nSome narrative claims do not match the tables. The text says perception and grasping are highly reliable in low-variation settings, yet grasp failures are 51% on Level 1 tool sorting and 45% on Level 1 cable routing. It says tool-hanging success is stable across tiers, which holds for the human graph but not for autonomous GaP (33% to 10%). The failure table reports N/A for Level 1 gear meshing, which is consistent with the human graph's 100% but not with autonomous GaP's 70%. This leaves unclear which system the failure analysis covers and how failures were attributed.\n\nTakeaway: The useful contributions are the VA framing, the task and variation specifications, the extended skill library, and the observation that even human-authored graphs reach only about 30–47% on the harder insertion, routing and sorting conditions. That suggests real headroom rather than saturation. The empirical section is thin and best read as a baseline sketch. Skim Sections III–V and Tables I–III unless you plan to use the benchmark or the MORSL/GaP stack directly.", "cost": 0.1987, "input_tokens": 30457, "output_tokens": 3845}, "pdf-beb8536dd7": {"text": "Gist: This is not a research paper. It is an FDA (CDRH) discussion paper and request for feedback, dated November 2026, on how to weigh benefits and risks of robotic medical devices that have autonomous and/or remote teleoperation capabilities. It proposes shared terminology, lists candidate benefits, risks, and mitigations, and poses 15 open questions ahead of a public workshop on December 2–3, 2026. It matters because it signals how the US regulator is framing surgical and medical robot autonomy and telesurgery before any such systems are authorized. The paper notes that, as of July 2026, no remotely teleoperated or fully autonomous robotic device system has US marketing authorization. It explicitly states that it is not draft or final guidance and does not set policy.\n\nQuestion: The paper asks how FDA should characterize and weigh benefits and risks for robotic systems as control shifts from the user to the machine (autonomy), or as the user moves out of the room (remote teleoperation). It also asks what evidence and risk controls could provide \"reasonable assurance of safety and effectiveness\" for these systems. The gap it identifies is the lack of agreed terminology and evaluation expectations. Scope extends beyond robotically-assisted surgical devices (RASDs) to stereotactic navigation, robotic imaging, and endoluminal navigation systems.\n\nMethod: The approach is conceptual, not experimental. Key definitions:\n- Autonomy is the ability to perform tasks and make decisions from current state and sensing without user intervention.\n- Autonomy is explicitly distinguished from \"automaticity,\" meaning predictable rule-following behavior. The paper focuses only on autonomy in this stronger sense.\n- Remote teleoperation is real-time control by a user not physically in the room with the patient. It can range from single tasks to entire procedures, and from another room in the same facility to another country. Connections may be wired (fiber) or wireless (Wi-Fi, 5G, satellite).\n\nThe paper reviews autonomy frameworks. Yang et al. (2017) is described as the most widely adopted; it has six procedure-level levels, from Level 0 (full surgeon control) to Level 5 (full autonomy). More granular alternatives are IEC/TR 60601-4-1 Degree of Autonomy, Haidegger's Level of Autonomy, and Schmidgall et al. (2025). These decompose autonomy into four cognitive functions: monitor, generate, select, and execute. The paper notes this granularity costs practicality as a grouping tool. It then maps benefits, risks, and mitigations onto existing FDA benefit-risk guidance factors.\n\nRobots and setup: There are no robots, sensors, simulators, datasets, or experiments. No specific robot models are named. The paper cites only motivating examples:\n- remote robotic ultrasound\n- remote RASD teleoperation\n- an FDA-authorized autonomous peripheral blood-draw robot\n- DARPA's MEDICS program for autonomous hemorrhage control\n- a 2025 Johns Hopkins report of a realistic autonomous surgery\n- the 2001 transatlantic telesurgery (Marescaux et al.)\n- a 2025 industry consensus paper on network and facility requirements for remote robotic surgery\n\nResults: There are no quantitative results or baselines. The substantive output is a qualitative catalogue.\n\nClaimed autonomy benefits include consistency and repeatability, fewer errors from inexperience, better use of pre-procedure imaging, broader access, and reduced user burden. AI/ML could amplify these benefits through adaptive planning.\n\nAutonomy risks include:\n- errors executed before a supervisor can intervene\n- poor adaptation to unanticipated conditions such as tissue deformation, bleeding, or anomalous anatomy\n- slow control handover\n- automation bias and automation rejection\n- deskilling, where users cannot finish a procedure manually if the system fails\n- AI/ML failures out of the training distribution, subgroup performance disparities, opacity, and performance drift\n- cybersecurity exposure under FD&C Act Section 524B\n\nTeleoperation benefits center on time-critical care such as stroke thrombectomy and MI, specialist access, and remote proctoring. Teleoperation risks include:\n- delayed management of intraprocedural adverse events\n- connectivity loss\n- motion-control and audio-visual delays that are out of sync with each other\n- missing sensory cues, such as drill pitch, palpation resistance, and odors\n- difficulty converting to a manual procedure or transferring the patient\n\nThe paper also notes two tensions. Staffing both a remote and a local specialist may reduce overall specialist availability. And the locations with the most to gain from teleoperation are often the riskiest because they lack on-site resources.\n\nCombined autonomy-and-teleoperation risks: Combining the two capabilities raises latency during autonomous failure and unreliable handoffs between autonomous and teleoperated modes. Shared risks across both include dependence on sensors and imaging, hardware and software failures, team training gaps, and end-to-end cybersecurity. The cybersecurity concerns are network performance, system-level threats, command integrity and non-repudiation, availability, and users' inability to detect tampered video.\n\nMitigations considered: The paper discusses design controls (haptic boundaries, velocity and force limits, redundancy and fail-safes). It covers verification and validation through bench, in silico, cadaver, and clinical studies under worst-case conditions. It also covers training the in-room staff for override and emergency stop, human factors engineering, and postmarket monitoring through real-world data and Medical Device Reporting. It suggests benefit-risk may need to be procedure- or condition-specific. For example, remote coronary stent deployment is likely riskier than advancing a GI endoscope.\n\nLimitations: The document is high-level and non-binding. It offers no thresholds for latency, accuracy, or autonomy level, no proposed test protocols, and no data. It deliberately avoids saying what evidence FDA would actually require.\n\nTakeaway: Read it if you work on surgical or medical autonomy, shared control, or telesurgery and care about clinical translation. It is a compact map of the failure modes and evidence types the regulator is worried about, and the 15 questions are a good source of research problems. Examples include override latency, safe mode handoff, sensory substitution, worst-case validation, and robustness to connectivity degradation. Skip it if you want technical methods or empirical results; it contains none.", "cost": 0.2489, "input_tokens": 48316, "output_tokens": 2783}, "arxiv-2511-14759": {"text": "Gist: The paper introduces RECAP (RL with Experience and Corrections via Advantage-conditioned Policies), a recipe for improving a large flow-matching VLA with real-world reinforcement learning. The resulting model, π*0.6, is first pre-trained with offline RL on tens of thousands of hours of multi-robot demonstrations. It is then improved per task using autonomous rollouts, sparse success labels, and human teleoperated corrections. It matters because it is one of the first demonstrations that a single, fairly simple RL recipe can substantially raise both the success rate and the speed of a full-scale VLA on long, dexterous, real-world tasks: espresso making, diverse laundry folding, and factory box assembly.\n\nQuestion: Imitation-trained VLAs suffer compounding errors and are capped by demonstrator quality. Existing RL approaches for VLAs have notable gaps. PPO-style on-policy fine-tuning is hard to run efficiently on real robots. Residual or action-head methods do not train the whole model end-to-end. Most prior value-based work uses discrete-action or Gaussian policies and short tasks. The question is how to do scalable, stable RL on an expressive flow-matching VLA, end-to-end, while mixing heterogeneous data: demonstrations, interventions, and autonomous episodes from current and older policies.\n\nMethod: RECAP is iterated offline RL with three steps.\n- Value function. A multi-task, language-conditioned distributional value function is trained with Monte Carlo returns. It uses a 670M Gemma 3 backbone, 201 value bins, and is co-trained with web data. The reward is -1 per step, 0 on success, and a large negative constant on failure, so the value approximates normalized negative steps-to-success. This makes it an on-policy estimate of the behavior policy's value, not a Q-function.\n- Advantage indicator. Advantages are computed with an N=50 step lookahead during fine-tuning and full-episode returns during pre-training. They are binarized into an indicator using a per-task threshold. The threshold gives roughly 30% positive data in pre-training, roughly 40% in fine-tuning, and 10% for the T-shirt task, where it pushes for speed.\n- Advantage-conditioned policy. The indicator is fed to the VLA as text (\"Advantage: positive/negative\") after the predicted subtask and before the action tokens. The VLA is trained on all data with ordinary supervised losses: FAST-token cross-entropy plus flow matching under the Knowledge Insulation recipe. Human corrections are always labeled positive. The indicator is dropped 30% of the time, so classifier-free guidance can optionally sharpen the policy at test time (β around 1.5–2.5).\n\nThe theoretical motivation follows CFGRL: conditioning on an improvement event yields a policy provably better than the reference. Each iteration re-fine-tunes both the policy and the value function from the pre-trained checkpoint rather than from the previous iterate, to avoid drift. The VLA itself is π0.6: a Gemma 3 4B backbone plus an 860M-parameter flow-matching action expert, producing 50 Hz joint-position action chunks and high-level subtask text.\n\nRobots and setup: Pre-training uses data from many robot platforms. All iterative-improvement experiments use one static bimanual system: two 6-DoF arms with parallel-jaw grippers, joint-position control at 50 Hz, and three cameras (one base camera between the arms, one wrist camera per arm). The paper does not name the exact arm or hardware models, and there is no simulation. The evaluation tasks are:\n- T-shirt/shorts folding: 200 s limit.\n- Diverse laundry: 11 item types, measured on button-up shirts, 500 s limit.\n- Strict single-shirt \"failure removal\" variant: collar must face up.\n- Double-shot espresso on a commercial machine: 200 s limit.\n- Box assembly in a real factory deployment: fold, label, and place in a crate, 600 s limit.\n\nData volumes are modest per iteration, for example:\n- Laundry: 300 autonomous episodes per iteration.\n- Box assembly: 600 autonomous plus 360 intervention episodes per iteration.\n- Cafe: 414 autonomous plus 429 correction episodes in a single iteration.\n\nResults: On every task, full RECAP beats the baselines: pre-trained π0.5, pre-trained π0.6, RL-pre-trained π*0.6, and π*0.6 offline RL + SFT.\n- Throughput: going from offline RL + SFT to the final model more than doubles throughput (successes per hour) on diverse laundry and espresso, and roughly halves the failure rate.\n- Success rates: the final model exceeds 90% success on all tasks except diverse laundry. On the easy laundry task, success was already near ceiling after SFT, but throughput still rose substantially.\n- Over iterations: laundry throughput improved about 50% over two iterations using autonomous data only, with success above 90% after the first iteration. Box assembly throughput first dipped, then reached about 2× after the second iteration, with about 90% success on the folding and labeling stages; placement in the crate remains the weakest stage.\n- Failure-mode removal: on the strict collar-up task, two iterations of 600 trajectories, using RL without demonstrations, raised success to 97%.\n- Long runs: the model made espresso for 13 hours straight and folded novel laundry in a new home for over two hours without interruption.\n- Note: most exact numbers are only shown in bar charts (Figs. 7–12), not in the text.\n\nAblations: The policy-extraction comparison was run only on T-shirt/shorts, with all methods trained on the same data RECAP collected. Against this, AWR and an SPO-stabilized DPPO/FPO-style PPO both fell well short of advantage conditioning and barely improved over offline RL + SFT. PPO needed a tight trust region (0.01) just to stay stable off-policy. AWR reached reasonable success but produced much slower policies. The paper also reports that RL pre-training plus SFT beats plain SFT as an RL starting point. Setting the indicator to always-positive during the initial SFT stage helped slightly, and large CFG weights produced overly aggressive actions, so they tuned the threshold instead.\n\nLimitations: The loop still relies on humans for success labels, interventions, and resets. Exploration is essentially greedy, coming from policy noise and corrections. Training is batched and iterated rather than truly online. The value estimator is a Monte Carlo on-policy estimate rather than an off-policy Q-function. Treating all human corrections as optimal is an assumption. Several design choices are tuned per task, such as advantage thresholds and data mixes, and the extraction-method comparison covers a single task. Hardware is underspecified, and nothing is open-sourced or simulated, so reproduction is impractical outside a lab with comparable data and infrastructure.\n\nTakeaway: Read it if you care about practical RL for large diffusion or flow VLAs. Its main contribution is showing that a binarized advantage token plus supervised training is a scalable, stable alternative to policy gradients and AWR for expressive policies, and that it delivers roughly 2× throughput gains on genuinely hard, long-horizon real-world tasks. The algorithmic pieces are individually known (CFGRL, HG-DAgger, distributional value functions); the novelty lies in their combination and scale rather than in a new theory.", "cost": 0.2099, "input_tokens": 37448, "output_tokens": 3006}, "arxiv-2504-16054": {"text": "Gist: This paper presents π0.5, a vision-language-action (VLA) model from Physical Intelligence that extends π0. It is co-trained on a heterogeneous mix of robot data, high-level subtask labels, verbal instructions and web data. The authors report that the model drives mobile manipulators through long-horizon cleaning tasks (10 to 15 minutes, e.g., cleaning a whole kitchen or bedroom) in homes never seen in training. They claim this is the first end-to-end learned system to show this level of open-world generalization on complex, dexterous, multi-stage household tasks. It is worth reading if you care about cross-embodiment transfer, hierarchical VLAs, or how to get generalization without collecting robot data in every target environment.\n\nQuestion: Prior VLAs are mostly evaluated in environments close to their training data. Simple skills such as picking or drawer opening have been shown to generalize by collecting robot data in many places, but brute-force data collection does not scale to long-horizon semantic tasks. The paper asks whether a co-training recipe can supply the missing breadth of knowledge. Its ingredients are other robots, lab data, web vision-language tasks, subtask prediction and human verbal instructions. It also asks which of these sources actually matter and how generalization scales with the number of training environments.\n\nMethod: A single transformer models both levels of a factorized policy, π(a, ℓ̂ | o, ℓ) = π(a | o, ℓ̂) · π(ℓ̂ | o, ℓ).\n- At inference the model first decodes a text subtask ℓ̂ (e.g., \"pick up the pillow\") from the overall prompt ℓ. It then generates a 50-step continuous action chunk conditioned on that subtask, so the low-level policy sees only the subtask, not the original prompt. This resembles chain-of-thought, but the high-level step runs at lower frequency than action generation.\n- The backbone is PaliGemma (SigLIP 400M plus Gemma 2B, width 2048, 18 layers). Proprioceptive state is discretized into text tokens.\n\nTraining happens in two stages:\n- Pre-training (280k steps) treats everything as next-token prediction. Actions are encoded as discrete FAST tokens, which trains faster than diffusion.\n- Post-training (80k steps, loss weight α = 10) adds a randomly initialized 300M-parameter \"action expert\" trained with flow matching. Text prediction is kept in the loss, and inference uses 10 denoising steps.\n\nSeveral architectural details support this design:\n- The attention mask stops the flow-matching tokens from attending to the FAST tokens, which prevents leakage between the two action representations.\n- Information flows only from the VLM to the action expert.\n- The flow timestep is injected via adaptive RMSNorm rather than fused with the noisy action as in π0.\n- Timesteps are sampled from a Beta distribution skewed toward low values.\n\nThe pre-training data mixture has five components:\n- About 400 hours of mobile-manipulator data from roughly 100 homes (MM).\n- Static single- and dual-arm data collected in many homes (ME).\n- Lab cross-embodiment data, including Open X-Embodiment (CE).\n- Manually annotated subtask labels plus bounding boxes (HL).\n- Web captioning, VQA and object-localization data (WD), drawn from CapsFusion, COCO, Cambrian-7M, PixMo and VQAv2, plus indoor detection data.\n\nAbout 97.6% of first-stage examples are not mobile-manipulation data. Post-training uses MM and ME (filtered to successful, shorter episodes), web data, and the ME slice of HL. It also adds verbal instruction (VI) data, in which experts \"teleoperate\" the learned low-level policy by issuing subtask commands in real time.\n\nRobots and setup: The paper does not name the hardware models. It describes two in-house mobile manipulator platforms, each with:\n- Two 6-DoF arms with parallel-jaw grippers.\n- A wrist-mounted monocular RGB camera on each arm.\n- Forward- and backward-facing cameras between the arms.\n- A 3-DoF holonomic wheeled base, commanded by velocity.\n- A 1- or 2-DoF torso lift.\n\nThis gives 18 or 19 DoF state and action spaces. All four cameras feed high-level inference; only the wrist and forward cameras feed low-level inference. The model outputs target arm, gripper and lift poses and base velocities at 50 Hz with action chunking. These targets are tracked by simple PD controllers, with no motion planning or collision checking, so navigation and manipulation are fully end-to-end. No simulator is used.\n\nEvaluation covers four rubric-scored tasks: dishes in sink, items in drawer, laundry in basket, and make bed. They run in three unseen mock kitchens, three unseen mock bedrooms and three real homes, typically with 10 trials per task. There is also a language-following test: the robot picks a named object from five candidates and places it in a drawer or sink, using either new instances of seen categories or entirely unseen categories (funnel, pill bottle, grill lighter, lighter, safety goggles).\n\nResults: The values below are approximate, read from bar charts.\n- **Real homes:** average task progress ranged from about 65% to 95% across tasks, comparable to mock-home performance of about 80–90%.\n- **Scaling with environments:** with location count varied over 3, 12, 22, 53, 82 and 104 homes, mock-home progress rose from roughly 15% to roughly 86%. The 104-location model matched a control trained on data from the test homes themselves (about 83%). Without the co-training pre-training, the in-domain control falls to about 39% and the 104-location model to about 5%. Language following and success rates also rise with more locations, with out-of-distribution objects improving more slowly.\n- **Versus π0 baselines (same robot data, comparable steps), task progress:**\n\n| Task | π0.5 | π0-FAST+Flow (no HL/WD) | π0 at 300k steps | π0 at 80k steps |\n|---|---|---|---|---|\n| Dishes in sink | ~91% | ~55% | ~41% | ~18% |\n| Items in drawer | ~85% | ~70% | ~32% | ~5% |\n| Laundry | ~80% | ~73% | ~30% | ~38% |\n| Make bed | ~57% | ~47% | ~19% | ~13% |\n\n- **Language following versus baselines:** follow rate was about 77% for π0.5, about 67% for FAST+Flow, and 18–35% for π0.\n\nAblations: Removing data sources had different effects in the mock homes (π0.5 at about 78% average progress):\n- Dropping either robot data source hurts: no CE gives about 51% and no ME about 53% (both p < 0.001). Dropping both gives about 41%.\n- Dropping web data gave about 72%, which was not significant (p = 0.385). However, it clearly hurt out-of-distribution object language following and the items-in-drawer task.\n\nHigh-level inference results (π0.5 at about 78%):\n- \"Implicit HL\" (subtask data used in training but no explicit subtask inference at runtime) reached about 71% (p = 0.14). This suggests much of the benefit comes from co-training on subtask prediction itself.\n- No HL data at all gave about 62%, no VI about 60%, and no WD about 60%. VI makes up only about 11% of the high-level mobile-manipulation examples yet clearly matters.\n- Zero-shot GPT-4 as the high-level planner gave about 57%.\n- A human oracle high-level policy gave about 63%, which π0.5 outperformed.\n\nLimitations: The authors note several failure modes:\n- Unfamiliar drawer handles and cabinets that are physically hard to open.\n- Partial observability, such as the arm occluding a spill.\n- High-level subtask predictions that get distracted, such as repeatedly opening and closing a drawer.\n- Only simple prompts are supported, and context and memory are limited, which rules out multi-room tasks or remembering where objects are stored.\n\nPractical caveats for a reader:\n- The hardware is unnamed and the datasets are proprietary, so the work is not reproducible.\n- Evaluation covers only four rubric-scored tasks at about 10 trials each, giving fairly wide error bars.\n- The scaling experiments use a reduced pre-training recipe (no MM data in pre-training, 40k post-training steps).\n\nTakeaway: The paper is a well-ablated systems paper rather than an algorithmic one. Its most transferable lessons are threefold. Discrete FAST pre-training followed by flow-matching post-training beats pure flow training on both control and language following. Cross-embodiment robot data from static arms and lab setups substantially helps a mobile platform. Training a single model to predict subtasks, including from cheap verbal-instruction data, improves the low-level policy even when explicit subtask inference is not used at runtime.", "cost": 0.3551, "input_tokens": 69711, "output_tokens": 3814}}, "ratings": {}, "links": {"pdf-beb8536dd7": {"url": "https://www.fda.gov/media/196129/download", "cost": 0.1008, "searches": 1}, "arxiv-2410-24164": {"url": "https://arxiv.org/abs/2410.24164", "cost": 0.0287, "searches": 0}, "pdf-556e228a43": {"url": "https://arxiv.org/abs/2411.05193", "cost": 0.097, "searches": 1}, "arxiv-2504-16054": {"url": "https://arxiv.org/abs/2504.16054", "cost": 0.0998, "searches": 1}, "arxiv-2511-14759": {"url": "https://arxiv.org/abs/2511.14759", "cost": 0.1034, "searches": 1}, "arxiv-2501-09747": {"url": "https://arxiv.org/abs/2501.09747", "cost": 0.0986, "searches": 1}}, "htmlv": {"claude": {"arxiv-2501-09747": {"path": "htmls_claude/arxiv-2501-09747_FAST  Efficient Action Tokenization for Vision-Language-Action Models/index.html", "cost": 1.0007, "input_tokens": 64364, "output_tokens": 37162}, "arxiv-2511-08544": {"path": "htmls_claude/arxiv-2511-08544_LeJEPA  Provable and Scalable Self-Supervised Learning Without the Heuristics/index.html", "cost": 0.8129, "input_tokens": 164303, "output_tokens": 7784}, "arxiv-2610-39302": {"path": "htmls_claude/arxiv-2610-39302_Proving and Improving the Platonic Representation Hypothesis with JEPAs/index.html", "cost": 0.716, "input_tokens": 129371, "output_tokens": 9926}, "arxiv-26
