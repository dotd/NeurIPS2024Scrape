l data for two reasons: the WAM is unable to recognize task completion and keeps generating purposeless motion after the task is done, and under open-loop generation the generated actions gradually drift away from the generated observations. To address both issues, we present rectified generative replay (R$^2$-WAM), which truncates generated rollouts at task completion with an agentic evaluator and filters out rollouts whose actions are physically inconsistent with the observations. On the four LIBERO suites and five real-world tasks, R$^2$-WAM reduces forgetting by over 90% relative to sequential fine-tuning and nearly matches ER without accessing any data from previous tasks. Our analysis further reveals that forgetting in WAMs concentrates in inverse dynamics modeling: a forgotten WAM still produces visually plausible observations of previous tasks while its generated actions fail.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world action model; robotic manipulation; continual learning; experience replay", "https://openreview.net/pdf?id=E8268t87nn", "", ""], ["https://openreview.net/forum?id=Bsr5qDMoJy", "Decomposing Residual Dynamics to Identify Nonlinear Mechanisms", "Sriya Karambor Chakravarty, A. Wicks, Simon Stepputtis", "Physics-informed system identification must balance built-in structure against learning. Hybrid models do this by pairing an analytical prior with a learned correction,  but it is rarely clear what the learned correction captures. To address this problem, we introduce PARSE (Physics-Anchored Residual Slot Encoding), which subtracts a single-mode linear prior from frequency responses measured at several drive levels and decomposes the complex residual with slots that compete for frequency lines. Features read from the slots around each mode are used to detect a nonlinearity, characterize its mechanism and localize the mode that carries it. On simulated systems with one to four degrees of freedom and cubic stiffening, dead-band clearance or Jenkins friction, PARSE reaches a balanced accuracy of 0.74, against 0.31 for a direct FRF classifier that has no model of the structure.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "nonlinear system identification; residual dynamics; slot attention", "https://openreview.net/pdf?id=Bsr5qDMoJy", "", ""], ["https://openreview.net/forum?id=9fpJFJqOV3", "DefFlow: Goal-Conditioned Deformable Object Manipulation using 3D Point Flows", "Gaurav Singh, Sergio Orozco, Ryan Duong, Mete Tuluhan Akbulut, George Konidaris, Srinath Sridhar", "Manipulating deformable objects toward desired 3D configurations is a fundamental capability for robots operating in unstructured physical environments. However, as the range of possible initial and target configurations grows, goal-conditioned deformable manipulation requires a robot to infer increasingly diverse manipulation behaviors in addition to precise continuous actions. We introduce DefFlow, a framework for goal-conditioned manipulation of deformable objects toward a broad range of 3D configurations. DefFlow learns a “3D World Action Modelling objective” from demonstrations by jointly predicting the goal-conditioned 3D point flow of the robot and deformable scene. We show that this formulation effectively captures both the manipulation decisions, such as when and where to grasp, release, or re-grasp, and the precise continuous motions required for goal reaching. Across rope, granular-media, and cloth manipulation settings with diverse initial and target configurations, DefFlow substantially outperforms goal-conditioned action-prediction and robot-flow-only baselines on success rates and goal-distance metrics.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "deformable object manipulation; goal-conditioned policies; world action models", "https://openreview.net/pdf?id=9fpJFJqOV3", "", ""], ["https://openreview.net/forum?id=guDXS2ATqZ", "Dexterity from Supervised Play", "Botao He, Yiming Dou, Yiannis Aloimonos, Jitendra Malik, Akash Sharma, Ruoshi Liu", "How can robots autonomously collect the contact-rich experience needed to learn dexterous manipulation? We present DSP: Dexterity from supervised play, a framework in which a robot learns a play policy from minutes of human play through behavior cloning, then deploys it autonomously to collect hours of interaction data to train a world model. During inference, the same play policy then guides model-predictive control (MPC) by proposing candidate action sequences for evaluation under the learned world model. To accelerate inference, we also introduce a method for distilling a closed-loop, goal-conditioned policy through self-play within the learned world model. We evaluate this framework on underactuated pushing and any-to-any in-hand pose reorientation with a multifingered hand, in simulation and real world. In simulated reorientation, our method reaches 91.4% SR@0.6 rad, compared with 53.9% for hindsight behavior cloning; a task-specific PPO operating point reaches 86.7% after about 490× more counted interaction frames. In the reported hardware evaluation, MPC remains within 4.1 percentage points of simulation at all three thresholds. These results demonstrate that supervised play can autonomously collect interaction data, guide model-based planning, and enable policy learning without task-specific demonstrations.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "supervised play; world models; dexterous manipulation; autonomous data collection; model predictive control", "https://openreview.net/pdf?id=guDXS2ATqZ", "", ""], ["https://openreview.net/forum?id=5dVWzPpmVP", "DiagGen: Agentic Generation of Deformable Assets with Sim-based Diagnostics for Robotic Simulation", "Guanxiong Chen, Yiduo Qu, Qianjun Xia, Pengyu Jing, Yixian Cheng, Bole Ma, Pengzhi Yang, Bingyang Zhou, Ziming Li, Shashwat Suri, Gongbo Sun, Chao Liu, Peter Yichen Chen, Ziqiu Zeng, Fan Shi", "While simulation-ready deformable assets are essential for in-silico robotic manipulation tasks, existing generation frameworks typically assess physical plausibility after generation, leaving an object's simulated response unused as feedback for repairing upstream errors. We present DiagGen, an agentic framework that turns a single in-the-wild image into a simulation-ready deformable asset through a generate--simulate--diagnose--refine loop. DiagGen constructs part-aware geometry and material parameters, then uses a VLM (vision-language model)-based agent to select semantically informative regions, probe them in a physics simulator, observe material responses, and route evidence-backed repair cues to the responsible generation stage. Experiments on 40 assets show that diagnostics provides useful repair cues and can moderately improve the quality of generated deformable assets. Finally, we show that unlike assets generated from visual foundation models which may not be simulatable, DiagGen-generated deformables can be directly dropped into a high-fidelity physical simulator for the planning and simulation of contact-rich pick-and-place tasks. The project's website is https://diaggen.github.io/.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "real2sim; simulation; manipulation; asset generation", "https://openreview.net/pdf?id=5dVWzPpmVP", "", ""], ["https://openreview.net/forum?id=8y3HdoXk8H", "Do Better Videos Mean Better Robot Control? Offline Checkpoint Selection for Video-Action Models", "Jessie Li, Isar Meijer, Carl Brander, Liam Achenbach, Marc Pollefeys, Oier Mees", "Recent video-action models build robot policies on pretrained genera-\ntive video backbones fine-tuned on robot videos, using their internal representa-\ntions as predictive features for action decoding. Yet visually plausible predictions\nprovide limited evidence about which representations will support effective con-\ntrol. We investigate whether interaction-relevant information accessible in video\nactivations helps explain downstream policy quality. We introduce Contact Gain,\nan offline metric that uses simulator contact labels to measure how much video\nactivations improve future-contact prediction beyond an observed-input probe, en-\nabling checkpoint selection before training a separate action decoder for every\ncandidate. Across fine-tuning checkpoint sweeps of two video-model families in\ntwo simulators, MolmoSpaces and RoboCasa, Contact Gain tracks downstream\npolicy success and identifies a checkpoint with the highest observed success in\neach sweep, while training loss and Fréchet Video Distance are less reliable for\ncheckpoint selection. Perturbing contact-associated activations also produces sub-\nstantially larger changes in predicted actions than matched random perturbations,\nconnecting the information accessible in video representations to action predic-\ntion.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "video-action models; representation learning; model evaluation", "https://openreview.net/pdf?id=8y3HdoXk8H", "", ""], ["https://openreview.net/forum?id=d9auTZxYvS", "DoomShift: How Much Adaptation Do World Models Need Under Domain Shift?", "Rohan Nagabhirava, Keerthana Chirumamilla, Changliu Liu", "World models have become capable simulators, but they are evaluated almost exclusively on held-out rollouts from the domain they were trained on. A small domain shift, such as a new map of the same game, lighting, textures or enemies, can make their outputs drift even when the underlying physics and game engine are unchanged. With DoomShift, a controlled version of this shift in Doom, we measure what breaks and how much adaptation is needed to repair it. We train three diffusion backbones, initialized from pretrained diffusion image models, on four Doom maps and evaluate them on 13 unseen maps. All three preserve their response to controls but fail to reproduce the new scene: scene PSNR drops by 2.8–3.3 dB and LPIPS rises by 0.126–0.145 across the three backbones. This consistent gap shows that action-conditioned behavior transfers more reliably than scene appearance, independent of architecture or model scale. Yet the lost appearance is relatively cheap to recover: rank-16 adapters trained on only eight episodes with 2% of the original training updates recover 72–76% of the LPIPS rise and about half of the lost PSNR. Together, these results suggest that adapting a world model to a new environment may require restoring the scene's appearance rather than relearning the underlying game.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; diffusion models; few-shot adaptation", "https://openreview.net/pdf?id=d9auTZxYvS", "", ""], ["https://openreview.net/forum?id=JrkcpyQWy6", "DROID-3D: Lifting Large-Scale Teleoperation Data into Robot-Grounded Metric 3D", "Jai Bardhan, Josef Sivic, Vladimir Petrik", "Learned world models for manipulation are trained almost entirely on RGB video, yet the quantities that matter for control, such as metric distances and where the arm is relative to an object, are inherently 3D. Large real-world teleoperation datasets record geometry only as a byproduct of collection, at a quality too low for supervision. We present DROID-3D, a robot-grounded metric 3D version of DROID covering $71{,}100$ episodes from $28$ robots in $13$ labs, with dense metric depth for all three stereo cameras and extrinsics in the robot's base frame. It combines learned stereo depth with one joint factor graph per robot, which renders the URDF into each view as a kinematic anchor and pools all of the robot's episodes to identify its hand-eye transform and joint-encoder offsets alongside per-scene extrinsics. Compared with a PointWorld-like per-scene calibration baseline, DROID-3D lowers the median external-camera reprojection error from $5.84$ to $0.25\\,\\mathrm{px}$ and the robot depth error from $111$ to $14\\,\\mathrm{mm}$, and on a replicated rig it recovers extrinsics to within $4.9\\,\\mathrm{mm} / 0.39^\\circ$ of ChArUco ground truth. Used as an additional prediction target, DROID-3D depth improves the RGB predictions of a video world model by $+1.48\\,\\mathrm{dB}$ PSNR.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "robot datasets; world models; 3d calibration; metric depth; hand-eye calibration; system identification; robot manipulation", "https://openreview.net/pdf?id=JrkcpyQWy6", "", ""], ["https://openreview.net/forum?id=kgiBog3R4w", "EgoPhys: Physics-Informed Digital Twins for Deformable Objects from Egocentric Video", "Hyunjin Kim, Ri-Zhao Qiu, Rocktim Jyoti Das, Guangqi Jiang, Dinesh Manocha, Xiaolong Wang", "Predicting how deformable objects respond to manipulation from unconstrained visual observations remains challenging. We present EgoPhys, a framework for constructing predictive deformable physical twins from a single egocentric RGB interaction. EgoPhys combines persistent correspondences with monocular 3D observations to identify a sequence-specific spring--mass model, with adaptations for manipulation coupling, support contact, and thin-object dynamics under moving-camera observations. Since short interactions weakly constrain local properties, EgoPhys learns a compact state-conditioned residual that predicts bounded stiffness corrections and remains frozen at test time. EgoPhys improves held-out future prediction over an adapted deformable-twin baseline, while its structured residual further improves independently identified twins, including unseen instances. The resulting predictive models also support deformable-object planning, with representative open-loop robot executions.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "system identification; real-to-sim; residual physics; egocentric video; deformable object manipulation", "https://openreview.net/pdf?id=kgiBog3R4w", "", ""], ["https://openreview.net/forum?id=Xzw0q6xbUx", "FACT: Failure-Aware Causal Training for World‑Action Models", "Quanquan Peng, Yutong Liang, Rui Yan, Nicklas Hansen, Xiaolong Wang", "Recent world-action models (WAMs) show that co-training policies with future prediction can provide physical priors for action generation. Building on the future-prediction ability of video models, many WAMs generate future videos and recover actions with inverse-dynamics models, or use these predicted videos as goal conditions for action generation. In both cases, the world model is trained mostly on successful demonstrations and has little reason to predict the consequences of bad actions. We introduce FACT, a causal World-Action Model that predicts future video and task progress conditioned on the candidate action. This action-conditioned interface allows failure rollouts to supervise action consequences, turning bad actions into valid future targets rather than being discarded. Failure-aware training makes the progress predictor aware of both successful and failed action outcomes, which can optionally be used to score sampled action candidates at inference. Extensive experiments on simulation and real-world bimanual manipulation tasks show that FACT improves policy success when failure data are incorporated into training, and reduces success-biased future hallucination under bad actions.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world-action models; learn from failure", "https://openreview.net/pdf?id=Xzw0q6xbUx", "", ""], ["https://openreview.net/forum?id=4LCGyDUVpt", "Few-Shot Residual Adaptation of Pretrained Latent World Models", "Jakub Suliga, Pankhuri Vanjani, Nisarga Nilavadi, Wolfram Burgard, Rudolf Lioutikov", "Pretrained latent world models support visual planning, but their predictions can fail when physical dynamics change at deployment. We adapt such models from a few interactions without modifying their weights or identifying the changed physical parameters. We introduce a few-shot residual adaptation approach that learns self-supervised corrections from latent prediction errors that act both inside the frozen predictor and on its output. We evaluate the approach in simulation and on a real robot under center-of-mass and friction shifts. These dynamic changes reduce the success of the frozen model to near zero. After three interaction episodes on a real robot, our dual-site approach recovers 90\\% success under the center-of-mass shift and 100\\% under modified friction, and it outperforms single-site adaptation. Our diagnostics suggest that much of the correction reduces a general prediction mismatch, while control also depends on shift-specific information captured during adaptation.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world model; jepa based world models; online adaptation; residual adapters", "https://openreview.net/pdf?id=4LCGyDUVpt", "", ""], ["https://openreview.net/forum?id=0gR9IYOCfs", "FORM: Identifying Material Laws from Robot Interaction for Deformable Object Manipulation", "Stepan Tretiakov, Ruihan Zhao, Cheng-Hsi Hsiao, Xingjian Li, Adam Thorpe, Hassan Iqbal, Sandeep P. Chinchali, Ufuk Topcu, Krishna Kumar", "Hybrid world models that combine neural networks with physics simulation can help robots manipulate deformable objects, but they require the object's material law, which is usually unknown. We present FORM, which identifies deformable material laws through physical interaction. FORM uses weak-form momentum balance to reduce identification to a linear least-squares problem over analytic or learned basis functions. The recovered model transfers directly to an MPM simulator for prediction and planning under new actions and geometries. In simulation, FORM is competitive with baselines at a fraction of their cost. On a real Franka Panda, models identified from a separate probing interaction enable open-loop shaping of unseen deformable specimens and target-volume pouring.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "system identification; deformable object manipulation; material point method; weak form; function encoders; hybrid world models; real-to-sim", "https://openreview.net/pdf?id=0gR9IYOCfs", "", ""], ["https://openreview.net/forum?id=UmNvW45IvN", "GeomVLA: Unifying Scene, Motion, and Action in 3D", "Ziyin Xiong, Nikolaos Gkanatsios, Moritz Reuss, Katerina Fragkiadaki", "Robot policies increasingly predict how a scene will evolve, but such predictions are usually made in pixel space while actions are executed in metric 3D, and it is unclear how a controller should consume predictions that are inevitably imperfect. We study these questions with GeomVLA, a vision-language-action (VLA) model that couples a language-conditioned 3D scene-motion model, trained on 3D point tracks extracted from demonstration videos, with a 3D action denoiser in a shared metric frame. Rather than executing predicted trajectories, the policy reads intermediate motion features from a single velocity-field evaluation. GeomVLA achieves state-of-the-art performance on CALVIN, competitive results on LIBERO and RoboTwin2.0, and strong real-world performance without robot-action pretraining. Ablations show that predictions help most when expressed in the same metric geometry as perception and action, and that early latent motion features are more useful to the policy than fully denoised trajectory predictions.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "vision-language-action; 3d motion prediction; world models", "https://openreview.net/pdf?id=UmNvW45IvN", "", ""], ["https://openreview.net/forum?id=PU8VtCeGAA", "Getting Out and Getting Back: World and Behavior Grounding in Real2Sim2Real Co-Training", "Samuel Liu, Youngsun Kim, Martin Matak, Gilwoo Lee", "Simulation can expand scarce real demonstrations, but how world fidelity and similarity to human behavior affect co-training remains unclear. We independently vary world grounding, which aligns simulation with the real system, and behavior grounding, which aligns simulated trajectories with human motion. On dynamic dexterous pick-and-sort, fully grounded co-training raises the success rate from 52% to 86% using 100 real demonstrations and 1500 simulated trajectories. Rollout observations suggest that policies follow real-derived behavior in demonstrated states and simulation-derived behavior elsewhere. We investigate these transitions through latent-space analysis and examine how both grounding axes affect task performance. We further show that both grounding axes remain consequential when co-training foundation models.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "real2sim2real; simulation grounding; dexterous manipulation", "https://openreview.net/pdf?id=PU8VtCeGAA", "", ""], ["https://openreview.net/forum?id=biEo1T1I2K", "GPWM: Generative Particle World Models for 3D Prediction and Planning", "Robert Ren, Matthew Bronars, He Zhu, Yikai Tang, Jianing Zhang, Sergey Zakharov, Pavel Tokmakov, Katerina Fragkiadaki", "We introduce GPWM a generative world model that learns 3D physical dynamics directly from particle trajectories. Its shared representation and architecture covers rigid, deformable, cloth, and granular materials, in both passive physics and robotic interaction. GPWM is an object-aware multi-resolution transformer that combines flow matching with diffusion forcing to enable streaming generation far beyond the training horizon. We train and evaluate GPWM on ParticleWorlds, a 25.5-million-frame corpus spanning diverse geometries, physical properties, interactions, and robot embodiments. When trained within individual domains, GPWM reduces prediction error by 29-53% relative to the strongest applicable prior learned-dynamics models. Going beyond the domain-specific setting of prior methods, a single Unified GPWM jointly models heterogeneous physical regimes within one set of weights. GPWM further generalizes to unseen geometries, physical properties, object counts, and rollout horizons. Beyond prediction, GPWM enables contact-rich planning. An object-space goal reward is backpropagated through the learned interaction dynamics to the latent noise, steering actuator motion and the contacts it establishes. Executed open-loop in simulation, the resulting plans outperform unguided generation and planning with prior learned dynamics models on pushing, picking, and granular manipulation.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; dynamics prediction; diffusion planning", "https://openreview.net/pdf?id=biEo1T1I2K", "", ""], ["https://openreview.net/forum?id=VFvsy2qVnP", "GRAIL: Generating Humanoid Loco-Manipulation from 3D Assets and Video Priors", "Tianyi Xie, Haotian Zhang, Jinhyung Park, Zi Wang, Bowen Wen, Jiefeng Li, Xueting Li, Qingwei Ben, Haoyang Weng, Yufei Ye, David Minor, Tingwu Wang, Chenfanfu Jiang, Sanja Fidler, Jan Kautz, Linxi Fan, Yuke Zhu, Zhengyi Luo, Umar Iqbal, Ye Yuan", "Scaling humanoid loco-manipulation requires robot-compatible demonstrations across diverse objects, whole-body motions, and scene geometries, but teleoperation and motion capture are difficult to scale because each collection depends on physical setups, instrumented actors, and robot operation. We present GRAIL, a digital generation pipeline that remains fully virtual until deployment: it composes 3D assets, simulator-ready scenes, and video foundation model (VFM) priors to synthesize interactions without physical scene rebuilds or robot teleoperation. GRAIL starts from fully specified 3D configurations with known object geometry, camera parameters, metric scale, environment depth, and a robot-proportioned character. This privileged setup conditions interaction-aware reconstruction of metric 4D human-object interaction (HOI) trajectories with reduced depth ambiguity and morphology mismatch. We retarget the recovered motions to a humanoid and train complementary task-general trackers: an object-aware latent adaptor for manipulation and a scene-aware tracker for terrain traversal. GRAIL produces over 20,000 sequences spanning pick-up, whole-body manipulation, sitting, and terrain traversal. Egocentric visual policies trained on this generated task data achieve 84% real-world object pick-up success and 90% stair-climbing success on a Unitree G1.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "humanoid loco-manipulation; robot demonstration generation; video foundation models; physics-based motion tracking; sim-to-real transfer", "https://openreview.net/pdf?id=VFvsy2qVnP", "", ""], ["https://openreview.net/forum?id=n4eAEcfgFE", "Grip, Trace, Write: Force-Aware Imitation and Reinforcement Learning for High-DoF Robotic Handwriting", "Rongqian Chen, Yiding Chen, Jijie Zhou, Tom Z. Jiahao", "Most robotic handwriting rigidly mounts the pen and reduces writing to trajectory tracking. A freely held pen instead couples grasp stability, tip motion, and contact force. We present Grip, Trace, Write, a force-aware simulation environment and learning framework for high-DoF handwriting. A two-branch actor separates pen retention from arm-wrist writing while preserving their closed-loop coupling. Training learns a grasp controller, initializes writing from inverse-kinematics demonstrations by behavior cloning, and improves writing through reinforcement learning with rewards on ink, force, time, and retention. Across diverse tasks, the policy improves completion, precision, force regulation, and efficiency over behavior cloning and inverse kinematics, and generalizes without fine-tuning to unseen English and Chinese content. These results establish force-aware handwriting as a testbed for dexterous tool use.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "reinforcement learning; imitation learning; contact-rich manipulation", "https://openreview.net/pdf?id=n4eAEcfgFE", "", ""], ["https://openreview.net/forum?id=ay8BLSIaIS", "Hallucination in World Models is Predictable and Preventable", "Nicklas Hansen, Xiaolong Wang", "Modern generative world models render increasingly realistic action-controllable futures, yet they frequently hallucinate: rollouts remain visually fluent while drifting from the ground-truth dynamics. We hypothesize that hallucination concentrates in low-coverage regions of the state-action space, where lightweight data-centric signals can both detect it and guide mitigation. To test this, we introduce MMBench2, a 427-hour, 210-task dataset for visual world modeling with ground-truth actions, rewards, and live simulators, and train a 350M-parameter world model on it. We identify three distinct hallucination modes: perceptual, action-marginalized, and scene-diverging -- each anchored to a different stage of the pipeline, and develop three signals that accurately predict where the model will fail. To close coverage gaps at training time, we develop a coverage-aware sampling technique; to close them online, our hallucination predictors serve as curiosity rewards for targeted data collection, yielding a data-efficient finetuning recipe that adapts the pretrained world model to entirely unseen environments with as few as 50 real environment trajectories. Overall, our findings reveal that hallucination in world models is inherently a data coverage issue, and that the same signals used to detect it can also be used for mitigation.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world model; continuous control; uncertainty; hallucination", "https://openreview.net/pdf?id=ay8BLSIaIS", "", ""], ["https://openreview.net/forum?id=hmGPhNTkQu", "How Long, Not How Close: Blending a Learned Temporal Embedding into Latent World Model Planning", "Lama Moukheiber, Haotian Xue, Yongxin Chen", "Latent world models plan by choosing actions whose predicted end state is closest to the goal. This works one plan from the goal but fails several plans away, because latent distance measures how closely a state resembles the goal, not how long it takes to reach it: two positions can look alike yet be separated by a wall or a long sequence of contacts. We hypothesise that the planning cost, not only the model’s predictions, contributes to this failure. We propose TEMPO, which leaves the world model untouched and blends a learned temporal embedding into the planner’s latent cost, so that plans are ranked by how long they take to reach the goal, not only by how visually close they are. The embedding is a small map of the frozen latent, learned without rewards or labels. On eleven simulated environments, from maze navigation to contact-rich pushing and 3D manipulation, a 0.13M-parameter map adding at most 0.3% to a plan’s arithmetic improves the LeWM and PLDM planners at every goal distance, raising LeWM from 36% to 99% on TwoRoom three plans out and PLDM from 76% to 90% on Push-T one plan out, and keeps helping when physical parameters change.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "latent world models; jepa; planning; robotic manipulation", "https://openreview.net/pdf?id=hmGPhNTkQu", "", ""], ["https://openreview.net/forum?id=qBAoakQhlG", "Hydra-0: Action Flow for Generalist World Modeling and Control", "Hongyu Li, Bowen Wen, Xinghao Zhu, Yixuan Wang, Yilun Du, Yunzhu Li, George Konidaris, Stan Birchfield, Soha Pouya, Chenran Li, Yan Chang", "A world model useful for manipulation must do more than generate plausible video: its inputs should correspond to executable actions, and its predictions should preserve outcomes relevant to control. We present Hydra-0, which represents robot actions as sparse image-plane motion trajectories called action flow. During deployment, action flow bridges physics simulation and the learned world model: a controller-and-physics rollout projects each command into kinematically feasible image-plane motion that conditions learned scene-consequence prediction. During training, the same representation is recovered from heterogeneous interaction videos without native robot actions. Across five held-out datasets, our best model reduces robot- and object-motion error by 90.4% and 60.2% relative to an action-conditioned baseline, while predicted and reference policy success rates correlate at r=0.96 on RoboLab. The same interface can be inverted in a proof of concept that maps desired object flow from a human demonstration to executable robot actions, suggesting that visual action abstractions can connect simulation, learned dynamics, evaluation, and control.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "hybrid simulation; world model", "https://openreview.net/pdf?id=qBAoakQhlG", "", ""], ["https://openreview.net/forum?id=UWhLunukQn", "JACK: Joint Axis Correction from Kinesthetic Feedback", "Arthur Jakobsson, Eugene Lee, Bardienus Pieter Duisterhof, Huang Huang, Jeff Tan, Romina Mir, Jonathan Francis, Jean Oh, Jeffrey Ichnowski", "A robot that opens a cabinet or repositions a desk lamp needs each joint’s type, axis direction and pivot point. We pose estimating these through interaction as system identification and train the estimator entirely in physics simulation, which samples joint physics, object placement and the error of the starting estimate per world and records the motion of every part exactly. The robot proposes the object’s joints from its first point cloud, pushes or pulls parts, tracks points on their surfaces, and fits screw motions to the tracked points. A learned belief weighs these fits against the proposal and holds each joint as a mixture of candidate axes, each with a calibrated angular and positional spread that narrows over successive actions. Because every training label comes from the simulator, the simulator’s physics and the quantities it exposes determine what the belief learns. We discuss considerations for anyone training such a model: training actions that leak the true joint, when action planning pays off, the range of starting errors, failed actions as evidence, and the simulator physics that make tracked motion meaningful. We close with open problems in moving the tracking pipeline to real cameras and a physical robot.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "articulated objects; system identification; interactive perception", "https://openreview.net/pdf?id=UWhLunukQn", "", ""], ["https://openreview.net/forum?id=dmCrseuxNh", "JEPA-x: Cross-Predictive Physics Grounding for Forecastable Latent Dynamics", "Kehan Wen, Ziming Li, Yiduo Qu, Siyuan Luo, Fan Shi", "Latent world models plan by predicting the outcomes of candidate actions in a learned representation space. In self-predictive models, however, the encoder and predictor are optimized jointly and can co-adapt to latent transitions that are easy to predict in the training distribution but weakly constrained by the physical evolution of the scene. We introduce the cross-predictive JEPA (JEPA-x), which grounds latent dynamics in privileged physical trajectories. JEPA-x treats visual observations and physical states as corresponding views of the same action-conditioned trajectory, advances both through a shared predictor, and matches each prediction to the future representations of both modalities. This encourages the action-conditioned predictor to learn a common transition rule across the two views. Privileged physical state is used only during training, leaving a visual-only model at deployment. Empirical results show that JEPA-x reduces the rollout drift of a newly fitted predictor from 0.361 to 0.104 and increases mean control success from 53.6% to 78.2% on a multi-task suite spanning six evaluation subfamilies. We additionally show that direct full-state regression improves position decodability without improving forecastability or control, indicating that the benefit comes from shaping latent dynamics rather than merely encoding physical variables.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "jepa; phyical grounding; world model", "https://openreview.net/pdf?id=dmCrseuxNh", "", ""], ["https://openreview.net/forum?id=lQn92Sva7n", "Latent Skill Acquisition and Composition for Contact-Rich Manipulation", "Wenlong Huang, Jiayuan Mao, Tomás Lozano-Pérez, Leslie Pack Kaelbling, Li Fei-Fei", "Human-level generalization in manipulation requires composing known behaviors to reach novel goals in scenarios never seen in training. The challenge sharpens in contact-rich settings, where behaviors must be recomposed at the granularity of contact rather than of a semantic subtask. Without relying on per-task demonstrations, a promising approach is to leverage test-time compute to perform physical reasoning that searches for novel solutions and improves them incrementally during deployment. To effectively perform search in the large space of motions, we propose SkillReasoner, which learns temporal abstractions of actions (i.e., skills) from unstructured offline interactions, and then reasons over and recomposes them at test time. Crucial to the formulation is a latent skill space learned with varying temporal horizons, so that composition can happen at varying granularity, as required by different stages of the task, while minimizing the number of decisions. To realize a novel goal at test time, the robot searches over latent skill sequences in its imagination, decodes a chosen skill into low-level actions, and replans in closed loop, up to 30 Hz. We demonstrate on a series of contact-rich real-world and simulated tasks that the robot chains behaviors to achieve novel goals that require far longer behaviors than those seen in training, and adapts zero-shot to unseen perturbations, changing dynamics, and constraints, all trained purely from unstructured play data without task-specific demonstrations.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "skill learning; robotic manipulation; manipulation planning", "https://openreview.net/pdf?id=lQn92Sva7n", "", ""], ["https://openreview.net/forum?id=82UCImH1eY", "Latent World Models Enhance Imitation Learning with Foresight", "Hengkai Pan, Gaoyue Zhou, Yann LeCun, Lerrel Pinto, Deepak Pathak", "Imitation policies acquire useful manipulation behaviors but can struggle in long-horizon and unfamiliar scenarios. ForesightIL augments behavior cloning with planning on demand through a latent world model and a self-supervised goal value. A shared visual representation allows repeated policy queries on imagined states, focusing multi-step search on plausible behaviors. VIP with temporal straightening ranks candidate outcomes, while a learned prediction-error signal determines when to invoke planning. Experiments across four simulated and four real-world manipulation tasks show improvements over the underlying imitation policy, including on long-horizon bimanual tasks. Uncertainty gating retains much of the benefit of planning at every decision while reducing planning frequency.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "imitation learning; world models; model-based planning; robotic manipulation", "https://openreview.net/pdf?id=82UCImH1eY", "", ""], ["https://openreview.net/forum?id=cf1iBgypTi", "Learned Differentiable Physics for Planning with and Designing Deformable-Manipulation Tools", "Nielsen Cugito, Kelsey R Allen", "Model-based planning requires dynamics models that are accurate across a wide range of scene configurations. Our technique uses a graph neural network (GNN) trained on RGB-D observations from a real robot using nine tools spanning three distinct interaction modes. We introduce a feature parameterization for the GNN which provides rotation and particle density invariance by construction, and show that this is crucial for enabling generalization to new tools and new manipulation trajectories. Trained on all nine tools, our model outperforms a state-of-the-art machine learning baseline, in both the “in-distribution” and “out-of-distribution” setting. Our model is also more accurate than a differentiable material point method fit to the same data, at an order of magnitude lower cost per planner query. Given a target dough shape, our model can design a tool to achieve this shape (conditioned on a manipulation trajectory), or come up with a manipulation trajectory for up to 4 grippers to match the target shape.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "deformable manipulation; learned dynamics; graph neural networks", "https://openreview.net/pdf?id=cf1iBgypTi", "", ""], ["https://openreview.net/forum?id=FUsD7vN1nb", "Learning Contact Residuals for In-Hand Manipulation Transfer", "Zhuoyang Chen, Jianshu Hu, Yutong Ban", "Dexterous in-hand manipulation relies on contact-rich dynamics that are difficult to simulate accurately. Existing work such as system identification of simulator parameters and dynamics randomization is constrained by the expressiveness of the simulator, while hand-focused learned dynamics can leave object contact effects implicit. We introduce an object-centric residual that learns contact-conditioned momentum corrections from target trajectories and applies them as impulses in a nominal simulator for policy fine-tuning. Preliminary sim-to-sim tests from MuJoCo/MJWarp to Genesis show improved transfer over fine-tuning without the residual on multiple objects, two tasks, and two hands.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "residual dynamics; sim2real; hybrid simulation; dexterous manipulation", "https://openreview.net/pdf?id=FUsD7vN1nb", "", ""], ["https://openreview.net/forum?id=VqcbxEBuKH", "Learning Force-Safe Diffusion Policies with a Differentiable Physics World Model", "Ryan Teoh, Sean Liu, Jason Jangho Choi", "NOTE: full content is hidden based on the author's request.\n\nAbstract: Diffusion policies learn strong manipulation behaviors from demonstrations, but demonstrations show a policy what to do, not what physically happens when it acts. In cooperative manipulation this gap matters: a policy can transport an object successfully while generating excessive internal forces that arise from the closed-loop interaction between multiple arms, the object, and the controller. We use a differentiable rigid-body model as an action-conditioned physics world model: from states the policy itself visits, it predicts the physical consequences of each candidate action chunk, including the internal force rates its own actions produce, which demonstrations never show. Penalizing predicted force-rate violations provides an on-policy fine-tuning signal that requires no force labels and no deployment-time safety filter. On a two-robot fragile-object transport task, this physical feedback raises force-safe episodes from 42.5% to 94.0% while preserving placement success (90.0% → 91.0%). The same world model supports decentralized policies without inter-robot communication: distillation into local-observation policies loses force safety (55.8%), and predicting the joint outcome of both robots’ independently sampled chunks restores it (93.7%).", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; differentiable physics; diffusion policies", "https://openreview.net/pdf?id=VqcbxEBuKH", "", ""], ["https://openreview.net/forum?id=CbbmDRbb0a", "Learning Tactile-Aware Hierarchical Whole-Body Control Policies for Quadrupedal Loco-Manipulation", "Pokuang Zhou, Le Mao, Xiyue Chen, Zhiyuan Zhang, Joseph Campbell, Yu She", "Touch provides direct information about contact state, force, slip, and interaction transitions, yet most mobile manipulation policies treat tactile signals only as passive observations rather than explicit control targets. We propose a hierarchical framework consisting of high-level and low-level policies, both conditioned on visual and tactile information. The high-level policy is responsible for planning and generating commands, while the low-level policy executes these commands through whole-body control. The high-level diffusion policy is trained from human demonstrations collected with a handheld visuotactile gripper, whereas the low-level policy is first trained through large-scale reinforcement learning in simulation and then post-trained with reward functions to jointly execute end-effector motion and tactile commands, enabling zero-shot transfer to the real robot. Our system demonstrates the capability to perform challenging long-horizon, complex, and contact-rich loco-manipulation tasks on a Unitree Go2 equipped with a D1 arm and a tactile gripper, including marker reorientation and insertion, valve tightening, delicate object manipulation, wrench-based bolt tightening, and cabinet-door opening. We further evaluate the generalization of the low-level policy across substantially different manipulator configurations, demonstrating the effectiveness and generalizability of our low-level architecture. Despite the nearly twofold difference in manipulator mass, the joint torques remain within approximately $-15$ to $27$ N$\\cdot$m during real-world deployment. We also compare our method against an advanced world action model approach. Across real-world trials, the full framework improves the average task success rate by 43.7\\% over the average performance of all other baselines, demonstrating that tactile information can serve as a planned and controlled action-level representation for robust contact-rich loco-manipulation.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "tactile sensing; whole-body control; imitation learning; world action model; visuotactile policy learning", "https://openreview.net/pdf?id=CbbmDRbb0a", "", ""], ["https://openreview.net/forum?id=ZL0jgrWi25", "LeWAM: A JEPA World Action Model with Diffusion-Steering-Based MPC", "Shashank Hegde, Alexander Popov, Elie Aljalbout, Nikolai Smolyanskiy", "World action models (WAMs) predict actions and future observations, typically from a reconstruction-based representation that carries noisy, redundant information which can complicate downstream predictions. We introduce LeWAM, a bidirectional transformer for forward, backward, inverse dynamics and policy prediction, on a decoder-free JEPA latent trained end-to-end through all four modes. We see the following benefits. 1) Alignment: linear probing better reads robot and object state over a regular Le World Model (a forward-only JEPA world model), while successfully ignoring distractors, which a regular WAM considerably reconstructs. 2) Acting: Closed-loop evaluations of LeWAM match or exceeds a regular policy (without a world model) on the same encoder and at matched size. 3) Planning: While sampling raw actions in planning with WAMs allows MPC to exploit dynamic model inaccuracies, we show that planning in the noise space of these WAMs improves their closed-loop performance.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world-action-models; mpc; jepa", "https://openreview.net/pdf?id=ZL0jgrWi25", "", ""], ["https://openreview.net/forum?id=5Yxc4gE3nt", "MixWorld: Sim-And-Real Co-Training for Robot World Models", "Lei Huang, Abhay Deshpande, Samuel M Bateman, Edison Zhu, Muhammad Zubair Irshad, Sergey Zakharov, Zhengbo Zou, Dhruv Shah", "Action-conditioned world models (ACWMs) require diverse interaction data to accurately predict robot actions, yet real-world datasets underrepresent off-nominal behaviors. We investigate whether large-scale simulation can complement real-world data for training robot world models. We introduce MixWorld, an ACWM jointly trained on 95k real and 550k simulated trajectories, where simulation expands coverage of off-nominal interaction dynamics and camera viewpoints while real data grounds predictions in the deployment domain. Our results suggest that sim-and-real co-training improves multiview consistency, object permanence, and robot-arm controllability in real-world video predictions, particularly during object-contact interactions and under randomized exocentric camera views. These improvements also translate to downstream applications. Compared to the base world model, MixWorld increases Spearman correlation in policy evaluation from 0.196 to 0.475 and improves the performance of a base policy via $\\textit{Best-of-N}$ inference-time search by 16.7-30.0 percentage points.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world model; robot manipulation; sim-and-real", "https://openreview.net/pdf?id=5Yxc4gE3nt", "", ""], ["https://openreview.net/forum?id=c3FEZjbVuq", "MS-MEM: Multi-Skill Manipulation-Enhanced Mapping via Uncertainty-Aware Belief-Space World Models", "Nils Dengler, Yitian Shi, Jesper Mücke, Sicong Pan, Rania Rayyes, Maren Bennewitz", "Accurate scene understanding in confined, cluttered spaces such as shelves is essential for service robots, yet it remains challenging due to severe occlusions, restricted accessibility, and the need to avoid excessive scene changes. In this paper, we propose Multi-Skill Manipulation-Enhanced Mapping (MS-MEM), an evidential framework for uncertainty-aware mapping that integrates active viewpoint selection, object pushing, and grasping. At its core, MS-MEM plans by rolling out learned world models that operate directly in belief space, predicting how the metric-semantic belief and its epistemic uncertainty evolve under each candidate action instead of predicting raw observations. Since these world models are trained entirely in physics simulation and share a single evidential belief, candidate perception and manipulation actions are evaluated within a unified action selection pipeline using a common information gain criterion.\nGrasping additionally relies on a novel full-evidential grasp estimator that models both grasp affordance and orientation uncertainty, while a collateral disturbance constraint (CDC) discourages excessive changes to confident regions of the scene belief. Experimental results show that, compared with single-skill and unconstrained baselines, MS-MEM achieves higher mapping accuracy while reducing scene disturbance by 55% in simulation and 28% in the real world.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "belief-space world models; active mapping; push-grasp synergy", "https://openreview.net/pdf?id=c3FEZjbVuq", "", ""], ["https://openreview.net/forum?id=g8EDN2DJzk", "NeRD2Real: Adapting Neural Robot Dynamics for Humanoid Control from Real-World Data", "Chang Yu, Iretiayo Akinola, Eric Heiden, Eliot Xing, Chenfanfu Jiang, Miles Macklin, Yashraj Narang, Jie Xu", "Accurate simulation is essential for transferring humanoid control policies to hardware, yet calibrating dynamics models from limited, noisy onboard data is challenging. We present NeRD2Real, a framework for learning Neural Robot Dynamics (NeRD) through extensive pretraining with analytical simulation data and adapting with limited real-world data. Simulation pretraining learns a dynamics-conditioned transition model and a trajectory-level missing-state estimator. Adaptation recovers unobserved states, identifies a real-world dynamics-latent, and fine-tunes the model on a mix of reconstructed real and simulation data. On Unitree G1, an adapted NeRD supports whole-body policy learning and enables sim-to-sim and sim-to-real transfer. A walking policy trained in the adapted NeRD without dynamics randomization transfers zero-shot to the real robot.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "neural simulation; humanoid control; real-to-sim-to-real; system identification", "https://openreview.net/pdf?id=g8EDN2DJzk", "", ""], ["https://openreview.net/forum?id=r0vW2eFo05", "OrbiSim: World Models as Differentiable Physics Engines for Embodied Intelligence", "Jiajian Li, Jingyuan Huang, Junru Gong, Qi Wang, Xiaokang Yang, Yunbo Wang", "We present OrbiSim, a robotic simulation paradigm that redefines world models as fully differentiable physics engines for embodied intelligence. Unlike world models focused on unconstrained imagination in latent or visual domains, OrbiSim establishes a physically grounded pathway connecting structured scene assets, neural dynamics, visual observations, and downstream policy learning. End-to-end differentiability throughout the simulation loop supports differentiable contact modeling, gradient-based policy optimization under sparse rewards, and physical-parameter inference. Experiments show improved predictive fidelity and control performance over the evaluated world-model baselines, while consistent responses to asset configurations and physical parameters make OrbiSim a differentiable tool for robot simulation and policy training.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; differentiable simulation; robotic manipulation", "https://openreview.net/pdf?id=r0vW2eFo05", "", ""], ["https://openreview.net/forum?id=ebmsvnGn5K", "PhysiCalWorld: In-Context Physics Calibration for World Models", "Yunhao Luo, Wentao He, Yinpei Dai, Hyelin Nam, Hongze Fu, Joyce Chai, Nima Fazeli, Jeong Joon Park", "Existing world models typically perceive a scene through current visual frame or a narrow history window. However, these observations may not reveal the physics properties that govern transition dynamics, such as an object’s mass distribution, joint damping, or surface friction. Without calibrating these physics factors for world models, predictions tend to regress toward an empirical prior and induce severe drift in novel test scenes. To this end, we propose PhysiCalWorld, which calibrates action-conditioned world models to the instance-specific dynamics via in-context prompting, without fine-tuning or analytical physics modeling. Our method encodes an exploratory interaction clip collected within the test scene into a compact physics descriptor token, which grounds subsequent predictions in the scene’s actual physical behavior. PhysiCalWorld is trained end-to-end with the latent prediction loss alone, without physics labels. At inference time, the descriptor token is extracted once and can be reused across rollouts with negligible compute overhead. We evaluate PhysiCalWorld across four environments covering diverse physics variations and show that it substantially improves rollout prediction accuracy and visual planning success rate. The learned descriptors also form a physically structured latent space and generalize beyond the physics ranges seen during training.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; robotics; in-context learning; planning", "https://openreview.net/pdf?id=ebmsvnGn5K", "", ""], ["https://openreview.net/forum?id=dmEcKsHkXs", "Recursive Successor Models", "Nitish Dashora, Richard Li, Dan Haramati, John Marangola, Chuning Zhu, Sunshine Jiang, Abhishek Gupta, Pulkit Agrawal, Zhang-Wei Hong", "Planning with world models enables improvement beyond the dataset, but compounding prediction errors hinder long-horizon planning. To prevent one-step compounding error, we instead model longer-term future state distributions, known as successor measures. We introduce Recursive Successor Models, which combine (1) a stable supervised training objective that avoids bootstrapping with (2) a recursive sampling procedure for planning that composes short-horizon distributions into long-horizon distributions. We demonstrate the capabilities of RSM in simulated benchmarks and real-world robot experiments by showcasing improvements in policy performance, planning latency, and training convergence speed across long-horizon and visual tasks.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "planning; reinforcement learning", "https://openreview.net/pdf?id=dmEcKsHkXs", "", ""], ["https://openreview.net/forum?id=W0UyFSPVMU", "RoboSimStudio: An Interactive Toolkit for Rapid Real2Sim of Robot Manipulation Tasks", "Kaiyuan Chen, Shuangyu Xie, Uksang Yoo, Xinyue Zhu, Alvin Zhu, Daehwa Kim, Eric Heiden, Erwin Coumans, Miles Macklin, Spencer Huang, Ken Goldberg", "It has been difficult to accurately model the physics of the interaction between a robot and the objects it manipulates, including contact mechanics, coupled contact dynamics, deformation, stiffness, and friction. We present RoboSimStudio (RSS), an interactive toolkit that makes choices of solver, contact model, and physical parameters explicit and editable, allowing both humans and coding agents to quickly create and iteratively refine simulations based on observed physical behavior. We implement RSS with the open Newton physics simulation system and describe experiments with human-guided Real2Sim using (1) visual feedback and (2) force feedback, and (3) agentic Real2Sim2Real. RSS will be open-sourced; code, videos, and additional information are available on the project website: https://robosimstudio.github.io.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "real2sim; multi-physics simulation; sim2real; coding agents; deformable object manipulation", "https://openreview.net/pdf?id=W0UyFSPVMU", "", ""], ["https://openreview.net/forum?id=JzHjX5ihIV", "Rolling-WAM: World Action Models with Rolling Imagination", "Yinghua Zhou, Junjie Ye, Yiqi Zhao, Hao Dong, Celina Shiyu Wang, Ruohai Ge, Tingyi Yang, Basile Van Hoorick, Gaurav S. Sukhatme, Vitor Campagnolo Guizilini, Yue Wang", "World Action Models (WAMs) couple action generation with future visual prediction, but iterative joint denoising incurs substantial latency in closed-loop control.\nWe present \\methodname, which distributes video--action denoising across successive replanning cycles.\nA sliding window maintains aligned video--action chunks at progressively higher noise levels toward the future, completing the imminent chunk while retaining partially denoised future predictions.\nReusing partially denoised predictions reduces the steps needed to prepare the next executable chunk, while new observations guide continued refinement.\nExperiments demonstrate competitive performance on LIBERO and the highest success rates on RoboTwin 2.0 and real-world humanoid manipulation, alongside a $4.5\\times$ steady-state replanning speedup over standard joint WAMs.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world action models; robot manipulation; imitation learning", "https://openreview.net/pdf?id=JzHjX5ihIV", "", ""], ["https://openreview.net/forum?id=yjSj65R40C", "SceneRig: An Agentic System for Simulation-Ready 3D Scene Reconstruction from Single Images", "Rundong Luo, Yunong Liu, Di Cao, Matthew Tancik, Shyamal Buch, Colton Stearns, Wenqi Xian", "Simulation supports robot policy evaluation, but constructing realistic scenes at scale remains difficult. Reconstructing simulation-ready scenes from single images requires accurate object recovery, placement, and physical grounding. Post-hoc settling can yield stable scenes that no longer match the observed workspace. We present SceneRig, an agentic system that reconstructs editable 3D scenes using visual, geometric, and physical tools. Agents recover objects and supports, construct the surrounding scene, and refine placement through simulated edit-and-validate loops. Across diverse tabletop images, SceneRig improves instance recovery, object-centric appearance, and 3D placement while maintaining physical stability. In calibrated RGB-D robotics experiments, its scenes predict real-robot policy outcomes more accurately than the baseline and more reliably replay recorded manipulations without trajectory adaptation. See our [project page](https://scenerig.github.io/).", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "real-to-sim; physics simulation; scene reconstruction; robot policy evaluation", "https://openreview.net/pdf?id=yjSj65R40C", "", ""], ["https://openreview.net/forum?id=wfmWFjHEhJ", "SD-MJX: Shape-Differentiable Rigid Contact Simulation for Real-to-Sim", "Fuquan Wang, Zofie Christian, Yifan Zhu", "Real-to-sim requires object geometry and physical parameters that reproduce observed behavior. However, image-based reconstructions can contain geometric interpenetrations that destabilize simulation. We present SD-MJX, which integrates SDF-based differentiable contact manifold generation into MJX, enabling efficient computation of geometry gradients through multi-step simulation. A local FP64 gradient check over a 100-step collision rollout yields a relative $L_2$ discrepancy of $2.46 \\times 10^{-4}$ against central finite differences. We evaluate geometry refinement on two static scenes reconstructed from real images. Over 5-second physical rollouts, the complete refinement pipeline reduces maximum object displacement from 19.778 to 0.783 mm and from 25.941 to 1.472 mm, respectively.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "differentiable simulation; real-to-sim; contact dynamics", "https://openreview.net/pdf?id=wfmWFjHEhJ", "", ""], ["https://openreview.net/forum?id=oeIWkYO2DW", "SimFoundry: Modular and Automated Scene Generation for Policy Learning and Evaluation", "Nadun Ranawaka, Josiah Wong, Wei-Lin Pai, Wei-Teng Chu, Tianyuan Dai, Masoud Moghani, Hang Yin, Yunfan Jiang, Wesley Durbano, Brandon Bryce Huynh, Yu Fang, Danfei Xu, Ruohan Zhang, Li Fei-Fei, Linxi Fan, Bowen Wen, Ajay Mandlekar, Yuke Zhu", "Training and evaluating robot policies in the real world is costly and difficult to scale.\nWe introduce SimFoundry, a modular and automated system for zero-shot real-to-sim scene construction from a video.\nSimFoundry generates sim-ready digital twins and supports object, scene, and task editing, enabling the automated generation of diverse digital cousins: affordance-preserving variations of reconstructed real-world scenes.\nPolicies trained on SimFoundry data transfer zero-shot to challenging real tasks involving multi-step manipulation, articulated object interaction, and bimanual interaction, and its digital cousins facilitate generalization to new real-world conditions.\nAcross 7 manipulation tasks and 5 policy architectures, SimFoundry simulation evaluations correlate well with real-world performance and strongly predict real-world policy rankings, with mean Pearson correlation 0.909 and mean maximum ranking violation 0.027. \nWhen evaluating sim-trained policies zero-shot in the real world, policies trained with object, scene, and task cousins in simulation show average task success rate improvements of 20\\%, 21\\%, and 40\\%, respectively. Additional details at https://simfoundry.github.io/.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "real-to-sim; sim-to-real; policy evaluation", "https://openreview.net/pdf?id=oeIWkYO2DW", "", ""], ["https://openreview.net/forum?id=PMQrKL7EbR", "SIMPACT: Simulation-Enabled Action Planning using Vision-Language Models", "Haowen Liu, Shaoxiong Yao, Haonan Chen, Jiawei Gao, Jiayuan Mao, Jia-Bin Huang, Yilun Du", "Vision-Language Models (VLMs) exhibit remarkable common-sense and semantic reasoning capabilities. However, they lack a grounded understanding of physical dynamics. This limitation arises from training VLMs on static internet-scale visual-language data that contain no causal interactions or action-conditioned changes. Consequently, it remains challenging to leverage VLMs for fine-grained robotic manipulation tasks that require physical understanding, reasoning, and corresponding action planning. To overcome this, we present $\\textbf{SIMPACT}$, a test-time, $\\textbf{SIM}$ulation-enabled $\\textbf{ACT}$ion $\\textbf{P}$lanning framework that equips VLMs with physical reasoning through simulation-in-the-loop world modeling, without requiring any additional training. From a single RGB-D observation, SIMPACT efficiently constructs physics simulations, enabling the VLM to propose informed actions, observe simulated rollouts, and iteratively refine its reasoning. By integrating language reasoning with physics prediction, our simulation-enabled VLM can understand contact dynamics and action outcomes in a physically grounded way. Our method demonstrates state-of-the-art performance on seven challenging, real-world rigid-body and deformable manipulation tasks that require fine-grained physical reasoning, outperforming existing general-purpose robotic manipulation models. Our results demonstrate that embedding physics understanding via efficient simulation into VLM reasoning at test time offers a promising path towards generalizable embodied intelligence.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "robotic manipulation; physics simulation; vision-language model", "https://openreview.net/pdf?id=PMQrKL7EbR", "", ""], ["https://openreview.net/forum?id=iCNagkpW3K", "Steel: Simulation for Generalist Robot Learning", "Dylan Turpin, Jared Mejia, Laki Iinbor, Octi Zhang, Vishal Mandadi, Eric Heiden, Miles Macklin, Deepak Pathak", "GPU-accelerated simulation at scale has enabled reinforcement learning to produce locomotion and whole-body control policies that transfer to physical robots: thousands of identical environments simulated in parallel under a simple on-policy recipe such as proximal policy optimization (PPO). Manipulation presents a different scaling problem: robots must learn across a large space of tasks and embodiments, interacting with different objects, layouts and mechanisms, so simulation must scale not only the number of environments but their diversity. We present Steel, a GPU rigid-body contact solver for the open-source Newton physics engine whose arrays are laid out per environment: each environment's constraint rows and response vectors occupy a range of fixed capacity, its mass-matrix factor a range sized to its degree-of-freedom group, and the factorization kernels run over groups of articulations of similar degree-of-freedom count, so robots, objects, contact sets and degrees of freedom may differ across the environments simulated in parallel and no robot is padded to the largest one present. Steel reaches 3.8x PhysX's throughput (geometric mean over 20 Isaac Lab tasks, faster on 19 of the 20) and about 1.3x MuJoCo Warp's (geometric mean over the same 20); with 5 to 20 scene types simulated in parallel, each solver at its own peak environment count, its throughput ratio to PhysX rises from 9.2 at 5 types to 13.0 at 20, while MuJoCo Warp, which requires one model for every environment it steps, has no result on mixed scene types.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "gpu physics simulation; contact solvers; heterogeneous environments", "https://openreview.net/pdf?id=iCNagkpW3K", "", ""], ["https://openreview.net/forum?id=ixIEAc2qdi", "When Does Planning with a World Model Need Search?", "Ahnaf Adib, Sabbir Ahmed, Ittehadul Karim, Latifur Khan", "Latent world models such as DINO-WM, JEPA-WM and LeWM plan by searching, with the cross-entropy method (CEM), for an action sequence whose predicted embedding reaches a goal image. The search takes most of the planning time. We compare CEM with predictive sampling, which scores the candidates of CEM's first iteration once and executes the lowest-cost sequence, on identical episodes across eight environments and three released world models, under one open-loop plan and under replanning. Manipulation and arm reaching need search. CEM leads on Push-T and OGBench-Cube in both settings and on Metaworld under replanning. Point navigation needs search only without feedback. With one open-loop plan CEM leads on Two-Room, Wall and Maze. With replanning and an any-step success test, predictive sampling matches CEM on Two-Room, comes within one episode on Wall, and trails by two or three on Maze. Executing candidates from the start state shows what the search contributes. CEM's last iteration holds better plans than its first in 30 to 32 of 32 episodes per environment. Scoring 9,000 candidates once matches CEM on Wall. On Push-T and Maze, CEM's iterations move the sampling distribution to plans that succeed. On zero-shot RoboCasa with a DROID-trained JEPA-WM, a ninth of the budget changes success by at most two of 143 episodes, and shortening the planning horizon from three steps to one raises success from 18 to 29.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "latent world models; model-based planning; cross-entropy method; action retrieval; robot manipulation; joint-embedding predictive architectures", "https://openreview.net/pdf?id=ixIEAc2qdi", "", ""], ["https://openreview.net/forum?id=NDKZldVkVW", "Wiggle and Go! System Identification for Zero-Shot Dynamic Rope Manipulation", "Arthur Jakobsson, Abhinav Mahajan, Karthik Pullalarevu, Krishna Suresh, Yunchao Yao, Yuemin Mao, Bardienus Pieter Duisterhof, Shahram Najam Syed, Jeffrey Ichnowski", "Many robotic tasks are unforgiving; a single mistake in a dynamic throw can lead to unacceptable delays or unrecoverable failure. We introduce Wiggle and Go!, a two-stage framework for zero-shot rope manipulation: a brief, safe wiggle action is observed to predict descriptive rope parameters, which instantiate a rope-specific simulator for goal-conditioned trajectory optimization. The identification module is trained entirely in simulation and is task-agnostic, supporting diverse manipulation policies without retraining. We achieve 3.55cm average error on real-world 3D target striking compared with 15.29cm for uninformed baselines, and over 50% success on multi-objective lobbing and draping tasks. Predicted parameters transfer to unseen motions with 0.95 average frequency correlation between simulated and real rope dynamics. A parameter ablation shows that identifying dynamics beyond rope length and lead mass is essential to accurate planning.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "system identification; physics-based modeling; deformable object manipulation; sim-to-real transfer", "https://openreview.net/pdf?id=NDKZldVkVW", "", ""], ["https://openreview.net/forum?id=d4ERsNN7PJ", "World Model MPC for Playing Crane Game", "Atsuya Ishizu, Makoto Kawano, KAZUKI OSAMURA, Ryo Moriyama, Junpei Yamaguchi, Hidetsugu Uchida, Narishige Abe", "Crane games can be viewed as robot manipulation tasks in which a robot indirectly controls a claw through an interface designed for human use and attempts to acquire a prize based on visual observations.\nIn this study, we formulate this task as a control problem based on predicting future states, and as a preliminary study, we explore robot control using a JEPA-based world model.\nWe collect visual observations and action sequences from a robot playing a physical crane game and use them to train a world model that predicts one-step-ahead states in a latent space conditioned on the actions.\nWe then use one-step model predictive control (MPC) to decide whether to continue or terminate the current lever action based on the predicted latent state.\nIn real-world experiments, the LeKiwi robot operated a crane game machine, achieving an average grasp success rate of 90.0\\% and a prize acquisition rate of 73.3\\% across two types of prizes requiring different claw stopping positions.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "jepa-based world models; machine-mediated manipulation", "https://openreview.net/pdf?id=d4ERsNN7PJ", "", ""], ["https://openreview.net/forum?id=y0qBMe2qH3", "2AM: Grounding Agent-Side Memory as Guidance for Steerable Action Models in Long-Horizon Manipulation", "Yutong Hu, FengJiao Chen, Xuezhi Cao, Renaud Detry", "Long-horizon robot manipulation requires memory, but not necessarily inside the action policy. To address such tasks, current agentic systems often combine VLAs with planners and geometric tools, sometimes using additional depth or calibrated geometry. These systems confound attribution: gains may come from richer observations or alternative motor tools, while failures may stem from either the policy or an under-specified language interface. We isolate this question through a deliberately constrained design: less tool breadth, but greater interface bandwidth. 2AM makes a multimodal Agent the sole holder of task memory and a single RGB-based, episodically stateless Action Model the sole executor of task-relevant motion. The Agent compiles interaction history into subtask language and optional 2D grasp, place, and move hints that bind its physical intention at different time scales. To teach this steerability to the VLA, we augment demonstrations with structured hint labels and train under condition dropout, spatial noise, and temporal jitter to tolerate imperfect Agent outputs. On LIBERO-Mem, without depth, online geometry, or planner-based object motion, 2AM reaches 76.3\\% average completion, a 61.5-point improvement over the strongest reported baseline of 14.8\\%, together with 63.0\\% relaxed and 11.8\\% strict success. These results show that task memory can remain Agent-side. They further show that Action Model capability depends not only on what the policy has learned, but on how precisely the Agent can steer it. Project page: agent-mem-action-model.github.io", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=y0qBMe2qH3", "", ""], ["https://openreview.net/forum?id=cRzAMT2Jll", "[PAPER]: A Few Words Go a Long Way: Language Guided Robot Policy Synthesis", "Daphne Chen, Archit Ritesh Jain, Eric Goossen, Emma Romig, Michael Murray, Nick Walker, Maya Cakmak", "While vision-language-action models have demonstrated impressive zero-shot manipulation capabilities, they remain fundamentally black box policies that are difficult to interpret, adapt, or correct when they inevitably fail. In this work, we propose ARCHITECT, a framework that treats robot policy acquisition as an interactive program synthesis task. ARCHITECT leverages the reasoning capabilities of LLM coding agents to synthesize modular robot programs that utilize a suite of perception and control tools. Unlike end-to-end models where distribution shift leads to unpredictable, cascading failures, our modular architecture allows users to isolate failures and localize feedback at the level of abstraction required. We introduce an iterative process where a human supervisor provides natural language corrections to steer the policy. These corrections are grounded in the policy code by program execution traces and distilled into a persistent skill library, a form of long-term in-context learning which enables the agent to accumulate a repertoire of reusable, interpretable behaviors. In a benchmark evaluation on a Franka Panda robot, ARCHITECT outperforms state-of-the-art VLA models and program synthesis baselines on complex, long-horizon tasks, including articulated object manipulation and cloth folding. Our results demonstrate that the synthesized skill library enables the system to transfer to novel tasks with decreasing human intervention, providing a steerable and data-efficient alternative to black-box robot learning. Website: https://robo-architect.github.io/", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=cRzAMT2Jll", "", ""], ["https://openreview.net/forum?id=AVqVpgtKYF", "Agentic Aerial Cinematography: From Dialogue Cues to Cinematic Trajectories", "Yifan Lin, Sophie Z. Liu, Ran Qi, George Z. Xue, Xinping Song, Chao QIn, Hugh H.-T. Liu", "Agents have demonstrated strong capabilities in digital environments, yet their reasoning abilities alone are insufficient to accomplish tasks in the physical world. We present Agentic Aerial Cinematography: From Dialogue Cues to Cinematic Trajectories (ACDC), an agentic framework that bridges this gap for autonomous aerial cinematography. ACDC provides an execution harness that grounds an agent’s interpretation of cinematic intent and visual judgment in scene geometry and flight constraints. Given a natural-language request and a 3D scene representation, the agent selects relevant viewpoints and guides their refinement through visual feedback, while optimization and motion planning translate these decisions into executable drone trajectories. Experiments across a variety of simulated indoor scenes and hardware-in-the-loop flight tests demonstrate how this framework connects open-ended user intent to prompt-aligned video tours and physical drone execution.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=AVqVpgtKYF", "", ""], ["https://openreview.net/forum?id=G9RmahESMC", "Agentic Real2Sim: Physics-based World Modeling with Vision-Language Agents", "Guanxiong Chen, Qianjun Xia, Jiawei Peng, Heng Zhang, Pengyu Jing, Bole Ma, Justin Qian, Yixian Cheng, Ziyi Jiao, Bingyang Zhou, Yiduo Qu, Luoxin Ye, Kaifeng Zhang, Kunyi Wang, Weijia Zeng, Yunuo Chen, Pengzhi Yang, Ziqiu Zeng, Siyuan Luo, Huamin Wang, Chao Liu, Alan Yuille, Fan Shi, Changxi Zheng, Yunzhu Li, Chenfanfu Jiang, Peter Yichen Chen", "Real-to-sim conversion for robotic interaction with objects remains labor-intensive because it requires more than visual reconstruction: a streamlined real2sim process must recover scene geometries and object states, infer physical parameters, and assemble actors, objects, cameras, poses, and trajectories into a runnable physical simulation. Today this process still depends on brittle workflow glue across visual perception tools and simulators: manual tuning of visual foundation models, mesh cleanup, coordinate frame alignments, etc. We introduce Agentic Real2Sim, a framework for generalized physical world modeling with vision-language agents that converts a real-world recording of object-robot interaction into a simulatable episodic twin, and connects the resulting twin to downstream policy fine-tuning and evaluation. We evaluate Agentic Real2Sim on rigid-object manipulation, deformable-object interaction, and humanoid motion scenes, spanning domains that are usually handled by separate Real2Sim pipelines. The framework's agentic decisions can be driven by an open-weight VLM backend at a small fraction of the cost of frontier models, while attaining a comparable conversion success rate. The framework further supports custom scene conversion, fine-tuning of a pretrained policy with data generated from converted episodes, and works effectively as a surrogate for real-world policy evaluation. The project site, including code is available at https://agentic-real2sim.github.io.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=G9RmahESMC", "", ""], ["https://openreview.net/forum?id=RgpYrdqaFM", "Agentic World Action Model", "Zhuoyang Liu, Dantong Niu, Botong Zhang, Boning Shao, Jing Wang, Ruijie Zheng, Yuvan Sharma, Runyu Lu, Jiaming Liu, Renrui Zhang, Roei Herzig, Yutong Bai, Ken Goldberg, Danfei Xu, Yuke Zhu, Guanzhi Wang, Linxi Fan, Trevor Darrell", "Recent world action models provide visual foresight and future prediction for robot manipulation, but lack explicit mechanisms for compositional skill reuse. Agentic robotics combines code-based planning and reasoning with reusable skills, but often lacks predictive grounding in physical dynamics. We introduce AW-0, an agentic world action model framework that integrates code-based planning with joint video and action prediction. We jointly model code, future video, and robot actions as three coupled generative streams within a unified mixture-of-transformers architecture. Within this architecture a code expert generates parameterized skill routines and control logic while video and action experts generate future visual states and low-level motor commands. Code serves two complementary roles: it structures multi-step prediction and control within the world model and represents skills as reusable programs for subsequent agentic execution. We further introduce an automated curation pipeline that labels robot and human video trajectories with aligned programs and consolidates recurring routines into reusable skill libraries. Evaluations on RoboTwin 2.0 and physical bimanual manipulation tasks show improved task performance over VLA and WAM baselines, alongside gains in language following, semantic reasoning and robustness, demonstrating that agentic code enables connection between planning, prediction and execution within WAMs.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=RgpYrdqaFM", "", ""], ["https://openreview.net/forum?id=LDd7VM2doA", "ASPIRE: Agentic /Skills Discovery for Robotics", "Runyu Lu, Yubo Wu, Ethan Kou, Haotian Lin, Letian Fu, Wenli Xiao, Ajay Mandlekar, Yinzhen Xu, Guanya Shi, Ken Goldberg, Ang Chen, Mosharaf Chowdhury, Jan Kautz, Yuke Zhu, Linxi Fan, Guanzhi Wang", "Traditional robot programming is notoriously challenging: it requires orchestrating multimodal perception, managing complex physical contact dynamics, and handling diverse environment configurations and execution failures. We introduce ASPIRE (Agentic Skill Programming through Iterative Robot Exploration), a continual learning system in which a coding agent writes and refines robot control programs and compounds validated fixes into a reusable skill library. ASPIRE combines (1)
