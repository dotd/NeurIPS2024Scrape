selectors. On LIBERO, it improves the frozen DreamZero base on all four suites and raises mean success from 75.1% to 78.3%, yielding the best aggregate result. These results show that pre-execution selection among native world action rollouts can improve closed-loop control without updating the underlying WAM", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world-action models; test-time scaling; world model evaluation; action gap; physical ai", "https://openreview.net/pdf?id=0jBljtvW7F", "", ""], ["https://openreview.net/forum?id=HgkYEexgxA", "SmolWAM: A Latent World-Action Model for Robotic Manipulation on Edge Devices", "Timi Owolabi, Hikmah Olawore, Frances Adelakun, Ayotomiwa Oyewumi", "World-action models (WAMs) jointly predict robot actions and future observations, but their video diffusion backbones are costly for edge deployment. We introduce SmolWAM, a compact latent WAM derived from the 2B-parameter Cosmos Policy using single-frame encoding, cached text features with preserved attention sinks, depth pruning, and token compaction. With 12 of 28 transformer blocks and 1,008 tokens, SmolWAM predicts actions and future latents in one rectified-flow step. After 3.6 A100 GPU-hours of training, it achieves 95.5% success over 400 LIBERO episodes at 57ms, 2.3TFLOP, and 2.4GiB per 16-action chunk on an A100: 11$\\times$ lower latency and 3.2$\\times$ lower memory than the five-step teacher. Its world head predicts scene motion; joint training improves success by 6.2 percentage points over an action-only ablation.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world-action models; efficient robot learning; knowledge distillation", "https://openreview.net/pdf?id=HgkYEexgxA", "", ""], ["https://openreview.net/forum?id=agrOsamO7R", "SUAVE: Unified Video-Action Models via Masked Diffusion", "Rhythm Syed, Jean Mercat, Sedrick Keh, Kushal Arora, Paarth Shah, Aykut Onol, Mengchao Zhang, Tony Dear", "Vision-language-action models (VLAs) inherit strong semantic grounding from pretrained vision-language backbones but are typically optimized for predicting actions rather than future observations. They can see and act, but they do not imagine the future before acting. World action models (WAMs) built on video diffusion backbones can imagine but treat language as frozen conditioning on a continuous latent space. Unified models bring these modalities into one architecture, but they either decode autoregressively, one token at a time, or keep video continuous with an auxiliary action head. In this work, we present SUAVE, a Single vocabulary Unified Action-Video modEl in which a masked diffusion transformer generates video and actions conditioned on language, with all three modalities represented as discrete tokens in a shared sequence. Choosing which tokens to mask at inference turns the same network into a world model, a robot policy, or a video-action model. For action-free co-training, the action positions of unlabeled video are filled with mask tokens and excluded from the loss. Simulation and real-world experiments demonstrate two findings. First, a single SUAVE model predicts long-horizon video and acts as a policy, competitive with dedicated world models and specialized action policies on static and dynamic manipulation tasks. On a real robot, our model generates subgoal images and an action chunk spanning one second of motion in 1,030 ms on an RTX 5090 GPU, sustaining closed-loop control at 2.5 actions per second. Second, pretraining on robot video and co-training on human video substantially improves policy performance and zero-shot robustness to distribution shift. Together, these results show that masked diffusion is a practical and versatile foundation for unified video-action modeling.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "masked diffusion; unified video-action model; world models; robot pretraining; imitation learning; robot manipulation", "https://openreview.net/pdf?id=agrOsamO7R", "", ""], ["https://openreview.net/forum?id=m2T48NFQL0", "Task-Relevant Fidelity in Robotic World Models", "Haibo Zhao, Jesse Zhang, Dieter Fox", "World models increasingly support robotic planning and policy learning, yet reconstruction quality cannot directly compare their effectiveness across video-generative and latent models. We propose an evaluation pipeline using pose estimators and probing networks trained with privileged simulator labels to measure pose and success/failure prediction on paired successful and failed trajectories. Across long-horizon trajectories and local interactions, we find that accurate robot tracking does not ensure accurate object interaction, observed information can be lost during latent rollouts, stronger video generation backbones better preserve interaction outcomes, and predictions can disagree across viewpoints. Agentic simulation generation with GPT-6 Astra provides a strong baseline but remains sensitive to initialization and task type. Motivated by these gaps, a multimodal, view-consistency training scheme improves all four reported metrics on held-out states in both latent and video-generative world models.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "action conditioned world model; video generative model; latent world model; agentic world model", "https://openreview.net/pdf?id=m2T48NFQL0", "", ""], ["https://openreview.net/forum?id=yf9SpLTeP2", "The Bitter Lesson Comes to Robotics", "Christopher Leet", "General purpose multimodal language models (LMs) are increasingly capable of directly controlling robotic arms (e.g., by commanding end effector poses) to manipulate their environment. Tracking the development of these capabilities is important for understanding their potential benefits, such as improving industrial automation, and risks, such as enabling malicious users to produce dangerous chemical or biological agents. To this end, we investigate the ability of frontier multimodal LMs to directly control physical robotic arms. We evaluate seven models at multiple reasoning-effort settings on six manipulation tasks taken from the RoboDojo benchmark. To our knowledge, this is the first systematic evaluation of LM manipulation capabilities across multiple models and tasks conducted on physical hardware. We find that current frontier models can directly control real robotic arms to perform a variety of manipulation tasks but are not yet precise or efficient enough to complete them within a practical action budget. However, these capabilities are improving rapidly: performance increases our benchmark between July and September 2026 (inclusive) correspond to a performance doubling time of 44.5 days, while the best recorded execution rate increased by 4.4x and the lowest recorded execution cost fell by a factor of 6.2. These trends raise the possibility that the Bitter Lesson is coming to robotics; the capabilities of embodied general purpose LMs may one day be comparable to those of more specialized models.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "physical language model benchmarking; embodied ai; robotic manipulation", "https://openreview.net/pdf?id=yf9SpLTeP2", "", ""], ["https://openreview.net/forum?id=xYaFSMUYyJ", "The Gaussian Is Enough: Flow-Matching Priors Do Not Help When Fine-Tuning Large Behavior Models", "Chen Xu, Rishi Shah, Hadas Kress-Gazit, Haruki Nishimura, Masha Itkina", "Modern robot imitation learning increasingly relies on generative policies based on diffusion or flow-matching models, which generate actions by transforming samples from a prior distribution. Replacing the standard Gaussian with a closer-to-target, non-Gaussian prior has been shown to substantially improve performance when $\\textit{training from scratch}$. A natural next step is to ask whether these gains transfer to $\\textit{fine-tuning}$ pretrained Large Behavior Models (LBMs) such as LBM 1.0, $\\pi_{0.5}$, and GR00T~N1.5, where one might expect even larger gains. Surprisingly, we find that this is not the case, except possibly at very low fine-tuning data fractions. Across over 100K simulation rollouts spanning all three aforementioned LBMs on 40+ tasks in two simulation platforms, and 1250 hardware rollouts on five bimanual manipulation tasks, non-Gaussian priors that are demonstrably closer to the target yield statistically indistinguishable or worse fine-tuning performance than a standard Gaussian prior. Diagnostic analyses suggest why: fine-tuned imitation learning policies converge to similar action predictions across priors, despite their fine-tuned $\\textit{encoder embeddings}$ diverging substantially from the pretrained embeddings and each other. A learning-rate ablation further shows that undertraining the observation encoder degrades performance more than any choice of prior we observed.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "large behavior models; flow-matching policies; policy fine-tuning; flow-matching priors", "https://openreview.net/pdf?id=xYaFSMUYyJ", "", ""], ["https://openreview.net/forum?id=7oLmQS6Na5", "The Human--VLA Communication Gap: What Humans Leave Implicit and What Policies Cannot Recover", "Yiqing Xu", "A robot may know how to perform a task yet fail when a human asks for it naturally. We study this human--VLA communication gap by separating an \\emph{information gap}, where task semantics, grounding, or event structure remain unresolved, from a residual \\emph{execution gap}, where even a fully specified task depends on how it is organized and invoked. To do this, we characterize how people naturally express demonstrated objectives and evaluate controlled variants of the same physical tasks, with detailed analysis on $\\pi_{0.5}$ and consistent trends on $\\pi_0$-FAST and Cosmos3-Edge. Our study reveals that humans increasingly compress instructions as tasks grow, relying more on contextual grounding and implicit execution structure. Current policies are misaligned with this behavior: they tolerate grounding dependence relatively well, but struggle when task semantics or event structure must be reconstructed. Even after the information gap is resolved, execution remains sensitive to command granularity and invocation state. These findings identify concrete targets for human-centered policy learning and interfaces that better bridge natural human objectives to robot behavior.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "human robot communication; action gap evaluation.", "https://openreview.net/pdf?id=7oLmQS6Na5", "", ""], ["https://openreview.net/forum?id=QjuCLD4l8q", "The Layer Mystery of VLA: An Information-Theoretical Analysis of VLA Latent Interface", "Yuxiang Liu, Lizhi Yang, Fengze Xie, Aaron Ames, Yisong Yue", "Vision-language-action (VLA) policies connect a pretrained vision-language backbone to an action head through a latent interface, but which backbone layers this interface should expose remains unclear. We study single-layer selection and multi-layer fusion for frozen backbones across three pretrained models and two manipulation benchmarks, LIBERO and CALVIN, with three policy-training seeds per configuration. Across three fusion mechanisms and three layer-subset strategies, 47 of 54 configurations underperform the best observed single-layer policy. Our stastical analysis further confirms that fusion's advantage is very limited. However, the best layer varies substantially across backbones and benchmarks, making layer selection consequential and exhaustive policy sweeps expensive. We further derive a reweighting equivalence between the proposed information-bottleneck objectives for action-conditioned InfoNCE and action prediction, motivating InfoNCE as a proxy for layer quality. Empirically, InfoNCE provides the most consistent positive association with policy success among four evaluated proxies. Selecting the layer with the highest InfoNCE score requires 9–33 times less GPU compute than exhaustive policy sweeps and reduces mean selection regret from 17.89 percentage points for deepest-layer selection to 3.71 points across six settings. Its mean regret is close to the 3.28–3.50 points achieved by fixed-layer heuristics optimized retrospectively using all six oracle sweeps, without requiring closed-loop evaluations during selection.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "action-vision-language model; interpretation; layer selection", "https://openreview.net/pdf?id=QjuCLD4l8q", "", ""], ["https://openreview.net/forum?id=RsOz1FOVWH", "Track, Articulate, Act: Generating Articulation from Casual Human Videos", "Jiaming Zhang, Homanga Bharadhwaj", "Human videos contain rich causal evidence for robot manipulation: they reveal how hand motion induces object motion and produces task-relevant changes in object state. In this work, we study articulated objects such as doors, drawers, cabinets, laptops, ovens, and hinged containers that are ubiquitous in daily life and present unique challenges for embodied interaction. These objects cannot be represented by a single pose; their motion depends on the underlying parts and joints. We introduce a real-to-sim framework that reconstructs a simulation-ready articulated object and hand--object interaction from a casual monocular RGB video, without RGB-D or multi-view input, prior scans, manually specified joints, or robot demonstrations. Our key insight is that dense 3D point tracks provide an embodiment-agnostic articulation cue: points on the fixed link remain approximately stationary, while points on the moving link follow coherent revolute or prismatic motion. Our method segments the links, estimates the joint and its state trajectory, reconstructs an articulated asset, and aligns the recovered 3D hand motion with the object. Central to our approach is a modular recipe that repurposes powerful pretrained models for single-image 3D reconstruction, mesh segmentation, and 3D scene flow, connecting their predictions through explicit geometric reasoning to infer articulation. We use the reconstructed articulated object and the human hand trajectory to replay interactions through contact in MuJoCo. The framework shows how pretrained vision models and explicit motion reasoning can turn casual human videos into articulated object models suitable for downstream embodied interactions. We host the code on an anonymous repo https://anonymous.4open.science/r/track-articulate-act-10BB.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "articulation; motion retargeting; joint estimation", "https://openreview.net/pdf?id=RsOz1FOVWH", "", ""], ["https://openreview.net/forum?id=VVWcT5VcYi", "TrAct: Bridging Robot Control and Visual Prediction with Visual Tracks", "Zhi Cao, Howard Ji, Kevin Zhang, Kuangzhi Ge, Li Fei-Fei, Jiajun Wu, Huang Huang", "Robot actions are inherently embodiment-specific and only weakly aligned with image-space visual changes, limiting their effectiveness as conditioning signals for robot world models. In contrast, visual tracks provide an embodiment-agnostic representation of how task-relevant points move through a scene, offering dense image-space guidance for accurate and spatially precise future video prediction. Building on this observation, we propose TrAct, a world-model-based robot decision-making framework that uses visual tracks as an intermediate interface between control and prediction. TrAct consists of three components: a Vision-Language-Action-and-Track model (VLAT) that jointly predicts candidate actions and corresponding visual tracks from the current observation and language instruction; a track-conditioned world model (TWM) that predicts future visual outcomes conditioned on the proposed tracks; and a vision-language reward model (VLAC) that scores the predicted outcomes. At inference time, VLAT generates candidate action–track pairs, TWM rolls out their visual consequences conditioned on the tracks, and VLAC selects the track whose predicted outcome best satisfies the instruction; the action paired with the selected track is then executed by the robot. Experiments on the proposed LIBERO-INTEGRAL benchmark and real-world Franka manipulation show that TrAct improves success from 27% to 55% in simulation and 49% to 76% on real-world tasks compared to the strong VLA baseline $\\pi_{0.5}$. Furthermore, TWM consistently improves video prediction quality over an action-conditioned world model (AWM). These results suggest that visual tracks provide an effective shared interface between robot control and visual prediction, enabling more accurate world modeling and stronger robot generalization.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot foundation models and general-purpose knowledge systems; video models and latent world models for robot learning", "https://openreview.net/pdf?id=VVWcT5VcYi", "", ""], ["https://openreview.net/forum?id=eKaoHK2E1q", "Transductive Generative Modeling: Learning Robot Policies that can Extend to Unseen Conditions", "Yating Lin, Necmiye Ozay, Yixin Wang", "Conditional generative modeling enables learning multimodal robotic behaviors from demonstrations, while robust generalization to unseen conditions outside the training distribution remains a challenge. In this work, we propose Transductive Generative Modeling (TGM), an algorithm that leverages a transductive reparameterization of conditional generative models for Out-of-Support (OOS) generalization. This reparameterization allows some OOS conditions, which we call delta-representable, to be represented by an in-support anchor and an in-support displacement. TGM combines the anchor and displacement through bilinear transduction, which can be interpreted as a learnable Taylor expansion around the anchor. This interpretation motivates extending transductive prediction to conditional generative models and reveals the structural assumptions. We instantiate TGM across multiple robotics tasks, including navigation and manipulation, and evaluate its performance on different unseen conditions. Across all tasks, TGM outperforms existing methods and demonstrates more robust generalization under unseen conditions.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "out-of-support generalization; imitation learning; conditional generative modeling", "https://openreview.net/pdf?id=eKaoHK2E1q", "", ""], ["https://openreview.net/forum?id=CPNmfa0qJf", "UniWALM: Unified World Action Language Model for Embodied Robot Control", "Rahul Sajnani, Diego Romeres, Mingyuan Zhang, Kai Gao, Carl Qi, Baichuan Huang, Srinath Sridhar, Dylan Randle, Lillian J. Ratliff, Jose Barreiros, Manikantan Nambi, Jeroen Vanbaar", "Motivated by the human ability to integrate experience across language, perception, and action, we introduce UniWALM, a unified world-action-language model that learns video, action, and language in a single shared representation, where each modality serves as both a conditioning signal and a supervision target. Prior world-action models (FastWAM, DreamZero) have already shown that co-denoising video with action in one backbone improves manipulation; language, however, is still consumed only as fixed conditioning, and other systems that do use language either stack a pretrained VLM on top of a video model or run reasoning as a separate autoregressive stage. UniWALM is instead a unified any-to-any model that generates video, action, and language synchronously via per-modality diffusion heads; the generated string (subtask || textual memory) is re-consumed as the next-step prompt, closing a language-as-memory loop with no external planner, VLM, or retrieval buffer. We study two questions: (i) does jointly generating language — on top of video-action co-denoising — improve manipulation further? (ii) does this additional language modality let a world-action model plan, remember, and act, enabling memory-dependent control tasks such as RMBench M(n)? On MolmoSpaces, UniWALM beats same-backbone FastWAM by +13.4% on compositional Pick&Place, isolating the gain from adding language on top of video-action co-denoising. On RMBench's memory-dependent M(n) subset — tasks that same-backbone FastWAM solves at only 13.3% — UniWALM reaches 34.5% without any pretrained language or reasoning model, +21.2 points over FastWAM and above Mem-0's keyframe-equipped setup (28.5%) using only a single anchor frame instead of per-task privileged keyframes. On a real-world Find-the-Item task, textual memory lifts success from 11.1% (FastWAM, no language) to 61.1%, while VLA and WAM baselines stay at or below chance (≤33.3%).", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world-action-language model; unified multimodal diffusion; memory-dependent manipulation; dexterous manipulation", "https://openreview.net/pdf?id=CPNmfa0qJf", "", ""], ["https://openreview.net/forum?id=AjLDgn6taB", "Usable but Unused: Diagnosing History-Dependent Prediction in a Latent World Model", "Wentao Shi", "When a world model fails to predict an outcome that depends on the past, it can appear to have forgotten. We show that a distinction made in the model's own earlier predictions can remain usable even when the model fails to carry it forward. We diagnose this gap by holding the complete latent window and corresponding actions fixed and replacing only the predictor. Using LeWorldModel with frozen perception in a visual TwoRoom variant, we compare histories with identical current images but different outcomes under the same action plan. A predictor deliberately supervised through step 2 but not step 3 distinguishes the outcomes at step 2, yet performs near chance at step 3. On this unchanged input, a reference predictor trained with autoregressive supervision through step 3 raises future-discrimination accuracy from 49.2\\% to 93.5\\%. Even after step 3 receives supervision from encoded ground-truth windows, predictor replacement further strengthens the target-aligned distinction and reduces prediction error on the unchanged input in every seed. These comparisons reveal a gap between the historical distinctions carried by generated inputs and those expressed in the next prediction.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "latent world models; history-dependent prediction; partial observability; autoregressive prediction", "https://openreview.net/pdf?id=AjLDgn6taB", "", ""], ["https://openreview.net/forum?id=smsDWzIc0Q", "WB-WAM: Heterogeneous Body–Hand Pre-training for Humanoid Loco-Manipulation", "Chuan Qin, Shaoting Zhu, SiYuan Luo, Siqiao Huang, Hongyu Zhao, Kasun Shanaka Kristombu Baduge, Hang Zhao", "Humanoid loco-manipulation demands coordinated body and hand behavior, while conventional robot pre-training data provide limited coverage of such whole-body motion. We present WB-WAM, a World Action Model that incorporates explicit whole-body action supervision into generative video pre-training. A shared physical action space integrates body, root, and dexterous hand annotations from heterogeneous sources, enabling joint video and action learning from 1880.2 hours of partially annotated video and motion data. The resulting priors are refined through PICO mid-training and adapted to robot tasks with auxiliary forward kinematics supervision. We construct WB-Datasets to support these stages with retargeted egocentric human demonstrations and robot trajectories, allowing task-aligned human motion to supplement limited robot data. Evaluations in simulation demonstrate strong whole-body task performance with 81.9\\% in HumanoidArena, while real-world experiments further validate WB-WAM with 84.0\\% mean success across five tasks. Moreover, task-aligned PICO mid-training improves downstream task performance while reducing the need for real-robot demonstrations. These results support heterogeneous whole-body pre-training and human motion transfer as a practical route to data-efficient humanoid loco-manipulation.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world action models; humanoid loco-manipulation; heterogeneous pre-training", "https://openreview.net/pdf?id=smsDWzIc0Q", "", ""], ["https://openreview.net/forum?id=sDIO0QYNtV", "Wearable-Free Human Real-to-Sim Supplies Action Supervision for Interactive Robots", "Sookwan Han, Haeun Ji, Junsu Kim, Sihun Lim", "Generative models learn rich knowledge from video, images and 3D data, but such data rarely records the actions behind it, and robot data that does record actions is conventionally collected by teleoperating robots or by recording people with head-worn cameras and handheld grippers, all of which ask the person demonstrating to wear or operate a device. These devices bias how people move, interrupt long-horizon capture for charging and offloading, and add operational cost with every person and session, since each must be fitted and synchronized and records only its user. We present a wearable-free approach where cameras record people moving naturally for long sessions with nothing worn and turn each recording into a comprehensive human real-to-sim of the people, including the objects they handle and their interactions in a digital twin of the room. Rendering each person's view from a consistent 3D avatar in this twin creates egocentric demonstrations for everyone present, each paired with the body motion that produced it, which supplies actions such as where a person picked up and put down an object. At an equal amount of data, policies trained on these demonstrations come close to those trained on a real head-worn camera in selected tasks and improve as the data scales, also for robot cameras that no one wore. Because one recording captures everyone present, the same data teaches a robot to respond to people, and scaling it unlocks interactive abilities such as helping someone who dropped something.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "action supervision from human data; egocentric demonstrations; human real2sim; human-robot interaction; wearable-free egocentric data; cross-embodiment transfer", "https://openreview.net/pdf?id=sDIO0QYNtV", "", ""], ["https://openreview.net/forum?id=AGpT1GNvlk", "WholeBodyWAM: Learning Whole-Body World Action Models with Scalable Motion Priors", "Bowei Zhang, Qiyao Zhang, Shuanghao Bai, Xinhua Wang, Meng Li, Yilei Wang, Leiwang Zhang, Jian Tang, Lu Zhou, Lei Sun, Zhengping Che", "Humanoid whole-body manipulation requires coordinated whole-body dynamics, yet large-scale trajectories from a target robot are expensive to collect and difficult to scale. In contrast, whole-body motion from human and humanoid sources is abundantly available, although such data cannot be directly used as embodiment-specific robot actions. This work asks whether these scalable motion resources can instead provide a transferable predictive prior for humanoid world-action modeling. We introduce WholeBodyWAM, a humanoid world-action model that learns whole-body dynamics from large-scale heterogeneous motion before target-robot training. We curate UniMotion-4K, a motion corpus spanning more than 4K hours from human videos, native 3D motion datasets, and heterogeneous humanoid platforms, and canonicalize these diverse sources into a unified motion space. A language-conditioned Motion Expert is then pretrained to predict future whole-body motion without target-robot action supervision. During robot post-training, the pretrained Motion Expert is integrated with Video and Action Experts through asymmetric Mixture-of-Transformers (MoT) attention, enabling predictive scene dynamics and whole-body motion to jointly inform embodiment-specific action generation. Experiments show that WholeBodyWAM consistently benefits from increased motion-pretraining scale, improves future-motion prediction and downstream task performance, and transfers effectively to real-world humanoid manipulation. Moreover, the pretrained motion prior substantially improves data efficiency under limited target-robot demonstrations.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "humanoid robot learning; world action models; motion pretraining; cross-embodiment transfer; whole-body manipulation", "https://openreview.net/pdf?id=AGpT1GNvlk", "", ""], ["https://openreview.net/forum?id=EXZDc0OHYF", "World Action Planner: Generalizable Robot Decision-Making with Action-Conditioned World Models", "XiangCheng Zhang, Runhan Huang, Yilun Du", "Building generalizable robot agents for diverse applications remains a fundamental challenge. While imitation learning-based policies can perform well in familiar training environments, they often struggle to generalize to novel scenes, layouts, and task compositions. To this end, we present **World Action Planner**, an agentic robot planning system that proposes and refines executable action plans through imagination with an action-conditioned world model. We perform a principled coarse-to-fine search over robot actions in two stages: (i) global action optimization, where the agent reasons over imagined world-model rollouts to identify potential failures and refine the proposed action plan, and (ii) local action search, where the agent compares the imagined future outcomes of neighboring action candidates and selects the best action for execution. Across compositional long-horizon tasks, novel object layouts, and zero-shot real-robot planning without expert demonstrations, World Action Planner consistently outperforms state-of-the-art end-to-end policy models, including VLAs and WAMs, demonstrating the effectiveness of world-model-based action search for generalizable robot decision making.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world model; generalization; planning", "https://openreview.net/pdf?id=EXZDc0OHYF", "", ""], ["https://openreview.net/forum?id=AclXLFoFLt", "WorldString: Actionable Object Representation", "Kunqi Xu, Shaoqiu Zhang, Jitao Li, Jianglong Ye, Tianshu Tang, Isabella Liu, Sifei Liu, Xueyan Zou", "Objects are the basic units of interaction in the physical world and serve as essential building blocks for world modeling. Real-world objects exhibit diverse deformation behaviors, ranging from articulated objects and skinning objects to soft deformable objects. While current methods approach object states through category-specific models such as FK, LBS, and FEM, or through scene reconstruction, they do not provide a common state interface across these object types. We propose WorldString, a unified neural architecture for learning object- specific, differentiable representations of actionable object geometry. For each object, structural keypoints provide a compact state representation that is decoded into a continuous occupancy field for arbitrary spatial queries. Across diverse object categories, WorldString outperforms traditional optimization-based methods, neural occupancy-based methods, and Gaussian Splatting approaches, achieving a 26.1% average relative improvement in IoU over the strongest baselines. It also has the potential to serve as a foundational component for physical world models, enabling future integration with learned dynamics and policy learning.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "nerual simulation; object representation; world model", "https://openreview.net/pdf?id=AclXLFoFLt", "", ""], ["https://openreview.net/forum?id=0jDEzDxNXr", "Blind Precise Assembly: Proprioceptive Sim-to-Real Peg-in-Hole for Diverse Parts", "Antonia Bronars, Younghyo Park, Kushal Kedia, Pulkit Agrawal", "Every robot already carries high-resolution contact sensors: its own joints. Are they enough for precise assembly, where a robot must find a millimeter-scale opening through light contact? We train a blind insertion policy that observes only a short history of joint positions, velocities, and its own actions, with no visual, force, torque, or tactile sensing and no knowledge of the hole's or the peg's pose. Trained with reinforcement learning entirely in simulation, it transfers zero-shot to a real robot and inserts pegs of different shapes and sizes in \\realtbd{74\\%} of trials. We also study the tradeoffs of blind versus visual policies. Against a matched visual policy, our blind policy takes longer to succeed, but is more robust to geometric variation like size or cross-section changes. To train on thousands of tight-clearance assemblies, we release an open-source MuJoCo generator of exact convex collision geometry.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "proprioception; sim-to-real transfer; peg-in-hole insertion; contact-rich manipulation; reinforcement learning; robotic assembly; collision geometry", "https://openreview.net/pdf?id=0jDEzDxNXr", "", ""], ["https://openreview.net/forum?id=OJEVRPVueL", "Contact Morphology Design: Shaping Contact Sensitivity and Repeatability", "Dong Ho Kang, Luis Sentis", "Dexterous manipulation requires repeated contact establishment,\nyet variability in contact responses complicates downstream\nlearning and control.\nWe introduce Contact Morphology Design (CMD), a perspective\nthat treats contact-response variability as a design target.\nUsing compliant fingertips with rigid internal carriers,\nwe optimize contact behavior and lateral optical observability\nwithout explicitly optimizing re-contact repeatability.\nAcross two silicone materials and two indenter sizes,\noptimized morphologies reduce same-location optical response\nvariation by 11.2--41.9\\% while improving the balance between\nre-contact consistency and neighboring-location distinguishability.\nThese results suggest that contact morphology can shape\nresponse consistency before downstream learning and control.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "fingertip design", "https://openreview.net/pdf?id=OJEVRPVueL", "", ""], ["https://openreview.net/forum?id=ldojMpV9eK", "DCPPT: Domain-Conditioned Policies from Procedural Trajectories for Sim-to-Real Dexterous Tool Use", "Beining Han, Jia Deng", "Sim-to-real RL has achieved impressive results in dexterous manipulation but remains limited to tasks with accurate rigid-body simulation. However, these methods cannot be applied to skills that involve deformables and particles, with which the simulation speed will become too slow for large-scale RL learning. We present DCPPT, a sim-to-real framework for end-to-end dexterous tool-use manipulation skills, e.g., sand scooping, play-dough rod-rolling, without simulating non-rigid materials. Our method learns a domain-conditioned RL policy by tracking procedural trajectories parameterized by domain parameters, and distills it into an end-to-end domain-conditioned sensorimotor policy. Furthermore, explicit domain representation enables fast selection of domain parameters that can maximize downstream task performance. We evaluate DCPPT end-to-end on six dexterous manipulation tasks, including sand scooping, play-dough rod-rolling, sand scraping, mouse-wheel scrolling, dispenser pressing, and spray triggering. Our method achieves 1.5-3.8$\\times$ in task metrics through the best domain parameter and transfers zero-shot to the real world.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; robot tool use; sim-to-real", "https://openreview.net/pdf?id=ldojMpV9eK", "", ""], ["https://openreview.net/forum?id=A3IyeNEN7Q", "DexAgent: An Agentic Human2Sim2Robot Framework for Dexterous Manipulation with Self-Evolving Tool Library", "Youhui Wang, Yunzhu Li, Li Fei-Fei, Jiajun Wu, Huang Huang", "Human videos are a scalable source of demonstrations for dexterous manipulation, but existing human-to-simulation-to-robot (Human2Sim2Robot) pipelines rely on predefined procedures that struggle with diverse object properties, particularly articulated and deformable objects. We introduce DexAgent, an agentic Human2Sim2Robot framework that converts a single egocentric human video and a task prompt into physically grounded robot trajectories for policy training, through four stages: semantic understanding, property-based simulation reconstruction, trajectory optimization, and robot data generation. At each stage DexAgent selects skills from its tool library or develops new ones, while property-specific verifiers assess outcomes and provide feedback, limiting error propagation. Retained tools make the library self-evolving. Across eleven real-world tasks, policies trained with DexAgent-generated data achieve a 3.5× higher success rate than competing baselines. Project website: https://dexagent1.github.io/", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; learning from human video; sim-to-real", "https://openreview.net/pdf?id=A3IyeNEN7Q", "", ""], ["https://openreview.net/forum?id=ehKIfzvXke", "Do as I Do: Dexterous Manipulation Data from Everyday Human Videos", "Bhawna Paliwal, Haritheja Etukuru, William Liang, Pieter Abbeel, Nur Muhammad Mahi Shafiullah, Jitendra Malik", "How can we scalably generate data for robotic manipulation, especially on human-like platforms such as dexterous multi-fingered hands? Learning from human videos has recently emerged as a likely answer to this question. However, difficulties in estimating hand-object interaction and crossing the human-to-robot embodiment gap have hindered the adoption of abundant monocular RGB-only human videos as the primary source of robot manipulation data. In this work, we present DO AS I DO, an algorithm to reconstruct and retarget monocular RGB human videos to multi-fingered dexterous robotic hands. DO AS I DO reconstructs hand-object interactions from various egocentric and exocentric in-the-wild video sources. The algorithm then retargets these hand-object interaction estimates into a sequence of actions executable in the real world, yielding robot-complete manipulation data from disparate human videos. Overall, DO AS I DO outperforms previous state of the art in estimating hand-object interactions and extracting dexterous manipulation trajectories from RGB videos, as we show in experiments on datasets with ground truths and on a dataset of video clips collected online. Our experiments enable us to propose an efficacy playbook for practitioners collecting human data for manipulation.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; learning from human videos; retargeting", "https://openreview.net/pdf?id=ehKIfzvXke", "", ""], ["https://openreview.net/forum?id=1XxguLFgl2", "EigenDEXplore: Structured Exploration for Dexterous Manipulation with Human Priors", "Harsh Gupta, Tyler Ga Wei Lum, Changhao Wang, Chuer Pan, Karen Liu, Jeannette Bohg, Shuran Song", "Dexterous manipulation poses a challenging high-dimensional optimization problem, as useful behaviors require coordinated motion across many hand joints. In reinforcement learning (RL) and sampling-based trajectory optimization, exploration commonly relies on independent robot joint perturbations, making coordinated behaviors difficult to discover. Prior work reduces this search space for grasp learning using low-dimensional spaces of coordinated joint motions learned from human hand data, but this restricts the expressivity required for general manipulation. Some combine learned and joint-space actions to restore expressivity, but this increases dimensionality and introduces redundancy. We study these effects across diverse manipulation settings, varying action dimensionality, exploration strategy, and the source of human data. Our experiments suggest that human-motion priors are most effective when used to structure exploration rather than change the action representation. Motivated by this finding, we propose EigenDEXplore, which induces correlated exploration by adding perturbations along human-derived eigenvectors to independent joint-space noise, leaving the action space unchanged. Across multiple dexterous hands, EigenDEXplore consistently outperforms joint-space and learned action-space baselines in grasping, in-hand reorientation, and contact-rich manipulation. These gains span unstructured and reference-guided RL, trajectory optimization, and sim-to-real deployment, and are largest in settings with less reward shaping and curriculum design.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; reinforcement learning; exploration", "https://openreview.net/pdf?id=1XxguLFgl2", "", ""], ["https://openreview.net/forum?id=VjYJceQS1M", "Finetuning VLAs for Dexterous Manipulation: The Right Checkpoint Is All You Need", "Artur Kuramshin, Charlotte Cloutier, Michael Przystupa, Kirsty Ellis, Mohammad Shahanshah Akhter, Glen Berseth", "Vision-Language-Action models have demonstrated strong manipulation capabilities. A limitation of VLA models is that most manipulation datasets focus on parallel-jaw gripper systems, making transfer to multi-finger hands challenging, particularly as teleoperation datasets are harder to collect with multi-fingered robots. In this work, we study how to best adapt VLAs to dexterous hands by pairing supervised fine-tuning (SFT) with diffusion-steering reinforcement learning (DSRL). Using $\\pi_{0.5}$ and a LEAP hand, we evaluate five fine-tuning recipes across two simulation tasks using only a handful of demonstrations. Our empirical analysis yields three key insights: (1) SFT success is poorly correlated with post-DSRL success, meaning the best SFT checkpoint is rarely the most effective to steer; (2) freezing the vision-language model (VLM) and tuning only the action expert produces the most steerable policy for both training and out-of-distribution placements; and (3) low-rank adaptation (LoRA) is the least steerable approach. Consequently, we recommend an adaptation recipe that freezes the VLM, fully trains the action expert, and eschews SFT rollout success as a checkpoint selection metric.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "vision-language-action models; dexterous manipulation; fine-tuning; diffusion steering; reinforcement learning", "https://openreview.net/pdf?id=VjYJceQS1M", "", ""], ["https://openreview.net/forum?id=kUpXd0Tcsq", "FINGR: Learning Dexterous Hand Control for Real-World Rubik’s Cube Solving", "Yutong Liang, Quanquan Peng, Matthew Kim, Xiaolong Wang", "Manipulating a Rubik's Cube with one single dexterous hand is a challenging test of sustained, contact-rich control: the hand must execute successive layer turns while keeping the cube secure. Each turn requires some fingers to support the cube while others push a moving layer, release contact, and reset for the next move. To learn this coordination, we introduce $\\textbf{FINGR}$ (Future-supervised Interaction Network with Geometric Representations), a policy that combines finger-relative geometry with future interaction prediction. A shared point encoder expresses the cube relative to each fingertip and aggregates its points without depending on cubie indexing. Learned future tokens share the observation encoder and receive supervision for contact-force changes, layer-turn progress, and finger joint displacement at multiple time scales. The resulting representation conditions a flow policy that directly generates finger actions. On a real dexterous hand, our policy achieves around $99.0\\%$ success over 300 turn attempts, compared with $79.7\\%$ for the base flow policy. Integrated with grasping and table-assisted regrasping, the policy solves all ten scrambled $2\\times2\\times2$ cubes in a mean complete-system time of approximately $137$ seconds.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; imitation learning; flow matching; task and motion planning", "https://openreview.net/pdf?id=kUpXd0Tcsq", "", ""], ["https://openreview.net/forum?id=iNan5MZzhQ", "FlashDexRetarget: Accelerating Dexterous Manipulation Data Generation through Multi-Motion Retargeting", "Kyungmin Lee, Sibeen Kim, Dongyoon Hwang, Yoonsang Oh, Donghu Kim, Youngdo Lee, I Made Aswin Nahrendra, Jaegul Choo, Hojoon Lee", "Human hand-object demonstrations offer a rich source of dexterous robot data, but converting them into physically grounded robot trajectories remains computationally expensive.\nWe present FlashDexRetarget, a reinforcement learning framework that jointly retargets multiple reference motions with a shared, reference-conditioned controller.\nThe framework combines geometric and future-motion observations, object-centric rewards, per-hand actor-critic networks, and efficient off-policy learning.\nOn 50 motions with XHand, it achieves 90\\% success under the SPIDER criterion in 29 GPU-hours, compared with 46\\% in 2,847 GPU-hours for CHORD's released PPO implementation.\nExperiments on two hand embodiments, component ablations, scaling to 1,000 reference motions, and real-world replay show its potential for efficient dexterous robot data generation.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; human-to-robot motion retargeting", "https://openreview.net/pdf?id=iNan5MZzhQ", "", ""], ["https://openreview.net/forum?id=HHmIIJbtIj", "Force-Modulated Dexterity: Unified Compliance for Contact-Rich Manipulation", "Ying Yuan, David Held, Jitendra Malik, Haozhi Qi", "Teleoperation is widely used to collect high-quality demonstrations for robot\nlearning. However, teleoperating dexterous manipulation is challenging because\nit requires coordinated control of motion and contact forces.\nOperators specify motion naturally, but the subtle force adjustments used in\nhuman manipulation are often unconscious and cannot be reproduced reliably\nwithout directly feeling the robot's contacts. We introduce\nforce-modulated dexterity, a unified formulation that treats the\noperator command as a nominal action and modifies its contact-relevant\ncomponents using force feedback. The formulation expresses actions in\ncoordinates defined by task geometry and contact structure, allowing different\nfeedback laws to share the same underlying principle. \nAcross four contact-rich dexterous tasks, our method reduces excessive contact while largely preserving task progress. Policies trained on force-modulated actions also achieve more reliable autonomous execution than those trained on raw teleoperation commands.\nThese\nresults suggest that force modulation provides a practical interface between\nmotion commands and the contact responses required for contact-rich dexterous\nmanipulation. Videos are shown on our website https://yingyuan0414.github.io/fomo-dex/ .", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "compliance; teleoperation; dexterous manipulation", "https://openreview.net/pdf?id=HHmIIJbtIj", "", ""], ["https://openreview.net/forum?id=Se8dGtohgn", "Forward and Reverse Teleoperation for Dexterous Manipulation and Human Intervention", "Zhanpeng He, Joaquin Palacios, Zhangyu Wang, Chenhao Li, Katelyn Lee, Matei Ciocarlie, Karen Liu, Jiajun Wu", "Teleoperated demonstrations are a primary source of data for robot manipulation, and teleoperated interventions are a primary mechanism for correcting policies at deployment. Yet most teleoperation systems close the loop through vision alone and are built around parallel-jaw grippers, limiting both what the robot can execute and what the operator can express through it. This is most damaging in shared autonomy, where the operator sees the scene only through occluded cameras and must take over a dexterous hand mid-task, often with an object already grasped. We present DITTO-X, a hand-agnostic dexterous teleoperation interface that renders joint-level force and fingertip contact events from sensing already on the robot hand, and drives three commercial dexterous hands (Sharpa, Wuji, and Inspire) without per-hand redesign. Because the exoskeleton is actuated, DITTO-X also supports reverse teleoperation, in which the robot back-drives the operator's fingers into its own configuration before control is transferred, so the human enters the loop already matched to the state they inherit. Our results show that DITTO-X improves demonstration quality and throughput over a commercial hand-tracking glove, both in regular data collection and in human intervention during policy deployment for contact-rich manipulation tasks.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; contact-rich manipulation; human intervention; dagger", "https://openreview.net/pdf?id=Se8dGtohgn", "", ""], ["https://openreview.net/forum?id=Boad839qIT", "FOVI-Dex: Foveation enables efficient perceptive learning of dexterous manipulation in simulation", "Nicholas Blauch, Nicolas Moënne-Loccoz, Jayjun Lee, Patrick Yin, Mohak Bhardwaj, Muhammad Asif Rana, Jessica Yin, Sam Mady, Karl Van Wyk, Nathan D. Ratliff, Jae-Hyun Jung, Ruth Rosenholtz, Ankur Handa, Gavriel State", "Advanced physics simulators and rendering engines promise to support the next-generation of robotic reinforcement learning (RL), yet training perceptive policies remains challenging due to the high-costs of rendering and perception.\nWe propose foveation as a solution to this challenge, coupling a novel foveated rendering solution with foveated perception, alongside a careful approach for ensuring transfer to foveated sampling of real uniform cameras. \nWe train a language-conditioned visuotactile policy controlling a dexterous arm-hand to find and\ngrasp a target object in clutter (FOVI-Dex), via online RL without demonstrations. In comparison to a high-resolution fixed-camera control, FOVI-Dex uses 8.9$\\times$ less vision tokens, supporting 6$\\times$ more\nparallel environments and 4.4$\\times$ higher training throughput. At matched training budgets, this efficiency enables FOVI-Dex to outperform both the high-resolution baseline and a matched uniform active camera baseline, in both sim and real, with an outsized advantage in the real world.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "foveated rendering; active perception; robot learning; sim2real", "https://openreview.net/pdf?id=Boad839qIT", "", ""], ["https://openreview.net/forum?id=flelaoK766", "FROM HAND TO HAND: A Shared Wearable Interface and Functional Benchmark for Dexterous Manipulation", "Qiandao Liu, Shengmiao Samuel Jin, Laura Ren, Tapomayukh Bhattacharjee", "Collecting dexterous manipulation demonstrations across robot hands often requires embodiment-specific sensing hardware or human-motion retargeting. We present \\wudi, a Wearable, Unified Interface for Dexterous manipulation that separates a shared sensorized exoskeleton from interchangeable passive hands and linkages. Its 16 sensors remain on the exoskeleton, while a mechanism model reconstructs target-hand joint positions. Wrist images and poses enable robot-free demonstration collection. We also introduce OTHER, an eight-task benchmark inspired by occupational therapy for evaluating functional manipulation. We fabricate WUJI and LEAP configurations, assess usability with 12 participants using WUJI, and validate joint reconstruction on the LEAP thumb and index finger against motion capture. Separate policies trained from 70 demonstrations per task–hand pair achieve 15\\%–80\\% success across three tasks, with 20 rollouts per pair. For one expert operator using LEAP, WUDI provides higher collection throughput than vision-based teleoperation. These results support shared sensing across embodiments while exposing limitations in reachable motion, contact-force regulation, and passive-hand mechanics. Project Website: https://emprise.cs.cornell.edu/wudi/", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; wearable device; imitation learning; hardware design; functional benchmark", "https://openreview.net/pdf?id=flelaoK766", "", ""], ["https://openreview.net/forum?id=h1CmpbO5Jp", "From Teleoperation to Long-Horizon Dexterity: Evaluating Visuomotor Skills and Offline Proxies for Dexterous Manipulation", "Ammar Abbas, Aayush Jain, PRASHANTH RAMANATHPUR VISWANATH, Nivesh Gadipudi, Giulia Vilone, Jim Gibbons", "Imitation learning policies are intended to make robotic manipulation robust to variations in object pose, appearance, and environment that challenge pre-programmed motion. However, real-world performance remains difficult to predict, as conventional optimization signals such as validation loss show no consistent relationship with robot success. To identify the design choices that govern real-world performance, 281 imitation-learning policies spanning seven policy families were evaluated in approximately 1,700 real-robot trials of RJ45 connector grasping and insertion using a five-fingered robotic hand. Controlled ablations showed that observation and action representations dominated conventional optimizer and sampling choices. For point-cloud policies, region-of-interest cropping, representation in the robot-base frame, and normalization within the point encoder each improved success by 70–100 percentage points. For the vision-languageaction policy, absolute rather than relative action prediction improved insertion success by up to 70 percentage points. Skill decomposition, multi-view perception, and recovery demonstrations were associated with the strongest-performing systems, although their effects were not independently isolated. Of 67 offline metrics evaluated, only five measures of predicted-motion smoothness and directness reliably correlated with insertion success (r = −0.70 to −0.80), and only within a single policy family. These results identify representation choices as key determinants of real-world imitation-learning performance and show that offline metrics can shortlist policies, but cannot replace real-robot evaluation.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; imitation learning; real-robot ablation", "https://openreview.net/pdf?id=h1CmpbO5Jp", "", ""], ["https://openreview.net/forum?id=KSkuMYhSkC", "Getting Out and Getting Back: World and Behavior Grounding in Real2Sim2Real Co-Training", "Samuel Liu, Youngsun Kim, Martin Matak, Gilwoo Lee", "Simulation can expand scarce real demonstrations, but how world fidelity and similarity to human behavior affect co-training remains unclear. We independently vary world grounding, which aligns simulation with the real system, and behavior grounding, which aligns simulated trajectories with human motion. On dynamic dexterous pick-and-sort, fully grounded co-training raises the success rate from 52% to 86% using 100 real demonstrations and 1500 simulated trajectories. Rollout observations suggest that policies follow real-derived behavior in demonstrated states and simulation-derived behavior elsewhere. We investigate these transitions through latent-space analysis and examine how both grounding axes affect task performance. We further show that both grounding axes remain consequential when co-training foundation models.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "real2sim2real; simulation grounding; dexterous manipulation", "https://openreview.net/pdf?id=KSkuMYhSkC", "", ""], ["https://openreview.net/forum?id=zqOJnIDacd", "GOTT: Object-centric Dexterous Manipulation with a Reusable Cross-Embodiment Primitive", "Yulin Liu, Lai Wei, Yen-Jen Wang, Akash Sharma, Pieter Abbeel, Henrik I Christensen, Haozhi Qi", "Foundation models and human data provide rich manipulation intent, but dexterous hands lack a reusable contact-acquisition primitive to execute it across tasks and embodiments. We propose GOTT, a reach-acquire-move framework built around a shared cross-embodiment primitive. Given an object trajectory and a reach specification, the robot approaches a task-relevant region, establishes stable contact through closed-loop control, and tracks the desired object motion. This decomposition supports motion specifications from diverse sources through a shared contact-acquisition and tracking backend. Simulation and real-world experiments demonstrate robust contact across diverse objects, arm-hand platforms, and seen and unseen hand morphologies, with higher end-to-end task success than open-loop grasp execution.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; cross-embodiment learning; object trajectory tracking", "https://openreview.net/pdf?id=zqOJnIDacd", "", ""], ["https://openreview.net/forum?id=i8SFBOmrpb", "IFG: Internet-Scale Guidance for Functional Grasping Generation", "Muxin Liu, Mingxuan Li, Kenneth Shaw, Deepak Pathak", "Large Vision Models trained on internet-scale data have demonstrated strong capabilities in segmenting and semantically understanding object parts, even in cluttered scenes. However, while these models can direct a robot toward the general region of an object, they lack the geometric understanding required to precisely control dexterous robotic hands for 3D grasping. To overcome this, our key insight is to leverage simulation with a force-closure grasping generation pipeline that understands local geometries of the hand and object in the scene. Because this pipeline is slow and requires ground-truth observations, the generated dataset is distilled into a diffusion model that can operate on camera point clouds. By combining the global semantic understanding of internet-scale models with the geometric precision of a simulation-based locally-aware force-closure, IFG achieves high-performance semantic grasping without any manually collected training data. For visualizations, please visit our website at https://ifgrasping.github.io/", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; simulation; deep learning; robotics", "https://openreview.net/pdf?id=i8SFBOmrpb", "", ""], ["https://openreview.net/forum?id=cVc4nwjbbs", "Imperfect Human Data for Dexterous Manipulation: A Controlled Study of Co-Training and Mid-Training", "Yiming Bao, Qianqian Wang, Heng Yang", "Egocentric human video offers scalable supervision for dexterous manipulation, but how should it enter policy training when human and robot differ in task, scene and embodiment? Primarily on the public $\\pi_{0.5}$ checkpoint, with 25 demonstrations of a simulated dexterous folding task and up to 29× as many retargeted EgoDex frames, we compare co-training and mid-training against compute-matched robot-only controls with pre-specified tests and three to five seeds. Whether co-training hurts depends on batch composition, not on the human share: the default recipe leaves about one robot frame per batch and drops success from 25.2% to 11.3%, while sample-count mixing degrades at no share from 0.30 to 0.95 and gains +6.7 points at 0.5. Post-training recovers the diluted policy but adds no established benefit. Separating the stages helps most: human-only mid-training then robot post-training reaches 38.6% vs. 25.7% (five seeds), vanishes when the human actions are shuffled, and transfers +8.7 points to a held-out task. The pattern holds across bases: the drop recurs on Zeva-Ego under our loss-weighted recipe and is absent on GR00T N1.7 under sample-count mixing; a real 22-DoF hand shows the same ordering. The drop is dilution of robot supervision, not negative transfer.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "human-to-robot transfer; egocentric data; co-training; mid-training", "https://openreview.net/pdf?id=cVc4nwjbbs", "", ""], ["https://openreview.net/forum?id=lsLD91bzd6", "INVAR: Randomization-Invariant Visual Representations for Zero-Shot Sim-to-Real", "Sunshine Jiang, Shuo Cheng, Francois Robert Hogan, Matthew Chang, Tingfan Wu, Jitendra Malik, Karen Liu, Nur Muhammad Mahi Shafiullah, Akash Sharma", "Humans know to act consistently across real and simulated environments because they can abstract away visual appearance to what matters for the task. Can robots achieve similar visual invariance? We present INVAR, a visual representation for zero-shot sim-to-real transfer. While classic sim-to-real methods rely on task-specific domain randomization (DR) to train visual encoders and action policies, INVAR distills diverse simulation randomizations into a unified, invariant visual encoder that is self-supervised and scalable. It leverages self-distillation over an unlabeled corpus of simulated play data and robot rollouts without requiring real-world images during representation learning. A policy trained purely on nominal simulation data with a frozen INVAR encoder transfers zero-shot to the real world. INVAR nearly doubles the success rate of identical policies built on state-of-the-art pretrained encoders trained with standard DR, across both dexterous manipulation (0.61 vs. 0.30 mean success) and parallel-gripper manipulation (0.65 vs. 0.32). These results demonstrate that decoupling visual invariance into a task-agnostic encoder unlocks scalable, zero-shot sim-to-real transfer, similar to humans. Our website is available at https://anonymous.4open.science/w/site-5e8c2d7b6a14/.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "sim-to-real transfer; visual representation learning; robot manipulation", "https://openreview.net/pdf?id=lsLD91bzd6", "", ""], ["https://openreview.net/forum?id=W7WWrEOACa", "KITE: Decoupling Kinematics and Interaction for Zero-Shot Cross-Embodiment Manipulation", "Qianxu Wang, Shengmiao Samuel Jin, Kuan Fang", "Generalizing manipulation policies across robot embodiments remains difficult because standard policies tie the interactions needed for a task to the actions of a particular robot. We introduce Kinematic Interaction Transfer across Embodiments (KITE), which decouples manipulation into embodiment-agnostic interaction prediction and embodiment-specific kinematic decoding through a learned contact-based representation of interaction intent. The interaction policy learns from source demonstrations, while the kinematic decoder learns to realize these intents from synthetic data generated using each embodiment's kinematic model. This allows the same interaction policy to control structurally different robots without target-task demonstrations. Across four tasks and six robot embodiments in simulation, KITE achieves an average score of $86.4\\%$ over $12$ task--target settings. Real-world deployment further demonstrates transfer from robot and human demonstrations to a Wuji hand.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "cross-embodiment transfer; dexterous manipulation", "https://openreview.net/pdf?id=W7WWrEOACa", "", ""], ["https://openreview.net/forum?id=MEBxU0ee6h", "Learning Dexterous Action Representations from Human Videos", "Hongyi Zhou, Maximilian Arnold, Mohamed Omran, Pietro Mazzaglia, Rudolf Lioutikov, Daniel Dijkman", "We introduce DexVAE, a latent action representation pretrained on human motion that transfers dexterous motion priors from egocentric human videos to robot policies. \nAlthough dexterous robot hands promise human-like manipulation, learning to control them requires large and costly robot datasets. Human videos provide dexterous experience at scale, but differences in morphology and action spaces prevent their direct use for robot control. DexVAE bridges this gap by compressing temporally extended hand trajectories, expressed in a shared canonical representation, into compact latent action tokens. We transfer knowledge through a staged pipeline consisting of human-motion pretraining followed by human–robot co-training. We adapt a pretrained VLA model to generate actions in this latent space using flow matching. \nWe evaluate our approach on six real-world manipulation tasks using a Unitree H1-2 humanoid with dexterous hands. With only 25 robot demonstrations per task, our method improves average task progression from $38.5\\%$ to $49.1\\%$, with the largest gain on high-dexterity tasks—from $35.7\\%$ to $58.6\\%$. Overall, DexVAE matches the raw-action baseline using $1/2$ the robot data and, on high-dexterity tasks, outperforms it using only $1/4$ the data.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; action representation; human videos; vision-language-action models", "https://openreview.net/pdf?id=MEBxU0ee6h", "", ""], ["https://openreview.net/forum?id=a367wizddP", "Learning Tactile-Aware Hierarchical Whole-Body Control Policies for Quadrupedal Loco-Manipulation", "Pokuang Zhou, Le Mao, Xiyue Chen, Zhiyuan Zhang, Joseph Campbell, Yu She", "Touch provides direct information about contact state, force, slip, and interaction transitions, yet most mobile manipulation policies treat tactile signals only as passive observations rather than explicit control targets. We propose a hierarchical framework consisting of high-level and low-level policies, both conditioned on visual and tactile information. The high-level policy is responsible for planning and generating commands, while the low-level policy executes these commands through whole-body control. The high-level diffusion policy is trained from human demonstrations collected with a handheld visuotactile gripper, whereas the low-level policy is first trained through large-scale reinforcement learning in simulation and then post-trained with reward functions to jointly execute end-effector motion and tactile commands, enabling zero-shot transfer to the real robot. Our system demonstrates the capability to perform challenging long-horizon, complex, and contact-rich loco-manipulation tasks on a Unitree Go2 equipped with a D1 arm and a tactile gripper, including marker reorientation and insertion, valve tightening, delicate object manipulation, wrench-based bolt tightening, and cabinet-door opening. We further evaluate the generalization of the low-level policy across substantially different manipulator configurations, demonstrating the effectiveness and generalizability of our low-level architecture. Despite the nearly twofold difference in manipulator mass, the joint torques remain within approximately $-15$ to $27$ N$\\cdot$m during real-world deployment. We also compare our method against an advanced world action approach. Across real-world trials, the full framework improves the average task success rate by 43.7\\% over the average performance of all other baselines, demonstrating that tactile information can serve as a planned and controlled action-level representation for robust contact-rich loco-manipulation.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "tactile sensing; whole-body control; loco-manipulation; imitation learning; world action model; visuotactile policy learning", "https://openreview.net/pdf?id=a367wizddP", "", ""], ["https://openreview.net/forum?id=iqQJYouXxd", "No Eyes, No Problem: Zero-Shot Blind Baoding Ball Manipulation with Binary Touch", "Ayush Deshmukh, Nalin Agarwal, Elle Miller, Sethu Vijayakumar", "Humans manipulate objects within their hands through touch alone with remarkable ease, but for robots, sustained real-world manipulation without vision remains an open challenge. We study this problem through Baoding ball rotation on the Shadow Dexterous Hand Lite, using only proprioception and binary tactile feedback, and achieve zero-shot sim-to-real transfer through a sensor-aligned, coupling-aware embodiment in simulation, tactile calibration, and two novel episodic domain randomisations: slew-rate action limits and STuck-AT Taxels (STAT). On the physical hand, the policy completes 225 consecutive $180^\\circ$ rotations (112.5 full rotations) at $\\sim0.36$ rot/s in a single continuous trial, the strongest reported hardware result for Baoding ball manipulation in both rotation count and speed irrespective of the sensing modality used. By effectively bridging the sim-to-real gap, our framework sets a new benchmark for sustained tactile-driven dexterous manipulation on physical hardware.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; tactile sensing; sim-to-real transfer", "https://openreview.net/pdf?id=iqQJYouXxd", "", ""], ["https://openreview.net/forum?id=xHETNKwCZu", "OpenTac: An Open Ecosystem for Customizable, Scalable, and Transferable 3D Tactile Sensing", "Ariel Slepyan, Gregory D. Hager, Homanga Bharadhwaj, Anand Bhattad, Krishna Murthy Jatavallabhula, Nitish Thakor", "Dexterous manipulation depends on touch, yet tactile skins are usually built for one fixed geometry and often sense only normal pressure. We present OpenTac, a low-cost piezoresistive tactile skin and open design ecosystem that senses distributed normal and shear force and can be generated automatically for new robot surfaces. A structured elastomeric overlay converts tangential load into\ndifferential pressure across neighboring taxels. OpenTac-CAD compiles a 2D outline, a 3D robot surface, or a text request into fabrication-ready flexible PCBs plus a machine-readable manifest shared by simulation, cross-sensor transfer, and adaptive acquisition tools. We fabricated 31 functional sensors; five representative designs compile in 0.7–2.6 s and cover 75–93% of their target regions. Deployments on four robot platforms demonstrate policy learning and contact-rich control: normal-and-shear policies achieve success rates (82% peg-in-hole and 62% plug insertion, versus at most 60% and 36% with normal-only sensing), and shear feedback maintains a bimanual grasp under impulsive loading in 16/20 trials versus 9/20 with a wrist force/torque sensor. Adaptive readout reaches 1286 partial frames/s on a 1024-taxel skin, 19.2× faster than full raster scanning. Anonymous website: https://anonymous.4open.science/w/opentac-workshop-site-4B13/.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "tactile sensing; dexterous manipulation; automated sensor design", "https://openreview.net/pdf?id=xHETNKwCZu", "", ""], ["https://openreview.net/forum?id=GwAf1uEbaU", "orca: A Platform for Open-Source Dexterity Research", "Francesco Capuano, Maximilian Eberlein, Fabrice Bourquin, Clemens Claudio Christoph", "Dexterous-hand research typically depends on bespoke software coupling robot hands, simulators, tracking devices, and robot learning pipelines. \nSuch fragmentation hinders progress and increases the cost of reproducing and extending results in the field.\nIn this work, we present \\orca, a fully open-source software stack making dexterous manipulation reproducible, and accessible across both simulation and real world hardware.\nWe provide interoperable packages for (1) real-world low-level control, (2) simulation assets and tasks, (3) full-arm integration, as well as (4) teleoperation and (5) retargeting from consumer devices.\n\\orca~directly interfaces with \\lerobot, enabling researchers to collect teleoperated demonstrations, train a policy, and deploy it on simulated or real-world robot hands using a tested, shared platform.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; open-source software", "https://openreview.net/pdf?id=GwAf1uEbaU", "", ""], ["https://openreview.net/forum?id=rjBEjJS1Iz", "PanoTac: A Dense Three-Axis Tactile Sensor for Robust Touch-Centric Manipulation", "Binglin Andre Wang, Xiaole Alex Jiang, Zicheng Teng, Xinqi Liu, Yunzhu Li, Lerrel Pinto, Zichen Jeff Cui, Binghao Huang", "Humans use vision and touch to guide everyday manipulation. When scooping grains, contact with the handle reveals the spoon's orientation, while resistance felt through the grasp guides motion. These cues reflect contact geometry and shear forces during interaction. To bring these sensing capabilities to robots, we present PanoTac, a low-cost, compliant tactile fingertip designed for dense three-axis tactile sensing. Each finger provides a $12 \\times 32$ taxel grid, with each taxel representing three components: normal ($z$) and shear ($x$, $y$). \nSensor characterization demonstrates spatially consistent and temporally repeatable responses across all three axes.\nSensor characterization quantifies response repeatability across loading cycles and sensor instances, as well as variation across contact locations.\nWe integrate PanoTac into a robotic system with a visuo-tactile learning pipeline. Across test tube preparation, grain scooping, and salt pouring, the resulting policies outperform vision-only baselines by an average of 43.3 percentage points. Ablations show that removing either spatial contact information or load feedback reduces overall performance across the task suite. Our project page is available at\nhttps://panotac.github.io.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "tactile sensing; sensor design; robotic manipulation", "https://openreview.net/pdf?id=rjBEjJS1Iz", "", ""], ["https://openreview.net/forum?id=udcKZU9hXr", "Pitch, Blur and Noise: Cramér-Rao Design Rules for Tactile Taxel Arrays", "Varun Puttagunta", "How densely should a dexterous hand be covered in taxels, and how soft should the skin over them be? We answer the question that is answerable exactly: for a point contact of unknown location and force read through a taxel array with an elastomer point-spread function and additive noise, what is the best achievable localisation precision? Computing the Fisher information exactly for Gaussian and compact response kernels over pitch, blur width, signal-to-noise ratio and array size, we find that the localisation bound obeys a single formula, sigma_x = 0.798 d/SNR per axis, whenever the pitch d is at most about 1.5 blur widths, independent of the blur itself; that this makes the achievable super-resolution factor 1.25 x SNR regardless of taxel density; that precision collapses (1.22x worse at two blur widths, 152.14x at four) once responses stop overlapping; and that compact response kernels produce blind spots centred on the taxels themselves, covering 21% of the surface when the contact radius equals the pitch. For a fixed number of taxels on a fixed patch, blur should be 0.8-1.0 pitches for Gaussian skins and at least 2.0 pitches for compact ones. A maximum-likelihood estimator attains the bound within 0.93-1.09x in 24 Monte Carlo cases. The rules are closed-form, hardware-agnostic, and say that beyond the overlap threshold, taxel count buys precision only linearly.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "tactile sensing; sensor design; cramér-rao bound; dexterous manipulation; super-resolution", "https://openreview.net/pdf?id=udcKZU9hXr", "", ""], ["https://openreview.net/forum?id=cjL7reYAhE", "Pre-training Visual Dexterity in Simulation", "Sarthak Kamat, Adam Rashid, Satvik Sharma, Aseem Doriwala, Chelsea Finn, Phillip Isola, Karen Liu", "Large-scale pre-training has made robot policy fine-tuning increasingly data-efficient, but this progress has largely been driven by datasets and embodiments built around simple parallel-jaw grippers. Dexterous, multi-fingered hands remain comparatively data-starved because real teleoperation is costly to scale, while human hand video is off-embodiment and requires lossy pose estimation and retargeting. We introduce Simulation Pre-training for Dexterity (SPD), a pre-training framework for dexterous manipulation that uses data entirely collected in simulation. In SPD, humans manipulate virtual objects inside a VR headset, enabling on-embodiment trajectories and robot-free collection. With the help of five operators, we collect 75 hours of multi-task dexterous manipulation over one week, and use it to pre-train a causal transformer on a sequence modeling objective. We study the benefits of simulation pre-training on real-world tasks by fine-tuning on 1-2 hours of physical demonstrations on a 56-DoF bimanual dexterous setup. We find that our approach outperforms training behavior cloning policies from scratch, showing that simulation teleoperation is a viable pre-training source for real-world dexterous manipulation. We perform ablation studies, measuring the benefits of history conditioning and short action chunks for reactive control.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; pre-training; simulation; teleoperation", "https://openreview.net/pdf?id=cjL7reYAhE", "", ""], ["https://openreview.net/forum?id=RT9PjZI98I", "ReForce: Learning Force-aware Retargeting for Dexterous Manipulation", "Yuhang Wu, Lingqi Zeng, Changwei Jing, Geng Chen, Jianglong Ye, Xiaolong Wang", "Human demonstrations offer a scalable data source for dexterous manipulation, but transferring them to robot actions remains challenging due to the embodiment gap. Today's retargeting is mostly kinematic, yet manipulation is decided by force, which governs how the hand interacts with the object and how the object moves. In this paper, we present ReForce, a Force-aware Retargeting method that turns human motion and forces into robot actions that reproduce the intended contact. ReForce predicts a residual on the kinematically retargeted action to reach the desired force, using a general force tracker trained on large-scale simulation interactions. It supports both online force-aware teleoperation and offline data translation. In simulation and on real hardware, ReForce achieves lower force-tracking error and stronger multi-finger contact engagement on contact-rich tasks such as paper-cup grasping and tongs manipulation.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; dexterous hand retargeting; imitation learning; tactile feedback; learning from human", "https://openreview.net/pdf?id=RT9PjZI98I", "", ""], ["https://openreview.net/forum?id=aPbT1KmiK7", "Rotation-Aware Point-Cloud Embeddings for Vision-Based In-Hand Reorientation", "Yashom Dighe, Karthik K Dantu", "Point-cloud goals provide a direct way to specify a reorientation task: instead of defining an object-specific pose frame or estimating 6D pose at test time, the policy is given the desired 3D geometry of the object. However, extracting the change in object pose between two raw point clouds is not straightforward. Since the points are unordered and independently sampled, directly relating the observations typically requires solving for correspondences or registration. Generic pretrained point-cloud feature extractors do not resolve this issue either, as their embeddings are not organized to directly expose the underlying rotation between observations. This lets a model-free PPO policy learn in-hand reorientation from current and goal point-cloud embeddings without explicit pose, correspondences, dense flow, or teacher-action supervision, while matching privileged-state and distillation-based baselines.", "3rd Workshop on Dexterous Manipu
