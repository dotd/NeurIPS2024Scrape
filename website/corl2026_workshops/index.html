he original data, and retraining the classifier on these successes raised success from 52.5% to 70.7%.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "vla models; flow matching; classifier guidance; embodiment transfer; transfer learning", "https://openreview.net/pdf?id=aLuF2Kdb7L", "", ""], ["https://openreview.net/forum?id=Y3aiT0YAhn", "Evaluating Test-Time Scaling in Robot Policies and World Models", "", "Vision-Language-Action (VLA) models and World Models (WMs) make sample-based test-time scaling natural for robot decision-making: sample candidate actions, imagine their consequences, execute the most promising one.\nWe introduce a test-time evaluation benchmark that reveals what current foundation decision-making models do well and poorly, when additional samples improve action selection, and how well WM-imagined futures help, spanning VLAs, integrated World-Action Models (WAMs), VLAs augmented with action-conditioned WMs, and GPT-6 Astra with a waypoint scaffold.\nThe evaluation covers three dimensions: \\emph{sampling potential} (oracle headroom from sampled actions), \\emph{selection effectiveness} (selector gains over random selection on the same pool), and \\emph{uncertainty informativeness} (whether dispersion in sampled actions predicts failure).\nAdditional samples expose substantial oracle headroom, nearly 50 percentage points for Astra on LIBERO, but tested selectors fail to achieve it consistently; we identify where current models fall short and what this implies for WM research.\n(Anonymous project page: \\url{https://robot-tts.github.io/})", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "test-time scaling; robot learning; world models; vision-language-action models; world-action models; benchmarking; action selection", "https://openreview.net/pdf?id=Y3aiT0YAhn", "", ""], ["https://openreview.net/forum?id=Xcta1vUXKa", "Getting Out and Getting Back: World and Behavior Grounding in Real2Sim2Real Co-Training", "", "Simulation can expand scarce real demonstrations, but how world fidelity and similarity to human behavior affect co-training remains unclear. We independently vary world grounding, which aligns simulation with the real system, and behavior grounding, which aligns simulated trajectories with human motion. On dynamic dexterous pick-and-sort, fully grounded co-training raises the success rate from 52% to 86% using 100 real demonstrations and 1500 simulated trajectories. Rollout observations suggest that policies follow real-derived behavior in demonstrated states and simulation-derived behavior elsewhere. We investigate these transitions through latent-space analysis and examine how both grounding axes affect task performance. We further show that both grounding axes remain consequential when co-training foundation models.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "real2sim2real; simulation grounding; dexterous manipulation", "https://openreview.net/pdf?id=Xcta1vUXKa", "", ""], ["https://openreview.net/forum?id=kHdCCwDovE", "HyperDrone: Simulation-to-Reality Transfer at Millions of Frames per Second", "", "We present HyperDrone, an extremely fast quadrotor simulator focused on high-performance batch rendering that is more than 20x faster than existing state-of-the-art batch quadrotor simulators. HyperDrone combines highly optimized multirotor dynamics with HyperLux, a new ray-tracing engine that takes full advantage of modern ray-tracing hardware, capable of running both components entirely on the GPU. HyperLux renders RGB, depth, semantic/instance segmentation, surface normals and optical flow observations at configurable levels of fidelity, including reflections, motion blur, anti-aliasing, and Physically Based Rendering (PBR). Even in the highest-fidelity settings, HyperLux achieves millions of Frames Per Second (FPS) on consumer-grade GPUs. We demonstrate the merits of HyperDrone by training a vision-based yaw-control policy purely in simulation and transferring it to a real small-scale quadrotor (Crazyflie) with a camera, running completely onboard.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "quadrotor; simulator; sim2real", "https://openreview.net/pdf?id=kHdCCwDovE", "", ""], ["https://openreview.net/forum?id=qi9nUxw0vH", "Improving Generalist Policies with Simulation Post-Training", "", "We present an ongoing study of how simulation can be used for post-training generalist robot policies. We consider the setting where a pretrained generalist policy already exhibits non-zero success on a target task and investigate a recipe to improve the policy without additional human demonstrations or enforcing task structure beyond sparse rewards. Our work focuses on unpacking the expert learning process, which most sim-to-real works treat as a black box, to simplify state-based expert learning and improve downstream student-teacher distillation. We leverage the following insights to set up a recipe for policy improvement with simulation: generalist policy rollouts can reduce the burden of exploration in expert learning and privileged critics from expert learning can improve the distillation step beyond standard supervised finetuning. We additionally discuss opportunities to push performance, expand recovery behavior, and improve policies without needing distillation.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "sim-to-real; post-training; reinforcement learning", "https://openreview.net/pdf?id=qi9nUxw0vH", "", ""], ["https://openreview.net/forum?id=CrsTwWeBUH", "ManiLadder: Benchmarking Robot Manipulation Through a Categorized and Multi-Difficulty Level Task Ladder", "", "Recent advances in robotic manipulation have enabled increasingly\ncomplex and dexterous behaviors, yet existing benchmarks still focus on sim-\nple pick-and-place tasks and lack a systematic framework for measuring progress\nalong the axis of task difﬁculty. We present ManiLadder, a large-scale and orga-\nnized simulation benchmark containing 112 tasks stratiﬁed into 4 difﬁculty lev-\nlevels, with 8 categories in each level, spanning rigid-body and deformable-object\nmanipulation, single-arm and dual-arm settings, and gripper and dexterous-hand\nend-effectors. To calibrate difﬁculty, we ﬁx the data amount for every task and\nuse a uniﬁed ﬂow-matching imitation learning policy under the same training and\nevaluation protocols, using its success rate as an empirical difﬁculty signal. All\ntasks are iteratively reﬁned until they fall into target difﬁculty ranges, which are\nthen veriﬁed across random seeds and policies. We further analyze task prop-\nerties, compare policies, study data scaling, and conduct real-world experiments\nshowing that the tasks preserve their difﬁculty ordering beyond simulation.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "benchmark; evaluation; simulation", "https://openreview.net/pdf?id=CrsTwWeBUH", "", ""], ["https://openreview.net/forum?id=YjNJtvKpD4", "MASSMARL: Measuring Population Scaling in Multi-Agent Reinforcement Learning", "", "Many widely used multi-agent reinforcement learning benchmarks evaluate small teams of up to a few dozen agents. GPU acceleration often increases throughput by batching these small worlds rather than increasing the population within each world. We present MASSMARL, a GPU-native JAX engine and grid-world benchmark with twenty tasks in five families, including four inspired by swarm robotics. MASSMARL simulates a single world of 16.1 million agents at 7.4 × 10^7 agent-steps/s on one A100-80GB. This simulation measurement excludes policy inference and learning. We evaluate ten shared-parameter baseline implementations across tested population sizes with 20 training iterations and four-step rollouts. Seven complete the test at 1,013,888 learners on an A100-80GB.\nA QMIX variant first fails at 663,552 learners, and compact attention and retention baselines at 41,472, with first failures at the same tested populations across three tasks. These are tested feasibility bounds, not exact population limits or evidence of convergence. The results distinguish simulation capacity from training feasibility and provide a computational diagnostic for population scaling in swarm-inspired learning; physical fidelity and transfer to robots remain untested.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "multi-agent reinforcement learning; gpu simulation; benchmarking; population scaling; swarm robotics", "https://openreview.net/pdf?id=YjNJtvKpD4", "", ""], ["https://openreview.net/forum?id=r0P7V6z0kD", "MimicShape: From One Real Object to Many via Real-to-Sim-to-Real Trajectory Replay for Manipulation Policy Learning", "", "Generalizing imitation-learned manipulation policies to unseen objects requires demonstrations across many object instances, making real-world data collection costly. Demonstration augmentation can reduce this collection burden, but demonstrated motions are tied to the source object’s geometry, making object diversity difficult to expand while reusing recorded trajectories. We present MimicShape, a real-to-sim-to-real system that expands object diversity in demonstration data by keeping real-world trajectories unchanged and generating compatible objects in simulation. A synchronized digital twin extracts contact and clearance constraints from the recorded trajectories, and an agentic system generates diverse, textured objects that satisfy these constraints. Simulation replay verifies that the original actions succeed on each candidate, yielding new visual observations paired with unchanged real-world actions. Across eight tasks on rigid, articulated, and deformable objects, four real and four simulated, MimicShape improves success rates on unseen objects over the strongest applicable baseline on every task by 15.5 percentage points on average. On real-world mug hanging, augmenting 50 demonstrations on one mug raises success on unseen mugs from 19% to 51%, against 63% for 250 demonstrations collected on five real mugs.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "imitation learning; real-to-sim-to-real transfer; object generalization; synchronized digital twins; trajectory replay; object generation", "https://openreview.net/pdf?id=r0P7V6z0kD", "", ""], ["https://openreview.net/forum?id=LDuEhoeyLc", "MoMa-NMP: Scene-Scale Neural Motion Planning for Mobile Manipulators", "", "Mobile manipulators operating in homes and other complex environments must coordinate their base and arm over long horizons, navigating around obstacles, through narrow passages, and between constrained workspaces. Neural motion planners can provide fast closed-loop planning from partial observations, but scaling them to room-sized environments is difficult because generating high-quality training trajectories is itself a challenging motion-planning problem. To address this, we introduce MoMa-DemoSmith, a demonstration-generation pipeline that separates the problem into global path discovery for large complex scenes and local motion refinement for collision avoidance. This key separation enables the generation of millions of challenging whole-body trajectories across our procedurally generated scenes. These demonstrations are used to train MoMa-NMP in two stages: behavior cloning (BC) followed by privileged on-policy distillation. The resulting policy plans from depth-camera and LiDAR observations, achieving 87.0\\% success without environment collisions in simulation and 77.5\\% across 80 trials in unseen physical scenes. See video results at https://adamhkan.com/moma-nmp/.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "mobile manipulation; neural motion planning; demonstration generation", "https://openreview.net/pdf?id=LDuEhoeyLc", "", ""], ["https://openreview.net/forum?id=Up1WVICrlD", "NeRD2Real: Adapting Neural Robot Dynamics for Humanoid Control from Real-World Data", "", "Accurate simulation is essential for transferring humanoid control policies to hardware, yet calibrating dynamics models from limited, noisy onboard data is challenging. We present NeRD2Real, a framework for learning Neural Robot Dynamics (NeRD) through extensive pretraining with analytical simulation data and adapting with limited real-world data. Simulation pretraining learns a dynamics-conditioned transition model and a trajectory-level missing-state estimator. Adaptation recovers unobserved states, identifies a real-world dynamics-latent, and fine-tunes the model on a mix of reconstructed real and simulation data. On Unitree G1, an adapted NeRD supports whole-body policy learning and enables sim-to-sim and sim-to-real transfer. A walking policy trained in the adapted NeRD without dynamics randomization transfers zero-shot to the real robot.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "neural simulation; humanoid control; real-to-sim-to-real; system identification", "https://openreview.net/pdf?id=Up1WVICrlD", "", ""], ["https://openreview.net/forum?id=U1RYGhLTYR", "Neural Fidelity Calibration for Informative Sim-to-Real Adaptation", "", "Deep reinforcement learning (RL) can transfer agile robot skills from simulation to the real world, but closing the sim-to-real gap by domain randomization requires expert physics knowledge, and simulator calibration from real data typically targets a few hand-picked parameters. Even then, simulators miss real-world effects, and environments reconstructed from onboard perception inherit sensing errors that limit policy improvement.\nWe propose Neural Fidelity Calibration (NFC), which uses conditional flow matching to calibrate simulator physical parameters and residual fidelity domains online during deployment. Residual fidelity captures sim-to-real dynamics discrepancies and perception-induced environment uncertainty. NFC operates in a latent space so that realistic environments can be sampled from the inferred posterior for real-to-sim policy fine-tuning. The framework is informative: the pretrained policy is fine-tuned only when an anomaly is detected, sequential NFC seeds its proposal from the simulation-pretrained estimator, and a hallucination policy modulates posterior uncertainty following optimism in the face of uncertainty.\nNFC attains the most accurate posteriors among established simulation-based inference methods on five robots with up to 39 physical parameters and a 128x128 residual terrain. On a wheeled robot with a broken wheel axle deployed on snow, mud, and wet grass, NFC raises success on rough terrain from 26% to 70% and reduces orientation jerk by 88%. Code and videos will be released upon publication.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "sim-to-real adaptation; simulation-based inference; flow matching; field robots", "https://openreview.net/pdf?id=U1RYGhLTYR", "", ""], ["https://openreview.net/forum?id=tvGTA10xJG", "One Phase is Enough: Sim-to-Real Transfer with Direct Visual Reinforcement Learning", "", "Sim-to-real reinforcement learning (RL) has enabled impressive robotic behaviors, yet deploying policies directly from vision remains challenging. A common approach first trains a teacher policy with RL using privileged state observations, then distills its behavior into a vision-based student via imitation. However, the resulting student can substantially underperform its teacher. Direct visual RL offers a promising alternative, but learning task-relevant visual representations from scratch can be sample-inefficient and computationally expensive making one-phase visual RL intractable. We propose DRIFT, a simple recipe for efficient one-phase visual RL using frozen pre-trained foundation vision encoders, allowing RL to focus on learning control from existing visual representations. Freezing the encoder avoids costly back-propagation through the vision backbone, while its pretrained representations enable real-world transfer from fast, rasterized simulation renders. Under matched architectures, observations, and compute budgets, DRIFT outperforms two-phase distillation and achieves a 58.8\\% relative improvement in average real-world success rate across three manipulation tasks. Controlled simulation evaluations demonstrate that DRIFT’s relative advantage grows from roughly 9\\% in-distribution to over 61\\% under out-of-distribution shifts, suggesting that stronger generalization contributes to superior real-world transfer.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "reinforcement learning; sim-to-real; visual rl", "https://openreview.net/pdf?id=tvGTA10xJG", "", ""], ["https://openreview.net/forum?id=m2Y1UmhnRu", "Reflex: Visually Grounded Reactive Humanoid Control", "", "Humans effortlessly react to the world; they catch a falling cup, step aside from a passing cart, or receive a box tossed during truck unloading. These everyday actions require anticipating a moving object and responding with the whole body within about a second, often by making contact with the arms and torso. Such visually reactive, contact-rich whole-body control remains challenging for humanoids, which must (1) coordinate whole-body contact, (2) react to object dynamics in real time, and (3) ground perception in egocentric vision. We study catching thrown boxes as a representative task that demands all three. We present Reflex, a three-stage framework that learns these capabilities stage by stage while connecting them through a compact representation of object dynamics: a state policy first learns whole-body catching with reinforcement learning, the policy then learns to infer box dynamics from delayed and incomplete observations, and an egocentric RGB-D encoder finally learns to recover this representation while the controller stays fixed. In simulation, Reflex catches 85.7% of throws from egocentric RGB-D, compared with 87.9% with privileged box observations. On a real Unitree G1, it catches human-thrown boxes with 65% and 40% success at 2.5 and 5 m, reaching 76% and 59% of human catchers’ success.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "humanoid control; gpu simulation; sim-to-real; reactive catching; egocentric vision", "https://openreview.net/pdf?id=m2Y1UmhnRu", "", ""], ["https://openreview.net/forum?id=5dGydIVmrk", "RoboCommons: Open, Evolving Evaluation for Generalist Robot Policies", "", "Generalist robotic manipulation policies are rapidly expanding in capability, but their evaluation remains largely tied to fixed benchmarks designed and defined at benchmark design time. We introduce RoboCommons, a language-driven multi-framework harness for open-ended evaluation that lets users specify what they want to test while handling framework-specific task implementation. RoboCommons generates executable, verified tasks across existing manipulation frameworks and accumulates them into a reusable evaluation repository. Using more than 300 generated tasks, we show that evaluation diversity continues to grow as the repository expands. Its automated verifier produces tasks that are 98.5% correct under human adjudication while retaining 93.6% of valid tasks. Across three frameworks, RoboCommons is rated significantly more usable and less cognitively demanding compared to GenSim and Cursor in a 26-participant user study. Finally, across 15 policy-framework combinations and 42,576 episodes, targeted task families reveal distinct capability gaps that are obscured by aggregate success rates. These results show that robotic evaluation can be made easier to author, reliable to execute, and extensible as policy capabilities evolve. Project page: https://robocommons2026.github.io", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "benchmarking; evaluation; simulation", "https://openreview.net/pdf?id=5dGydIVmrk", "", ""], ["https://openreview.net/forum?id=xxVgTVAjnv", "RoboRender: Robot-Oriented Video Generation for Visual Sim-to-Real Transfer", "", "Simulation enables large-scale, low-cost robot data generation, but policies trained in simulation often fail to transfer to the real world due to the sim-to-real visual discrepancies. Existing approaches often rely on intermediate representations, which can discard rich semantic information or require additional perception modules at deployment. We address this visual sim-to-real gap with RoboRender, a framework that converts simulated trajectories into photorealistic RGB videos for policy learning. RoboRender trains a robot-oriented video generation model conditioned on simulated depth videos, language instructions, and robot RGB mask videos, preserving simulator geometry, robot motion, and action labels while synthesizing realistic textures, backgrounds, and distractors. The generated RGB videos are paired with simulator-provided states and actions to train policies for zero-shot real-world deployment. On robot video test sets, our video model outperforms depth-conditioned video generation baselines in generation quality. In real-world experiments across pick-and-place, articulated-object manipulation, and mobile manipulation tasks, policies trained on RoboRender-generated data achieve a 71% average success rate, outperforming raw simulation renderings and conventional visual domain randomization by approximately 7.1×and 3.6×, respectively. We further show that policy performance improves with more generated videos per simulation trajectory, increasing opening-task success by 65 percentage points. These results demonstrate that generative video rendering mitigates the visual sim-to-real gap for zero-shot policy transfer.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "sim-to-real transfer; video generation models", "https://openreview.net/pdf?id=xxVgTVAjnv", "", ""], ["https://openreview.net/forum?id=Z4fyPsIQZU", "Rollout Aggregation Stabilizes On-Policy Reinforcement Learning", "", "Large-scale parallel PPO can struggle on complex, long-horizon tasks with high-dimensional action spaces. Prior work has emphasized exploration bottlenecks and diminishing returns from increasing environment parallelism. We instead present evidence that learning instability offers a compelling alternative explanation for PPO's poor performance. To improve stability, we introduce rollout aggregation, a minimal modification that retains the previous rollout and trains on it alongside newly collected samples. We show that overlapping rollout batches regularize the policy's optimization trajectory by preserving pressure to retain recently learned behavior while incorporating new experience. Across several challenging manipulation tasks, rollout aggregation prevents the collapse observed with standard PPO and outperforms strong baselines, including SAPG and CPO, with several-fold improvements in sample efficiency. Our findings motivate studying recent-data reuse as a mechanism for stabilizing policy learning and achieving strong, sample-efficient performance at scale.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "reinforcement learning; dexterous manipulation; policy optimization", "https://openreview.net/pdf?id=Z4fyPsIQZU", "", ""], ["https://openreview.net/forum?id=F9mbPCXVi8", "ScheduleGen: Demonstration Generation via Skill Scheduling for Multi-Arm Imitation Learning", "", "Multi-arm robot platforms, including bimanual and humanoid robots, have the capability to complete tasks with lower cycle times than single-arm systems, but they are more difficult to safely control due to the presence of multi-arm constraints. The paradigm of training generalist robot policies from massive datasets is a promising approach to address general-purpose multi-arm manipulation, but the acquisition of large multi-arm manipulation datasets remains a bottleneck. Automated demonstration generation can alleviate this burden by synthesizing new demonstrations from a handful of source demonstrations, but existing algorithms ignore multi-arm constraints and as a result often induce unsafe and unsuccessful behaviors. We address this limitation by introducing ScheduleGen, an integrated planning & scheduling algorithm for multi-arm demonstration generation. We evaluate ScheduleGen on 28 simulation task variants, including seven externally authored RoboDojo tasks and settings inaccessible to prior systems; it achieves 79.6% mean data-generation success and trains policies with 65.5% mean success. ScheduleGen policies outperform those trained on a state-of-the-art data generation baseline, and achieve 50-80% success across eight real-world tasks through zero-shot sim-to-real and real-to-sim-to-real transfer. Videos and more at: https://schedulegen.github.io/", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "data-generation; imitation-learning; sim-to-real; motion-planning; multi-arm-manipulation", "https://openreview.net/pdf?id=F9mbPCXVi8", "", ""], ["https://openreview.net/forum?id=EfNYDXLSUP", "SidewalkBench: Benchmarking Visual Navigation on Urban Sidewalks", "", "Urban sidewalk navigation presents significant challenges due to complex structural layouts, dynamic pedestrian behaviors, and long distances. While recent visual navigation models offer a promising solution, the lack of a unified benchmark hinders quantitative and reproducible evaluation. To bridge this gap, we propose SidewalkBench, a comprehensive benchmark designed for visual navigation on urban sidewalks. Built upon NVIDIA Isaac Sim, SidewalkBench brings GPU-accelerated simulation of diverse, high-fidelity sidewalk environments, including both procedurally generated and real-world scanned scenes. We further populate the scenes with rich, reactive event-based pedestrian behaviors and flexible, efficient animation, enabling standardized model evaluation under realistic real-world settings. We conduct a comprehensive evaluation of 9 visual navigation models on 330 unit-test scenarios, 800 pedestrian-reactive scenarios, and 105 long-horizon scenarios. Our findings highlight that pedestrian interaction and long-horizon robustness remain critical bottlenecks for existing models, and scaling up sidewalk training with synthetic data emerges as a promising solution.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "visual navigation benchmark; urban sidewalk simulation", "https://openreview.net/pdf?id=EfNYDXLSUP", "", ""], ["https://openreview.net/forum?id=gB9zlGOMek", "Sim-to-Real Transfer for Muscle-Actuated Robots via Generalized Actuator Networks", "", "Tendon drives paired with soft muscle actuation enable faster and safer robots while potentially accelerating skill acquisition. Still, these systems are rarely used in practice due to inherent nonlinearities, friction, and hysteresis, which complicate modeling and control. So far, these challenges have hindered policy transfer from simulation to real systems. To bridge this gap, we propose a sim-to-real pipeline that learns a neural network model of this complex actuation and leverages established rigid body simulation for the arm dynamics and interactions with the environment. Our method, called Generalized Actuator Network (GenAN), enables actuation model identification across a wide range of robots by learning directly from joint position trajectories rather than requiring torque sensors. Using GenAN on PAMY2, a tendon-driven robot powered by pneumatic artificial muscles, we successfully deploy dynamic but precise goal-reaching, ball-in-a-cup, and table tennis policies, trained entirely in simulation. To the best of our knowledge, this result constitutes the first successful sim-to-real transfer for a four-degrees-of-freedom muscle-actuated robot arm.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "sim-to-real; reinforcement learning; muscle actuation; pam; tendons", "https://openreview.net/pdf?id=gB9zlGOMek", "", ""], ["https://openreview.net/forum?id=eJRu9hYSJO", "SimFoundry: Modular and Automated Scene Generation for Policy Learning and Evaluation", "", "Training and evaluating robot policies in the real world is costly and difficult to scale.\nWe introduce SimFoundry, a modular and automated system for zero-shot real-to-sim scene construction from a video.\nSimFoundry generates sim-ready digital twins and supports object, scene, and task editing, enabling the automated generation of diverse digital cousins: affordance-preserving variations of reconstructed real-world scenes.\nPolicies trained on SimFoundry data transfer zero-shot to challenging real tasks involving multi-step manipulation, articulated object interaction, and bimanual interaction, and its digital cousins facilitate generalization to new real-world conditions.\nAcross 7 manipulation tasks and 5 policy architectures, SimFoundry simulation evaluations correlate well with real-world performance and strongly predict real-world policy rankings, with mean Pearson correlation 0.909 and mean maximum ranking violation 0.027. \nWhen evaluating sim-trained policies zero-shot in the real world, policies trained with object, scene, and task cousins in simulation show average task success rate improvements of 20\\%, 21\\%, and 40\\%, respectively. Additional details at https://simfoundry.github.io/.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "real-to-sim; sim-to-real; policy evaluation", "https://openreview.net/pdf?id=eJRu9hYSJO", "", ""], ["https://openreview.net/forum?id=0O2Q2idELA", "SkillWeaver: Agentic Exploration over Neural Interaction Skills for Scalable Robot Data Generation", "", "Large-scale demonstrations have driven rapid progress in robot learning, yet collecting robot data through teleoperation is expensive and difficult to scale to diverse environments and long-horizon tasks. GPU-accelerated simulation can generate experience at scale, but existing data-generation pipelines still rely on open-loop controllers, scripted skill sequences, or task-specific programs to produce behavior. We introduce SkillWeaver, an agentic framework that autonomously generates robot experience by exploring over Neural Interaction Skills (NIS): reusable, parameterized, closed-loop policies that expose learned physical interaction capabilities to a reasoning agent. A VLM agent invokes and parameterizes NIS in simulation, observes their outcomes, and organizes exploration as verifier-guided tree search with reflection and memory, discovering successful long-horizon behaviors without predetermined execution pipelines. SkillWeaver autonomously generates 39.1K verified demonstrations across 14.1K scenes, which we distill into visuomotor policies. Training on this experience substantially improves generalization on simulation benchmarks, enables zero- and few-shot sim-to-sim transfer, and more than doubles average real-world success on a Franka robot without any real-world teleoperation.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "agentic robot data generation; embodied exploration; sim-to-real transfer", "https://openreview.net/pdf?id=0O2Q2idELA", "", ""], ["https://openreview.net/forum?id=vmsPJdwqwl", "Steel: Simulation for Generalist Robot Learning", "", "GPU-accelerated simulation at scale has enabled reinforcement learning to produce locomotion and whole-body control policies that transfer to physical robots: thousands of identical environments simulated in parallel under a simple on-policy recipe such as proximal policy optimization (PPO). Manipulation presents a different scaling problem: robots must learn across a large space of tasks and embodiments, interacting with different objects, layouts and mechanisms, so simulation must scale not only the number of environments but their diversity. We present Steel, a GPU rigid-body contact solver for the open-source Newton physics engine whose arrays are laid out per environment: each environment's constraint rows and response vectors occupy a range of fixed capacity, its mass-matrix factor a range sized to its degree-of-freedom group, and the factorization kernels run over groups of articulations of the same degree-of-freedom count, so robots, objects, contact sets and degrees of freedom may differ across the environments simulated in parallel and no robot's factorization is padded to the largest one present; contact rows use a fixed per-environment budget. Steel reaches 4.6× PhysX's throughput (geometric mean over 20 Isaac Lab tasks, faster on all 20) and 1.8× MuJoCo Warp's (geometric mean over the same 20); with 5 to 20 scene types simulated in parallel, each solver at its own peak environment count, its throughput ratio to PhysX rises from 7.5 at 5 types to 12.6 at 20, with no result reported for MuJoCo Warp, whose evaluated backend shares model structure across worlds.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "gpu physics simulation; contact solvers; heterogeneous environments", "https://openreview.net/pdf?id=vmsPJdwqwl", "", ""], ["https://openreview.net/forum?id=DVSfvV3mAs", "SUN: Agentic Robot Policy Learning with Persistent Task Programs", "", "Model-based control can directly execute specified objectives, while learning can amortize such behaviors into reactive policies, making their combination a natural solution to multi-stage manipulation. We introduce Semantically UNified (SUN) Programs, typed executables that compile grounded relations into aligned optimal control objectives, satisfaction predicates, and learning rewards. Our harness, Kuafu, equips a foundation model as a task-level agent to orchestrate scene preparation, verification, residual RL, and data production. The agent uses program feedback to repair candidate programs and training diagnostics to calibrate relative reward weights, retaining accepted task semantics across tool calls. Across nine multi-stage manipulation tasks, Kuafu achieves 82.03\\% average success rate, significantly outperforming all learned baselines. The downstream visual-policy transfer zero-shot to physical Franka and Kinova robots, demonstrating sim-to-real generalization.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "robot learning; manipulation; model predictive control; reinforcement learning; sim-to-real; language grounding", "https://openreview.net/pdf?id=DVSfvV3mAs", "", ""], ["https://openreview.net/forum?id=7RmW8P1qnE", "Support-Constrained RL Enables Real-World Policy Improvement without Additional Real-World Experience", "", "Robots trained on real world data tend to be imprecise, slow, and brittle to perturbations. Improving these policies with reinforcement learning (RL) is an appealing alternative, but this process often requires expensive training in the real world. Performing policy improvement in simulation instead provides a far cheaper alternative, but unconstrained RL in simulation can exploit contact and dynamics mismatches, resulting in unsafe behaviors that do not transfer to hardware. Common forms of regularization can furthermore limit improvement by overconstraining to an imperfect behavior prior.  In this work, we propose Support-Constrained Off-Domain REinforcement (\\texttt{SCORE}), a real-to-sim-to-real framework that constrains RL in simulation to stay near the \\textit{support} of a generative policy pretrained on real data. We instantiate this constraint through \\textit{flow steering}, restricting \\texttt{SCORE} to explore through modes of the base policy, which ensures transferable behaviors while maximizing policy improvement. Improving a policy with \\texttt{SCORE} requires minimal effort: it learns from sparse rewards, avoids distillation, and leaves the base policy untouched. Across eight real-world dexterous multi-fingered robotic manipulation tasks, \\texttt{SCORE} improves average success rate from $38.6\\%$ to $89.3\\%$, compared to $59.8\\%$ for the best baseline, and completes tasks $36.7\\%$ faster than the base policy. Ultimately, through extensive experiments and ablations, we show that simulation can substantially improve real-world manipulation policies when policy optimization is appropriately constrained, introducing a new paradigm for real-to-sim-to-real policy improvement. Videos are available at https://score-anon.github.io.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "reinforcement learning; sim-to-real; dexterous manipulation", "https://openreview.net/pdf?id=7RmW8P1qnE", "", ""], ["https://openreview.net/forum?id=jmZMj6QkeI", "What Can Three Seeds and Fifty Rollouts Resolve? A Preregistered Audit of Operator and Seed Variance on robomimic Multi-Human Benchmarks", "", "Results on the robomimic Multi-Human benchmarks are conventionally reported as a mean over three training seeds, each evaluated with 50 rollouts. We preregistered the hypothesis that the variance caused by which operators' demonstrations are in the training set exceeds the variance caused by training seed. We tested it with 138 BC-RNN runs on Lift, Can and Square: ten seeds at fixed data, six leave-one-operator-out partitions, and six size-matched random partitions as a control, all evaluated at the final checkpoint on fixed initial states. The preregistered tests were not met on any task, and with six operators the procedure detects a true ratio of two only 18% of the time. With 50 rollouts, seeds cannot be told apart by success rate on any task, and two three-seed means on Square must differ by 12.7 points to be distinguished. Re-evaluating the 46 Square checkpoints with 500 rollouts, the 50-rollout success rates correlate only r = 0.56 with the 500-rollout ones, an apparent proficiency-tier pattern vanishes, and the operator contrast is not established.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "imitation learning; benchmarking; reproducibility; evaluation; variance components; preregistration; robomimic", "https://openreview.net/pdf?id=jmZMj6QkeI", "", ""], ["https://openreview.net/forum?id=JG9LX2V3XN", "When Robots Outweigh Objects: How Inertia Mismatch Shapes Robot Policy Learning", "", "Conventional robot arms can be extremely heavy compared with the everyday objects they manipulate, creating a significant inertia mismatch at contact. Even a small accidental bump from a heavy arm can knock a light object out of place. Modern learning methods have nevertheless demonstrated a wide range of successful manipulation behaviors on these platforms, suggesting that even extreme inertia mismatch can be overcome with sufficient data. However, it remains unclear whether high inertia imposes a hidden cost on learning, potentially worsening scaling with data and lowering the performance ceiling of modern robot learning methods. This question is hard to answer on hardware, where a robot's mass cannot be varied in isolation, so we use GPU-accelerated simulation as a controlled instrument: pushing experiments that vary robot and object masses while matching the free-space controller response. A reinforcement-learned policy succeeds across a broad range of masses, while behavior cloning learns more reliable policies when a lighter robot manipulates a heavier object. This finding can also guide how we use an existing robot: an arm's task-space mass varies with its posture. Choosing workspace placements and demonstration trajectories that favor lower contact inertia improves closed-loop imitation on contact-rich manipulation tasks in simulation, and the same workspace intervention also improves imitation on a real robot.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "gpu-accelerated simulation; behavior cloning; contact inertia; real-world validation", "https://openreview.net/pdf?id=JG9LX2V3XN", "", ""], ["https://openreview.net/forum?id=p6yUjibJia", "ZAP: Zero-shot Acceleration of Robot Policies Through Impedance-Augmented Residuals", "", "Robot policies trained by imitation inherit the slow pace of their demonstrations, and existing methods for accelerating them require per-task training. We present ZAP, a framework for $\\textit{zero-shot}$ policy acceleration with impedance-augmented residuals: learned corrections that offset the policy's pose targets and modulate the gains of the underlying controller. We train per-task residuals in simulation under a shared reinforcement learning objective and distill them into a single task-agnostic residual that transfers to new tasks and base policies. Across 20 held-out tasks in simulation, ZAP achieves the highest throughput among state-of-the-art acceleration baselines, without any in-domain demonstrations or interactions; on a real-world task, ZAP achieves throughput comparable to these baselines while maintaining the highest success rate, demonstrating zero-shot, sim-to-real transfer to an unseen scene and base policy.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "reinforcement learning; variable impedance; sim2real", "https://openreview.net/pdf?id=p6yUjibJia", "", ""], ["https://openreview.net/forum?id=g52Xqypuwy", "$\\tau_0$-VLA: a Hierarchical Robot Foundation Model with World-Model-Guided Test-Time Computation", "Xiaowei Cai, Yunuo Cai, Bingao Chen, Jingxiao Chen, Zhi Chen, Siyuan Feng, Tengyu Hou, Jingshun Huang, JiangHan, Runkun Ju, Dong Li, Mingxiang Li, Shaowei.Li, Xinchen Li, Yifan Li, Yi Liu, Zhongyuan Liu, Jianlan Luo, Junwen Miao, Ruiqi Ni, Buqing Nie, Mingjie Pan, Xinlin Ren, JianHeng Song, Jiaxu Wang, Peiqi Wang, Wangsen, Xiaoyan Wang, DafengWei, Dongming Wu, Pengwei Xie, Pu Yang, Hangjian Ye, Xiangyu Yue, Jinyu Zhang, Zhang Qinglin, ZhaoXueyong, Pengfei Zhou, Yue Zhou", "Long-horizon robot manipulation requires a robot to both execute individual skills reliably and sequence them coherently over extended tasks. Most hierarchical vision-language-action (VLA) models make each such decision with a single forward pass, leaving no mechanism to allocate additional computation to difficult or consequential choices. We introduce $\\tau_0$-VLA, a hierarchical robot foundation model that formulates high-level subtask generation as a compute-scalable inference problem through world-model-guided test-time computation. At each inference step, the high-level policy uses execution memory to generate a subtask and, when needed, searches over alternatives before committing to its output. A low-level policy then executes the generated subtask across multiple robot embodiments. The policy is trained on 40,115 hours of heterogeneous real-world data with multimodal co-training. Across in-domain and distribution-shifted settings, allocating additional test-time computation substantially improves next-subtask prediction accuracy, and these gains translate into higher closed-loop success on long-horizon robot manipulation tasks.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "vision-language-action models; world models; hierarchical planning; test-time computation; long-horizon manipulation", "https://openreview.net/pdf?id=g52Xqypuwy", "", ""], ["https://openreview.net/forum?id=Wc7zx1QgwO", "$k$-WM: Predicting $k$ Steps at Once for Long-Horizon Planning with World Models", "Xiaole Alex Jiang, Yinuo Wang, Lerrel Pinto, Yann LeCun, Gaoyue Zhou", "Latent world models are learned abstractions of environment dynamics that can be planned over at test time, enabling goal-conditioned optimization and generalization across tasks with a single model. In practice, however, planning success remains limited to short horizons, and gradient-based planners driven by autoregressive rollouts still underperform sampling-based methods. We hypothesize that two properties of next-step prediction contribute to these limitations: autoregressive rollouts compound prediction errors, and planning gradients must traverse a chain of nested model calls. We introduce $k$-WM, a minimal extension to transformer-based JEPA world models: a multi-horizon training objective and input layout that let the predictor map an action sequence to the future latent states in a single forward pass. Across three classes of JEPA world models and four environments, $k$-WM improves gradient-based planning by 37\\% and sampling-based planning by 15\\% over the existing next-step world models it extends, and reduces long-horizon inference cost. Our analysis shows that the gains coincide with substantial changes in the learned representation, suggesting that the prediction horizon shapes the abstraction a world model learns for planning. Additional results and planning rollouts are available at https://anon-k-wm.github.io.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; jepa; planning", "https://openreview.net/pdf?id=Wc7zx1QgwO", "", ""], ["https://openreview.net/forum?id=6yJrUIPvj2", "Agent Priors-guided Policy Learning", "Puming Jiang, Tianrun Hu, Haozhe Du, Yibo Li, Zhiwei Xue, Xinhu Li, Harold Soh", "Robots that learn from a few demonstrations often require two forms of generalization. Compositional generalization recombines skills to solve new tasks, and skill generalization lets the learned policy behind each skill work in new situations. The two depend on each other, yet information is lost between composition and the skills it calls. Where a skill works is determined by the structure its policy is trained with, while composition sees the skill only through a separate description, such as a name, an instruction, or a symbolic operator, that omits this structure. Our key idea is to use each policy's structural prior as part of the interface between composition and the skill. A structural prior states what a behavior depends on, for example that a grasp depends only on the gripper's pose relative to the object. Built into training, it shapes where the policy generalizes; stated in language, it tells composition where the policy applies. We instantiate this idea in Agent Priors-guided Policy Learning (APPL). A construction agent segments complete demonstrations into reusable skills, proposes several structural priors for each skill, and trains and verifies one policy per prior. A runtime agent then selects among these prior-specific policies and composes them toward new task goals using their interfaces. Across MetaWorld and long-horizon ManiSkill tasks, APPL improves out-of-distribution skill generalization and enables previously unseen skill compositions; ablating the interface information substantially reduces performance. These results support the use of training-time structural assumptions as a bridge between skill learning and skill composition.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "robot learning; agent; compositional generalization", "https://openreview.net/pdf?id=6yJrUIPvj2", "", ""], ["https://openreview.net/forum?id=gxEC7M0oZj", "Agentic Hypothesis-Driven Active Learning of Natural-Language Robot Skill Models", "Benned Hedegaard, Naman Shah, Sumeet Batra, Rohun Tripathi, Alvaro Herrasti, Dieter Fox", "To operate safely and effectively, a robot must understand, and therefore model, the bounds of its capabilities. Prior work has traditionally sought to learn such models using symbolic abstractions, imposing strong biases on the space of expressible and learnable models. The recent advent of agentic systems has opened the possibility of using frontier models for robot decision-making. In place of symbolic models, an agentic system (i.e., agent) interfaces with its skills as modular tools, documented by text descriptions of their arguments and behavior. We study how agents can use experimentation to adapt these interfaces, and whether such experimentation can allow them to autonomously learn skill models that improve downstream planning capabilities. Our evaluations use simulated block-stacking tasks whose motor skills have hidden preconditions and stochastic effects, comparing a naive agent free to experiment as it chooses against a structured agent whose harness requires explicit hypotheses and planned trials, each experimenting either open-ended or guided by example tasks. We find that skill descriptions learned through experimentation improve downstream planning performance, and can even outperform expert-designed descriptions; that our structured harness provides complementary benefits to those obtained through example task guidance; and that the structured agent's experiments are more controlled and replicated, beyond what its harness explicitly requires.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "agentic robotics; active learning; model learning; experimentation", "https://openreview.net/pdf?id=gxEC7M0oZj", "", ""], ["https://openreview.net/forum?id=d0QoEpVBxX", "AIDA:  A Neuro-symbolic Framework for Planning and Residual Learning of Multi-task Robot Policies", "Ziyi Yang, Jiayuan Mao, Stefanie Tellex, George Konidaris, Karl Berntorp", "Pretrained robotic foundation models can be adapted to a new environment by finetuning on human demonstrations, enabling a single network to perform multiple skills. However, after this initial adaptation, two challenges remain: composing the resulting skills to solve long-horizon tasks, and further improving their reliability without collecting additional demonstrations. Abstraction learning supports skill composition, but the learned abstractions rarely contribute to improving the underlying skills. Reinforcement learning offers a way to improve skill execution, but existing approaches rely on task-specific reward design and do not directly support skill composition.\nTo address this gap, we propose Abstraction Invention for Decision-making and Adaptation (AIDA), which learns a symbolic transition model to support task planning and uses it to train residual policies that improve the base policy. We present preliminary results on the CALVIN benchmark showing that learned abstractions allow multiple skills of the same base policy to be both composed and improved.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "long-horizon manipulation; planning; reinforcement learning", "https://openreview.net/pdf?id=d0QoEpVBxX", "", ""], ["https://openreview.net/forum?id=zIR8mVMqdd", "Are Vision-Language-Action Models ready for Task and Motion Planning?", "Christopher M. Smith", "Current task and motion planners (TAMP) are limited by the human engineering required to design motor skills. Could learned generalist policies such as vision-language-action (VLA) models supply the motor skills that TAMP systems such as TiPToP lack? We discuss what is necessary to use VLAs as skills inside TAMP and show that current VLAs fall short. We believe that to effectively utilise learned generalist policies inside of task and motion planning, the policy must meet four conditions: it must only manipulate objects specified by invoked operators, it must cause no unintended side effects, it must know when to terminate, and its competence must be predictable from a symbolic state. We build a hybrid system, based on TiPToP [1], which learns operators for VLAs from training data, and uses a vision language model (VLM) to check each step executed successfully, and triggers a replan if not. On five RoboLab tasks, no method completes any task, yet the hybrid system scores highest on four of the five. We also found that aligning actions produced by the motion planner to the VLA’s training\ndistribution increases the VLA’s downstream competence.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "vision-language-action models; task and motion planning; operator learning", "https://openreview.net/pdf?id=zIR8mVMqdd", "", ""], ["https://openreview.net/forum?id=2usjb66X4r", "Beyond Point Transitions: Learning Skill Effect Sets for Compositional Planning", "Jeffrey Jewett, Sandhya Saisubramanian", "Robots complete long-horizon tasks by chaining together a sequence of pre-trained skills. Existing approaches use coarse high-level abstractions for planning with skills, often producing plans that are not feasible for execution. This infeasibility is only discovered after many unsuccessful attempts to refine skill parameters for execution.  We present Skill Effect Sets (SES), an approach to learn the range of states that a skill can reach under its continuous parameterizations. SES is learned from skill executions with a contrastive objective. We also present SES-Guided Interleaved Skill Chaining (SES-ISC), a planning algorithm that leverages SES by refining skills over sets of reachable states rather than individual skill parameters. SES-ISC focuses exploration on previously unreached state regions, allowing it to quickly prune infeasible plans from imperfect high-level abstractions.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "hierarchical planning; abstraction learning; skill chaining", "https://openreview.net/pdf?id=2usjb66X4r", "", ""], ["https://openreview.net/forum?id=HtIg8Z5LnU", "BIFROST: Bridging Invariant Feature Representation for Observation-space Sim2Real Transfer", "Yunfu Deng, Josiah P. Hanna", "Sim2real transfer for robot policy learning suffers due to mismatch between simulation and reality. Existing methods typically address each gap in isolation through separate adaptation modules, which are composed or layered when both gaps coexist. Yet the basis for attempting sim2real in the first place is that there is shared structure between a task in simulation and reality, where equivalent actions from equivalent configurations produce equivalent long term outcomes regardless of domain specific differences in rendering or physics. In this paper, we study whether we can identify and exploit this shared structure from raw observations to train a policy that enables zero shot transfer.\n% \nWe introduce BIFROST, which learns a shared history encoder on paired cross-domain data via cross-domain bisimulation objective: observation-action sequences leading to equivalent long-term behavior are mapped to nearby latent states, regardless of domain. \nPolicies trained on these latent states in simulation transfer zero-shot to reality. We provide empirical evidence on sim2sim visual navigation and sim2real contact rich manipulation task and visual servoing task that BIFROST achieves effective transfer where domain adaptation and co-training baselines fail under both visual and dynamics domain gaps.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "representation learning; sim2real; reinforcement learning", "https://openreview.net/pdf?id=HtIg8Z5LnU", "", ""], ["https://openreview.net/forum?id=eznUHGM2SP", "CaPE: Code as Path Editor for Grounding Language Communication in Multi-Agent Coordination", "Haojun Shi, Suyu Ye, Katherine M. Guerrerio, Jianzhi Shen, Yifan Yin, Daniel Khashabi, Chien-Ming Huang, Tianmin Shu", "Successful coordination among decentralized agents requires each agent to quickly adapt its plan to the behavior of other agents. One common way to achieve such adaptation is to ground other agents’ language communication in plan adjustment. Despite recent advances in language-conditioned policy learning, it remains difficult for existing methods to achieve robust, safe, and fast language grounding in multi-agent coordination. In particular, there are two unique challenges for path-level coordination: (1) selecting among multiple plausible coordination path plans and (2) continuously refining a selected path locally. To address these challenges, we propose CaPE (Code as Path Editor), a novel method for grounding language communication in multi-agent coordination. CaPE first generates topologically distinct candidate paths for the target agent and predicts other agents’ paths using a homotopy-aware joint planner. It then leverages a vision-language model (VLM) to write a path-editing program based on language communication from a partner, selecting a path and adjusting it as intended by the partner. To ensure feasibility and safety, a verifier checks each edit line by line and rejects any that violate physical constraints. We evaluate CaPE in simulated multi-robot coordination, human-robot teaming in cluttered household apartments, and real-world joint carrying with human partners using a mobile manipulator. CaPE substantially outperforms strong baselines, including frontier VLMs, across all settings. Driven by a small fine-tuned VLM, CaPE also runs efficiently, supporting on-the-fly adaptation.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "human-robot interaction", "https://openreview.net/pdf?id=eznUHGM2SP", "", ""], ["https://openreview.net/forum?id=QMhuFDn7GI", "CausalDreamer: Learning Predictive World Models with Latent Disentanglement", "Prince Jha, Nils Lukas, Kun Zhang, Salem Lahlou", "World models for control must capture which aspects of the environment respond to the agent's actions and which are relevant to reward. Generative world models such as Dreamer 4 consist of a video tokenizer, which encodes each frame into a latent, and a dynamics model, which is pretrained to predict future latents from past latents and actions. Yet the tokenizer is trained with a reconstruction objective, without action or reward supervision, so its latent provides no explicit mechanism to separate controllable, uncontrollable, reward-relevant, and reward-irrelevant information. We propose \\textit{CausalDreamer}, which keeps the tokenizer frozen and re-encodes its latent into a factored representation of four groups along two axes: controllability, where only the two controllable groups receive the action, and reward relevance, learned by predicting the reward from the two reward-relevant groups. The pretrained dynamics model is then fine-tuned to predict the factored representation. We evaluate \\textit{CausalDreamer} and the pretrained world model it starts from with model-predictive planning on 20 MMBench2 tasks: 10 clean tasks seen during training and 10 unseen tasks, of which 6 are manipulated variants of clean tasks with a changed background, object, or maze layout, and 4 are new environments. We normalize returns so that a policy taking uniformly random actions scores 0 and an expert scores 1. \\textit{CausalDreamer} achieves a 14\\% higher normalized score than the pretrained world model on the clean tasks (0.199 vs.\\ 0.175) and a 25\\% higher score on the manipulated variants (0.307 vs.\\ 0.246), while neither model scores meaningfully above the random policy in the new environments. Additionally, our analysis shows that the factored representation separates reward-irrelevant changes, such as a changed background, from its reward-relevant groups.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; representation learning", "https://openreview.net/pdf?id=QMhuFDn7GI", "", ""], ["https://openreview.net/forum?id=BDE6ZgxpKm", "CLEAR: Capability-Aware Latent Ordering for Adaptive Interaction with Movable Objects", "Joonhyung Lee, Sangbeom Park, Jeongsoo Lim, Jaesang Sun, Kyeong-Jae Lee", "Planning physical interactions in cluttered environments requires reasoning about robot capabilities.\nFor example, a legged robot may climb stairs, while a wheeled robot may need an alternative route.\nHowever, the ability to move objects does not ensure task completion, as the interaction order and resulting object configurations can block subsequent actions.\nTo address this challenge, we propose a capability-aware planner that jointly determines which objects to interact with, in which order, and how to move them.\nOur planner, Capability-Aware Latent Ordering for Adaptive Interaction with Movable Objects (CLEAR), learns to select objects and propose alternative interaction orders from scene observations and robot structure.\nFor each proposed sequence, it generates object references, conditioning each prediction on those planned for preceding interactions.\nThe planner checks whether candidate plans are feasible in the proposed interaction order, selects the valid candidate with the fewest object interactions, and replans from updated observations during execution.\nOur approach is evaluated in three simulation environments: 2D grids, ordered manipulation, and maze navigation.\nThe maze experiments assess the effect of robot-structure conditioning and the ability to replan when environmental perturbations block access to required objects.\nCode, videos, and results are available at\n\\url{https://joonhyung-lee.github.io/clear/}.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "learning for planning; action abstraction; task and motion planning; generative models; embodiment-aware planning; planning among movable objects", "https://openreview.net/pdf?id=BDE6ZgxpKm", "", ""], ["https://openreview.net/forum?id=QxJUFGvpNs", "Collision-Conditioned Reasoning and Planning for Autonomous Manipulation from Partial View Point Clouds", "Ashton Larkin, Tucker Hermans", "Placing an object in a cluttered scene requires choosing a grasp, a placement pose and a collision-free trajectory that work together. Prior work shows that jointly reasoning about pick and place is essential for place success, but relies on hand-defined placement costs and slow optimization. Learned collision models can screen candidate placements from partial-view point clouds, but existing pick and place systems that use them commit to a grasp before searching for a placement. We present a collision network that predicts, from partial-view point clouds of the object and environment, whether the object collides with the environment at a candidate placement pose. We combine this network with a learned grasp generator and a GPU-vectorized motion planner to form a collision-conditioned pick and place planning framework that plans for many grasp and placement pairs in parallel. In hardware experiments, our approach is roughly 3.5$\\times$ faster than a joint pick and place optimization baseline.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "robotics; manipulation; motion planning; grasping; probabilistic inference", "https://openreview.net/pdf?id=QxJUFGvpNs", "", ""], ["https://openreview.net/forum?id=liZo8BXIJ5", "cuArms: GPU-Accelerated Conflict-Based Planning for Multi-Arm Manipulation", "Philip Huang, Fabio Ramos, Jiaoyang Li, Caelan Reed Garrett, Lars Johannsmeier", "Multi-arm manipulation has the potential to dramatically improve the throughput, efficiency, and dexterity of many manipulation tasks. Recent work coordinates multiple robot arms in a shared workcell by allocating and scheduling tasks for greater parallelism, jointly planning multi-arm motions, or directly learning multi-arm policies. So far, these approaches are either too slow, rely on domain-specific assumptions, or scale poorly with the number of robots and task horizon. Thus, we introduce cuArms, a conflict-based planner co-designed with GPU parallelism that efficiently decomposes the search space using reusable multi-modal roadmaps for individual robots and resolves conflicts and deadlocks through a lazy search. To jointly optimize task assignment, schedules, motions, and manipulation\nskills, we integrate a high-level scheduler that proposes candidate skeletons for cuArms to ground into coordinated manipulation\nplans. This scheduler can also be a coding agent: given the cuArms API, an off-the-shelf coding agent writes and optimizes the samplers, schedule skeletons, and costs for each new problem, while cuArms generates highly coordinated multi-arm motions. Experimental results show that our method establishes a new state of the art, with real-time initial solutions and anytime improvements in both motion quality and scheduling, without days of domain-specific training required by learning approaches. With Claude Opus 5.5 or GPT-6 Astra as the\nscheduler, the system outperforms our hand-designed schedulers, with 31% and 52% lower makespans, respectively. Videos of\nboth simulated and real-world industrial tasks are available on https://cuarms.github.io/.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "multi-arm manipulation planning; agentic planning; task and motion planning", "https://openreview.net/pdf?id=liZo8BXIJ5", "", ""], ["https://openreview.net/forum?id=6sFbcwHnEn", "DemoStream: Batched Task-and-Motion-Plan Optimization for Automated Learning from Demonstration", "Caelan Reed Garrett, Neel Jawale, Fabio Ramos", "Learning from demonstration is an effective strategy for endowing robots with manipulation capabilities but requires training on datasets comprised of massive amounts of demonstrations. Existing demonstration collection approaches either require constant human involvement, for example, via teleoperation or are specialized for a single task. Task and Motion Planning (TAMP) systems are able to autonomously solve and therefore generate demonstrations for general-purpose tasks; however, learning from their demonstrations has proven difficult due to multi-modality in their solutions. In this work, we build on recent work leveraging GPU acceleration for TAMP and propose DemoStream, a TAMP system that optimizes demonstration quality in order to improve behavior cloning success rates. First, we introduce batched TAMP sampling operations along with a new TAMP algorithm that correspondingly performs batched constraint satisfaction in order to explore many solutions in parallel. We conduct simulation experiments ablating different action spaces, cost functions, and batch sizes to analyze the effect of these choices on downstream policy success rates. Finally, we show that we can leverage the safety guarantees of TAMP to directly collect real-world demonstrations at an average rate of 66 demos per hour. See our website for policy rollout videos: https://demostream.github.io.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "task and motion planning; imitation learning; agentic planning", "https://openreview.net/pdf?id=6sFbcwHnEn", "", ""], ["https://openreview.net/forum?id=AcBIRCFRq8", "Disentangled Representations Enables Zero-Shot Visual Generalization in Robot Manipulation", "Sumeet Batra, Jeremy Morgan, Gaurav S. Sukhatme", "Training vision-based manipulation policies that are robust across diverse visual environments remains an important and unresolved challenge in robot learning. Current approaches often sidestep the problem by relying on invariant representations such as point clouds and depth, or by brute-forcing generalization through visual domain randomization and/or large, visually diverse datasets. However, historically and across disciplines, simple, parsimonious solutions have stood the test of time. In this work, we investigate whether emergent compositional representations, specifically disentangled representations, from a self-supervised learning auxiliary objective on high-dimensional RGB data can yield the same, if not better, visual generalization on robot manipulation tasks as brute-force scaling from pretraining. We provide empirical results that disentangled representations improve zero-shot visual generalization capabilities on modern robot learning benchmarks under adversarial visual perturbations in simulation and on real hardware. We believe this work marks a significant step towards manipulation policies that are adaptable out of the box, and a path towards compositional generalization that does not rely on large-scale pretraining.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "robot learning; disentangled representation learning; compositional generalization; visual generalization; robot manipulation; imitation learning", "https://openreview.net/pdf?id=AcBIRCFRq8", "", ""], ["https://openreview.net/forum?id=Lt6tewJ0RI", "DynaCoDiff: Density-Space Diffusion for Multi-Robot Planning in Dynamic Environments", "Chunxuan Jiao, Han Gao, Dusk Ding, Yunze Hu, Jiayu Yuan, Zhejia Wen, Luolina, Chang Liu", "Online planning for large robot teams must coordinate collective motion under moving obstacles and uncertain observations. DynaCoDiff represents group motion as Gaussian mixture model (GMM) trajectories. Differentiable collision costs guide a learned motion prior using group spatial spread and obstacle-prediction uncertainty. Gaussian transport generates individual references for distributed model predictive control, while planning continues during execution. In mixed dynamic–static environments with 500 robots, DynaCoDiff achieves 86% task success, compared with 0% for a reactive reinforcement-learning policy. Gaussian safety margins outperform isotropic-inflation and mean-only alternatives across four observation-noise settings. These results support density abstractions for connecting learned motion priors, obstacle beliefs, and individual execution.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "multi-robot motion planning; diffusion models; density abstraction; dynamic obstacle avoidance; uncertainty-aware planning", "https://openreview.net/pdf?id=Lt6tewJ0RI", "", ""], ["https://openreview.net/forum?id=u3JzQTSt1e", "EMBODIEDSWE: Coding Agents for Long Horizon Dexterous Robotics", "Haoxiang You, Zeyu Shen, Yilang Liu, Zhicheng Zheng, Lihan Zha, Kashu Yamazaki, Mingtong Zhang, Suning Huang, Jiankai Sun, Qianzhong Chen, Luxi He, Kaiyuan Liu, Haoran Chang, Katerina Fragkiadaki, Dhruv Shah, Mac Schwager, Peter Henderson, Ian Abraham, Canwen Xu", "We study coding agents for long-horizon, dexterous robotics and ask whether their solutions can provide scalable supervision for learning general robot policies. To test this, we develop EMBODIEDSWE-BENCH, a simulation benchmark for coding agents spanning contact-rich manipulation, deformable objects, and long-horizon tasks requiring up to half an hour of continuous interaction. We\nfind that frontier coding agents can solve complex long-horizon tasks and transfer prior solutions across both tasks and embodiments. We also design supporting tools that help agents more effectively solve these tasks. However, the resulting solutions require substantial iterative interaction and are typically specialized to individual task instances. We therefore introduce EMBODIEDSWE-GEN,which expands a single solution from coding agent into large diverse trajectories for training a VLA. VLA performance improves with more generated demonstrations, and agent-aided diversification improves generalization to held-out task variations. We also show that a VLA finetuned solely on coding-agent-generated simulation demonstrations completes a long-horizon task on real robot. Together, our framework uses coding agents to solve complex robotics tasks and turn verified solutions into scalable supervision for robot policies", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "coding agents; dexterous manipulation; robot learning", "https://openreview.net/pdf?id=u3JzQTSt1e", "", ""], ["https://openreview.net/forum?id=jxmiIoO6At", "EMPIRIC: Experiment-Driven Learning of Residual World Models for Robot Planning", "Yichao Liang, Amber Li, Dat Nguyen, Emily Bunnapradist, Michelangelo Naim, Sreela Kodali, Matteo Merler, Bowen Li, Kiran Gopinathan, Yiyun Liu, Nikhil Pimpalkhare, Joshua B. Tenenbaum, Adrian Weller, Zenna Tavares, Tom Silver, Kevin Ellis", "A robot should be able to learn through experiments how unfamiliar objects behave and interact, then plan with that knowledge.\nIt need not start from scratch: physics engines supply knowledge of motion and contact, but can omit entire mechanisms, such as glue curing, water heating, or wind.\nWe present EMPIRIC, an agent that learns a residual world model: a physics engine extended with code for the missing mechanisms.\nThe learned programs can introduce new forces, constraints, and hidden state, \nand Bayesian inference estimates their parameters and states from noisy observations.\nThe resulting model lets the agent predict the outcomes of actions, choose informative experiments, and revise its hypotheses when predictions fail.\nAcross five simulated domains, EMPIRIC learns interpretable, reusable models, and solves more tasks with fewer environment interactions than all three baselines. On a physical robot, it learns wind forces and domino masses to solve a manipulation task.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "code world models for planning; neuro-symbolic ai; robot learning", "https://openreview.net/pdf?id=jxmiIoO6At", "", ""], ["https://openreview.net/forum?id=Kcx90cUpXn", "Evaluating and Improving Task-Relevant Prediction in Robotic World Models", "Haibo Zhao, Jesse Zhang, Dieter Fox", "Using action-conditioned world models as simulators requires preserv-\ning task-relevant physical states and outcomes beyond visual plausibility. We eval-\nuate agentic, latent, and video-generative models on paired successful and failed\nmanipulation trajectories spanning pick-and-place, contact-driven reorientation,\nand long-horizon composition. Object and end-effector pose errors complement\noutcome prediction over full trajectories and local interaction segments on seen\nand held-out starts. Reliability depends on task and configuration: an agent-built\nsimulator predicts pick-and-place well but struggles with reorientation and com-\nposition, while the evaluated Wan 2.2 configuration better preserves these out-\ncomes. Latent-model readouts can be accurate on observed images yet degrade\nto near-chance outcome prediction during rollout. An additional study finds im-\nprovements from multiview and multimodal learning.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; planning with world models", "https://openreview.net/pdf?id=Kcx90cUpXn", "", ""], ["https://openreview.net/forum?id=ELddZJx2NU", "Evaluating Long-Horizon Robot Planning under Uncertainty", "Harsh Muriki, Gayathri Aravindan, Yuchen Zheng, Sonia Chernova", "Household robots must successfully navigate imperfect circumstances, both in their internal models and the external world. We introduce a benchmark of seven long-horizon household tasks in Habitat that vary initial robot memory and environment configurations. We evaluate adaptations of ReAct, VLM-TAMP, and Tru-POMDP within a shared execution framework across 90 tasks--environment--memory combinations, totaling 1,350 episodes. Our evaluation measures task success, partial completion, and action efficiency, along with rule-based analysis of execution traces. ReAct achieves the highest overall task success (45.3\\%) and completion (71.7\\%), while having accurate initial memory does not consistently yield the highest performance for every planner. We identify recurring placement errors, precondition errors, and redundant actions through trace analysis. These findings highlight differences in how the evaluated planners use initial knowledge and respond to uncertainty.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "task and motion planning; uncertainty; planning; vlm", "https://openreview.net/pdf?id=ELddZJx2NU", "", ""], ["https://openreview.net/forum?id=661Q6HJnfB", "Evaluating Representational Reliability Across World Models", "Shobhit Gupta, Maanya Cola Bharath, Chirag Shah", "The term \"world model\" now spans latent predictive encoders, masked reconstruction models, recurrent dynamics models, and video predictors, increasingly proposed as general engines for prediction, planning, and physical reasoning. We treat world model evaluation as a problem of matching claims to evidence: what information is recoverable from frozen, pooled representations, and how does it relate to their benchmark-label geometry? We analyze V-JEPA 2, VideoMAE v2, and DreamerV3 on IntPhys2, combining latent geometry metrics, supervised probes, and saliency-based background suppression. Condition and camera-type labels are recoverable under the evaluated protocol, while global condition clustering remains weak despite positive unsupervised clustering. Background suppression increases 5-NN condition accuracy with small observed changes in condition silhouettes, while nearest neighbor margins change in different directions. Together, these diagnostics characterize label recoverability, local neighborhoods, and global condition geometry as distinct properties of the evaluated readouts. The findings are specific to the pooled representation pipelines; they do not establish a causal explanation of world model unreliability or demonstrate planning utility.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; intuitive physics; representation evaluation", "https://openreview.net/pdf?id=661Q6HJnfB", "", ""], ["https://openreview.net/forum?id=Ess8wZF1rg", "FEIJOA: Task-Driven Grounding and Execution for Mobile Manipulation", "Aditya Agarwal, William Shen, Sahit Chintalapudi, Lucy Cai, Nishanth Kumar, Aidan Curtis, Travis Manderson, Tomás Lozano-Pérez, Leslie Pack Kaelbling", "A mobile manipulator asked to ``put the toys away in the toy box'' must decide which objects are toys and which container the user means, then find base poses, grasps, and placements it can execute. Because a scene representation is built before the instruction is known, it may lack the attributes, affordances, or concepts needed to resolve the task. We present FEIJOA, a language-model agent that grounds the instruction at test time. It queries a grounding tool over a posed RGB-D scan, inspects the returned candidates, and refines its queries until they resolve the instruction. An embodiment-aware harness checks each skill's preconditions, samples base poses from which the target is reachable, and verifies the skill's effect from observations before and after execution. On 103 open-ended grounding queries, FEIJOA resolves 94.2% exactly, compared with 68.0% for the best prebuilt representation. Over 50 real-world trials on Spot, it completes 35 tasks; 17 of these successes follow recovery from a failed tool call or verification check. Of the 15 failed trails, 13 were caused by the robot's physical skills, and only 2 by grounding or the agent's reasoning.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "mobile manipulation; language-model agents; task-conditioned grounding", "https://openreview.net/pdf?id=Ess8wZF1rg", "", ""], ["https://openreview.net/forum?id=YOmlZrbwsb", "FRAME: Towards Neuro-Symbolic World Models for Task and Motion Planning", "Timo Stoll, Daniel Swoboda", "Latent world models are an increasingly popular way to learn the dynamics and control of manipulation tasks. However, especially for longer-horizon tasks like TAMP problems, symbolic task-level representations are useful abstractions to increase their tractability. FRAME represents ongoing work towards combining these two concepts into a single predictive model, using a bi-level scene graph as the underlying state representation. A
