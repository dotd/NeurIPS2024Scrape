<title>CoRL 2026 Workshops</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #222; background: #fff;
         height: 100vh; display: flex; flex-direction: column; }
  nav { flex: none; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #ddd; }
  nav b { margin-right: 12px; }
  nav button { padding: 6px 14px; border: 1px solid #bbb; border-radius: 6px; background: #f6f6f6; cursor: pointer; }
  nav button.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  nav .stats { margin-left: 16px; color: #666; font-size: 13px; }
  nav .count { margin-left: auto; color: #666; }
  nav #clear { background: #fff; }
  .view { display: none; flex: 1; min-height: 0; overflow: auto; }
  #filters { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
             padding: 8px 16px; border-bottom: 1px solid #ddd; background: #f8fafc; }
  .facet { position: relative; border: 0; padding: 0; }
  .facet > summary { list-style: none; font-weight: normal; padding: 5px 12px; border: 1px solid #bbb;
                     border-radius: 6px; background: #fff; user-select: none; }
  .facet > summary::-webkit-details-marker { display: none; }
  .facet.on > summary { border-color: #2b6cb0; background: #e8f0fb; }
  .facet .panel { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; width: max-content;
                  min-width: 260px; max-width: min(460px, 90vw); max-height: 60vh; overflow: auto;
                  background: #fff; border: 1px solid #bbb; border-radius: 6px; padding: 6px;
                  box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .facet .panel input[type=search] { width: 100%; margin-bottom: 4px; padding: 4px 6px; }
  .facet label { display: flex; gap: 6px; align-items: baseline; padding: 2px 4px; cursor: pointer; }
  .facet label:hover { background: #f0f4fa; }
  .facet label small { margin-left: auto; padding-left: 12px; color: #777; white-space: nowrap; }
  #filters select, #filters button, #filters input[type=number] { padding: 5px 8px; border: 1px solid #bbb;
                                                                 border-radius: 6px; background: #fff; }
  #filters input[type=number] { width: 70px; }
  #q { width: min(320px, 100%); padding: 5px 8px; border: 1px solid #bbb; border-radius: 6px; }
  svg { width: 14px; height: 14px; vertical-align: -2px; fill: currentColor; }
  summary a.gh { color: #24292f; margin-left: 6px; }
  .sumbox { margin: 8px 0; }
  .sumbox button { padding: 3px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
  .htmlrow { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 0 0 8px; }
  .htmlbox button { padding: 3px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
  .sumbox .erase { margin-top: 6px; color: #b42318; }
  .sumbox details > div { white-space: pre-wrap; background: #f6f8fb; border-left: 3px solid #2b6cb0;
                          padding: 8px 12px; margin-top: 4px; max-width: 900px; }
  summary .stars { margin-left: 8px; color: #e0a100; font-size: 15px; letter-spacing: 1px; cursor: pointer; }
  summary .stars span:hover { color: #b47f00; }
  summary .sumflag { margin-left: 6px; font-weight: normal; font-size: 12px; color: #777; }
  summary .badges { font-weight: normal; color: #777; font-size: 12px; margin-left: 6px; }
  .view.active { display: block; }
  .btbar { position: sticky; top: 0; z-index: 4; background: #fff; padding: 8px 0; display: flex; gap: 8px; align-items: center; }
  .btbar select { padding: 5px 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px; }
  .btnum { color: #2b6cb0; font-weight: bold; }
  .rd { padding: 6px 0; border-bottom: 1px solid #eee; }
  .wa { margin: 4px 0; }
  .wa > button, .wa .panel button { padding: 3px 10px; border: 1px solid #bbb; border-radius: 6px; background: #f7f7f7; cursor: pointer; }
  .wa .panel { margin-top: 4px; }
  .wa textarea { display: block; width: min(100%, 640px); font: 13px/1.4 system-ui, sans-serif; margin-bottom: 4px; }
  .rd .rdtitle { font-weight: bold; }
  .rd .rdtitle a { font-weight: normal; margin-left: 8px; }
  .drive { margin: 4px 0; font-size: 13px; }
  .nextmov { margin: 4px 0; padding: 3px 10px; border: 1px solid #bbb; border-radius: 6px; background: #f7f7f7; cursor: pointer; }
  a { color: #2b6cb0; }

  /* table view */
  table { border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid #ddd; padding: 4px 6px; vertical-align: top; overflow: hidden; }
  th { position: sticky; top: 0; z-index: 1; background: #eef2f7; text-align: left;
       white-space: nowrap; text-overflow: ellipsis; cursor: grab; user-select: none; }
  th.drag-over { box-shadow: inset 3px 0 0 #2b6cb0; }
  th .resize { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; }
  th .resize:hover { background: #2b6cb0; }
  td div { max-height: 4.2em; overflow: hidden; overflow-wrap: anywhere; }  /* ~3 lines */
  tr:nth-child(even) td { background: #fafafa; }

  /* papers view */
  #papers { padding: 8px 16px; }
  details { border-bottom: 1px solid #eee; padding: 6px 0; }
  summary { cursor: pointer; font-weight: 600; }
  summary .kw { font-weight: normal; color: #555; }
  dl { display: grid; grid-template-columns: 180px 1fr; gap: 4px 12px; margin: 8px 0 4px 18px; }
  dt { color: #666; }
  dd { margin: 0; overflow-wrap: anywhere; }
  /* justified collage: row height follows the viewport, images grow by aspect ratio to fill each row */
  .collage { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px 18px; }
  .collage::after { content: ''; flex-grow: 999; }
  .collage a { display: block; }
  .collage img { display: block; width: 100%; height: auto; margin: 0; max-width: none; border: 1px solid #ddd; }
  details details summary { font-weight: normal; color: #2b6cb0; margin-left: 18px; }
  .movies { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px 18px; }
  .wsgroup { margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; padding: 6px 10px; background: #fbfaf7; }
  .wsgroup > summary { cursor: pointer; font-size: 15px; }
  .wsgroup > summary small { color: #666; margin-left: 8px; }
  .wsgroup > div { padding: 4px 0 4px 12px; }
  .movies video, .movies img { width: min(100%, 640px); background: #000; }
  .movies iframe { width: min(100%, 640px); aspect-ratio: 16 / 9; border: 0; background: #000; }
  details > img { display: block; max-width: min(100%, 900px); margin: 8px 0 4px 18px; }
</style>

<script id="data" type="application/json">{"columns": ["id", "title", "authors", "abstract", "🛠️ workshop", "🏷️ keywords", "pdf", "local_pdf", "💻 github"], "rows": [["https://openreview.net/forum?id=1IrAXpQ1cA", "An Adversarial Multi-Agent Pursuit Game for Locomotor Agility Pretraining", "Nathan A. C. Hogg, Matt Hyatt, Neil Klingensmith, George K Thiruvathukal", "Agile humanoid locomotion requires controllers that can adapt to rapidly changing motion demands while remaining stable and robust.     Recent locomotion controllers are typically designed with either a dense reward that is carefully shaped to encourage steps and penalize falling, or by using a reference tracking reward which teaches the controller to follow predetermined motions. Once a behavior that maximizes the reward is discovered, the controller ceases to learn. While generally stable, reference-tracking methods focus on motor control separately from motion generation. Self-play has been proven as an effective technique for superhuman performance on several multiagent games like go, Starcraft, hide-and-seek, and capture-the-flag. We train neural networks to play the game of multiagent tag in a physics simulator to study if new motion generation and control strategies can emerge through sparse feedback and competitive self-play.         We present MJTag, a task suite for role-conditioned locomotion during competitive pursuit-evasion. Our model is a role-conditioned policy for a low-level locomotion controller and optional planar velocity commands. MJTag's league-based-play with sparse feedback enables a locomotion controller to adopt new strategies, including dodging, sprinting, and tackling.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "locomotion; multi-agent; reinforcement learning; humanoid", "https://openreview.net/pdf?id=1IrAXpQ1cA", "pdfs/1IrAXpQ1cA_An Adversarial Multi-Agent Pursuit Game for Locomotor Agility Pretraining.pdf", ""], ["https://openreview.net/forum?id=c22DjhXdnt", "Beyond Dodge Rate: Testing Humanoid Dodgeball Under Camera Failures", "Kingston Kuan, Samuel J Chew, Khai Loong Aw, Brandon Ong", "Dodge rate measures whether a robot avoids an incoming ball, but can miss later task failure. We study this evaluation gap in simulated humanoid dodgeball, where task success also requires staying upright and keeping the pelvis within $1$ m of its starting position throughout a four-second trial. Controlled camera interventions test two fixed G1 policies. In a paired $64$-seed experiment, restoring fresh frames at $2$ s raises $\\pi_1$ success from $50.0$% to $95.3$%, while dodge rate remains $100$%. In a separate stale-to-blank control, blank input and fresh-image restoration rescue the same $31$ of $64$ trials for $\\pi_1$ and leave $\\pi_2$ success unchanged. Yet fresh frames bring both policies closer to their starting position by trial end than blank input does. These simulation findings support reporting post-encounter motion alongside contact, falls, and area compliance.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "humanoid robot systems; performance evaluation and benchmarking; sensor failures; visual feedback", "https://openreview.net/pdf?id=c22DjhXdnt", "pdfs/c22DjhXdnt_Beyond Dodge Rate  Testing Humanoid Dodgeball Under Camera Failures.pdf", "https://github.com/Hebbian-Robotics/beyond-dodge-rate"], ["https://openreview.net/forum?id=mXXom2FlZ1", "Joga: Learning Agile Humanoid Soccer Skills with Active Vision", "Avinash Narula, Khai Nguyen, Nolan Fey, Venki Parsuram, John Marangola, Martin Peticco, Pulkit Agrawal", "Humanoid soccer requires coordinating perception, whole-body motion, and foot--ball contact. Playing alongside humans further requires receiving fast passes, avoiding falls near people, and moving at speeds closer to human play. We introduce Joga (Joint Optimization of Gaze and Action), a full-stack system for humanoid dribbling, shooting, passing, and receiving using only onboard sensing. Each skill policy jointly controls the whole body and a custom 2-DoF actuated neck, and is trained through task-driven reinforcement learning in simulation. Rather than widening randomization to compensate for limited simulation fidelity, Joga aligns the simulator's perception and actuation to hardware using small amounts of real data, limiting domain randomization to only cover the remaining variability. On a Unitree G1, Joga achieves sustained dribbling at 1.7 m/s with an estimated peak of 2.3 m/s, executes sharp 135 degree turns, demonstrates single-touch receiving of passes at up to 5.2 m/s. These results show that limited real-world data and targeted modeling preserve fast, precise contact interactions, making Joga both capable of human-like skills and playable like a soccer video game.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "humanoids; whole-body control; sim-to-real transfer; reinforcement learning", "https://openreview.net/pdf?id=mXXom2FlZ1", "pdfs/mXXom2FlZ1_Joga  Learning Agile Humanoid Soccer Skills with Active Vision.pdf", ""], ["https://openreview.net/forum?id=jHVFOjXd85", "Joga: Learning Agile Humanoid Soccer Skills with Active Vision (Demo)", "Avinash Narula, Khai Nguyen, Nolan Fey, Venki Parsuram, John Marangola, Martin Peticco, Pulkit Agrawal", "Humanoid soccer requires coordinating perception, whole-body motion, and foot--ball contact. Playing alongside humans further requires receiving fast passes, avoiding falls near people, and moving at speeds closer to human play. We introduce Joga (Joint Optimization of Gaze and Action), a full-stack system for humanoid dribbling, shooting, passing, and receiving using only onboard sensing. Each skill policy jointly controls the whole body and a custom 2-DoF actuated neck, and is trained through task-driven reinforcement learning in simulation. Rather than widening randomization to compensate for limited simulation fidelity, Joga aligns the simulator's perception and actuation to hardware using small amounts of real data, limiting domain randomization to only cover the remaining variability. On a Unitree G1, Joga achieves sustained dribbling at 1.7 m/s with an estimated peak of 2.3 m/s, executes sharp 135 degree turns, demonstrates single-touch receiving of passes at up to 5.2 m/s. These results show that limited real-world data and targeted modeling preserve fast, precise contact interactions, making Joga both capable of human-like skills and playable like a soccer video game.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "humanoids; whole-body control; sim-to-real transfer; reinforcement learning", "https://openreview.net/pdf?id=jHVFOjXd85", "", ""], ["https://openreview.net/forum?id=Dj6r0KXsIk", "Learning Whole-Body Humanoid Sparring from Motion Demonstrations", "Agneya Tharun", "We present a simulated Unitree G1 humanoid robot sparring with another moving humanoid. We first train the fighter on recorded punches, kicks, and dodges, then use reinforcement learning to practice against previously trained opponents. In a continuous 90-second video, the fighter rises from the floor, guards, and strikes. We explain how the fighter was trained, how it chooses actions while fighting, and what separate evaluations show about striking and recovery.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "humanoid robotics; reinforcement learning; motion imitation; simulated sparring; whole-body control", "https://openreview.net/pdf?id=Dj6r0KXsIk", "pdfs/Dj6r0KXsIk_Learning Whole-Body Humanoid Sparring from Motion Demonstrations.pdf", ""], ["https://openreview.net/forum?id=eTJRjpOzOk", "Reflex: Visually Grounded Reactive Humanoid Control", "Taoyang jia, Weikai Huang, Linxin Song, Jared Darlington, Jieyu Zhao, Yue Wang, Jiafei Duan, Jason Ren, Ranjay Krishna", "Humans effortlessly react to the world; they catch a falling cup, step aside from a passing cart, or receive a box tossed during truck unloading. These everyday actions require anticipating a moving object and responding with the whole body within about a second, often by making contact with the arms and torso. Such visually reactive, contact-rich whole-body control remains challenging for humanoids, which must (1) coordinate whole-body contact, (2) react to object dynamics in real time, and (3) ground perception in egocentric vision. We study catching thrown boxes as a representative task that demands all three. We present Reflex, a three-stage framework that learns these capabilities stage by stage while connecting them through a compact representation of object dynamics: a state policy first learns whole-body catching with reinforcement learning, the policy then learns to infer box dynamics from delayed and incomplete observations, and an egocentric RGB-D encoder finally learns to recover this representation while the controller stays fixed. In simulation, Reflex catches 85.7% of throws from egocentric RGB-D, compared with 87.9% with privileged box observations. On a real Unitree G1, it catches human-thrown boxes with 65% and 40% success at 2.5 and 5 m, reaching 76% and 59% of human catchers’ success.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "humanoid control; reactive catching; physical human-robot interaction; dynamic contact; egocentric vision", "https://openreview.net/pdf?id=eTJRjpOzOk", "pdfs/eTJRjpOzOk_Reflex  Visually Grounded Reactive Humanoid Control.pdf", ""], ["https://openreview.net/forum?id=2pjEHAMaCZ", "RopeFormer: Cross-Trial Adaptation from Interaction History for Dynamic Rope Manipulation", "Menglin Wu, Kaixiang Yao, Shangbo Luan, Masayoshi Tomizuka, Yuxin Chen", "Fast manipulation of ropes is sensitive to uncertain mass, stiffness, and damping, yet explicitly identifying these properties online is difficult. We introduce *RopeFormer*, a history-conditioned policy that adapts across repeated interactions with the same rope by retaining action–response context, without online parameter estimation or policy-weight updates. A Transformer-XL policy is trained on multi-trial episodes with randomized rope–actuator dynamics. Matched simulation comparisons isolate the effect of retaining rather than resetting context in three tasks: single-arm rotation, bimanual rotation, and target-line whipping. On a Unitree H1-2 with previously unseen physical ropes, target-acquisition time improves by 30.9% and 33.9% for the two rotation tasks from trial 1 to 3, while whip target hits rise from 0.2 to 2.3 out of three. These results show that ordinary task execution can supply useful context for subsequent dynamic manipulation.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "dynamic rope manipulation; in-context adaptation; cross-trial memory; deformable object manipulation; reinforcement learning; humanoid robotics", "https://openreview.net/pdf?id=2pjEHAMaCZ", "pdfs/2pjEHAMaCZ_RopeFormer  Cross-Trial Adaptation from Interaction History for Dynamic Rope Manipulation.pdf", ""], ["https://openreview.net/forum?id=Lj0aErWl0u", "Seconds to Spare: Interception Slack for Fair and Graded Robot Tennis Benchmarks", "Hyunjun Yi, Bryan Bu, June Young Kim, Raiyan Mazhar", "Sport benchmarks for agile human-robot interaction must compare bodies that differ in speed, reach, and latency, and a raw success rate mixes what a body allows with what its controller achieves. We define the interception slack of a shot, the largest spare time with which an embodiment could bring its racket to the ball. It gives an exact feasibility ceiling for holonomic agents, upper and lower bounds for wheelchairs, and the ceiling under any added latency. In a tennis simulation with three bodies calibrated to published data and two robot archetypes, success factors into ceiling and efficiency, which reverses raw rankings. Slack marks 12 to 67% of shots as impossible for a given body and ranks the rest better than ball speed or travel distance in 8 of 10 body-policy pairs. Wheelchair tennis's two-bounce rule is worth 0.05 to 0.13 s of reaction time against a gap of at least 0.88 to 1.11 s to an able-bodied player, and in side-by-side human-robot doubles 15–24% of shots at 26 m/s and 36–47% at 22 m/s are reachable by both partners.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "benchmarking; human-robot interaction; robot sports; embodiment fairness; wheelchair tennis; interception", "https://openreview.net/pdf?id=Lj0aErWl0u", "pdfs/Lj0aErWl0u_Seconds to Spare  Interception Slack for Fair and Graded Robot Tennis Benchmarks.pdf", ""], ["https://openreview.net/forum?id=0SIsl52aer", "SHIFT-WORLD: A Coverage-Controlled Audit of Counterfactual Agents for Intent-Shifted Human–Robot Coordination", "Arefeh Yavary", "We study whether counterfactual intervention opportunity estimation improves shared-target human–robot decisions when robot participation is controlled. Earlier SHIFT-WORLD variants reduced simulated conflicts partly through excessive abstention; here, we audit that failure mode and evaluate a distinct opportunity-supervised extension under exactly matched action coverage.\n\nSynthetic paired potential outcomes train a learned intervention ranker, whose performance is compared to arrival, intent, commitment, and linear counterfactual baselines on five held-out conditions. Across 120,000 held-out scenarios and 600,000 policy evaluations, all compared policies intervene on exactly 40% of scenarios.\n\nUnder frequent intent changes, the opportunity model attains 63.84% team success and 2.52% simulated conflict, compared with 56.88% and 5.30% for Commitment. A linear counterfactual model is comparably strong (64.15% and 2.65%), limiting claims of nonlinear architectural superiority.\n\nA five-budget sensitivity sweep (20–60%) across all five test conditions audits whether conclusions depend on selecting one action budget. The contribution is a controlled empirical audit of participation-dependent safety claims and an opportunity-supervised intervention selection proof of concept; no physical collision-avoidance guarantee or real-robot transfer is established.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "human-robot interaction; agile robot learning; human intent prediction; risk-aware role arbitration; intent shift detection; safe human-robot collaboration; robot learning benchmarks; robustness evaluation; failure analysis", "https://openreview.net/pdf?id=0SIsl52aer", "pdfs/0SIsl52aer_SHIFT-WORLD  A Coverage-Controlled Audit of Counterfactual Agents for Intent-Shifted Human Robot Coo.pdf", ""], ["https://openreview.net/forum?id=Itk2H7KyQY", "Tag, You're Safe: Intention-Aware Barrier Filtering for Agile Physical Human-Robot Interaction", "Chenghao Huang, Johnathan Luu, Aryan Padarthi, Ethan Mingyi Ye, Adhvait Bireddy", "Sport-style physical human-robot interaction requires reaching a target held by a person at athletic speed while that person feints, dodges and lunges. We introduce PadTag, a seeded benchmark in which a torque-controlled arm must tag a hand-held pad under a torque, joint, 4 cm body-clearance and 0.5 m/s contact-speed envelope. Our method, IA-CBF, is a 200 Hz robust CBF-QP whose bound on partner acceleration comes from a goal-inferring Kalman filter: the bound resets to the physical worst case at detected intent switches and is calibrated on training partners. Over 10 seeds against an adversarial partner, every baseline without it (clamped, penalty-shaped and Lagrangian PPO, linear MPC, speed-and-separation monitoring) leaves 0.34 or more body and contact violations per episode. These are mostly unsafe tags. IA-CBF reduces them to 0.07 with success within about 5 points of the best baseline, and its pad-aware variant beats all such baselines on both axes. Ablations are consistent with the benefit coming from when the bound is relaxed, not from the predicted direction. The pipeline runs in 0.99 ms per step, and an a-posteriori bound shows where the guarantees stop.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "physical human-robot interaction; control barrier functions; safe reinforcement learning; agile phri; safety filter", "https://openreview.net/pdf?id=Itk2H7KyQY", "pdfs/Itk2H7KyQY_Tag, You re Safe  Intention-Aware Barrier Filtering for Agile Physical Human-Robot Interaction.pdf", ""], ["https://openreview.net/forum?id=KCkfldUqYH", "Where Does Regret Come From? Oracle-Substitution Diagnostics for Partner-Aware Agents", "Sangwan Dhawan Junior, NITISH KUMAR ROY", "Layered agents for doubles tennis must combine fast ball tracking, shot-level partner-intent decisions, and slower\nformation planning. Aggregate scores reveal overall performance but not which layer should be improved first. Oracle\nsubstitution is a standard way to locate error in modular systems; our contribution is a diagnostic protocol that\nmakes four of its choices explicit and reportable: oracle information, oracle strength, reference stack, and interaction\nbaseline. Beyond standard substitution, it reports gains from both reference stacks, Shapley attribution, an interaction\nexcess against an independence reference, and a clairvoyant/parameter-aware oracle pair that separates irreducible\nfrom reducible regret. We evaluate the protocol in a scripted, one-dimensional lateral-coordinate simulator inspired\nby RoboLetics Levels 3 and 5; this is a reduced abstraction rather than a full benchmark implementation. Across\n10 seeds and 4,000 episodes per configuration, clairvoyant substitutions attribute 82–100% of total regret to partner\nintent decisions, while the parameter-aware-to-clairvoyant medium-regret ratio ranges from 28% to 52%. At the\ndefault Level-5 setting, an online constant-step partner forecaster closes 59% of the reported reducible intent-regret\nmeasure and maintains positive gains under three scripted partner-mismatch conditions. These findings show that\nregret attribution depends on oracle assumptions and simulator design; they do not establish real-world human-intent\npredictability. We conclude with a regret-card reporting protocol and identify human-play validation as a necessary\nnext step.", "RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction", "human-robot collaboration; partner intent inference; oracle substitution; regret attribution; multi-agent systems; hierarchical decision-making; robotic coordination; simulation-based evaluation", "https://openreview.net/pdf?id=KCkfldUqYH", "pdfs/KCkfldUqYH_Where Does Regret Come From  Oracle-Substitution Diagnostics for Partner-Aware Agents.pdf", ""], ["https://openreview.net/forum?id=1WbNYYTPTM", "An Empirical Analysis of Controller Selection for Safe Execution of UMI-Style Policies", "", "Handheld devices such as the Universal Manipulation Interface (UMI) enable scalable, embodiment-agnostic data collection for behavior cloning. The resulting policies predict Cartesian end-effector trajectories and delegate execution to a robot-specific controller, which trades off tracking accuracy with compliance. However, current policy evaluation protocols treat the controller as a fixed implementation detail, conflating policy and execution errors. We disentangle the two by replaying real handheld demonstrations on a simulated Franka FR3 while varying only the controller across speeds, payloads, and contact-directed reference errors. We find that controller choice alone substantially changes task success, even for kinematically feasible references; soft impedance closes the drawer in only 6\\% of trials at nominal speed, whereas tuned impedance always succeeds. Under a 20\\,mm reference error, stiff position control drops to 0\\% success on bottle placement and uprighting, while compliant controllers risk applying insufficient force. Force-aware residual control mitigates this trade-off, yet no single controller performs best under learned flow-matching policies. We argue that the community should carefully consider the controller as an explicit tunable knob' during inference.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "empirical analysis; umi-style policies; manipulation controllers", "https://openreview.net/pdf?id=1WbNYYTPTM", "pdfs/1WbNYYTPTM_An Empirical Analysis of Controller Selection for Safe Execution of UMI-Style Policies.pdf", ""], ["https://openreview.net/forum?id=1H7r3pWx5g", "Beyond Fixed Delays: Why the Time Scale of Inference Latency Matters for Robot Policies", "", "Asynchronous action-chunking policies are evaluated under a fixed inference delay, but on a robot, what runs beneath the policy (the inference server, a GPU shared with perception, the scheduler) makes latency vary from call to call. Measured on a consumer GPU, SmolVLA's latency is autocorrelated, and a co-located detector slows it by 58%, costing up to 39 points of success when replayed in simulation at tight slack. With the per-call delay distribution held fixed, how fast latency varies changes success on 12 Kinetix tasks by up to 33 points, in task-dependent directions. No function of the delay distribution, the fixed-delay success curve S(d) included, can predict this, but under a memoryless hazard S(d) bounds it. In tests registered before their results were inspected, the lower bound held on 9 unseen tasks while the upper bound failed on some. A model of how tasks recover from runs of overruns predicted on which tasks an intermediate time scale is worst (23 of 24 pairs). These cases come from executor starvation: they largely vanish when a starving robot holds its last action instead of stopping. We recommend reporting the time scale of deployment latency and the starvation fallback, and replaying measured latency in order.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "asynchronous execution; action chunking; inference latency; vision-language-action models; real-time chunking; robot policy evaluation; gpu co-location; pre-registration", "https://openreview.net/pdf?id=1H7r3pWx5g", "pdfs/1H7r3pWx5g_Beyond Fixed Delays  Why the Time Scale of Inference Latency Matters for Robot Policies.pdf", ""], ["https://openreview.net/forum?id=dTUSsgalaY", "Blind Dexterity: Whole-Body Humanoid Manipulation via Pure Proprioception", "", "We present blind, whole-body manipulation skills on a Unitree G1 humanoid using only onboard proprioception, without cameras, markers, force-torque, or tactile sensors. Despite this minimal sensing, trained policies exhibit push-resilient bipedal walking without IMU feedback, active football trapping, suitcase-handle search and lifting, and mounting a randomly positioned skateboard. Two choices beneath the policy are central: compliant position control exposes contact through joint-tracking deviations, and training withholds object state from the actor while rewarding object-dependent task completion. Blind policies trained from scratch learn to seek informative contact, whereas students distilled from object-aware teachers struggle to acquire these behaviors. Separate diagnostic estimators reveal that task-relevant object state becomes more decodable after contact, without rewarding estimation accuracy. We interpret this training design as \\emph{epistemic forcing}: withholding a perceptual shortcut encourages the policy to generate the evidence needed for control. Simulation ablations of previous-action inputs, gain scaling, and estimator feedback, together with qualitative hardware transfer, establish pure proprioception as a strong practical baseline and a foundation on which richer sensing can be layered. Project page and all videos: https://aditya.bhatts.org/BlindDexterity", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "humanoid robotics; proprioceptive sensing; compliant control; active perception; reinforcement learning; partial observability; policy distillation", "https://openreview.net/pdf?id=dTUSsgalaY", "pdfs/dTUSsgalaY_Blind Dexterity  Whole-Body Humanoid Manipulation via Pure Proprioception.pdf", ""], ["https://openreview.net/forum?id=ZufpMWf3yT", "Breaking Modality Entanglement in Vision-Language-Action Policies", "", "Vision-Language-Action (VLA) policies integrate multiple sensors to support robust robotic task execution, yet limited and homogeneous demonstrations can encourage reliance on spurious inter-sensor correlations rather than task-relevant evidence. We call this failure modality entanglement. It takes two forms: nuisance sensitivity, where corrupting an uninformative sensor still degrades the policy, and single-modality insufficiency, where the policy cannot act on the one informative sensor that remains intact. We study both failures on a BEHAVIOR-1K benchmark of 47 skills and on two real robots, and address them with Evidence-Gated Regularization (EGR), a training objective that leverages simple task knowledge to guide the policy toward the most relevant sensor at each frame. Our study shows that with limited demonstrations more sensors can make a policy more fragile, that clean-input success hides both failures, and that gating the training loss by task-relevant evidence reduces them without new data or architectural changes. EGR more than doubles success under single-sensor fallback in simulation and raises success under physical distractors from 30% to 85% on a bi-manual robot.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "vision language action models; multimodal learning; benchmark", "https://openreview.net/pdf?id=ZufpMWf3yT", "pdfs/ZufpMWf3yT_Breaking Modality Entanglement in Vision-Language-Action Policies.pdf", ""], ["https://openreview.net/forum?id=qgngbEkAq5", "Decomposing the Precision Gain of Force Sensing in Learned Peg Insertion", "", "Sensors move the precision limit of learned insertion, but swapping a whole sensor in or out cannot tell which part of its signal matters or whether a learned policy can use it. In simulated peg insertion, we place a belief-correction module beneath a fixed servo and compare four correction rules restricted to nested information: none, proprioceptive stall detection, force as a contact switch, and the loaded side of the contact. Each rule is measured by τ50, the clearance at which it succeeds half of the time. At 2 mm pose noise, contact detection accounts for 0.92 of the 1.21 mm gain, the two detectors differ by less than 0.15 mm, and load direction adds 0.26 mm (0.43 mm at 4 mm noise). Students behaviour-cloned from 320 demonstrations match the force-based rules, direction included, but recover only 47% of proprioceptive detection (57% when trained to near-zero loss with four times the budget). A label that targets the accumulated rather than the per-step correction recovers about a fifth of the force gain. Finally, a likelihood estimator with profile intervals shows that a published precision limit carries about ±0.5 mm of uncertainty once overdispersion is modelled.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "peg-in-hole insertion; force sensing; imitation learning; evaluation", "https://openreview.net/pdf?id=qgngbEkAq5", "pdfs/qgngbEkAq5_Decomposing the Precision Gain of Force Sensing in Learned Peg Insertion.pdf", ""], ["https://openreview.net/forum?id=VgOto5oF70", "Detecting Silent Faults at the Environment–Trainer Boundary in Reinforcement Learning", "", "Robot reinforcement learning increasingly runs environments outside the trainer: in another process, on another machine, in another language. Many faults at this boundary raise no error. We make the boundary a wire protocol and ask what notices a fault in it.\n\nOn Pendulum, HalfCheetah, Hopper and a 7-joint arm (Pusher), we injected up to 23 faults into what crosses the wire and 2 into the trainer's log, from one value to every value. Unless every value was wrong, a learning-curve threshold caught at most one run in ten, and a comparison with ten fault-free seeds at most 21%. A clean evaluation of all 1,060 final policies agreed with the curves: of the 728 boundary-fault runs both curve checks passed, 723 scored no more than three standard deviations below fault-free seeds, though nearly all ended on other weights and, for reward faults, logged other returns.\n\nChecks of the run itself, not of its outcome, saw every fault. A step ledger kept on both sides and compared step by step caught and located every fault that crossed, on Pendulum, Hopper and Pusher on one machine and on Pendulum across two, with no fault-free run and, on Pendulum, a median 3% more training time. An episode record kept at the environment caught the faults in the trainer's log. We list such faults found in practice, in Gymnasium 1.3 and our own code and, reported by others, in five multi-agent libraries, and recommend a step ledger and episode counts kept at the environment.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "reinforcement learning infrastructure; environment-trainer interface; silent faults; reproducibility; testing; robot learning systems", "https://openreview.net/pdf?id=VgOto5oF70", "pdfs/VgOto5oF70_Detecting Silent Faults at the Environment Trainer Boundary in Reinforcement Learning.pdf", ""], ["https://openreview.net/forum?id=nRU0GzU0Hc", "Escape Is Not Success: Diagnosing Spatial-OOD Failures of Robot Action Interfaces", "", "Success conflates policies that stay put with those that approach but fail to lift. We score escape, distance-normalised approach and strict completion in simulated cube lifting (targets 5–25 cm radially and 10–30° angularly beyond demonstrations; three training seeds per cell). Three ACT policies complete 0, 0 and 1 of 70 radial episodes per seed yet differ: one stays within 1 cm of the demonstrated region, one escapes but rarely approaches, and one often approaches but rarely completes. Absolute arms approach in at most 4 of 70 radial episodes per seed in either frame and, for EEF commands, with every camera tested; residual arms in 27–60. Under residual EEF commands, a wrist camera adds 19–32 strict radial completions per seed; absolute policies rarely approach, so their zero completions cannot isolate camera effects. Per-seed stages and matched contrasts expose interface failure modes.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "imitation learning; spatial generalization; action interfaces; evaluation", "https://openreview.net/pdf?id=nRU0GzU0Hc", "pdfs/nRU0GzU0Hc_Escape Is Not Success  Diagnosing Spatial-OOD Failures of Robot Action Interfaces.pdf", ""], ["https://openreview.net/forum?id=PYg9IBwK6M", "From Teleoperation to Long-Horizon Dexterity: Evaluating Visuomotor Skills and Offline Proxies for Dexterous Manipulation", "", "Imitation learning policies are intended to make robotic manipulation robust to variations in object pose, appearance, and environment that challenge pre-programmed motion. However, real-world performance remains difficult to predict, as conventional optimization signals such as validation loss show no consistent relationship with robot success. To identify the design choices that govern real-world performance, 281 imitation-learning policies spanning seven policy families were evaluated in approximately 1,700 real-robot trials of RJ45 connector grasping and insertion using a five-fingered robotic hand. Controlled ablations showed that observation and action representations dominated conventional optimizer and sampling choices. For point-cloud policies, region-of-interest cropping, representation in the robot-base frame, and normalization within the point encoder each improved success by 70–100 percentage points. For the vision-language-action policy, absolute rather than relative action prediction improved insertion success by up to 70 percentage points. Skill decomposition, multi-view perception, and recovery demonstrations were associated with the strongest-performing systems, although their effects were not independently isolated. Of 67 offline metrics evaluated, only five measures of predicted-motion smoothness and directness reliably correlated with insertion success (\\(r=-0.70\\) to \\(-0.80\\)), and only within a single policy family. These results identify representation choices as key determinants of real-world imitation-learning performance and show that offline metrics can shortlist policies, but cannot replace real-robot evaluation.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "dexterous manipulation; imitation learning; real-robot ablation; evaluation metrics", "https://openreview.net/pdf?id=PYg9IBwK6M", "pdfs/PYg9IBwK6M_From Teleoperation to Long-Horizon Dexterity  Evaluating Visuomotor Skills and Offline Proxies for D.pdf", ""], ["https://openreview.net/forum?id=wZHmhWKEeX", "Generalist-Parkour: One Policy for Extreme Humanoid Parkour", "", "Can one policy master a library of extremely difficult real-world parkour courses? Existing generalist policies struggle to cover the diversity of complex, sparse real-world terrain, while jointly optimizing a single policy across many heterogeneous courses can suffer from cross-task interference. We study this on 75 reconstructed real-world courses where every support is elevated and contacting the floor is a terminal state, demanding centimeter-level foothold precision. We propose specialize-then-consolidate: one expert per course, consolidated by terrain-routed on-policy distillation with a difficulty weighting that keeps supervision on unsolved courses. The consolidated policy achieves 95.4% simulation success on a 29-DoF humanoid using egocentric depth. Proprioception-as-query attention, developed on elevation maps, works on egocentric depth only once every token carries its back-projected body-frame position. We further characterize scaling trends: expanding the training library improves zero-shot success on unseen courses from 21% to 82%, while increasing student capacity improves converged performance across the course library. Real-world deployment demonstrates transfer to both in-distribution and unseen course layouts without policy adaptation. The course library will be released as a benchmark.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "humanoid parkour; egocentric depth; map encoding; policy distillation; sim-to-real", "https://openreview.net/pdf?id=wZHmhWKEeX", "pdfs/wZHmhWKEeX_Generalist-Parkour  One Policy for Extreme Humanoid Parkour.pdf", ""], ["https://openreview.net/forum?id=cg2GSk4CNa", "OpenTac: Making Tactile Sensor Design Configurable for Robot Learning", "", "Tactile observations depend on sensor geometry, material response, measured force components, and acquisition strategy, yet these choices are often fixed by the available hardware. We present OpenTac, an open design ecosystem that makes these choices configurable through a shared fabrication and readout pipeline. OpenTac-CAD compiles a 2D outline, 3D surface, or text request into a fabrication-ready flex-PCB-based tactile sensor and a machine-readable manifest shared by acquisition, simulation, and cross-sensor transfer tools. A structured overlay enables normal and shear sensing. We fabricated 31 functional sensors; five representative designs compile in 0.7–2.6 s and cover 75–93% of their target regions. Material and taxel-pitch comparisons reveal changes in sensitivity, saturation, and spatial resolution. Adaptive readout on a 1024-taxel skin reaches 1286 partial frames/s versus 67 full frames/s, detecting brief impacts missed by raster scanning. Deployments on four robots demonstrate policy learning and contact-rich control. OpenTac enables researchers to vary tactile sensor design within a shared fabrication and acquisition pipeline.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "tactile sensing; sensor design; robot learning infrastructure; customizable sensors; adaptive sampling", "https://openreview.net/pdf?id=cg2GSk4CNa", "pdfs/cg2GSk4CNa_OpenTac  Making Tactile Sensor Design Configurable for Robot Learning.pdf", ""], ["https://openreview.net/forum?id=JcxzmPgz1p", "Pushing Your Robot Policy toward Its Speed Limits via Coupled Gain–Duration Optimization", "", "Robot policies learned from demonstrations can perform increasingly complex tasks with high reliability, but their execution speed often remains constrained by the demonstrations from which they are learned. We argue that an important bottleneck lies one level below the policy—the low-level controller that determines how quickly and how long each action is physically realized. We introduce Coupled Gain–Duration Optimization (CGDO), which accelerates pretrained policies by jointly optimizing the controller gain and execution duration for each action with reinforcement learning (RL) without modifying the policy. These two variables respectively govern how aggressively the commanded action target is approached and how long the action is executed, and their effects are tightly coupled, making joint optimization critical for pushing execution toward the speed limits without sacrificing task performance. CGDO is policy-agnostic by design and can be combined with other RL methods for further acceleration. Across a suite of experiments, CGDO achieves substantially shorter execution times than other compared methods, while in most cases can also improve success rates. See Videos and code at \\url{cgdo-anonymous.pyrite-apogee.workers.dev}.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "robot policy acceleration; reinforcement learning; low-level controller", "https://openreview.net/pdf?id=JcxzmPgz1p", "pdfs/JcxzmPgz1p_Pushing Your Robot Policy toward Its Speed Limits via Coupled Gain Duration Optimization.pdf", ""], ["https://openreview.net/forum?id=pXhp1rpJI6", "Recomputing Success Rates and Comparing Policies on the RoboArena Leaderboard", "", "Success rates and rankings from real-robot leaderboards serve as references, for example to evaluate world models. Recomputing a success rate from RoboArena's records and comparing two policies need three conditions the leaderboard does not publish. First, the leaderboard's A/B evaluations record progress but no success label, so the success threshold decides what a rate counts: halving it from full progress raises all but one of the nine most-evaluated policies' rates by 28 to 36 percentage points, while their rank correlation with the leaderboard stays high. Second, the evaluators' composition is part of what the leaderboard estimates: one evaluator group supplies most evaluations, and weighting the groups equally reorders 5 of the 36 pairs among the nine. Third, testing a difference needs the covariance of the fitted abilities, which a preference model reproducing every published score and standard error gives. Under this covariance, which takes the evaluations as independent, a stepdown test at nominal familywise level 0.05 separates 25 of these pairs. Simulated at the fitted dependence, this test and two of four methods that allow dependence within evaluator groups err far more often than 0.05; the other two keep their errors near or below it and on the records separate 2 and 3 pairs, none within the seven middle policies, so a ranking test also needs a model of that dependence. We turn these conditions into a reporting checklist for success rates and rankings.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "leaderboard reliability; real-robot evaluation; binary success labels", "https://openreview.net/pdf?id=pXhp1rpJI6", "pdfs/pXhp1rpJI6_Recomputing Success Rates and Comparing Policies on the RoboArena Leaderboard.pdf", ""], ["https://openreview.net/forum?id=vOR1YBuzKL", "Residual Compliant Policy: Learning Compliant Policies from Few Demonstrations", "", "Contact-rich manipulation requires a robot to be\nprecise in free space to establish the intended contacts, and\ncompliant once in contact to avoid excessive forces. Yet the\ncompliance underlying a demonstration is not directly observable\nand is therefore difficult to infer from demonstration data alone.\nWe present a framework that makes compliance explicit at every\nstage. During data collection, the operator teleoperates the real\nrobot and selects between two discrete compliance modes, while\na synchronized digital twin visualizes the error between the\ncommanded reference and the achieved pose. To generalize across\nobject poses, we combine Laplacian editing with simulation-based\ntrajectory optimization. Finally, a residual reinforcement learning\npolicy refines the interaction forces by adjusting the reference\npose of the admittance controller. We evaluate on three flipping\nand pushing tasks on a Franka FR3 from 7 demonstrations in\ntotal. With the same policy backbone and data budget, Laplacian\nediting alone succeeds in 11/30 trials on a wall-constrained task\nagainst 30/30 with our augmentation, our two compliance modes\nmatch a 19-D adaptive compliance action (35/40 vs. 33/40 hard\ntrials), and the residual policy raises this to 40/40.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "contact-rich manipulation; compliance control; learning from demonstration", "https://openreview.net/pdf?id=vOR1YBuzKL", "pdfs/vOR1YBuzKL_Residual Compliant Policy  Learning Compliant Policies from Few Demonstrations.pdf", ""], ["https://openreview.net/forum?id=nqzXIRk81e", "SAFTER: Safety-Aware Filtering Through Explicit Recoverability for Robust Reinforcement Learning under Distribution Shift", "", "Learning safe policies that remain reliable in unseen environments is challenging under bounded actuation, where satisfying current-state constraints may still leave insufficient control authority for future recovery. We propose SAFTER (Safety-Aware Filtering Through Explicit Recoverability), a framework that embeds a differentiable closed-form backup-CBF filter into Soft Actor-Critic and combines current safety, sampled backup safety, terminal recovery, and input admissibility into a single differentiable certificate. The resulting affine condition admits an exact minimum-intervention projection in surrogate-control space without iterative online optimization, enabling direct policy learning through the safety filter. In quadruped navigation, SAFTER reaches the same training-performance criterion with 30.6% fewer transitions than Vanilla SAC and 34.1-35.1% fewer than current-state CBF-filtered SAC baselines. Under geometric distribution shift, SAFTER achieves 88.6% success in simulation, exceeding the strongest baseline by 38.0 percentage points, and 73.3% and 76.7% success on a physical quadruped in two matched laboratory layouts, improving over the strongest baselines by 10.0 and 60.0 points, respectively. Moreover, ablations show that differentiating through the exact safety-filter Jacobian is the key learning mechanism behind SAFTER’s robustness, increasing success from 6.2% to 61.4% in the most challenging shifted environment. Videos are available on the project website: https://nail-uh.github.io/SAFTER.github.io/.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "safe reinforcement learning; backup control barrier functions; recoverability-aware safety filtering", "https://openreview.net/pdf?id=nqzXIRk81e", "pdfs/nqzXIRk81e_SAFTER  Safety-Aware Filtering Through Explicit Recoverability for Robust Reinforcement Learning und.pdf", ""], ["https://openreview.net/forum?id=2FOEqUnRbt", "SensorPerch: Sense Wherever and Whenever it Matters", "", "Existing robotic perception is constrained by sensors that are either robot-mounted or permanently fixed in the environment, locking perception to a limited set of viewpoints. Yet as robots perform increasingly diverse tasks, the most informative viewpoint shifts from one task to the next—often somewhere onboard sensor and static infrastructure cannot readily satisfy. To address this gap, we propose SensorPerch, a novel realization of active perception that decouples sensing from both the robot embodiment and the environment by treating sensors as independent physical entities that the robot can autonomously detach and reattach within the environment. SensorPerch presents one realization of this paradigm: a lightweight, wireless, reconfigurable sensor platform that can perch on diverse surfaces, paired with a viewpoint-selection framework that determines task-optimal sensor placements. Together, these enable robots to construct task-relevant viewpoints on demand, independent of the robot's current position and available fixed infrastructure. We demonstrate the paradigm on two task classes: (i) object-coupled perception, where SensorPerch enables persistent object-state detection beyond the robot's current position, achieving successful event detection even when the robot is not nearby; and (ii) policy-coupled perception, where SensorPerch allows robots to construct diverse, policy-specific viewpoints for various policies, achieving success rates comparable to those obtained using oracle viewpoints.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "active perception; sensor reconfiguration; autonomous sensor placement", "https://openreview.net/pdf?id=2FOEqUnRbt", "pdfs/2FOEqUnRbt_SensorPerch  Sense Wherever and Whenever it Matters.pdf", ""], ["https://openreview.net/forum?id=8yJK2fEFxJ", "SPACE: Enabling Learning from Cross-Robot Data Toward Generalist Policies", "", "In robot learning, scaling training datasets across diverse embodiments and environments has become a dominant paradigm for learning generalizable robot policies. These policies are commonly trained via behavior cloning to imitate actions from pre-collected demonstrations. However, since robot actions are tied to the dynamics of the data collection robot, different robots may require different actions to achieve the same motion. This discrepancy hinders both policy training and deployment across diverse robots. To address this, we propose using Cartesian state delta as a universal action representation across robots, and introduce State Prediction and Adaptive Command Execution (SPACE). SPACE handles robot dynamics variation at three levels: across different embodiments, across hardware units of the same embodiment, and within a single robot during operation. It consists of two components: (i) a Cartesian state delta policy that predicts geometric end-effector displacement, and (ii) Action Adapter, which converts the predicted Cartesian state delta into robot-specific control commands. Experiments show that SPACE substantially outperforms policies that directly predict control commands when learning from data collected across different embodiments and across hardware units of the same embodiment. SPACE also remains robust under dynamics shifts at deployment, including changes in control frequency, object weight, and controller gains.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "imitation learning; action space; cross-robot", "https://openreview.net/pdf?id=8yJK2fEFxJ", "pdfs/8yJK2fEFxJ_SPACE  Enabling Learning from Cross-Robot Data Toward Generalist Policies.pdf", ""], ["https://openreview.net/forum?id=7VPgMRvpux", "TouchScale: 500 Hours of Human Vision and Touch for Visual-Tactile Learning", "", "Large-scale egocentric human interaction data is becoming an important source of physical supervision for embodied learning, but visual observations alone do not directly measure contact and force during physical interaction. Recent visual-tactile datasets have begun to fill this gap, but the available volume of synchronized tactile data remains far smaller than that of human video, and the largest existing resources often combine data collected with different sensors or annotation procedures. Datasets containing hundreds of hours of human vision and touch captured through one consistent sensing pipeline remain scarce. We introduce TouchScale, a 500-hour dataset of contact-rich human interaction collected through a consistent sensing pipeline, comprising approximately 2K predefined task descriptions spanning everyday activities and structured manipulation. Each recording contains time-aligned egocentric RGB-D, bilateral wrist RGB and tactile measurements. At this scale, we ask a simple question: what does scale unlock for visual-tactile learning? We investigate this via cross-dataset generalization, transferable representation learning, and robotic manipulation. Using the same vision-to-touch architecture, training on TouchScale instead of EgoTouch improves zero-shot cIoU on EgoTactile by 35.1%. Pretraining on TouchScale improves downstream action recognition accuracy by 49.3% compared with other visual-tactile pretraining datasets. Using TouchScale for visual-tactile pretraining improves contact-rich manipulation success rate from 40% to 70%. Together, our scalable collection paradigm, large-scale dataset, and study establish a foundation for human visual-tactile learning and its transfer to robotic manipulation.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "visual-tactile learning; egocentric dataset; robotic manipulation", "https://openreview.net/pdf?id=7VPgMRvpux", "pdfs/7VPgMRvpux_TouchScale  500 Hours of Human Vision and Touch for Visual-Tactile Learning.pdf", ""], ["https://openreview.net/forum?id=48Xgkolxoc", "WeaveRL: Weaving Reconstruction into Scene-Aware Fabrics for Perceptive Reinforcement Learning", "", "Reinforcement learning allows robots to acquire complex skills, but producing policies for geometrically complex manipulation remains difficult. A promising approach is to learn on top of collision-avoidant controllers, such as geometric fabrics. However, these approaches have relied on static, hand-specified representations of the scene. Integrating active, online 3D perception into massively parallel RL training has so far been inaccessible. We introduce a GPU-accelerated method that reconstructs the scene as a collection of surfels across thousands of parallel simulation instances during active rollouts. This lets policies operate over sensor-derived, rather than hand-specified, geometry. On a suite of collision-dense manipulation tasks, our surfel fabrics enable policies to tackle geometrically complex scenes where primitive-based baselines fail, while maintaining sim-to-real transfer. Furthermore, policies learned with a scene-aware fabric are more robust to the introduction of novel geometry at test time, improving collision-free task completion under unseen obstacles from 35% to 61%. We release our reconstruction system, training code and test dataset to spur research in this direction.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "robotics; machine learning; perceptive rl; scene reconstruction", "https://openreview.net/pdf?id=48Xgkolxoc", "pdfs/48Xgkolxoc_WeaveRL  Weaving Reconstruction into Scene-Aware Fabrics for Perceptive Reinforcement Learning.pdf", ""], ["https://openreview.net/forum?id=dtSNBmsZoR", "Which Taxels, Not How Many: Tactile Sensor Placement for Dexterous Policies", "", "Policies for dexterous manipulation depend on design choices made before training: which sensors enter the observation, where they are placed, and how their readings are arranged for the encoder. These choices are rarely examined. For tactile sensing, simulation studies place taxels uniformly over the hand, and this placement has become a default without being tested. We test this default under a single controlled protocol. The protocol holds the teacher, the training procedure, and the candidate taxels fixed and varies only the sensor configuration and the representation. We evaluate it on in-palm rotation and grasping with three robot hands. A small set of taxels selected from contact statistics matches a far larger uniform set. Taxels at rarely contacted sites are equivalent to no tactile input. With all candidate taxels, their layout in the input tensor does not affect performance, even for a convolutional encoder. Uniform placement therefore overestimates the number of taxels a task requires. We distill these results into lessons for designing tactile policies and into a minimal set of design choices that a tactile policy study should report.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "tactile sensing; dexterous manipulation; in-hand manipulation; policy distillation; observation space design; sensor placement; simulation", "https://openreview.net/pdf?id=dtSNBmsZoR", "pdfs/dtSNBmsZoR_Which Taxels, Not How Many  Tactile Sensor Placement for Dexterous Policies.pdf", ""], ["https://openreview.net/forum?id=GXtKJjdGui", "Workhorse: Learning Robust Whole-Body Humanoid Loco-Manipulation from Human Data", "", "Humanoid robots still struggle to plan contact-rich whole-body manipulation from egocentric RGB and proprioception. Workhorse learns such manipulation from robot-free human demonstrations. A visual planner predicts five-link targets: the poses of the torso, both wrists, and both feet. A reinforcement-learning whole-body tracker follows them on the robot. Both policies train separately on the same recorded human poses, without retargeting. We augment the training data of each policy to imitate the errors that the other makes at deployment. On a real Unitree G1, Workhorse transports boxes with its hands and a kick, catches a thrown box, and topples and climbs a suitcase. During box transport, we show recoveries after a person pushes the robot or takes the box away. In a simulated copy of the demonstration room, the system completes box transport in 77% of episodes, and in 64% under 40 $\\\\mathrm{N\\\\,s}$ pushes. With both policies retrained from the same demonstrations, a simulated second humanoid completes box transport in 83% of push-free episodes.", "Everything Beneath the Policy: How Controllers, Hardware, and Data Infrastructure Shape Robot Learning", "humanoid loco-manipulation; whole-body control; contact-rich manipulation", "https://openreview.net/pdf?id=GXtKJjdGui", "pdfs/GXtKJjdGui_Workhorse  Learning Robust Whole-Body Humanoid Loco-Manipulation from Human Data.pdf", ""], ["https://openreview.net/forum?id=EWICwTslWf", "ACCRUE: Continual Off-Policy Reinforcement Learning for Robot Foundation Models", "Changyeon Kim, Kimin Lee, Yashraj Narang, Yijie Guo", "Reinforcement learning (RL) post-training improves robot foundation models (RFMs) beyond their demonstrations, but real-world deployment demands more: learning new tasks efficiently while retaining previously acquired behaviors. Existing continual RL methods on top of VLAs mitigate forgetting but rely on on-policy updates with limited forward transfer, whereas off-policy methods improve single-task sample efficiency without addressing learner persistence across tasks. We propose ACCRUE, a continual off-policy RL framework that carries lightweight actor and critic networks across tasks, allowing each stage to reuse behavioral and value knowledge acquired through prior RL. The inherited critic adapts only on current-task transitions and guides current-task actor learning, while prior behavior is preserved by distilling the actor toward cached targets on a small number of retained episodes. Fixed visual features keep the inherited learner and its replay compatible with base-policy updates. Across contact-rich assembly sequences in simulation and on real-robot hardware, ACCRUE accelerates subsequent-task learning with near-zero forgetting and significantly reduces real-robot training time by 31.0\\% to 68.5\\%.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "continual learning; reinforcement learning; assembly tasks; contact-rich manipulation", "https://openreview.net/pdf?id=EWICwTslWf", "pdfs/EWICwTslWf_ACCRUE  Continual Off-Policy Reinforcement Learning for Robot Foundation Models.pdf", ""], ["https://openreview.net/forum?id=Necql1OWWV", "Agent-Guided Reinforcement Learning for Robot Policy Improvement", "Weijun Dong, Carl Qi, Mingyuan Zhang, Manikantan Nambi, Lillian J. Ratliff, Jeroen Vanbaar, Dylan Randle, Jose Barreiros", "Reinforcement learning (RL) over generalist robot policies is a promising path to advance robotic manipulation, but it is bottlenecked by low sample efficiency: the RL learner must discover how to correct its own suboptimal behaviors through costly uninformed exploration. Meanwhile, modern foundation models can provide rich priors over both successful behaviors and counterfactual actions, supplying exactly the knowledge that the RL algorithm itself lacks. We introduce a novel framework that turns this prior into action-level guidance for reinforcement learning. When a rollout fails, a tool-using reasoning agent analyzes the trajectory, identifies states where actions can be improved, and produces action proposals for them. These diagnoses run asynchronously alongside training without blocking online rollouts. We incorporate the proposed actions into policy training via a soft imitation objective alongside the RL loss, steering subsequent exploration toward the reasoning agent's suggestions. We evaluate on ten LIBERO manipulation tasks, where our method achieves $6.9\\times$ the normalized success throughput of the strongest pure-RL baseline within a 400-episode interaction budget. Moreover, our RL framework outperforms directly imitating the agent's proposals, especially when the agent is weaker.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "reinforcement learning; agentic robot learning; manipulation", "https://openreview.net/pdf?id=Necql1OWWV", "pdfs/Necql1OWWV_Agent-Guided Reinforcement Learning for Robot Policy Improvement.pdf", ""], ["https://openreview.net/forum?id=oiv0mYQcPy", "ANCHOR: KL-Anchored Adaptation for Stable Offline-to-Online RL", "Geonwoo Cho, Jaegyun Im, Doyoon Kim, Lexin Li", "Offline-to-online reinforcement learning (RL) follows the pretrain-finetune paradigm: an agent is first pretrained on historical data and then adapted through online interaction. We study offline-to-online adaptation without offline replay, where the agent must improve using only the pretrained model and newly collected experience. A key challenge is to avoid catastrophic failure, a sharp early performance collapse during online fine-tuning, while still achieving strong asymptotic performance. Through controlled experiments, we show that removing offline replay can induce catastrophic failure, while retaining strong conservative regularization from offline RL can suppress final online performance. We also find that common stabilization strategies do not reliably prevent early collapse, and that the critic-side mechanisms we test are insufficient on their own. Motivated by these findings, we propose ANCHOR, a simple adaptation method that anchors the actor to the offline-pretrained policy early in online fine-tuning, anneals this constraint over time, and retains only a small residual conservative critic regularizer. We provide a theoretical interpretation showing that KL anchoring helps preserve critic reliability across nearby occupancy distributions, with a two-phase regret bound explaining when anchoring should be maintained or relaxed. Across FrankaKitchen, AntMaze, and Adroit tasks, ANCHOR substantially reduces catastrophic failure while maintaining strong asymptotic performance. Ablations show that KL annealing and the residual conservative weight are important for balancing early stability and online adaptation, while additional analysis shows that ANCHOR is most beneficial when the pretrained policy contains useful behavior to preserve.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "continual learning; offline-to-online learning; reinforcement learning", "https://openreview.net/pdf?id=oiv0mYQcPy", "", ""], ["https://openreview.net/forum?id=l31QSeIQhu", "ASPIRE: Agentic /Skills Discovery for Robotics", "Runyu Lu, Yubo Wu, Ethan Kou, Haotian Lin, Letian Fu, Wenli Xiao, Ajay Mandlekar, Yinzhen Xu, Guanya Shi, Ken Goldberg, Ang Chen, Mosharaf Chowdhury, Jan Kautz, Yuke Zhu, Linxi Fan, Guanzhi Wang", "Traditional robot programming is notoriously challenging: it requires orchestrating multimodal perception, managing complex physical contact dynamics, and handling diverse environment configurations and execution failures. We introduce ASPIRE (Agentic Skill Programming through Iterative Robot Exploration), a continual learning system in which a coding agent writes and refines robot control programs and compounds validated fixes into a reusable skill library. ASPIRE combines (1) a closed-loop robot execution engine that exposes per-primitive multimodal traces for failure diagnosis and repair validation, (2) a skill library that distills validated repairs into transferable knowledge, and (3) evolutionary search that explores beyond single-trajectory refinement. ASPIRE surpasses prior methods by up to 77% on LIBERO-Pro, 72% on Robosuite's bimanual handover, and 32% on BEHAVIOR-1K, and its skill library transfers zero-shot to unseen LIBERO-Pro Long tasks (31% versus 4% for prior coding agents). ASPIRE improves as models get stronger: with Claude Opus 5.5 it nearly saturates these benchmarks, reaching 99% average success across all 80 LIBERO-Pro tasks and 100% on representative Robosuite and BEHAVIOR-1K tasks. On real robots, skills discovered in simulation reduce programming effort despite different embodiments and robot APIs, and skills learned online let ASPIRE solve a Rubik's Cube with progressively improving efficiency.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot learning; code as policy; skill library; self improvement", "https://openreview.net/pdf?id=l31QSeIQhu", "", ""], ["https://openreview.net/forum?id=l6vBRAdtwZ", "Autonomous Functional Play with Correspondence-Driven Trajectory Warping", "William Liang, Sam Wang, Hung-Ju Wang, Osbert Bastani, Yecheng Jason Ma, Dinesh Jayaraman", "The ability to conduct and learn from interaction and experience is a central challenge in robotics, offering a scalable alternative to labor-intensive human demonstrations. However, realizing such \"play\" requires (1) a policy robust to diverse, potentially out-of-distribution environment states, and (2) a procedure that continuously produces useful robot experience. To address these challenges, we introduce Tether, a method for autonomous functional play involving structured, task-directed interactions.\nFirst, we design a novel open-loop policy that warps actions from a small set of source demonstrations ($\\leq 10$) by anchoring them to semantic keypoint correspondences in the target scene. We show that this design is extremely data-efficient and robust even under significant spatial and semantic variations.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "autonomous play; robot data generation; robot manipulation", "https://openreview.net/pdf?id=l6vBRAdtwZ", "", ""], ["https://openreview.net/forum?id=edj3vD5wWm", "Beyond Imitation: Self-Improving Robot Policies via Off-Policy Q-Planning", "Varun Giridhar, Anant Khandelwal, Jeremy A. Collins, Ignat Georgiev, Animesh Garg", "Behaviour Cloning (BC) has driven remarkable progress in robot manipulation, yet it is fundamentally limited by its inability to self-improve: a policy that fails cannot learn from that failure without additional human demonstrations. Reinforcement Learning fine-tuning offers a path to self-improvement but has proven difficult to scale to the multi-billion-parameter models underpinning modern robot policies. We propose Q-Planning, which equips a large visuomotor BC policy with a small off-policy Q-function. Because a Q-function estimates value rather than imitates actions, it can be trained on the same successful demonstrations as the BC policy and later absorb both successful and failed deployment rollouts, an asymmetry BC does not have. We exploit this asymmetry to enable value-guided action selection at inference (a single-step Q-weighted average over BC draws) and online self-improvement that fine-tunes only the Q-function, leaving the BC weights untouched. On LIBERO and bimanual RoboTwin, ten iterations of self-improvement lift every benchmark score we tested (LIBERO-10 93 to 99%, RoboTwin 83.8 to 91.4%) and shorten successful episodes on the near-ceiling suites (LIBERO-Object, LIBERO-Goal). On two contact-rich bimanual real-robot tasks, the same loop (BC frozen, no human intervention) improves purely from its own deployment rollouts: stack-cups 40 to 90% and insert-wallet 25 to 80% in five iterations, whereas supervised fine-tuning (SFT) on successful rollouts alone stalls at 55% and 30%. Under an identical online budget Q-Planning is the only method, among Best-of-N, filtered SFT, IBRL, DSRL, and DAWR, that improves stably from failures without training an auxiliary actor. Project website and code: https://q-planning-anon.github.io.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "behaviour cloning; reinforcement learning; self-improvement; vision-language-action models", "https://openreview.net/pdf?id=edj3vD5wWm", "", ""], ["https://openreview.net/forum?id=p9BUxBtXWW", "Beyond Validation Loss: Coverage and Reliability Dynamics in Robot Policy Pretraining", "Zhanyi Sun, Max Simchowitz, Shuran Song", "In modern robot learning, generative robot policies are first pretrained through supervised learning from demonstrations, then refined through reinforcement learning, supervised finetuning, or other forms of posttraining. Yet conventional pretraining metrics, such as validation loss and average task success, provide an incomplete account of which policies support both effective direct deployment and subsequent posttraining. In this work, we study closed-loop pass@k, which evaluates the probability that k rollouts from the same initial condition attain at least one success. Thus, pass@1 measures mean task success; large-k pass@k measures whether success remains reachable under repeated sampling. Across a wide range of posttraining recipes, we show that large-k pass@k reveals posttraining differences not captured by pass@1. In particular, checkpoints with similar pass@1 but different large-k pass@k have different posttraining performance. Moreover, we show pass@k peaks at different checkpoints during supervised pretraining, revealing a coverage--reliability tradeoff over the course of training. Based on these observations, we propose two practical interventions: (1) a purely offline checkpoint-selection criterion that balances coverage and reliability without closed-loop evaluation, and (2) a generative data augmentation procedure that expands supervision beyond the finite demonstration set, preserving large-k pass@k while maintaining or improving pass@\n and raising the observed coverage--reliability Pareto frontier. Together, our results motivate evaluation, checkpoint selection, and training procedures that explicitly account for posttraining.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot learning; behavior cloning; robot policy pretraining and posttraining; learning dynamics", "https://openreview.net/pdf?id=p9BUxBtXWW", "", ""], ["https://openreview.net/forum?id=oyvDL5dY9P", "Bi-Lipschitz-Regularized Pretraining for Efficient Policy Finetuning", "Shubham Mittal, Yunchu Zhang, Waleed Yagoub, William Huey, Zev Alvidrez, Kanta Hamasaki, Andrew Wagenmaker, Abhishek Gupta", "Generative control policies (GCPs) based on diffusion and flow matching have achieved strong performance by modeling multimodal action distributions through supervised learning. However, adapting these policies to new tasks, preferences, or constraints often requires further optimization through the pretrained generative model. We show that standard flow-matching objectives, while effective at learning action distributions, can produce poorly conditioned mappings from latent noise to actions that hinder downstream optimization. In particular, excessive expansion amplifies small perturbations, while severe contraction makes flow inversion ill-conditioned and can attenuate gradients. To address these issues, we introduce Billip, a Jacobian-based bi-Lipschitz regularizer that controls the local expansion and contraction of the learned flow during pretraining. Our theoretical analysis characterizes how these geometric properties affect perturbation and error amplification through the flow. We demonstrate that Biliip improves three downstream finetuning via reinforcement learning in the latent noise space, supervised finetuning through flow inversion, and test-time gradient-based guidance using backpropagation through time (BPTT). Across simulated benchmarks and challenging real-world bimanual manipulation tasks, our approach substantially improves post-training performance and learning efficiency. Our results establish that the geometry learned during generative pretraining is a critical factor in downstream optimization, and that regularizing this geometry during pre-training provides benefits across multiple post-training algorithms without modifying the algorithms themselves.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot learning; reinforcement learning; online adaptation", "https://openreview.net/pdf?id=oyvDL5dY9P", "", ""], ["https://openreview.net/forum?id=hw47Ldnggr", "D&A: Decoupling Description and Assessment Enables VLMs as Zero-Shot Robotic Reward Models", "Marius Memmel, Shawn Yin, Urvi Rutia, Gavin Angeloff, Eldon Li, Ankit Goyal, Jesse Zhang, Dieter Fox, Fabio Ramos, Anqi Li, Abhishek Gupta", "Vision-Language Models (VLMs) hold promise for zero-shot video task-progress estimation in robot learning, yet existing frameworks frequently suffer from confirmation bias, hallucinating progress in failed executions due to implicit success assumptions or relative temporal ranking designs. Na\\\"ive prompting of frontier models collapses into a binary success detector that fails to capture nuanced, non-linear progress and failures. While post-training approaches can mitigate this through explicit training, they demand expensive real-world robotics data and require computationally intensive post-training for every individual base model.\nTo resolve these limitations, we introduce D\\&A (Describe \\& Assess): our approach decouples progress estimation into an objective, task-grounded textual description of scene dynamics followed by an assessment phase using explicit rubrics. By compelling the VLM to synthesize an explicit, text-based definition of absolute success before scoring, the framework anchors evaluations to an external, global criterion rather than the video's internal timeline. Empirical results demonstrate that our method calibrates zero-shot estimates and mitigates confirmation bias, providing fine-grained, partial progress metrics that accurately penalize failed executions while correctly interpolating successful runs. Being purely prompt-based, D\\&A generalizes across tasks, embodiments, and benchmarks---matching or surpassing post-train
