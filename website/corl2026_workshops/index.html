a closed-loop robot execution engine that exposes per-primitive multimodal traces for failure diagnosis and repair validation, (2) a skill library that distills validated repairs into transferable knowledge, and (3) evolutionary search that explores beyond single-trajectory refinement. ASPIRE surpasses prior methods by up to 77% on LIBERO-Pro, 72% on Robosuite's bimanual handover, and 32% on BEHAVIOR-1K, and its skill library transfers zero-shot to unseen LIBERO-Pro Long tasks (31% versus 4% for prior coding agents). ASPIRE improves as models get stronger: with Claude Opus 5.5 it nearly saturates these benchmarks, reaching 99% average success across all 80 LIBERO-Pro tasks and 100% on representative Robosuite and BEHAVIOR-1K tasks. On real robots, skills discovered in simulation reduce programming effort despite different embodiments and robot APIs, and skills learned online let ASPIRE solve a Rubik's Cube with progressively improving efficiency.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=LDd7VM2doA", "", ""], ["https://openreview.net/forum?id=F1qPCjfU0x", "Can Astra Solve RoboMME without Breaking the Bank?", "Bingao Chen, Haoquan Fang, Karen Liu", "Robotic manipulation often requires remembering information that is no longer visible, such as an object’s location before occlusion or the order of a demonstrated action sequence. A large vision-language planner can read this history, but calling it before every action chunk is slow and costly. We present a three-tier system for the RoboMME benchmark. GPT-6 Astra (System 2) selects a grounded subtask from stored visual history, a π0.5 vision-language-action policy (System 1) executes it, and a fine-tuned Qwen3-VL-4B monitor (System 1.5) checks after each action chunk whether the subtask is finished. The instruction is kept until the monitor reports completion or a task-specific event occurs, while the policy keeps acting on new observations. On RoboMME, the system succeeds in 79.13% of episodes with an average of 3.63 Astra calls and 80.84 seconds per episode. This is 34.62 points above the best published non-oracle baseline and 4.95 points below GroundSG+Oracle, which gives the low-level policy ground-truth subgoals.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=F1qPCjfU0x", "", ""], ["https://openreview.net/forum?id=UJHkYOreYB", "Co-Evolving Robot Orchestrators and Policies through Deployment", "Xilun Zhang, Maggie Wang, Erik Bauer, Hong-Xing Yu, Huang Huang, Jiajun Wu, Marco Pavone", "Vision-language-action (VLA) policies trained on large datasets are capable within their training domains, yet they still fail to generalize to the variety of situations a robot meets in real-world deployment. Agentic robot systems complement the policy with a vision-language model (VLM) orchestrator that learns when to call the policy, how to instruct it, and when to use scripted skills instead. However, because the harness is built around a frozen policy that has limited language steerability, the orchestrator can avoid the policy's failures but never overcome them. The policy becomes the bottleneck of the whole system. Fine-tuning the policy can remove this bottleneck, but updating it alone decouples it from an orchestrator tuned to its old behavior. We propose Robo-COP, in which the orchestrator and policy co-evolve during deployment. Robo-COP curates skill demonstrations from its own executions, fine-tunes the policy when this data can address recurring failures, and adopts each new policy only after it improves the skills it was trained for. Across ten simulated RoboLab tasks, Robo-COP raises mean held-out success from 64.8% to 73.8% over the same harness with a frozen policy, while fine-tuning on a fixed schedule without verification reaches only 65.8%. On three real-world tasks, Robo-COP raises held-out success from 38.3% to 50.0%. Robo-COP turns deployment into a self-improving flywheel in which robots learn by doing, with each improvement in execution producing better data for the next round of learning. Videos and code are available at https://xilunzhangrobo.github.io/robo-cop/.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=UJHkYOreYB", "", ""], ["https://openreview.net/forum?id=l0BBYNeW4A", "ComDex: A Compositional Framework for Dexterity Learning from Offline Human Manipulation Videos", "Yunhai Han, Harish Ravichandar, Yashraj Narang, Jie Xu, Wei Yang", "Recent advances in vision-based human hand tracking make human manipulation a promising source of rich supervision signals for robot learning. However, the substantial embodiment gap between human hands and robotic manipulators makes direct transfer, such as pose retargeting, insufficient to guarantee successful robot execution. To bridge this gap, recent approaches typically introduce a subsequent optimization stage, often based on reinforcement learning, to refine retargeted robot behaviors using information estimated from the video, such as object-pose trajectories. Despite their effectiveness, these approaches are difficult to apply to precise in-hand manipulation from RGB videos, as commonly used vision-based estimators often fail to accurately recover object poses under severe hand–object occlusions. Additionally, object-tracking-based refinement may fall short when task semantics matter. For example, in assembly, maximizing the object-pose tracking reward alone does not necessarily ensure successful insertion, as pose estimation errors can exceed the tolerance required for precise insertion. To address these two challenges, we first propose an effective in-hand object pose estimation method by leveraging human hand motion and the hand–object interaction. We then introduce an agent-based task-understanding module and a corresponding reward-generation module that autonomously produce simulation-ready task reward functions. Leveraging these components, we develop a “one-button” framework, ComDex, that converts human videos of complex, contact-rich manipulation into robot policies by integrating pose tracking rewards, interaction rewards, task rewards, and CuRobo-enabled collision-aware motion planner. We further validate the framework across diverse manipulation tasks involving in-hand manipulation, contact-rich interactions, and functional manipulation.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=l0BBYNeW4A", "", ""], ["https://openreview.net/forum?id=78L8T5nsLM", "Contact Code: A Typed Program Interface for Measurable and Repairable Contact-Rich Manipulation", "Yanru Wu, Zizhe Zhang, Qi Chen, Haimin Hu, Alan Yuille, Jieneng Chen", "The ability to adapt to physical feedback is essential for robots performing contact-rich manipulation. Vision-language models (VLMs) provide a promising way to interpret task instructions and configure robot behavior from visual observations. However, adapting these decisions after physical interaction requires connecting execution feedback to the parameters that can be revised. We introduce Contact Code, a typed program interface that supports this connection by organizing controller parameters, measured execution evidence, and permitted updates around individual contact stages. Within predefined task templates, a VLM proposes a task configuration that is validated and instantiated into an executable program. During execution, robot motion and contact measurements provide feedback for controller-level recovery and evidence for subsequent program revision. If execution still fails, the system uses this evidence to select a contact stage and guides the VLM to propose a constrained update before the next attempt. We evaluate Contact Code on eight tasks and 800 held-out instances across ManiSkill, Isaac Lab, and UniVTAC-based simulation, spanning wrist force and fingertip tactile sensing as well as single-arm and bimanual settings. Contact Code increases success from 60.4% on the first rollout to 73.6% after repair and outperforms free-form parameter repair by 8.3% under the same feedback and rollout budget. In a separate study on three representative tasks, we evaluate programs composed by a VLM from shared primitives, with automatically derived evidence bindings and repair interfaces, showing improved success after feedback-guided program repair. We also evaluate Contact Code on a Flexiv arm for peg insertion and nut threading, providing evidence for the effectiveness of feedback-guided program repair and the portability of the interface across robot platforms. This interface provides a foundation for studying how physical feedback can guide program revision, offering a path toward more adaptable language-guided robotic systems.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=78L8T5nsLM", "", ""], ["https://openreview.net/forum?id=CQFstcjx1Z", "Do Agentic Policies Need to Look at Every Step? Geometric Abstraction for Reasoning and Action", "Yihang Liu, Yiming Chen, Mingzhe Zheng", "Recent multimodal language models can reason directly about robot scenes, but it is unclear whether they need to repeatedly reinterpret raw visual observations at every step of an interaction. We propose shifting routine spatial reasoning from images to text and symbols through a 3D geometric abstraction that is refreshed locally from observations and read directly by the language models. Specifically, our interface represents scene geometry via typed, evidence-aware symbolic references to object parts, grounds them from calibrated RGB-D, and returns compact textual checkpoints with metric residuals after each action. Symbolic task structure can thus be reused across decisions while metric values are rebound to the current scene, with direct visual reasoning invoked only on demand. Across offline policy synthesis and continuous online execution, reasoning over grounded text and symbols improves multi-step manipulation completion while substantially reducing repeated multimodal queries, positioning explicit geometric state as an effective substrate for agentic\nrobot policies.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=CQFstcjx1Z", "", ""], ["https://openreview.net/forum?id=9HKnVoy6O0", "Embodied XAI: Tracing Hierarchical Agent Decisions via 4D Spatio-Temporal Saliency", "Suzan Halim", "Robots steered by vision-language models are being proposed for spaces people occupy, where an unaccountable choice carries real cost. Yet when these physical AI agents silently pick a target, per-frame 2D saliency cannot say what in the physical world drove them: the planner is re-queried continuously while the robot drives, so each map sits in its own moving camera frame, leaving thousands of disconnected images that cannot be pooled, sliced, or compared. We present \\emph{4D spatiotemporal saliency}, a model-agnostic framework that relocates attribution from the camera to the scene: an attribution stage scores the planner's own sampled steering token, each attributed pixel is lifted into world coordinates through depth and pose, and the results accumulate across queries and trials into one heat field growing through time. The explanation thereby becomes an object that can be added up, grouped by outcome, differenced against a reference, replayed, and physically intervened upon. We instantiate it with chosen-action integrated gradients on a quadruped driven by ambiguous instructions, and use the field to certify scene-level attribution patterns as repeatable, separate the signatures of success and failure, watch a decision harden, and run closed-loop occlusion experiments that persistently target the same physical region as the camera moves.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=9HKnVoy6O0", "", ""], ["https://openreview.net/forum?id=3c1CfvfHa7", "EMBODIEDSWE: Coding Agents for Long Horizon Dexterous Robotics", "Yilang Liu, Zeyu Shen, Haoxiang You, Zhicheng Zheng, Lihan Zha, Kashu Yamazaki, Mingtong Zhang, Suning Huang, Jiankai Sun, Qianzhong Chen, Luxi He, Kaiyuan Liu, Haoran Chang, Katerina Fragkiadaki, Mac Schwager, Dhruv Shah, Peter Henderson, Ian Abraham, Canwen Xu", "We study coding agents for long-horizon, dexterous robotics and ask whether their solutions can provide scalable supervision for learning general robot policies. To test this, we develop EMBODIEDSWE-BENCH, a simulation benchmark for coding agents spanning contact-rich manipulation, deformable objects, and long-horizon tasks requiring up to half an hour of continuous interaction. We find that frontier coding agents can solve complex long-horizon tasks and transfer prior solutions across both tasks and embodiments. We also design supporting tools that help agents more effectively solve these tasks. However, the resulting solutions require substantial iterative interaction and are typically specialized to individual task instances. We therefore introduce EMBODIEDSWE-BENCH, which expands a single solution from coding agent into large diverse trajectories for training a VLA. VLA performance improves with more generated demonstrations, and agent-aided diversification improves generalization to held-out task variations. We also show that a VLA finetuned solely on coding-agent-generated simulation demonstrations completes a long-horizon task on real robot. Together, our framework uses coding agents to solve complex robotics tasks and turn verified solutions into scalable supervision for robot policies.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=3c1CfvfHa7", "", ""], ["https://openreview.net/forum?id=9CSIakHmiD", "ENCORE: Few-Shot Agentic Discovery of Manipulation Strategies", "Yifan Kang, Zihan Wang, Zhiwen Fan, Bangya Liu", "Coding agents can now write, run, and debug programs with little human help.\nRobot tasks, however, are usually specified by a sentence that leaves out how\nto grasp, in what order to make contact, and what the result should look\nlike, and an agent given only the sentence must find these details by trial\nand error. We introduce \\method{}, which gives the agent a few\ndemonstrations as evidence to read rather than as training data. A\ndeterministic builder distills each demonstration into a pack of multi-view\nkeyframes, gripper events, frame strips, and the full trajectory. A coding\nagent studies the pack, writes a policy program against a fixed perception\nand action API, checks it with its own sensors over a few development\nrollouts, and freezes it before a sealed evaluation that never reveals the\nsuccess signal. On LIBERO-PRO, the agent's first program already succeeds in\nhalf of the perturbed tasks with demonstrations and in one task without them, and the\nfrozen programs outperform the strongest prior agentic system run with the\nsame language model (96.3\\% against 89.3\\%). On RoboDojo tasks whose\ninstructions leave the goal unstated, no program succeeds without\ndemonstrations. ENCORE also runs on a real bimanual robot, learning cube\nhandover and cup inversion from five demonstrations each.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=9CSIakHmiD", "", ""], ["https://openreview.net/forum?id=Eq3xq6KZDC", "FEIJOA: Task-Driven Grounding and Execution for Mobile Manipulation", "Aditya Agarwal, William Shen, Sahit Chintalapudi, Lucy Cai, Nishanth Kumar, Aidan Curtis, Travis Manderson, Tomás Lozano-Pérez, Leslie Pack Kaelbling", "A mobile manipulator asked to ``put the toys away in the toy box'' must decide which objects are toys and which container the user means, then find base poses, grasps, and placements it can execute. Because a scene representation is built before the instruction is known, it may lack the attributes, affordances, or concepts needed to resolve the task. We present FEIJOA, a language-model agent that grounds the instruction at test time. It queries a grounding tool over a posed RGB-D scan, inspects the returned candidates, and refines its queries until they resolve the instruction. An embodiment-aware harness checks each skill's preconditions, samples base poses from which the target is reachable, and verifies the skill's effect from observations before and after execution. On 103 open-ended grounding queries, FEIJOA resolves 94.2\\% exactly, compared with 68.0\\% for the best prebuilt representation. Over 50 real-world trials on Spot, it completes 35 tasks; 17 of these successes follow recovery from a failed tool call or verification check. Of the 15 failed trails, 13 were caused by the robot's physical skills, and only 2 by grounding or the agent's reasoning.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=Eq3xq6KZDC", "", ""], ["https://openreview.net/forum?id=wKgMn9vqUi", "Fewer Tokens, Better Action: GPT-6 Astra Robot Agents with 14% Higher Success but 65% Fewer Tokens", "Ruiyang Si, Jianxin Bi, Shunyu Yang, Rui Ni, Wenbo Huang, Qiang Wang, Shulong Jiang, Duomin Wang, Zhen Dong, Daquan Zhou", "Vision language model (VLM) agents can control robots through visual feedback and action primitives, but repeated model invocations and redundant observations incur substantial token overhead. We introduce PyRUA-Lean, an interactive code-execution framework that couples feedback-driven primitive composition with selective observation: the agent composes classical robot primitives and learned vision-language-action (VLA) policies into Python cells that perform conditional checks and local retries, returning only explicitly requested images and state feedback for replanning. Across 700 simulated task instances from LIBERO-PRO, RoboTwin 2.0, and RoboCasa365, we compare PyRUA-Lean with a tool-calling baseline using the same GPT-6 Astra planner and underlying robot primitives. Under equal LLM-call budgets, PyRUA-Lean increases overall success from 63.1\\% to 71.7\\%. On instances solved by both agents, it uses 49\\% fewer LLM calls and 65\\% fewer input tokens. The PyRUA-Lean library will be released.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=wKgMn9vqUi", "", ""], ["https://openreview.net/forum?id=sU18hA2zbD", "Generalized Planning Interfaces for Agentic Robotics", "Ben Zandonati, Yifan Kang, Tomás Lozano-Pérez, Leslie Pack Kaelbling", "Agentic manipulation requires reasoning over semantic task structure and continuous robot motion. Existing robot interfaces determine which decisions an agent can express and which it must resolve explicitly. High-level skill interfaces restrict task coverage, while detailed low-level motion generation imposes substantial inference cost and is more prone to geometric errors. We introduce generalized planning interfaces (GPIs), which let agents specify what a robot should achieve and how it should act, at any level of abstraction. Agents flexibly combine declarative goals and motion constraints with imperative skill sequences and fully specified trajectories. We instantiate a GPI with SPROUT (Sampling and Pooled Refinements of Underspecified Trajectories). SPROUT interleaves spatio-temporal constraint-graph synthesis with sampling and optimization, preserving agent-defined goals and constraints, while supplying the physical variables and constraints needed for execution. Compatible numerical queries are pooled across heterogeneous graphs for GPU execution. Across eight simulated tasks with three scenes each, SPROUT achieves a 29 percentage point increase in success, compared with less flexible agent-robot interfaces.  SPROUT enables agents to solve complex multi-step manipulation tasks, reasoning at the level of abstraction required for the task. Additional information and videos are shown on our website: https://sprout-project-d81650.pages.dev/", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=sU18hA2zbD", "", ""], ["https://openreview.net/forum?id=02FSMHg6ii", "Guava: Distilling Frontier VLMs into a Compact Agent through a Robotic Manipulation Harness", "Haowen Liu, Xirui Li, Shaoxiong Yao, Peng Shi, Tianyi Zhou, Jia-Bin Huang, Furong Huang, Jiayuan Mao", "Frontier vision–language models (VLMs) can perform robotic manipulation by interpreting visual observations, invoking robot tools, and adapting to execution feedback, but repeated model calls incur high costs and latency. In this paper, we study the problem of distilling these capabilities into compact VLMs. The key challenges are designing an interaction interface that enables efficient and generalizable distillation, and a data collection protocol that captures diverse scenarios. We present $\\texttt{Guava}$, a framework built around a manipulation harness and a simulation-based data generation pipeline. We first study how harness design affects both frontier and compact models, and use the resulting interface for teacher data generation and student deployment. Through this harness, a frontier VLM generates physically executed and validated interaction trajectories in simulation, which we augment with perturbation branches that expose the teacher to execution deviations and recovery trajectories. Using $\\texttt{GPT-5.4}$ as the teacher, we collect 2,268 interaction trajectories and fine-tune $\\texttt{Qwen3.5-4B}$ to obtain $\\texttt{Guava-4B}$. $\\texttt{Guava-4B}$ substantially outperforms its base model and approaches $\\texttt{GPT-5.4}$ performance across simulated and real-world manipulation tasks, while generalizing to unseen objects, instructions, and task compositions. Perturbation trajectories particularly improve unseen-task generalization. With substantially lower inference latency and token usage compared to a frontier model, $\\texttt{Guava-4B}$ enables efficient local deployment.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=02FSMHg6ii", "", ""], ["https://openreview.net/forum?id=vTOrVYhBnp", "Harness VLA: Steering Frozen VLAs into Reliable Manipulation Primitives via Memory-Guided Agents", "Yixian Zhang, Huanming Zhang, Feng Gao, Xiao Li, Zhihao Liu, Yi Nie, Chunyang Zhu, Jiaxing Qiu, Yuchen Yan, Jiyuan Liu, Wenhao Tang, Jiaji Rao, Zhengru Fang, Changxu Wei, Quanlu Zhang, Yu Wang, Wenbo Ding, Chao Yu", "Language-conditioned manipulation requires both precise contact-rich control and robust reasoning over language, scenes, and long horizons. End-to-end Vision-Language-Action (VLA) models provide strong local visuomotor skills, but they are trained on in-distribution task trajectories and often degrade under deployment perturbations such as semantic retargeting, goal re-binding, spatial-layout shifts, and unstable local contacts. LLM coding agents provide complementary semantic and compositional reasoning, but purely analytic primitives struggle with irregular grasping, constrained placement, and articulated-object interaction. We present Harness VLA, a memory-augmented agentic framework that exposes a frozen VLA as a retryable contact-rich primitive and composes it with a small fixed library of analytic primitives for grounding, staging, transport, navigation, and release. Rather than expanding the skill library, the harness learns the operating range of these fixed primitives from task-specific execution traces, global success rules, and failure models. By lifting semantic re-grounding, non-contact execution, and VLA re-staging to the planner while reserving the frozen VLA for local contact-rich phases, Harness VLA extends pretrained VLAs beyond their original trajectory distribution without fine-tuning. Across perturbed tabletop, household kitchen, and clean-to-randomized bimanual manipulation, Harness VLA improves over the strongest relevant baselines by 38.6 and 27.2 percentage points on LIBERO-Pro and RoboCasa365, respectively, and reaches 58.4\\% on RoboTwin C2R. Real-world demonstrations on dual-Franka robots further show target redirection, grasp recovery, and new task compositions with the same frozen VLA.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=vTOrVYhBnp", "", ""], ["https://openreview.net/forum?id=z5FsJD37Dj", "How Hard Are Current Robot Memory Benchmarks for Agentic Harnesses?", "Feiyang Wu, Weirui Ye, Haonan Chen, Haoyu Chen, Jiayu Zhou, Yandong Ji, Yuejiang Liu, Yilun Du", "Robot memory research has developed policies with dedicated mechanisms for storing observations and learning representations of history. Recent progress in vision-language agents offers a simpler alternative: a planner can consult explicit records of past observations and actions. We study how challenging current robot memory benchmarks remain under this approach. Our minimalist memory harness supplies a VLM planner with text logs and historical images, without an additional learned memory module. At each decision, it builds a fresh prompt from the task instruction, current image, and permitted history; a fixed controller executes the selected skill. Full text logs fit within the context window, and history channels can be removed while keeping the planner and executor fixed. We freeze the harness, task guidance, and skills before evaluating new instances of familiar tasks. With GPT-6 Astra, the harness achieves 91.9\\% success on RoboMME with past execution frames and 95\\% on RMBench with an event log. These results suggest that simple external records already enable strong VLM agents to solve most evaluated tasks under fixed task guidance.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=z5FsJD37Dj", "", ""], ["https://openreview.net/forum?id=uMkXmX3mAy", "Impossible Twins: Judge-Free Measurement of Verifier False Positives in Agentic Robot Controller Search", "Tianlang Chen", "Coding agents that rewrite robot controllers against an automated verifier can converge on the verifier's defects, and separating a false positive from genuine success ordinarily requires a judge. We make these false positives countable without a judge by pairing each task with an impossible twin. No action sequence meets its specification, so every acceptance is a false positive. Across 336 eight-iteration searches on planted defects, gpt-oss-120b on reach ended 8 of 8 runs with a complete exploit once told the defect, under a score or a task objective. An added integrity instruction left that count unchanged. Naming only the checked quantity gave 1 and 5 of 8, and gpt-oss-20b followed a different pattern, so the counts set no general threshold. A route-preservation check shows that a pinned twin largely closes a pushing exploit that a goal-side twin keeps open (4 against 45 of 50 episodes). A behavioral replay shows that 15 of 18 goal-side finals lift the block. On the solvable side, a misaligned proxy holds genuine success at 0.05 against 0.92 with true-checker feedback. A pre-gated repair pilot locates the first limit: over-rejection, which twins cannot show, leaves twin-driven repair at genuine rate 0.46 against 0.53 from one oracle. Impossible twins give a direct measure of false acceptance, and route-preservation, behavioral and solvable-side checks cover what they leave open.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=uMkXmX3mAy", "", ""], ["https://openreview.net/forum?id=F7Dp4022mM", "KPI: A Promptable Kernel for Physical Interaction on Humanoids", "Yikai Wang, Honghao Zhu, Xiao Hu, Hao Zhang, Zelin Wang, Yip Fun Yeung, Ding Zhao, Lingfeng Sun", "Humanoids now walk, balance and reach with remarkable generality: one whole-body tracking policy follows references from a human, or from an end- to-end policy. That generality travels in the trajectory, and a trajectory alone car- ries limited information about the interaction it should produce: at contact, the ex- ecuting controller determines how the robot behaves. Single-task policies usually reach hard interactions by optimising trajectory and controller together in simula- tion; general stacks usually assume a preset or hand-chosen controller. We present KPI, a promptable kernel for physical interaction between the trajectory source and an unmodified whole-body tracker. Instead of a controller fixed before the task, the trajectory source sends a contract: per direction, track, comply, or hold a force range. From tracking error and a wrench estimate, the kernel adapts the arms’ stiffness, damping, reference and feedforward toward it at contact rate. We demonstrate KPI through an agentic framework: from one instruction, a vision- language agent writes both the reference trajectory and the contract, with no task- specific code. We demonstrate instruction-driven winch operation, door open- ing, and box transport, alongside scripted surface-interaction experiments. In the winch demonstration, the humanoid is able to turn a crank to hoist a second robot fully off the ground. Project website: https://kpi-robot.github.io/.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=F7Dp4022mM", "", ""], ["https://openreview.net/forum?id=ttNVX8zEcB", "MemBodied: Recurrent Associative Memory for Vision-Language-Action Models", "Tej Deep Pala, Navonil Majumder, Bryce Goh, Raphael Yee, Jianfei Yang, Liming Chen, Soujanya Poria", "Vision-Language-Action models provide a strong foundation for general-purpose robot control, yet a vast majority of policies do not preserve and leverage episode-level information beyond current observation. This limitation is consequential in history-dependent manipulation tasks that depend on information available only in past observations. Retaining past observations in context can aid in recovering this information, but at the significant cost of ever-growing bloated context and inference latency. We thus introduce MemBodied, a fixed-size episodic memory with two complementary components: an associative state that records interactions across policy calls and an episode anchor that preserves a compact representation of the initial scene as a reference. At each policy call, the model conditions action generation on the current input and the memory components, rather than directly using past observations. Across five evaluated RMBench tasks requiring memory, MemBodied achieves $7.81\\times$ the mean success rate of a stateless policy and $2.98\\times$ of vanilla recurrent memory, while outperforming the strongest memory-augmented baseline by $1.3\\times$ with $10\\times$ fewer added parameters. On the fully observable LIBERO-Long suite, it reached 90.6\\%, a 5.4\\% improvement over the stateless $\\pi_0$ policy. These findings support MemBodied as a practical alternative to expanding the policy context for history-dependent manipulation.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=ttNVX8zEcB", "", ""], ["https://openreview.net/forum?id=JprkI7JQDW", "PhysCaP: Grounding Code-as-Policy Agent with Physics-Informed Exploration", "Chen-Yu Lin, Jing-Wen Chen, Hsueh-En Chang, Hung-An Chen, Sheng-Hsun Chang, Chi-Pin Huang, Fu-En Yang, Min-Hung Chen, Yi-Ting Chen, Yu-Chiang Frank Wang, Shao-Hua Sun", "We present PhysCaP, a Physics-Informed Code-as-Policy agent system for active perception in robotic manipulation. While vision-language-action policies excel at imitating demonstrations, they rely on passive observation and fail to infer latent physical properties critical for manipulation. PhysCaP augments code-as-policy frameworks with a physics-informed exploration layer that enables explicit information-seeking through interaction. Our method introduces training-free physical property extraction modules that estimate object mass and stiffness from robot proprioception without additional sensors. To balance exploration costs and the efficiency of information obtained, PhysCaP employs a multi-agent design: a Planner that decides when to explore and when to stop, and a Prioritizer that filters implausible interactions and ranks the remainder using a heuristic priority score, enabling efficient, targeted exploration. We evaluate PhysCaP on three real-world tabletop manipulation tasks and a simulated task in LIBERO. The results show that existing passive and naive interactive baselines either fail when physical properties are hidden or over-explore, whereas PhysCaP achieves comparable performance with fewer interactions and reduced execution time. Ablation studies further validate the effectiveness of the proposed physical property extraction modules.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=JprkI7JQDW", "", ""], ["https://openreview.net/forum?id=SlmaqmaqW0", "Physical Agency: Better Robot Performance Through Better Interfaces", "Liane Galanti, Dhruv Shah, Tri Dao", "Frontier models increasingly act as robot-use agents, calling a robot's motor skills as tools much as they interact with a browser or code editor. But exposing skills as tools leaves open how the model should use them: what it emits, what feedback it receives, and when it decides again. We study the interface through controlled comparisons with the robot, cameras, scenes, and motor-policy weights held fixed, and separately measure the benefit of adding a complementary frozen skill. We introduce Pigey (Physical Agency), an agent that (1) issues language-level actions one at a time over a persistent task state, (2) uses verified execution, checking post-action images and robot state and recovering when it detects failure, and (3) draws on an open set of skills exposed as tools it selects for each subgoal. No additional policy training or demonstrations are required. On 30 real-robot tasks designed to probe decisions over existing motor skills, the same frozen π0.5 policy succeeds in 16.7% of trials when called directly and 84.0% through Pigey. Adding a frozen motion planner as a second skill raises success to 97.3%. Removing verification and recovery lowers success by 28 percentage points, the largest ablation drop. Gains also hold in simulation and across Claude, Gemini, and Qwen reasoners. Most of what the policy was missing was an interface, not a skill.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=SlmaqmaqW0", "", ""], ["https://openreview.net/forum?id=LkW6BOlHMY", "Program-Level Adversarial Co-Adaptive Self-Play for Robotic Security", "Leo Benaharon, Chi Zhang, Wei Zheng, Weifan Zhang, Yifan Wei", "Coding agents can adapt robotic software by revising executable programs, but successful responses to an evolving opponent may not remain effective. We present a framework for program-level adversarial co-adaptive self-play in which coding agents generate attacks and defenses from tested opponent code and mission feedback, without model fine-tuning. Environment-specific interfaces support external programs for autonomous driving and SDK-level defenses for humanoid locomotion. Two eight-generation case studies reveal concrete software responses: a driving defender introduces direct-actuation recovery, while a humanoid defender revises incoming-state validation. These responses provide local task recovery but do not establish sustained robustness. The framework makes such adaptation and limitations observable through executable artifacts and task-level evidence.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=LkW6BOlHMY", "", ""], ["https://openreview.net/forum?id=xQRzEp0Zhj", "RAPID: Robot Agentic Programming from Demonstrations", "Yuyao Liu, Jiayuan Mao, David Hsu, Leslie Pack Kaelbling, Tomás Lozano-Pérez", "Coding agents have demonstrated enormous success in solving complex programming problems. To leverage their potential for robot systems, this work introduces **Robot Agentic Programming from Demonstrations (RAPID)**, which automatically generates, verifies, and refines robot programs, given a single visual human demonstration. The iterative agentic loop of code refinement requires several key ingredients: (i) a testable task specification, (ii) action primitives for robot execution, and (iii) an interactive environment for program execution and verification. RAPID infers all three from the demonstration automatically. To make the resulting program reusable beyond the demonstration setting, RAPID uses an *object-centric relational program representation* that focuses on the underlying structure of the demonstrated strategy rather than the specific motion *per se*: it expresses the action primitives as trajectory-optimization programs that realize object-level motion effects, while composing them through relational constraints that capture scene-specific geometry at run time. We evaluated RAPID in simulation on eight challenging contact-rich nonprehensile manipulation tasks as well as general prehensile manipulation tasks in the LIBERO-Pro benchmark. We also successfully deployed it on a real Franka arm and evaluated it on all eight nonprehensile tasks. In all experiments, RAPID demonstrated strong performance, with generalization over object pose, shape, material, and environment. Website: https://yuyaoliu.me/projects/rapid.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=xQRzEp0Zhj", "", ""], ["https://openreview.net/forum?id=RxO0XrZm0h", "Reconstruct, Practice, Go Real: Guided Self-Improvement for Embodied Agents", "Yen-Jen Wang, Haozhe Jiang, Shuying Deng, Haoru Xue, Weirui Ye, Rocky Duan, Nika Haghtalab, S. Shankar Sastry, Pieter Abbeel, Haozhi Qi", "Building reliable robot capabilities across diverse tasks requires substantial human effort to develop and maintain skills, design rewards, and integrate perception with control.\nWe present Reconstruct, Practice, Go Real (RPG), a framework for autonomous improvement of robot execution systems without updating model weights.\nRPG identifies manipulation capabilities in an offline dataset, constructs related practice tasks in simulation, and uses execution feedback, privileged simulator state, and available dataset videos to diagnose failures.\nFrom these diagnoses, it develops and refines reusable symbolic skills and revises the system prompt, retaining only changes that pass cross-task evaluation.\nOn held-out initializations of 22 manipulation tasks, RPG improves task success from 28.6\\% after the first practice round to 95.0\\% after 15 rounds, outperforming all evaluated baselines, including ASPIRE (75.5\\%) and CaP-Agent0 powered by GPT-6 Astra Pro (60.0\\%).\nAfter a common calibration and hardware-adaptation procedure, the frozen system succeeds in all 30 physical trials, with ten trials on each of three tasks.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=RxO0XrZm0h", "", ""], ["https://openreview.net/forum?id=UPAuYhlq0Y", "Recovery Credit: Evaluating Robot Decisions Under Physical-State Uncertainty", "Mateo PETEL", "Successful task completion sometimes conceals recovery decisions that respect the prescribed procedure in one hidden physical state and violate it in another. We introduce recovery credit as a history-sensitive evaluation framework that couples policy decisions across observationally equivalent latent-state branches and assesses each consequential commitment against a predeclared state-dependent contract. Paired robust completion measures universal terminal success with contract-consistent commitments and endpoint-masked fragility identifies successful branch families containing an earlier contract conflict. The diagnostic suite models interrupted actuation and hidden insertion contact, then extends the evaluation to material transfer under occluded target occupancy. Across all three tasks, scripted normalization-first controls achieve terminal success and paired robust completion of 1.00 with endpoint-masked fragility of 0.00. Blind-retry controls with subsequent endpoint repair attain the same terminal success rate with paired robust completion of 0.00 and endpoint-masked fragility of 1.00. Independent contract checks reproduce the stipulated classifications and exhaustive branch-subset analysis establishes the dependence of admissibility on candidate-state coverage. Fixed-trajectory authorization changes further quantify the sensitivity of robust-completion classifications to declared contracts. These findings establish the admissibility of decisions made under physical uncertainty as a distinct criterion for evaluating robotic recovery, even across trajectories with identical successful endpoints.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=UPAuYhlq0Y", "", ""], ["https://openreview.net/forum?id=DdoqCu21kt", "RL$^2$-VLA: Adaptive RL Latent Compositional Steering with Test-Time Scaling for Vision-Language-Action Models", "Derek Ming Siang Tan, Shailesh Shailesh, Srikrishna Iyer, William Teo, Yuanliang Ju, Qiao Gu, Guillaume Adrien Sartoretti", "Despite the impressive visuomotor capabilities enabled by Vision-Language-Action (VLA) models, their performance often degrades on out-of-domain tasks. Recent test-time steering and scaling methods avoid extensive data collection and retraining, but action samples often remain concentrated around similar behaviors and inherit correlated failure modes. We introduce $RL^2$, an adaptive inference-time steering framework that leverages $\\underline{\\text{R}}$einforcement $\\underline{\\text{L}}$earning on VLA $\\underline{\\text{L}}$atents. $RL^2$ composes the flow velocity of a lightweight offline RL policy, conditioned on latents from the VLA action expert, with that of the frozen VLA. This combines the behavioral priors of large-scale imitation learning with the action diversity induced by offline RL beyond dominant demonstration modes. We further discover that inference-time steering follows fundamentally different scaling laws under success and failure states: diversity helps most when the base VLA is likely to fail, but unnecessarily perturbs states when success is already likely. This motivates $RL^2$ to route corrective guidance to the frozen VLA actions only when failure is detected. On SIMPLER and PolaRiS benchmarks, $RL^2$ improves success rates by up to +17.3\\% in out-of-domain settings, with ablations highlighting the importance of latent representations and RL training, and real-world experiments  establishing $RL^2$ as a practical and modular steering framework for VLA deployment.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=DdoqCu21kt", "", ""], ["https://openreview.net/forum?id=YxvA7kHDbK", "RLE-Bench: A Qualifying Exam for Coding Agents as Robot Learning Engineers", "Haitong Ma, Chenxiao Gao, Rushi Qiang, Bo Dai, Na Li", "Coding agents are beginning to move beyond purely digital tasks to tackle physical-world challenges, particularly in robotics. Existing robotics benchmarks, however, primarily focus on the performance of individual artifacts, such as policies or controllers, offering limited coverage of coding agents’ broader engineering capabilities. Real-world robotics extends beyond control: agents must build, integrate, diagnose, and improve heterogeneous artifacts under resource constraints and reason from multimodal feedback. To evaluate these broader capabilities, we introduce \\rlebench{}, a benchmark of robot-learning tasks spanning four representative robotics development workflows: interactive control, policy learning, perception and estimation, and mechanical design. We use diverse task-specific metrics to evaluate the artifacts submitted by the coding agents, from the success rate the agents achieved to the policy agents trained, the harness agent built, and the mechanical structures the agent designed. We aggregate these metrics into an overall RLE Index and report workflow-specific capability profiles, enabling systematic comparison of coding agents' capabilities across multiple capability dimensions. Beyond performance ranks, we also conduct in-depth case studies examining agent behavior on representative tasks, highlighting both current capabilities and limitations, and pointing to the opportunities robotics tasks have to offer for future agent training.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=YxvA7kHDbK", "", ""], ["https://openreview.net/forum?id=C3sG9bZPbs", "SceneRig: An Agentic System for Simulation-Ready 3D Scene Reconstruction from Single Images", "Rundong Luo, Yunong Liu, Di Cao, Matthew Tancik, Shyamal Buch, Colton Stearns, Wenqi Xian", "Simulation supports robot policy evaluation, but constructing realistic scenes at scale remains difficult. Reconstructing simulation-ready scenes from single images requires accurate object recovery, placement, and physical grounding. Post-hoc settling can yield stable scenes that no longer match the observed workspace. We present SceneRig, an agentic system that reconstructs editable 3D scenes using visual, geometric, and physical tools. Agents recover objects and supports, construct the surrounding scene, and refine placement through simulated edit-and-validate loops. Across diverse tabletop images, SceneRig improves instance recovery, object-centric appearance, and 3D placement while maintaining physical stability. In calibrated RGB-D robotics experiments, its scenes predict real-robot policy outcomes more accurately than the baseline and more reliably replay recorded manipulations without trajectory adaptation. See our project page: https://scenerig.github.io/.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=C3sG9bZPbs", "", ""], ["https://openreview.net/forum?id=Hpk5GERa1W", "SimEX: Simulation-Integrated Robotics AutoResearch", "Jiaheng Hu, Roberto Martín-Martín, Peter Stone, Rocky Duan, Zhenyu Jiang, Guanya Shi", "Coding agents powered by large language models (LLMs) have shown remarkable abilities to autonomously reason about and achieve goals in the digital world. However, bringing this success to the physical world remains challenging. On the one hand, direct generation methods (e.g., Code as Policies) often suffer from the LLMs’ insufficient understanding of robots and physical environments. On the other hand, iterative trial-and-error tuning in the physical world (e.g., physical autoresearch) induces significant experimental cost and safety concerns. We introduce SimEX: Simulation-Integrated Robotics AutoResearch, an autoresearch framework that tightly integrates simulated experimentation, enabling coding agents to efficiently acquire physical capabilities for controlling real robots. SimEX operates in two stages. First, the agent conducts open-ended probe-and-optimize iterations in simulation, developing a robot toolbox with robust and generalizable capabilities. Second, the agent adapts the toolbox and the simulator together through only a few physical trials: each trial corrects the simulator, and the corrected simulator is used to diagnose failures and screen candidate repairs. We evaluate SimEX extensively in sim-to-sim settings and on physical robots. On challenging real-world manipulation tasks including towel folding, barcode scanning, and plate manipulation, SimEX enables coding agents to efficiently acquire robot skills without any demonstration and with only 10 minutes of real-robot interaction. These results suggest that simulation can be a critical component in achieving physical intelligence, not only as a source of training data for policies, but also as a laboratory where a coding agent iteratively develops capabilities through experimentation before acting on the robot.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=Hpk5GERa1W", "", ""], ["https://openreview.net/forum?id=52exBmCzDf", "Skill2Real: Agentic Skill Learning for Zero-Shot Sim-to-Real Robot Manipulation", "Xincheng He, Siyu Ma, Chang Yu, Yunuo Chen, Yanjia Huang, Ying Nian Wu, Yin Yang, Chenfanfu Jiang", "Sim-to-real learning commonly adapts policies or representations to domain variation, often directing the learning budget toward task-agnostic low-level representations at the expense of task-level knowledge. Skill2Real builds on cross-domain grounding from foundation vision-language models (VLMs) to acquire validated, reusable skills in simulation through a shared code-based policy interface. In its asymmetric Proposer--Verifier--Governor (PVG) loop, the Proposer acts from public observations and API returns, the Verifier diagnoses outcomes with privileged simulation evidence, and the Governor admits updates supported by validation rollouts. A Cerebellum learns reusable local manipulation skills; a Brain then composes the frozen library into long-horizon programs with planning and recovery. At deployment, this hierarchy is grounded in real observations through the same interface. On unseen LIBERO-Pro Long, frozen LIBERO-90 skills raise success from 2.0% to 56.3% with Astra and from 0.5% to 49.0% with Opus 5. Robosuite success reaches 85.1--89.4% across seven tasks. On a real UR5e, the same agent's mean completion rises from 27.50% to 78.75% across four tasks with Skill2Real, a controlled gain that, with cross-model improvements, shows Skill2Real adds a capability orthogonal to the foundation model by learning transferable task knowledge in simulation.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=52exBmCzDf", "", ""], ["https://openreview.net/forum?id=ys5jtBPagk", "STeP: Signal Temporal Logic for Precise Specifications for Action Generation with Vision Language Models", "Kasra Torshizi, Anukriti Singh, Sidharth Mathur, Khuzema Habib, Leo Du, Pratap Tokekar", "Natural-language robot instructions often specify more than a coarse task goal: they may impose spatial, temporal, and logical requirements that must remain satisfied throughout execution. We present STeP, a specification-based agentic framework that uses Signal Temporal Logic (STL) as an explicit interface between high-level language reasoning and low-level robot execution. Rather than encoding such requirements implicitly in a learned policy, STeP formalizes them as task specifications that can be decomposed across multi-stage manipulation, enforced during execution, monitored online, and used as structured feedback for replanning. We evaluate STeP on standard LIBERO and LIBERO-PRO, and introduce LIBERO-Constrained, a new benchmark for manipulation tasks with spatial, temporal, and logical requirements, together with real-world tabletop experiments. On LIBERO-PRO, STeP retains 54%-89% success across five of six evaluated perturbation settings, substantially outperforming VLA and code-as-policy baselines under distribution shift. On LIBERO-Constrained, STeP achieves 80% safe success across 49 task-constraint instances; on real-world tasks, it improves safe success over a specification-free model-based baseline across all four task categories, with gains of up to 45 percentage points. These results support explicit formal specifications as a practical interface between foundation-model reasoning and reliable robot execution.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=ys5jtBPagk", "", ""], ["https://openreview.net/forum?id=BCdDYO0jo9", "SUTO: Failure-Localized Reasoning for Robot Task Planning and Execution", "Sohan Rudra, Yuezhe Zhang, Kumar Manas, Vignesh Prasad, Georgia Chalvatzaki", "A task plan is a structured sequence of actions, instantiated through primitives or skill sequences, to achieve a predefined goal. During long-horizon execution, such plans must remain consistent with the task specification, the relevant entities, and the evolving world state. When execution fails, however, not all prior reasoning becomes invalid. The key challenge is to determine which commitments must be reconsidered and which can be retained. We address this through SUTO, a long-horizon planning framework centered on retry validity. SUTO identifies the highest-level commitment that remains valid after a failure and selectively revises only the dependent artifacts. The framework generates self-verifying local policies using scene-graph grounding and couples their execution with evidence-conditioned failure attribution. This enables localized recovery without restarting the reasoning process. On LIBERO-PRO, SUTO achieves an $11\\%$ zero-shot success rate while remaining substantially cheaper than competing approaches, and reaches $50\\%$ success in real-world evaluations at approximately $17\\times$ lower cost than naive retry based approaches.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=BCdDYO0jo9", "", ""], ["https://openreview.net/forum?id=RkzWx9Sfcz", "Topology-Informed Visual Prompting for Hierarchical Vision-Language-Action Control", "Haoyang Wu, Abhinav Kumar, Dmitry Berenson", "Agentic robot systems often separate high-level reasoning from low-level visuomotor control, motivating the use of intermediate representations that communicate task-relevant constraints between layers. We study this interface in manipulation tasks where partial observations of obstacle geometry can obscure topological relationships that require qualitatively different actions.\nWhile motion planners with full knowledge of environment geometries and object states can reason about these signatures in planning, this information is often not known at deployment.\nTo address this issue, we present a topology-guided visual-prompting framework that uses simulation-based planning to augment a nominal demonstration dataset and provides vision-based guidance at deployment.\nOur method uses a Gauss-Linking-Integral topological signature representation to capture important topological properties of the environment. Using privileged geometry information from a simulation approximation of our environment, we augment a VLA fine-tuning dataset with trajectories that move the system to a demonstrated signature and, from the new configuration, resume task execution.\nAt deployment, a vision-language model (VLM) estimates the current signature and predicts image-space end-effector waypoints from camera observations. Recomputing both after each VLA action chunk yields a closed-loop hierarchical policy in which the VLM performs topological state estimation and waypoint prediction, while the VLA executes continuous control.\nAcross three simulated bimanual tasks and a real-world box pickup task, our method outperforms a VLA fine-tuned only on nominal demonstrations and a VLM-prompting baseline that can remove topology-relevant information from observations.\nOn hardware, it exceeds the strongest baseline by 40\\% in task success. Project website: \\texttt{https://topology-vla.github.io}.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=RkzWx9Sfcz", "", ""], ["https://openreview.net/forum?id=cPUMmLHDG6", "Uncertainty Is the Wrong Trigger: An Exact Account of When an Agent Should Ask Before It Cannot Undo", "Varun Puttagunta", "An agentic robot that can ask a person for help has to decide when to ask, and the field's answer is to ask when it is uncertain - a conformal set that is too large, an entropy above a threshold, a confidence below one. We show that no such rule can be right, and we show it exactly rather than empirically. On a task where the Bayes-optimal asking policy is a closed-form backward recursion, the value of a query is not a function of how uncertain the agent is: it is a function of whether the answer would change what the agent does. Those differ, and they differ in a way that is fatal for a threshold. Across 98 configurations in which the optimum asks at some failure rates and not others, no threshold on entropy reproduces the optimal policy in 3 of them and no threshold on the failure probability itself reproduces it in any (0 of 98); the best entropy threshold agrees with the optimum on as few as 30 of 49 decisions. The mechanism is an asymmetry: uncertainty is symmetric under q -> 1-q and the value of asking is not, so 31% of equal-uncertainty pairs get opposite optimal answers. At q=0.06 and q=0.94, which carry identical uncertainty of 0.33 bits, asking is worth 0.0316 and -0.1292 respectively. The value of asking peaks at a median failure rate of 0.12, never above 0.52 - almost never at maximum uncertainty. A decision-theoretic trigger fixes it: thresholding the value gap between the agent's two best actions recovers a median 97% of the value of asking against 77% for the best-tuned entropy threshold, and is exactly optimal on 473 of 600 tasks against 374. We also report a null we did not expect: irreversibility, the thing the whole practice is meant to guard against, moves the optimal asking rate by a median of 0 percentage points, while query cost moves it from 96% to 4%.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=cPUMmLHDG6", "", ""], ["https://openreview.net/forum?id=rNHO9vQF9h", "World Action Planner: Generalizable Robot Decision-Making with Action-Conditioned World Models", "XiangCheng Zhang, Runhan Huang, Yilun Du", "Building generalizable robot agents for diverse applications remains a fundamental challenge. While imitation learning-based policies can perform well in familiar training environments, they often struggle to generalize to novel scenes, layouts, and task compositions. To this end, we present **World Action Planner**, an agentic robot planning system that proposes and refines executable action plans through imagination with an action-conditioned world model. We perform a principled coarse-to-fine search over robot actions in two stages: (i) global action optimization, where the agent reasons over imagined world-model rollouts to identify potential failures and refine the proposed action plan, and (ii) local action search, where the agent compares the imagined future outcomes of neighboring action candidates and selects the best action for execution. Across compositional long-horizon tasks, novel object layouts, and zero-shot real-robot planning without expert demonstrations, World Action Planner consistently outperforms state-of-the-art end-to-end policy models, including VLAs and WAMs, demonstrating the effectiveness of world-model-based action search for generalizable robot decision making.", "Workshop on Agentic Robotics", "", "https://openreview.net/pdf?id=rNHO9vQF9h", "", ""], ["https://openreview.net/forum?id=kSnt4vdJL6", "$Z$-sight: Unifying Vision-Language-Action and Latent World Modeling", "Junjie Ye, Yiqi Zhao, Muchen Xu, Celina Shiyu Wang, Hao Dong, Ruohai Ge, Rong Xue, Benjamin J Kolligs, Aditya Dutt, Sasanka Nagavalli, Nassim A. Samad, Gaurav S. Sukhatme, Jyotirmoy V. Deshmukh, Yue Wang, Yuliang Guo", "We introduce $Z$-sight, a unified robot foundation model that brings\nvision-language-action modeling and world modeling together through\nfeature-space future prediction. Whereas video-based world action models (WAMs)\nadapt pretrained video generators at substantial computational cost, $Z$-sight\npredicts the future in the native visual representation space of a pretrained\nvision-language model (VLM), so the policy perceives the present and predicts\nthe future within a shared visual foundation. A foresight expert and a\ncontinuous action expert are coupled to the VLM through a\nmixture-of-transformers: the foresight expert denoises future spatial visual\ntokens, while the action expert attends to this prediction stream to generate\nactions, enabling joint learning from robot trajectories and human egocentric\nvideo without pixel reconstruction. On a real humanoid robot, $Z$-sight\nachieves a 62% average success rate across five manipulation tasks,\noutperforming VLA and WAM baselines by a large margin, while running at\n110,ms per action chunk.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot foundation models; vision-language-action models; world models; latent world modeling; humanoid robotics", "https://openreview.net/pdf?id=kSnt4vdJL6", "", ""], ["https://openreview.net/forum?id=PqygDMdaMX", "3D Motion Priors for Data-Efficient and View-Robust Latent Action Learning", "Dongyun Kim, Hanjung Kim, Jinho Jeong, Jaehyun Kang, Youngwoon Lee, Seon Joo Kim", "Learning generalizable visuomotor policies from limited action-labeled demonstrations remains a key challenge in robot learning. While latent action models leverage action-free videos to learn task-relevant dynamics, their pixel-space latent action representations often entangle physical motion with viewpoint-dependent appearance, limiting robustness to unseen camera views. We propose a geometrically grounded 3D latent action framework that learns compact motion priors from canonical 3D scene motion. These priors supervise policy pre-training, and co-finetuning on limited labeled demonstrations adapts the resulting motion-aware representation to executable control. Combined with a 3D-aware visual encoder, our framework supports robust observation-to-latent-action prediction. Experiments on LIBERO and RoboCasa show that our framework improves novel-view generalization under limited demonstrations, yielding relative gains of 119% on RoboCasa and 33.5% on LIBERO over a 3D encoder-only baseline in the extreme 2-shot setting.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "latent action modeling; 3d motion priors; data-efficient robot learning; view generalization", "https://openreview.net/pdf?id=PqygDMdaMX", "", ""], ["https://openreview.net/forum?id=CR5wVdj5Nc", "AFFORD2ACT: How Far Can Sparse Keypoints Go for Robot Manipulation?", "Anukriti Singh, Kasra Torshizi, Khuzema Habib, Kelin Yu, Ruohan Gao, Pratap Tokekar", "Vision-based manipulation policies are commonly learned from rich visual observations, yet it remains unclear how much of this visual information is required for effective policy learning. Sparse 2D keypoints provide a deliberately compact alternative, giving the policy spatial information while removing direct access to appearance, texture, and background. We use Afford2Act: Affordance-Guided Keypoints to Act to study how much manipulation capability can be retained under this representation constraint. An off-the-shelf language-conditioned affordance model identifies the task-relevant region, from which up to 15 object keypoints are selected; together with 4 end-effector keypoints, each observation is reduced to 19 2D keypoints (38 coordinates). Correspondence preserves keypoint identity across object instances, after which the points are tracked over time and passed to a lightweight gated policy. Across six real-robot manipulation tasks, this compact state outperforms the evaluated RGB, RGB-D, and dense-affordance behavior cloning baselines, degrades less as the number of demonstrations is reduced, and achieves 82% average success in held-out settings. Replacing learned gating with uniform weights reduces success from 92% to 52%. At the same time, the representation depends on reliable affordance localization and keypoint tracking, and remains vulnerable to incorrect masks, occlusion, tracking drift, and distractors.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "affordances; keypoints; imitation learning; robotic manipulation", "https://openreview.net/pdf?id=CR5wVdj5Nc", "", ""], ["https://openreview.net/forum?id=3zm6gB0Hh8", "BFN Policy: Visuomotor Policy Learning for Hybrid Action Spaces via Bayesian Flow Networks", "Zhaoyang Li, Aleyna Kara, Abha Jha, Bo-Ruei Huang, Majid Khadiv, Erdem Biyik", "Diffusion Policy is state of the art for continuous control, but robots often act through abstractions pairing a discrete mode with continuous parameters, formalized as Parameterized Action Markov Decision Processes (PAMDPs). Gaussian noise cannot corrupt a discrete choice; relaxing and rounding the mode instead pushes samples off the probability simplex and breaks discrete-continuous coupling. Faster samplers such as DDIM and Consistency Policy inherit the same continuous-only Gaussian process. We introduce BFN Policy, the first Bayesian Flow Network imitation policy, designed for hybrid actions. BFN Policy casts hybrid action generation as structured posterior inference in belief space rather than denoising in data space: conjugate updates flow the categorical belief on the simplex and monotonically sharpen the Gaussian belief. Every intermediate state is a valid posterior, preserving discrete-continuous dependencies without relaxation or rounding, with a test-time step budget needing no distillation. On eight PAMDP benchmarks and Push-T with continuous and hybrid actions, BFN Policy outperforms all diffusion and consistency baselines on hybrid tasks by a margin growing with discrete branching, matches Diffusion Policy on continuous control, and runs at DDIM-level cost, over an order of magnitude faster than DDPM. Sampler diagnostics trace the gain to a discrete representation Gaussian formulations cannot maintain. Code and videos are available at https://anonymousproj-dot.github.io/BFN-Policy.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "imitation learning; generative policy learning", "https://openreview.net/pdf?id=3zm6gB0Hh8", "", ""], ["https://openreview.net/forum?id=PM7I8LhQHE", "BURGER: Benchmarking and Understanding Robotic Generalization via Embodied dRawing", "Xiangyu Xu, Bangshuai Peng, Ziyi Liu, Mengjie Zhao, Chenhao Lu, Zhengyang Fan, Huazhe Xu, Kaizhe Hu", "How effectively can vision-language-action (VLA) models learn diverse language-conditioned behaviors as training data scales? Investigating this question requires large and varied robot datasets, whose collection on physical robots remains costly. We introduce BURGER, a language-conditioned robotic drawing benchmark with a scalable, prompt-driven pipeline for generating continuous drawing trajectories, both in simulation and the real world. In BURGER, an agent starts from the same blank canvas and controls a robot arm to draw the object or spatial composition specified by language, while each instruction allows an openended variety of valid drawings and stroke orders. Using 28,200 simulated demonstrations spanning 282 drawing tasks, we evaluate five representative VLA models across data scales, language grounding, and multimodal behavior. BURGER supports fine-grained analysis of language grounding, spatial composition, and action generation, revealing distinct failure patterns across VLA models. Our experiments suggest that some VLA models can benefit from greater task diversity and demonstration scale, capture multimodal drawing behaviors, and generalize to unseen object compositions of familiar objects. Finally, we deploy a trained policy on a Franka Panda arm, demonstrating the ability to draw reactively under human intervention. We refer the reader to https://burger-bench.github.io for more visualization.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vision-language-action model; robot data generation", "https://openreview.net/pdf?id=PM7I8LhQHE", "", ""], ["https://openreview.net/forum?id=jdLfwzLgyG", "Can the Critic Select Checkpoints in Vision-Language-Action Reinforcement Learning?", "Nikash Bhardwaj", "Reinforcement learning (RL) post-training can improve a pretrained vision-language-action (VLA) policy, but choosing which saved checkpoint to deploy usually requires evaluation episodes on the robot. A signal that requires no evaluation episodes is the critic the RL algorithm already trains, and a guideline from offline RL takes the checkpoint at which its average value peaks. We study this choice in simulation for $\\pi_0$ steered through DSRL on task 8, the LIBERO-Long task on which $\\pi_0$ succeeds least often in our setup. We find that the critic's value at demonstration states peaks early in training, before success rises, so the checkpoint with the highest value is under-trained on every task-8 run on which we computed the critic's value. Restricting the critic's choice to late training, with a cutoff we chose after seeing most runs' critic values, still performs worse than keeping the final checkpoint, and no other selector we tested that requires no evaluation episodes reliably improves on keeping the final checkpoint. On task 8, keeping the final checkpoint usually gives up little success relative to the best checkpoint whose success we confirmed on a second pool of episodes, but on four of our sixteen task-8 runs the final checkpoint falls more than 10 points below an earlier checkpoint, sometimes because training ends in a collapse. Practice success, the success rate of the episodes the learner collects while training, ranks checkpoints only weakly once we control for training step, so in this setting the chosen checkpoint should still be confirmed on evaluation episodes. Code is available at: https://github.com/Nikash-B/vla-checkpoint-selection.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vision-language-action models; reinforcement learning; checkpoint selection; model selection; off-policy evaluation", "https://openreview.net/pdf?id=jdLfwzLgyG", "", ""], ["https://openreview.net/forum?id=PqbgsEMl8U", "Cross-Embodiment Robot Foundation World Models with Latent Actions", "Huang Huang, Sriram Yenamandra, Arjun Majumdar, Elie Aljalbout, Tushar Nagarajan, Tsung-Yen Yang, Akshara Rai, Michael Rabbat, Li Fei-Fei, Jiajun Wu, Tingfan Wu, Franziska Meier", "The diversity of robot embodiments and action spaces makes it challenging to build robot world models that generalize across different embodiments. We introduce the Latent Action-Conditioned Robot World Model (LAC-WM), which operates within a learned unified latent action space shared across diverse embodiments. This unified action space improves the world model’s performance when adapted to previously unseen robot embodiments. We compare LAC-WM with an Explicit Action-Conditioned World Model (EAC-WM), which conditions on explicit motion labels. Our results show that explicit action conditioning leads to disjoint action representations across embodiments, limiting downstream performance when adapting to new robots. We evaluate both models on dexterous manipulation\ntasks and a modified LIBERO benchmark. LAC-WM improves downstream performance over EAC-WM by up to 46.7% on dexterous manipulation and 11.7% on LIBERO. Crucially, the unified latent action space allows LAC-WM’s downstream performance to scale positively with the number of embodiments used during pretraining. In contrast, the disjoint action space in EAC-WM leads to decreased\nperformance as the number of pretraining embodiments increases. These results highlight the importance of a unified action space for efficient cross-embodiment learning, addressing a key challenge in robotics.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot world models; latent action conditioned world models", "https://openreview.net/pdf?id=PqbgsEMl8U", "", ""], ["https://openreview.net/forum?id=SYQVkgOdev", "CrossBFM: Distilling a Shared Latent Behavior Space Across Humanoid Embodiments", "Tan-Dzung Do, Phuong Tuan Dat, Nico Bohlinger, Cuc T.Trinh, Siwei Ju, Vien Anh Ngo, Jan Peters, Xinchao Wang, An Thai Le", "Behavior Foundation Models (BFMs) give humanoids a promptable policy over a latent behavior space, enabling one single vector to represent a motion to imitate, a pose to reach, or a reward to maximize. Forward-Backward representations successfully produce such spaces, but at the cost of hundreds of GPU-hours for a single robot. Moreover, when the training process is repeated for a second robot, it produces a second space unrelated to the first, resulting in embodiment-specific latents that do not unify or transfer. We address these problems with CrossBFM, treating the latent space as the transferable asset for various embodiments. As retargeting provides frame-level cross-embodiment correspondence, we propose a unified encoder architecture with no robot-specific parameters for distilling the behavior space to address all training embodiments simultaneously in less than a GPU-hour. Following this encoder, latent-conditioned trackers turn the distilled latent into whole-body control in a conventional PPO training manner in just 10 more GPU-hours. On three distilled humanoids, all three prompting modes transfer: motion tracking with latent-conditioned policy losing only 0.025 rad to its joint-conditioned counterpart, smooth goal reaching between poses with no falls, and reward optimization for all 41 reward prompts. Our experiments further reveal that 1) regressing the encoder on a quarter of the motion corpus costs only 5\\% of tracking performance and 2) training the encoder on a subset of robots and evaluating on an unseen one recovers up to 89\\% of the tracking performance of seen robots, demonstrating cross-embodiment generalization to morphologically similar robots. We also verify the pipeline on real robots across all three prompting modes and with flow-based generated latents. Project website: https://dotandung.github.io/crossbfm/", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "behavior foundation model; cross-embodiment learning", "https://openreview.net/pdf?id=SYQVkgOdev", "", ""], ["https://openreview.net/forum?id=IQPS2BYcbD", "Does Synthesized Audio Help Action Recognition Beyond Its Predicted Label?", "DongSik Yoon, Joanne Kim", "Pretrained generative models are increasingly used to support robot learning, but a downstream gain does not by itself identify which component of a generation pipeline provides the benefit. We study this attribution problem in a controlled human-action recognition setting. We synthesize audio for every clip of NTU RGB+D 60 with a quality-gated pipeline (Qwen3-VL prompting followed by MMAudio); an RGB+audio recognizer trained on it improves over a reproduced RGB-only baseline on X-Sub and loses accuracy significantly when its audio is removed (McNemar $p<10^{-7}$). However, a waveform-free control that directly provides the action label predicted by the vision-language model during synthesis achieves slightly higher accuracy (95.89% vs. 95.78% on X-Sub; 98.23% vs. 98.18% on X-View) with no statistically significant difference on either protocol ($p=0.43$ and $0.66$), and label smoothing without any audio performs comparably. We release the dataset and propose adaptations of this comparison for evaluating generative priors in robot learning, leaving their policy-level validation to future work.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "synthesized audio; video-to-audio generation; generative data augmentation; multimodal action recognition; negative results; evaluation of generative priors", "https://openreview.net/pdf?id=IQPS2BYcbD", "", ""], ["https://openreview.net/forum?id=DxxmuQiUAw", "DoomShift: How Much Adaptation Do World Models Need Under Domain Shift?", "Rohan Nagabhirava, Keerthana Chirumamilla, Changliu Liu", "World models have become capable simulators, but they are evaluated almost exclusively on held-out rollouts from the domain they were trained on. A small domain shift, such as a new map of the same game, lighting, textures or enemies, can make their outputs drift even when the underlying physics and game engine are unchanged. With DoomShift, a controlled version of this shift in Doom, we measure what breaks and how much adaptation is needed to repair it. We train three diffusion backbones, initialized from pretrained diffusion image models, on four Doom maps and evaluate them on 13 unseen maps. All three preserve their response to controls but fail to reproduce the new scene: scene PSNR drops by 2.8–3.3 dB and LPIPS rises by 0.126–0.145 across the three backbones. This consistent gap shows that action-conditioned behavior transfers more reliably than scene appearance, independent of architecture or model scale. Yet the lost appearance is relatively cheap to recover: rank-16 adapters trained on only eight episodes with 2% of the original training updates recover 72–76% of the LPIPS rise and about half of the lost PSNR. Together, these results suggest that adapting a world model to a new environment may require restoring the scene's appearance rather than relearning the underlying game.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world models; diffusion models; few-shot adaptation", "https://openreview.net/pdf?id=DxxmuQiUAw", "", ""], ["https://openreview.net/forum?id=9SWNois8do", "Dream What I Can: Sparse Visual Planning for Long-Horizon Robot Manipulation", "Chongkai Gao, Wenlong Huang, Haonan Chen, Lin Shao, Yilun Du, Jiajun Wu, Ruohan Zhang, Li Fei-Fei", "Video models provide rich priors for generalizable robotic manipula-\ntion, but plausible visual futures are not always executable. We introduce Dream-\nCan, a hierarchical policy that grounds video models through sparse visual plan-\nning: a high-level planner adapted from a pre-trained video model and a low-level\nvisuomotor policy. Rather than predicting dense trajectories, the planner generates\nsparse visual subgoals that balance reachability and task utility. We estimate both\nquantities from ofﬂine, action-free robot videos and use dynamic programming\nto select subgoal sequences without manual annotations. The resulting subgoals\nare more reliably attained than uniformly spaced ones, and the full system out-\nperforms language, dense-video, and uniform-subgoal planners, reaching 91.2%\nsuccess on LIBERO-Long with a 0.1B-parameter low-level policy. The system\nalso scales with suboptimal videos and test-time compute, and performs challeng-\ning real-world bimanual tasks, including box folding and packing with unseen\nobject combinations.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "visual planning; world models; hierarchical manipulation", "https://openreview.net/pdf?id=9SWNois8do", "", ""], ["https://openreview.net/forum?id=0Y6nde4ZbP", "DreamRehearse: Video World Models Turn Any Source of Action into Robot Demonstrations", "Hongyi Chen, Liquan Wang, Shuo Cheng, Qiyang Yan, Jeffrey Ichnowski, Zackory Erickson, Homanga Bharadhwaj, Nur Muhammad Mahi Shafiullah", "Dexterous manipulation is bottlenecked by demonstrations: every new scene, object set or embodiment means teleoperating the robot again. Action-conditioned video world models could supply that data, but the ways they are used remain narrow: a policy is improved by resampling its own rollouts, which requires it to already succeed often enough for anything to be kept; the rollouts stay in the scene the model was fit to; and the platform is almost always a parallel-jaw gripper. We present DreamRehearse, which treats such a model as a demonstration generator and lifts all three restrictions. Conditioning on rendered robot skeletons rather than raw actions makes the model embodiment-invariant, so a single model covers parallel-jaw grippers and multi-finger hands and predicts future video more accurately than action-conditioned baselines. Any source of motion can rehearse inside it, a coding agent, a learned specialist, a generalist VLA or a trajectory validated in simulation, and a success classifier keeps only the rollouts that work. Because filtering a teacher's rollouts by outcome is one step of reward-weighted regression, the student improves on the teachers that produced its data; we make this precise and bound how much of the improvement survives the model's prediction error. On RoboTwin, dreams pooled from five teachers lift $\\pi_{0.5}$ from 1.9% to 70.6%, above the teacher (63.1%) and within 97% of training on simulator rollouts. On a bimanual dexterous hand, dreams in rooms the model never saw raise out-of-distribution success from 10.4% to 61.1%. On real hardware, simulated trajectories dreamed into real observations reach 85% success with five real demonstrations on two dexterous manipulation tasks.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world models; demonstr
