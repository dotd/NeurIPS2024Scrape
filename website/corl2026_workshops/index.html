ed reward models---and its reward estimates enable efficient downstream reinforcement learning.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "reward modeling; real-world rl; frontier models", "https://openreview.net/pdf?id=hw47Ldnggr", "", ""], ["https://openreview.net/forum?id=1cpIRLdDsp", "Data Source Decides Forgetting: Self-Generated Rollouts vs. Human Demonstrations for a Flow-Matching VLA", "Ende Shen", "Continually self-improving robots must acquire new skills without forgetting the ones they have. Recent work has shown that on-policy reinforcement learning (RL) forgets far less than supervised fine-tuning (SFT) when updating vision–language–action (VLA) models; for language models, this has been attributed to the data RL trains on, sampled from the model's own distribution, rather than to its objective. We test the effects of on-policy data on a flow-matching VLA ($\\pi_{0.5}$). Starting from a skill just improved by on-policy RL, we fine-tune on new tasks with SFT, holding everything fixed except the training data: successful rollouts of the policy itself, or human demonstrations. Across three new tasks, human demonstrations learn the new task but erase the prior skill, while the policy's own rollouts keep it on all three and modestly improve success on one of the new tasks. On one task pair, a full-precision replication shows that on-policy RL and SFT on the same rollouts learn the new task comparably and both keep the prior skill, while demonstrations erase it. Our results suggest that for flow-matching VLAs the data source, more than the objective, decides whether prior skills survive, and that SFT on the policy's own successes protects them.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "continual learning; self-improvement; vision-language-action models; forgetting", "https://openreview.net/pdf?id=1cpIRLdDsp", "", ""], ["https://openreview.net/forum?id=RicVCrChZv", "ELEVATE: Agentic Controller Acquisition from Task Failure for Quadrupedal Manipulation", "Shiqi Liu, Radu Corcodel, Ding Zhao", "Quadrupedal manipulators can extend their workspace through whole-body interaction, but task-planning agents’ capabilities remain limited by their available controllers. We present ELEVATE, a framework that uses persistent failures during task-program refinement to identify and acquire missing whole-body control capabilities. When these failures suggest a missing physical capability, a coding agent formulates and iteratively refines a reinforcement-learning problem, specifying behavior-specific rewards, curricula, and termination conditions. Validated controllers are added to the capability library and composed with existing controllers to retry the task. Starting from a single pretrained loco-manipulation controller, ELEVATE autonomously acquires controllers for wall-supported elevation, supported manipulation, and wall descent across a sequence of seven simulation tasks. These controllers are reused in subsequent reaching and object-manipulation tasks. On the five tasks beyond the initial controller’s workspace, ELEVATE achieves mean success rates of 98.4%–100% across five independent runs, while coding-agent baselines with a fixed controller library fail to complete these tasks. The synthesized task programs, together with the acquired controllers, also transfer to a physical quadrupedal manipulator without real-robot training or fine-tuning, achieving 18/20 successes in rack retrieval and 16/20 in floor-to-rack placement.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "continual robot learning; autonomous skill acquisition; reinforcement learning; skill composition; whole-body control", "https://openreview.net/pdf?id=RicVCrChZv", "", ""], ["https://openreview.net/forum?id=mxyWdjRJgS", "EqC: Equilibrium Energy Control for Introspective Lifelong Robot Learning", "Haodong Yang, Runhan Huang, Bowen Zhang, Iofai Lei, Zunzhe Zhang, XiangCheng Zhang, Shaoting Zhu, Linzhan Mou, Yicheng Liu, Hang Zhao", "Long-term robot autonomy depends on more than effective action generation: a policy must recognize when its behavior is no longer sufficiently supported and use assistance to improve. We introduce **Equilibrium Energy Control (EqC)**, a framework for introspective lifelong robot learning built around an explicit conditional energy landscape. EqC casts generative action refinement as equilibrium-seeking optimization, while the geometry of the refinement process reveals whether the generated behavior remains consistent with the learned landscape. This competence signal enables Energy-Gated DAgger, where persistent energy-consistency violations trigger expert takeover and the resulting recovery trajectories are aggregated for subsequent policy updates. EqC integrates naturally into both Diffusion Transformer policies and flow-matching-based vision-language-action (VLA) policies. Across simulation and real-world bimanual manipulation, EqC improves task performance and robustness while enabling timely intervention near the policy's competence boundary. A real-world study further shows how these interventions progressively expand the range of situations handled autonomously, providing a practical path from static generative controllers toward self-improving robot systems.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robotics; embodied ai; generative control; vla; failure detetion", "https://openreview.net/pdf?id=mxyWdjRJgS", "", ""], ["https://openreview.net/forum?id=CRt76SdPnP", "Failure-Aware Progress Estimation for Robot Learning", "Yingxi Lu, Kairan Dou, Bu He, Mengdi Xu", "Task-progress estimation provides a task-agnostic signal for reward modeling, failure detection, and data filtering in robot learning. Existing estimators are trained on successful trajectories under a monotonic-progress assumption with limited usage of failure trajectories, leaving them unreliable on suboptimal and failed states. We propose RoboFAPE, a Failure-Aware framework for Progress Estimation that augments standard training with an automatic pipeline for assigning fine-grained progress labels to suboptimal and failed trajectories. We evaluate the resulting estimator intrinsically through prediction accuracy and consistency, and extrinsically through downstream applications including RL reward shaping, failure detection, and data filtering. Experiments on nine robotic manipulation tasks demonstrate that incorporating consistently labeled failure trajectories yields a more robust estimator, improving prediction accuracy on non-monotonic states and enhancing all down-stream tasks.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot manipulation; task progress estimation; reward modeling; reinforcement learning; failure detection", "https://openreview.net/pdf?id=CRt76SdPnP", "", ""], ["https://openreview.net/forum?id=nabzCV6nED", "Few-Shot Residual Adaptation of Pretrained Latent World Models", "Jakub Suliga, Pankhuri Vanjani, Nisarga Nilavadi, Wolfram Burgard, Rudolf Lioutikov", "Pretrained latent world models can support visual planning and control, but their predictions may fail when physical dynamics change at deployment. We study whether such models can adapt from only a few interactions without modifying their pretrained weights or identifying the changed physical parameters. We introduce a few-shot residual adaptation approach that learns self-supervised corrections from latent prediction errors. The corrections are applied both inside the latent predictor and directly to its predicted latent state, while the pretrained world model remains frozen. We evaluate the approach in simulation and on a real robot under center-of-mass and friction shifts. These changes reduce the success of the frozen model to near zero. Using three interaction episodes for adaptation, our dual-site approach recovers 90\\% success under the center-of-mass shift and 100\\% under the modified friction on the real robot. Ablations show that correcting both locations outperforms single-site adaptation. Our diagnostics further suggest that much of the learned correction reduces a general prediction mismatch, while successful control also depends on shift-specific information captured during adaptation.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "world model; jepa based world models; online adaptation; residual adapters", "https://openreview.net/pdf?id=nabzCV6nED", "", ""], ["https://openreview.net/forum?id=xKhXISaOkc", "FMP-STEER: Steering Flow-Based Motion Priors for Real-World Humanoid Reinforcement Learning", "Junhong Xu, Hao Fu, Zifan Xu, Steve Wen, Linji Wang, Jiaheng Hu, Andrew Wagenmaker, Xuesu Xiao, Roberto Martín-Martín, Peter Stone", "Humanoid policies trained in simulation can fail to perform well under real-world dynamics that differ from their training conditions. Model-free reinforcement learning (RL) on hardware addresses this problem directly, since it optimizes under the true dynamics without any model mismatch. However, it is rarely applied to humanoids, where exploration must be stable enough to keep the robot collecting data and task-relevant enough that the interactions inform the current task. Our insight is that human motion data already contains\nthe variation real-world exploration needs, in the form of coordinated changes in gait and posture. Based on this insight, we introduce Flow-based Motion Prior Steering (FMP-STEER), which turns this data into a structured exploration space. FMP-STEER distills simulation experts that track retargeted human motion into a flow-matching prior, then trains a noise-steering policy over it in simulation. On hardware, we fine-tune only the steering policy, so each perturbation selects a different human-derived whole-body behavior rather than jittering individual joints, keeping exploration stable and informative enough to collect meaningful data for learning. We evaluate FMP-STEER against two families of adaptation methods, simulator grounding and direct action-space exploration, in cross-simulator transfer under payload changes, joint restrictions, and interaction with unanticipated objects. It improves return fastest under dynamics shift. This sample-efficiency carries over to hardware: on the Booster T1, FMP-STEER adapts to these dynamics changes after about 40 min of real-world interaction. Videos and additional information can be found at: https://roboticspage.github.io/FMP-STEER/.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "real-world rl; humanoid; sim-to-real adaptation", "https://openreview.net/pdf?id=xKhXISaOkc", "", ""], ["https://openreview.net/forum?id=9xiPwQZOeX", "GUARD: Anomaly-Informed Q-Steering for Generative Robot Policies in Dexterous Manipulation", "Aryaman Gupta, Xiaoyue Wu, Rana Soltani Zarrin, Mark Van der Merwe", "Generative robot policies based on diffusion and flow matching can model complex, multimodal behaviors, but remain susceptible to covariate shift during closed-loop execution. Existing approaches mitigate such failures through additional demonstrations, policy fine-tuning, or test-time guidance, but often require human intervention, engineered rewards, or other task-specific signals. We introduce GUARD, an anomaly-informed Q-steering framework that leverages the policy's training distribution to construct a dense, failure-anticipatory steering signal. GUARD pairs sparse task rewards with dense anomaly scores learned from policy training data and propagates both through a learned Q-function. Its gradients then steer the denoising process toward actions that improve task return while preventing trajectories from entering poorly supported regions, without directly modifying the pretrained policy. Across four Adroit dexterous manipulation tasks, GUARD achieves average success rates of $96$% and $80$% under nominal and perturbed dynamics, outperforming the strongest baseline by $21$ and $20$ percentage points while maintaining the lowest anomaly score. GUARD further demonstrates direct sim-to-real transfer on in-hand screwdriver rotation and reorientation tasks, achieving $40$ and $25$ percentage-point gains in success rate. These results demonstrate that anomaly signals can serve not only for failure monitoring but also to complement sparse task rewards as effective supervision for robust policy steering.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "dexterous manipulation; failure prevention; policy steering", "https://openreview.net/pdf?id=9xiPwQZOeX", "", ""], ["https://openreview.net/forum?id=kdH57TjI3g", "HiRE: Hindsight Reward Editing for Policy Finetuning", "Haoyi Niu, Zhengtao Han, Yufeng Ji, Zhongyu Li, Koushil Sreenath", "Pre-trained robot policies always require finetuning to adapt to specific environments. Reinforcement Learning (RL) offers high performance potential because it improves action optimality rather than simply mimicking data. However, such potential depends heavily on reward quality. Sparse rewards lack process feedback, human-designed rewards are costly and biased, and semantic rewards from foundation representations are often not control-centric. We propose Hindsight Reward Editing (HiRE), a training-free framework to break this reward bottleneck. HiRE bridges the broad knowledge of foundation representation models with physical control awareness, by contrasting successful and failed trajectories in hindsight. It calibrates foundation representation models by identifying \"trap states\" that are evaluated as high-rewarding states yet eventually result in failure, and vice versa. HiRE explicitly penalizes these traps while boosting rewards for critical successful states. This approach can be flexibly compatible with any foundation representations and RL algorithms. Experiments show that HiRE consistently outperforms other reward recipes by delivering dense, control-aware feedback that prevents value function collapse and reward hacking, thereby achieving superior sample efficiency, stable policy updates, and higher performance ceilings, e.g., at least 3x performance of the base policies.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot manipulation; reward specification; policy finetuning", "https://openreview.net/pdf?id=kdH57TjI3g", "", ""], ["https://openreview.net/forum?id=1L6jOir8RW", "How Should a Home Robot Update Its Memories When Human Routines Change?", "Oliver Wang, Mani Srivastava", "A home robot that helps with chores needs to learn over time where objects tend to be in order to interact with them. However, people move objects differently when their routines change (e.g., if a resident stays in bed sick), so the robot’s knowledge of their routines becomes outdated. A language model inside the robot might let it improve without retraining: each night it reads what the robot saw and writes a summary that guides the next day’s searches. Such a summary might even capture the high-level cause (e.g., illness) behind object movements. On the other hand, rewriting it every night might discard evidence the robot needs later. We test this tradeoff in simulated households where a resident falls ill for ten days, and investigate whether the robot can discover this shift and adapt. We find that nightly summaries are too infrequent to keep up: even a simple rule that checks the last-seen location outperforms a day-old language-model summary. Then, when we give the model the original sightings alongside summaries, it catches up with the rule. This suggests that summaries lose important information. Additionally, language-models fail to save observations into high-level hypotheses. For instance, even after being told that a resident was ill, the summaries  deleted this hypothesis while keeping relevant sightings only as disorganized facts. Overall, the model was better at reading stored observations than at turning them into a summary. This suggests that long-term memory built from summaries alone may not be enough for personalized robots to keep improving their knowledge.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "long-term autonomy; language-model memory; non-stationary environments; object search; continual learning; evaluation", "https://openreview.net/pdf?id=1L6jOir8RW", "", ""], ["https://openreview.net/forum?id=8GpAiSFPSv", "Keeping the Grader Honest: Reliable Self-Assessment and Better Data for Self-Improving Robots", "Tianlang Chen", "A self-improving robot that grades its own attempts relies on a learned success detector for both its training data and its progress report. We measure this self-assessment against ground truth in simulated Fetch manipulation loops. False-positive rates rise as the loop evolves for state, image, and vision-language graders, from 0.14 to 0.29 for the state grader. Failures move closer to the goal, and the grader also becomes more lenient within the same distance range. A one-time calibration therefore covers the truth only 30% of the time, against 95% for the same labels spent as fresh audits. With 20 audited labels per 100 rollouts, verdict-stratified (targeted) auditing with grader refitting beat random auditing on a prespecified endpoint in fresh-seed Fetch Pick&Place runs. Last-three-iteration evaluation success rose by 4.3 percentage points with a state grader, 4.5 with an image grader, and 5.8 with a vision-language judge. Admitted-data precision rose, with the largest recall cost for the VLM judge. On Fetch Push, where even oracle labels add only two points, the same test found no gain. Letting the refit grader re-judge all archived rollouts each iteration adds 5.0 points over targeted auditing with the state grader and is non-inferior with the other graders. In exploratory runs it comes within about two points of oracle labels with the state grader and closes about half the standard loop's gap with the others. Across an exploratory sweep over label noise, fuzzy success, budget, fleet size, and horizon, every success point estimate is positive. A self-improving robot should therefore report progress through fresh audits and spend them where they also clean its training data.  Code: https://github.com/jackiectl2/grader-drift-self-improvement.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot self-improvement; learned success detection; reliable evaluation; prediction-powered inference; autonomous data collection; label-efficient auditing", "https://openreview.net/pdf?id=8GpAiSFPSv", "", ""], ["https://openreview.net/forum?id=fi5UmvIKPo", "Language to Design (L2D): Towards Self-Evolving Robots", "Kehlani Fay, Sha Yi, Michael T. Tolley, Xiaolong Wang", "Designing a robot requires expertise in both complex mechanics and control. This process typically relies on slow cycles of estimation, prototyping, and testing to find where design and behavior align. This raises a fundamental question: can robot design be made as simple as describing what we want a robot to do? We present Language to Design (L2D), a co-design framework that turns a prompt and an existing robot into an optimized body, a motion that performs the task, and manufacturable parts, without tuning or training per task or per robot. The framework supports 1) language proposals grounded in measured physics, where language reflection decides what to change and physics measured in simulation decides how much, 2) a continuous design space, spanning link kinematics, motors, added joints, and continuous morphology designs for contact points such as feet and fingers, and 3) generalization across nine different robots and eleven tasks, where one framework co-designs quadrupeds, arms, grippers, dexterous hands, and humanoids. Task videos are available on our anonymous website.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot co-design; self-improving robots; morphology optimization; language models; physics-grounded design search", "https://openreview.net/pdf?id=fi5UmvIKPo", "", ""], ["https://openreview.net/forum?id=7zNyEJETvE", "Learning Quality-Controllable Robot Policies with Iterative Hindsight Relabeling", "Sinjae Kang, Dong Kyu Shin, Jaehong Kim, Kamin Lee, Hyoeun Kim, Kaixin Wang, Li Zhao, Seonghyeon Ye, Kimin Lee", "Robot policy evaluation often relies on a binary success signal for task completion. In real-world deployment, however, desired execution behaviors are also defined by quality attributes such as execution speed and motion smoothness, which need to be dynamically controlled according to task requirements. To address this, we introduce Quality-Controllable Policy (QCP), a robot policy that enables inference-time control over both individual quality attributes and their combinations. To extend the controllable quality range beyond initial demonstrations, we introduce an iterative hindsight relabeling loop: QCP collects online rollouts under target quality labels, adds successful trajectories to the dataset, relabels the accumulated trajectories in hindsight according to their measured quality, and fine-tunes the policy. Experiments on robomimic and RoboEval demonstrate that QCP consistently improves both task execution quality and success rates across iterations, producing successful rollouts that exceed the quality of the initial demonstrations. Finally, we validate QCP on real-world manipulation tasks, showing that controlling speed increases throughput in conveyor operations and controlling transport stability improves success when carrying wine glasses, showing that quality-controllable policies yield practical gains in physical deployment.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot learning; imitation learning; quality-controllable policy", "https://openreview.net/pdf?id=7zNyEJETvE", "", ""], ["https://openreview.net/forum?id=QOk1IWyCYw", "MimicAgent: Quadruped Skills via Prompt-to-Trajectory Generation", "Lucky Kant Nayak, Narayanan Palghat Parameswaran, Neehar Peri, Deva Ramanan", "We present MimicAgent, a prompt-to-trajectory generation framework for learning dynamic quadruped skills. Although reward shaping is extensively used when training quadruped policies, navigating the resulting reward landscape is notoriously difficult, requiring hours of ``graduate student descent''. Eureka attempts to automate reward design with LLMs, but we find that it struggles to generalize across diverse skills and morphologies. Our key observation is that it is far easier for a human -- and by association, an LLM -- to generate reference motions than to shape reward functions. Our hypothesis is motivated by the success of example-guided RL for humanoids, which exploits large-scale motion capture datasets as references for training locomotion policies. Unlike humanoids, quadrupeds lack such reference motion data. Towards this end, we propose MimicAgent, an agentic harness that, given a skill prompt, generates quadruped reference trajectories with coding agents. These coarse reference trajectories are then used to train example-guided RL policies that are deployable in simulation and in the real-world. Notably, we find that when prompting Claude Fable 5.1 within our agentic harness, 87\\% of prompts yield semantically aligned reference trajectories.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "agentic trajectory generation; llm-based code synthesis", "https://openreview.net/pdf?id=QOk1IWyCYw", "", ""], ["https://openreview.net/forum?id=w0tP2CmTiI", "Multisensory Continual Learning: Adapting Pretrained Visuomotor Policies to Force", "Jaden Clark, Changhao Wang, Yihuai Gao, Seongheon Hong, Hojung Choi, Mark Cutkosky, Yifan Hou, Shuran Song", "Robot manipulation often depends on sensory data beyond vision, especially in contact-rich tasks where force, tactile, or audio feedback reveals interaction states not directly visible from images. Yet such modalities are hardware- and task-specific, and large multisensory datasets remain scarce, making it impractical to pretrain policies with every sensor they may encounter. We study multi-sensory continual learning: adapting a pretrained robot policy to new tasks with newly introduced modalities while preserving performance under the original sensor suite. We propose MultiSensory World Model (MuSe), which integrates limited multisensory data into pretrained vision-only policies using  multi-stage fusion, multisensory future prediction, and experience replay on pretraining data. We instantiate MuSe by adding force-torque sensing to a pretrained vision-only policy and evaluate it on real-world manipulation tasks. Experiments show that MuSe not only performs well on contact-rich finetuning tasks but also has performance gains on pretraining tasks - suggesting that a modest multisensory dataset can enhance general model capability beyond the finetuning distribution. https://multisensorylearning.github.io/multisensory-world-model/", "Continually Self-Improving Robots Workshop (CSIR-2026)", "continual learning; world models; multisensory learning; force", "https://openreview.net/pdf?id=w0tP2CmTiI", "", ""], ["https://openreview.net/forum?id=AFcBurihjY", "Never Stop Learning: From Simulation to Hardware with Maximum a Posteriori Policy Optimization", "Serena Liu, Mathieu Decker, Patrick Spieler, Harley Wiltzer, Andrej Orsula, Pedro Roque, Abbas Abdolmaleki, Amir Rahmani, Joel W. Burdick, Jean-Pierre de la Croix, Elena Sorina Lupu", "A common practice in robot learning is to learn policies in simulation and deploy them on hardware without further learning.\nHowever, the world in which robots operate is dynamic and too complex to anticipate every possible change in a simulator.\nWe empirically demonstrate how an off-policy actor-critic method such as Maximum a Posteriori Policy Optimization (MPO) enables a robot to learn in simulation and then not stop learning, but continue on hardware, allowing the policy to adapt to changes encountered in the real world. \nWe evaluate vanilla MPO, MPO with categorical (C51) critic, and propose Q-DMPO, which uses a quantile-regression critic and removes the need to specify return bounds.\nOn Open Ant hardware and in simulation-to-simulation transfer on Open Ant, Swimmer-v5, HighTorque Mini Pi, and an electric crane, the MPO variants continues to learn despite altered environment dynamics, whereas Soft Actor-Critic degrades or collapses as the dynamics shift grows. We trace this ability to a specific component: the Gaussian prior in MPO's policy update, whose Fisher-weighted regularization matches the penalty of Elastic Weight Consolidation. These results suggest that the choice of algorithm, critic, and regularization can replace transfer-time heuristics in permitting real-world learning without performance collapse.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "learning on hardware; learning in simulation; policy optimization", "https://openreview.net/pdf?id=AFcBurihjY", "", ""], ["https://openreview.net/forum?id=t66Jsm3yFC", "One Phase Is Enough: Sim-to-Real Transfer with Direct Visual Reinforcement Learning", "John Marangola, Antonia Bronars, Younghyo Park, Stephen Andrews, Kushal Kedia, Pulkit Agrawal", "Sim-to-real reinforcement learning (RL) has enabled impressive robotic behaviors, yet deploying policies directly from vision remains challenging. A common approach first trains a teacher policy with RL using privileged state observations, then distills its behavior into a vision-based student via imitation. However, the resulting student can substantially underperform its teacher. Directly training visual policies with RL offers a promising alternative, but learning task-relevant visual representations from scratch can be sample-inefficient, making one-phase visual RL intractable.\n\nWe propose DRIFT, a simple recipe for efficient one-phase visual RL using image observations available at test time. Our key insight is to use frozen, pretrained foundation vision encoders, allowing RL to focus on learning control from existing visual representations. Freezing the encoder avoids costly back-propagation through the vision backbone, while its pretrained representations enable real-world transfer from fast, rasterized simulation renders. Under matched architectures, observations, and compute budgets, DRIFT outperforms two-phase distillation and achieves a 58.8% relative improvement in average real-world success rate across three manipulation tasks. Controlled simulation evaluations demonstrate that DRIFT's relative advantage grows from roughly 9% in-distribution to over 61% under out-of-distribution shifts, suggesting that stronger generalization contributes to superior real-world transfer.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "sim-to-real; reinforcement learning; visual rl; robotic manipulation", "https://openreview.net/pdf?id=t66Jsm3yFC", "", ""], ["https://openreview.net/forum?id=JHdJL42sle", "One World, Many Hypotheses: Self-Play with Plural Curiosity", "Caiyi Zhang, Yuejiang Liu, Yilun Du", "Self-play enables robots to improve through their own experience, but its efficiency depends on identifying informative trajectories. \nA common approach uses disagreement among models as an intrinsic curiosity signal. Yet models with similar inductive biases may fail in similar ways, suppressing curiosity precisely where it is most needed.\nTo address this, we introduce Plural Curiosity, a mechanism that guides self-play through disagreement by design. The key idea is to construct hypotheses with deliberately different inductive biases, enabling them to offer competing explanations when evidence is scarce. These hypotheses can become more consistent as experience accumulates.\nWe instantiate Plural Curiosity in two ways: (i) perceptual diversity, using image-based and point-cloud-based encoders, and (ii) decision diversity, varying temporal dependencies through bidirectional and causal attention in action decoders.\nWe evaluate the proposed method in world action models, using self-play to improve the inverse dynamics models that translate predicted visual futures into actions. Experiments on ManiSkill show that Plural Curiosity achieves about 45% higher correlation with ground-truth error than previous methods and improves sample efficiency, with about 10% higher self-play success rates than random selection under the same data budget.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "self-improvement; self-play; world action model; inverse dynamics", "https://openreview.net/pdf?id=JHdJL42sle", "", ""], ["https://openreview.net/forum?id=19LRDddFhj", "Playful Agentic Robot Learning", "Junyi Zhang, Jiaxin Ge, Hanjun Yoo, Letian Fu, Zihan Yang, Yaowei Liu, Raj Saravanan, Shaofeng Yin, Justin Yu, Dantong Niu, Zirui Wang, Roei Herzig, Ken Goldberg, Yutong Bai, David M. Chan, Ion Stoica, Angjoo Kanazawa, Jiahui Lei, Haiwen Feng, Trevor Darrell", "Current agentic robot systems can write executable Code-as-Policy\nprograms, observe feedback, and revise behavior across multiple attempts, but\nthey remain largely task-driven: reusable skills are acquired only after explicit instructions. We study Playful Agentic Robot Learning, where an embodied coding\nagent uses self-directed play as a continual skill-learning stage before downstream\ntasks arrive. We introduce RATS, Robotics Agent Teams designed for play-time\nskill acquisition. During play, RATS proposes novel yet learnable exploratory\ntasks, plans and executes robot-code policies, verifies intermediate progress, diagnoses failures, retries with dense, step-level feedback, and distills successful\nexecutions into a persistent code skill library. At test time, the agent reuses\nrelevant skills from this frozen library to help solve new tasks. Experiments in\nLIBERO-PRO and MolmoSpaces show that play-learned skills improve held-out\ndownstream tasks over no play and random-play baselines, with a 20.6 and 17.0\npercentage-point gains over CaP-Agent0 on LIBERO-PRO and MolmoSpaces, respectively. Moreover, the learned skills can be plugged into other inference-time\nCode-as-Policy agents by simply retrieving them into the context, improving RoboSuite and real-world transfer by 8.9 and 8.8 points, respectively, without finetuning the underlying model.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "learning through play; agentic robotics; continual skill learning", "https://openreview.net/pdf?id=19LRDddFhj", "", ""], ["https://openreview.net/forum?id=lHfkUGnhMt", "RECALL: Recovery Experience Collection for Active Lifelong Learning in Vision-Language-Action Models", "Ulas Berk Karli, Tesca Fitzgerald", "Vision-Language-Action (VLA) models are typically trained offline on large demonstration datasets and updated post-deployment through additional fine-tuning. Deployed VLAs should instead identify where supervision is useful and adapt without forgetting. We present RECALL, a controlled empirical study of active lifelong adaptation in pretrained VLAs, investigating two coupled questions: where to collect new supervision and how to incorporate it into a pretrained policy. We evaluate a VLA's ability to retain prior behaviors while adapting to new data, comparing start-state demonstrations against policy-induced recovery states, uncertainty-guided versus non-uncertainty-based state selection, sparse versus dense recovery collection, and continual adaptation strategies including reduced learning rates, elastic weight consolidation, and replay. Key findings include: recovery-state supervision is often more useful than repeated start-state demonstrations, though this advantage does not require uncertainty-based selection; more recovery data is not always better; targeted recovery data alone can cause severe forgetting; and preserving prior behavior requires maintaining appropriate behavioral coverage. We further demonstrate uncertainty-triggered recovery collection as a pre-execution intervention on a physical robot. Together, these findings establish an empirical foundation for active lifelong learning in VLAs and offer practical guidance for building robot policies that improve continuously from deployment experience.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "vision-language-action models; active learning; continual learning", "https://openreview.net/pdf?id=lHfkUGnhMt", "", ""], ["https://openreview.net/forum?id=TxrH4y1Zh0", "Robo-Cortex: Continual Strategy Induction for Self-Evolving Embodied Navigation", "Nga Teng Chan, Yi Zhang, Yechi Liu, Renwen Cui, Fanhu Zeng, Zeyuan Ding, Xiancong Ren, Zhang Zhang, Jian Liu, Qifeng Chen, Yong Dai, Xiaozhu Ju", "Embodied agents increasingly retain their past through memory and reflection, yet retaining experience is not the same as learning from it. Most systems retrieve prior trajectories to inform the current decision while the reusable principles that map evidence to action stay fixed. We call this limitation strategic stasis: the agent accumulates experience, but its decision strategy never changes. We introduce Robo-Cortex, a self-evolving framework for embodied agents that maintains a persistent, versioned navigation strategy and revises it based on the outcomes of its own interactions. After each evolution round, Robo-Cortex diagnoses successful and failed episodes, induces candidate heuristics, and, rather than writing them straight into its knowledge base, selectively consolidates them into strategic guides. A confidence- and support-aware gate selects which guides enter the persistent strategy. The resulting strategy is subsequently redeployed through a closed-loop Imagine-then-Verify planner, while a multi-scale experience memory supplies the evidence required for diagnosis and evolution. On image-goal navigation, active recognition, and active embodied question answering, strategies Robo-Cortex induces for itself transfer to unseen environments and outperform strategies written by human experts by +9.72% SR, improving SPL by +15.30% over an unguided pipeline; under continued evolution the agent reaches 55.56% SR on IGNav against 38.57% for the strongest prior method. Real-world robot deployments show the navigation strategies support failure recovery in physical environments.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "in-context learning; embodied agents; strategy learning; embodied navigation", "https://openreview.net/pdf?id=TxrH4y1Zh0", "", ""], ["https://openreview.net/forum?id=RM7kcceIJA", "RoboLongR: Causally-Consistent Rewards Teach Robots to Progressively Master Long-Horizon Manipulation", "Zixuan Chen, Lin Cao, Fenggang Zhang, Haotong Zhang, Yangtao Chen, Jieqi Shi, Jing Huo, Yang Gao", "Long-horizon manipulation requires actions whose validity depends on earlier interactions, yet visual progress can conceal missing task prerequisites. We propose RoboLongR, an offline-to-online framework that learns history-dependent rewards to guide policy adaptation to new tasks. Its central objective is causal consistency: aligning rewarded progress with prerequisites supported by execution history. Stage-shuffle supervision encourages execution-order sensitivity, recurrent memory preserves evidence of earlier interactions, and two-round training refines trajectory segments using predicted progress. The resulting rewards guide stage-conditioned policy refinement from behavior cloning to online reinforcement learning. Sparse terminal feedback connects policy experience to reward learning by triggering correction for repeated high-scoring failures. Pretrained on demonstrations from 88 RLBench tasks and Open-X data, RoboLongR achieves 31.8% average success on 18 long-horizon tasks excluded from reward pretraining, exceeding the strongest evaluated baseline by 9.2 percentage points. Across four real-robot tasks, it achieves 57.5% success, a 32.5-percentage-point improvement over the comparison method. Reward-level controls probe sensitivity to synthetic order perturbations, while ablations examine the contributions of individual components to policy improvement. Project website: https://chenzixuan99.github.io/RoboLongR-public/.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "long-horizon manipulation; reward learning; reinforcement learning", "https://openreview.net/pdf?id=RM7kcceIJA", "", ""], ["https://openreview.net/forum?id=aPS3938Wc2", "Self-Correcting Imaginative Planning for VLM Embodied Agents", "Kai-Po Chang, Chang-Hsun Wu, Yen-Siang Wu, Yu-Han Huang, Kai-Chen Yang, Yu-Chiang Frank Wang", "Recent advances in Vision-Language Models (VLMs) have demonstrated their remarkable capability to serve as embodied agents in interactive environments. However, these agents often make plans (i.e., action sequences) that appear linguistically plausible but fail upon execution, without considering the visual consequences of each action. While prior works have explored enhancing VLM agents through language supervision or self-correction with text-based verification, enabling them to self-correct invalid plans against visual consequences before execution remains an open challenge. To tackle this, we propose Self-Correcting Imaginative Planning (SCIP), a training framework that enables VLM agents to self-correct their plans against imagined visual consequences before execution. SCIP integrates an imagination-guided policy learning scheme that grounds the VLM agent's planning in visual consequences, and a verification-driven imagination learning scheme that calibrates the imagination process to faithfully reflect the actual environment dynamics. Extensive experiments show that SCIP outperforms existing embodied VLM agents across multiple embodied planning tasks.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "vision-language model agents; embodied planning", "https://openreview.net/pdf?id=aPS3938Wc2", "", ""], ["https://openreview.net/forum?id=SSzIQ2yg7E", "Steering Multirobot Behavior via Closed-Loop Affine Activation Editing", "Satyajeet Das, Darren Chiu, Shashank Hegde, Gaurav S. Sukhatme", "Real-world robots need to adapt their behavior beyond the envelope of their pre-trained policy. Policy finetuning or retraining are options, but they risk catastrophic forgetting, degrading the pretrained policy's base performance. To combat this, we introduce CLAE: Closed-Loop Affine Activation Editing, an inference-time framework for steering the behavior of a frozen policy by editing intermediate activations while keeping the base policy weights and downstream action head untouched. CLAE approaches behavior steering as a closed-loop problem whose outputs edit policy activations that adapt online to the robot state, environment, target behavior, and multi-robot context. It trains a sparse autoencoder over frozen-policy activations, selects behavior-relevant latent features via post-hoc probing, and learns a lightweight RL-based steering policy that applies state-dependent affine edits to selected latents during inference. We validate CLAE on a frozen multi-quadrotor navigation policy trained to perform a single task: navigating robots to a set of goal locations while avoiding obstacles. Through extensive simulations and physical tests, we show that while navigating to their goal positions, CLAE can 1. steer individual robot behavior by controlling each robot's velocity profile; 2. coordinate multirobot behavior by preserving a desired formation, and 3. produce entirely new behavior wherein robots are required to reduce their exposure to surveillance cameras in the environment.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot navigation; multi-robot systems; behavior steering", "https://openreview.net/pdf?id=SSzIQ2yg7E", "", ""], ["https://openreview.net/forum?id=V8hQBmyydD", "TacHarness: Agentic Infrastructure for Continually Improving Visuotactile Robot Policies", "Jingxiang Guo, Gujie Shao, Yuxin Hu, Bingsheng Xie, Jiaxin Shi, Chen Gao, Yuhang Zheng, Haoyu Zhao, Weihao Yuan, Fei Wang, Shuicheng YAN", "Visuotactile robot learning involves environment construction, multimodal data production, policy training, and evaluation. TacHarness integrates agents into these stages to coordinate tool execution and manage dependencies between datasets and trained models. Agents interpret requirements, select tools and configurations, inspect execution evidence, and coordinate bounded retries or repairs. Collection integrates agentic environment generation with DataEngine. Environment-generation agents interpret text or visual requirements, select assets and layouts, invoke compilation and simulation, and diagnose and repair failures. After robot-task binding, DataEngine agents select trajectories, configure embodiment retargeting, and synthesize synchronized visual, tactile, state, and action observations through simulation. Quality checks connect accepted episodes to versioned datasets. For training, agents select policy backends, initialization, and optimization budgets, bind accepted datasets to compatible configurations, and invoke training executors. They inspect progress and failure evidence and coordinate recovery through backend checkpoint mechanisms. Training checks cover optimization steps, finite losses, and checkpoint availability; the resulting checkpoints record data sources and sensor–action conventions for downstream serving and evaluation. Evaluation decouples policy inference from benchmark execution and returns task outcomes, timing, and failure evidence for subsequent decisions. Shared formats link scenes, datasets, models, and evaluation reports, while deterministic tools enforce task-specific acceptance criteria. We present the system architecture and adapters alongside recorded agent execution and multimodal replay across six environments. Execution records connect data inspection and repair to policy training, checkpoint verification, and online benchmark evaluation, showing how agents coordinate tools and use results throughout the learning workflow.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "agentic robotics; visuotactile robot learning; autonomous data collection; continual learning; robot learning infrastructure", "https://openreview.net/pdf?id=V8hQBmyydD", "", ""], ["https://openreview.net/forum?id=rcLTiMdxUa", "Test-Time Gradient Guidance of Flow Policies in Reinforcement Learning", "Zhiyuan Zhou, Andy Peng, Charles Xu, Qiyang Li, Jost Tobias Springenberg, Kevin Frans, Sergey Levine", "Expressive continuous control policies, such as diffusion and flow models, form the backbone of recent advances in scaling imitation learning for simulated and real robot control. While they are known to scale stably in the supervised imitation learning setting, incorporating them into reinforcement learning (RL) pipelines for policy improvement has proven more difficult. It often requires specialized training objectives or back-propagating through denoising processes, which cause well known issues with stability and affects scalability. In this paper we study the question of whether simple policy improvement schemes at test time alone, leaving stable supervised policy training intact, can be a competitive alternative which side-steps these issues. To this end, we propose QGF (Q-Guided Flow), a new RL algorithm that performs policy optimization entirely during test time. QGF works by pre-training both a reference flow policy (via a standard behavioral cloning objective) and a value function critic and, during test-time, using the value gradient to guide the reference policy to generate higher-value actions without any additional policy learning. Empirically, QGF outperforms prior test-time RL methods while being much cheaper to run, and is competitive with state-of-the-art training-time algorithms on single-task and goal-conditioned offline RL benchmarks with high-dimensional action spaces. Moreover, it exhibits favorable scaling with model size by avoiding the instability of actor-critic training, offering a practical and effective alternative RL algorithm with expressive policies.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "reinforcement learning; test-time guidance", "https://openreview.net/pdf?id=rcLTiMdxUa", "", ""], ["https://openreview.net/forum?id=gbpBmOKEBt", "The Evaluation Tax on Self-Improving Robots: Exact Operating Characteristics of Evaluation-Gated Improvement Loops", "Varun Puttagunta", "A self-improving robot proposes a policy update, evaluates it with a handful of real-world trials, keeps it or discards it, and repeats; every trial spent on evaluation is one not spent on learning. We give an exact account of this evaluation gate. Modelling each update as a shift in success rate drawn from a proposal distribution and each gate as a rule on n trials per policy, we compute by binomial enumeration the probability of accepting a regression, the expected progress per trial, and the exact distribution of the loop's success rate after a fixed trial budget, for 8 accept rules and 7 proposal distributions. When fewer than half of proposals help, the intuitive \"keep it if not worse\" gate makes the loop lose performance for every n below a closed-form threshold; with 20% good proposals and n=5, a loop starting at 50% success ends at 0.02 after 2000 trials. The progress-maximising n depends on proposal quality, from 3 to unbounded, and a paired sequential race is 1.68x more trial-efficient than the best fixed-n gate. Selecting the best of ten candidates on ten trials each inflates the measured gain 18x. The evaluation budget per iteration is a design variable of the loop, and we give the numbers needed to set it.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "self-improvement; real-world evaluation; statistics; policy comparison; sequential testing", "https://openreview.net/pdf?id=gbpBmOKEBt", "", ""], ["https://openreview.net/forum?id=LbJs3jw9BW", "The Experience Machine: A Conceptual Computation Model for Experience-Driven Intelligence", "Chengbo Yuan", "Humans learn from experience, while most current embodied agents do not. Modern robots are largely trained from offline demonstrations and exhibit only limited adaptation after deployment, often within specific domains. We argue that intelligence should continuously adapt to experience. We introduce the Experience Machine (EM), a conceptual model for this setting as a computational paradigm for experience-driven intelligence. EM draws inspiration from the computational abstraction of the Turing Machine and views experience as a paper-tape written with state, intent, action, and consequence critique in temporal order. The machine continuously reads the tape and performs processing and prediction, unifying policy inference, world modeling, and outcome evaluation, while updating its own internal belief. \nThe key idea is that the context written on the tape can come from diverse sources: internal imagination, real-world interaction, and human supervision. We demonstrate that this provides a natural path toward embodied reasoning, self-exploration, reinforcement learning from environment, and human-machine interaction. Rather than treating these capabilities as isolated research problems, EM places all of them within a single computational framework. It also naturally supports adaptive test-time computation, allocating more computation to complex or uncertain situations while using less for simple ones. Rather than proposing specific empirical results, this paper aims to introduce a unified computational framework that connects a growing set of directions and capabilities toward next-generation intelligence. We envision EM as a new paradigm for experience-driven intelligence and hope it inspires concrete instantiations in the future.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "experience-driven intelligence; computational model", "https://openreview.net/pdf?id=LbJs3jw9BW", "", ""], ["https://openreview.net/forum?id=81O8s78vu9", "The Open Ant: A Robot Platform for Reinforcement Learning Research", "Elena Sorina Lupu, Patrick Spieler, Khurram Javed, Kris De Asis, John D Martin, Martha Steenstrup, Joseph Modayil", "Reinforcement learning (RL) research has demonstrated success in both physical and simulated domains; however, the predominant methodology remains rooted in simulations. The predominance of simulations makes translating research to physical reality uncertain for both algorithms and researchers.\nWe propose a physical platform that is designed to simplify the transition. \nIn this paper, we present the Open Ant: a physical variant of the commonly used Gymnasium Ant environment, along with a simulation. \nWe demonstrate that competent walking policies can be learned from scratch in approximately one hour directly from the physical robot's experience for two substantially different RL algorithms: SARSA($\\lambda$) and Soft Actor-Critic (SAC). \nSeparately, we show policies that were learned in simulation transfer to reality. \nWe also examine how well the platform supports a nimble experimental ecosystem. Specifically, we observe the speed with which new users from diverse backgrounds achieve their first success with the platform, and how easily the platform can be repaired and updated when hardware issues arise.\nBoth the hardware design and software are available as open-source GitHub for ease of customization.\nIn summary, we advocate for the use of the Open Ant for RL researchers who frequently use simulated environments, so they can more easily include robot experiments in their evaluations.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "reinforcement learning; robotics; embodied intelligence; research platform", "https://openreview.net/pdf?id=81O8s78vu9", "", ""], ["https://openreview.net/forum?id=xOgueo5zGr", "Uncertainty-Gated Exploration Noise Suppresses Task Collapse in Online RL Fine-Tuning of a Flow-Matching Vision-Language-Action Policy", "Mehmet Turan Yardımcı, Yunus Emre Cogurcu", "Online reinforcement learning (RL) fine-tuning of pretrained flow-matching vision-language-action (VLA) policies promises robots that keep learning after deployment, but continued updates frequently destroy competence on individual tasks while the aggregate still looks healthy. We study this failure mode, which we call task collapse, under a matched small-compute budget on LIBERO-10 with a 450M-parameter SmolVLA policy trained by PPO in the stochastic (SDE) sampling regime. Three exploration-noise policies differ in a single live variable: a fixed noise scale, a learned noise network in the style of ReinFlow, and an uncertainty-gated controller that redistributes exploration across task streams from task-agnostic novelty and competence signals, without task labels or episode boundaries. Under the pooled definition, fixed noise collapses tasks in two of three seeds and learned noise in every seed measured to iteration 200, while the controller collapses none in any of its three seeds. Measured parameter displacement confirms that the controller's action expert continues to change, while its mean applied noise is close to the fixed scale in the available logs. The matched comparison supports the controller's effect on task preservation; the separate contributions of its adaptation across states and over time are not disentangled. A lower fixed scale slows the decline but does not stop it. No arm improves on the behavior-cloning baseline in this budget. Two properties of that regime are measured beside this result rather than offered as its cause: following the reference recipe, training runs in bfloat16 with no fp32 master copy, under which 96.02% of the action expert's elements stay bit-identical across three consecutive iterations, and an fp32 master copy at the reference learning rate collapses both arms in a single-seed observation. We release measurement tools for per-task collapse under four definitions, run-to-run rescoring noise and instrument tares.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "vision-language-action models; online reinforcement learning; flow matching; exploration noise; task collapse; continual learning; robot learning; numerical precision", "https://openreview.net/pdf?id=xOgueo5zGr", "", ""], ["https://openreview.net/forum?id=ajd27grKXj", "Value Sim-to-Real: Simulation Values for Efficient Real-World RL", "Weijun Dong, Yilin Wang, Jiawei Fu, Yuchen Zhou, Henrik I Christensen, Zhao-Heng Yin, Hao Su", "Real-world reinforcement learning (RL) is a promising approach for advancing robotic manipulation, but how to obtain informative and robust reward signals remains a central challenge. Recent works have explored reward models trained on real robotic data to enable efficient real-world RL. However, this formulation can be expensive and infeasible due to the high-dimensional state space and its dependence on real-world expert data. In this paper, we address this limitation with Value Sim-to-Real (VSR), a novel framework that leverages simulation-trained value functions to define informative, high-quality reward functions for efficient real-world RL. We evaluate our method with both sim-to-sim and sim-to-real experiments on several vision-based contact-rich tasks. We show that VSR learns a smooth value function that strongly correlates with task progress and improves the performance and sample efficiency of downstream RL with its induced reward function.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "real world reinforcement learning; robot manipulation; sim-to-real transfer", "https://openreview.net/pdf?id=ajd27grKXj", "", ""], ["https://openreview.net/forum?id=RiCX6mW1vX", "VeriFine: Scaling Verification for Self-Improvement in Embodied Reasoning", "Zewei Zhou, Rachel Luo, Yulong Cao, Chaowei Xiao, Chensheng Peng, Boyi Li, Thomas Tian, Zheng Lian, Yan Wang, Jiaqi Ma, Boris Ivanovic, Marco Pavone, Wenhao Ding", "Self-improving policies continually expose new failure patterns, changing what their judges must be able to verify. However, current fixed judges constrain both optimization feedback and the discovery of useful training examples, limiting further self-improvement. This challenge is even more acute in embodied reasoning, where reliable evaluation must account for spatial grounding, causal reasoning, and safety-aware decision-making. We introduce VeriFine, an agent harness framework that scales verification through the co-evolution of the policy, training curriculum, and judge. The Policy Improvement Loop uses a rubric judge to diagnose recurring failures, construct an adaptive curriculum, and optimize the policy. When progress plateaus and verification becomes a bottleneck, the Judge Improvement Loop selectively queries human guidance on informative failure cases and refines the judge through coactive calibration, in which humans and agents resolve disagreements and converge toward the objective rubric of physical reasoning. The revised judge then guides the next stage of data selection and policy optimization. Experiments on driving and robot navigation tasks demonstrate continuous self-improvement in both policy and judge capability across reinforcement and supervised fine-tuning. These results show how scaling verification supports continuous self-improvement as policy failure patterns evolve.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "self-improvement; embodied reasoning; scale verification", "https://openreview.net/pdf?id=RiCX6mW1vX", "", ""], ["https://openreview.net/forum?id=2VMRk0ojD2", "VETO: Reward-Supervised World Models as Action Verifiers for Sample-Efficient RL", "Skand Peri, Matthew M Hong, Chaoxiang Zhang, Ross Worobel, Suraj Shivakumar, Dieter Fox, Jesse Zhang, Abhishek Gupta", "Fine-tuning pre-trained manipulation policies with reinforcement learning (RL) is a promising route to real-world adaptation, but its sample efficiency remains the limiting factor on real robots. A key source of wasted interactions comes from *credit-assignment lag*, i.e., RL policies repeatedly reattempting failure modes they have already observed because observed outcomes must be propagated through a slowly converging temporal-difference (TD) critic, and then through the policy, before behavior changes.  Model-based RL methods are often used to improve sample efficiency since they rely on supervised learning, but they can introduce model-error bias into policy gradients. Our key insight is that action ranking need not rely on TD learning: a latent world model trained with *supervised reward prediction* can provide useful rankings with fewer transitions than TD-trained $Q$-functions. We introduce **V**erifying **E**xploratory **T**rajectories **O**nline, which uses a continually learning, lightweight world model as an online action verifier. The policy proposes candidate action chunks, and the verifier scores them by rolling out latent dynamics and predicting rewards to veto poor action candidates. Because policy and critic targets use real transitions rather than imagined rollouts, world-model errors do not enter the Bellman backup, allowing for asymptotic optimality. Across 7 tasks in 2 simulation suites and on real-world YAM and Franka platforms, $\\texttt{VETO}$ adapts in fewer environment interactions than off-policy and model-based baselines and improves pre-trained policies in the real world.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "adaptation; real-world reinforcement learning", "https://openreview.net/pdf?id=2VMRk0ojD2", "", ""], ["https://openreview.net/forum?id=V7OW0Ar0yl", "VICTR: Value-Informed In-Context Learning for Vision-Language-Action Models", "Luca Macesanu, Tianluo Zhang, Aditya Anant Patil, Archit Sharma, Kevin Angers, Christopher Clark, Chen Feng, Juexiao Zhang", "Recent advances in robot foundation models have highlighted the potential of in-context learning (ICL) for adapting robot behavior from demonstrations without further fine-tuning. \nPrevious work has used retrieval-based post-training to equip pretrained vision-language-action (VLA) models with the capability for ICL by teaching them to condition action predictions on retrieved visually-relevant demonstration chunks. However, the effectiveness of retrieval hinges on selecting context relevant to the current execution stage, which visual similarity alone may not capture.\nWe introduce VICTR, a framework enabling in-context learning in VLAs via progress-informed context retrieval built around an In-Context Value Function Estimator (IC-VFE). IC-VFE conditions on a reference demonstration video, a language instruction and the current observation to estimate task-relative \\emph{progress}.\nBy conditioning progress estimation on a reference demonstration, IC-VFE can align the current state with a demonstrated execution even for tasks unseen during training.\nVICTR uses the estimated progress to select demonstration chunks at corresponding stages of execution and supplies them to a $\\pi_{0.5}$ policy post-trained for in-context action generation.\nOn unseen out-of-domain real-world manipulation tasks, VICTR raises the success rate from 2.7\\% for a fine-tuned $\\pi_{0.5}$ baseline to 25.0\\% and more than doubles the task progress rate, from 26.8\\% to 58.2\\%.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "in context learning; vlas; mobile manipulation; value function estimation", "https://openreview.net/pdf?id=V7OW0Ar0yl", "", ""], ["https://openreview.net/forum?id=lSCER7Mc61", "Visual Verification Enables Inference-time Steering and Autonomous Policy Improvement", "Mingtong Zhang, Dhruv Shah", "Robots deployed in the real world should learn from their experience and improve over time. This requires a mechanism of practicing and learning from feedback. In this paper, we propose VERITAS, a generator–verifier framework for generalist robot policies for inference-time policy steering and self-improvement. We use a pre-trained generalist robot policy as a “generator” and pair it with a gradient-free “visual verifier” that evaluates actions at inference time. This framework enables inference-time steering that improves policy performance without additional training. We demonstrate that inference-time verification consistently outperforms vanilla generalists without training on additional demonstration data. Additionally, we demonstrate that the verified rollouts provide effective supervision for offline policy improvement: policies fine-tuned on verified self-generated trajectories achieve consistent performance gains. Notably, we find that post-training with verified rollouts achieves comparable efficiency to expert demonstrations, while requiring no human interventions. Our results highlight inference-time verification as a practical and scalable mechanism for improving robotic policies during deployment.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "robot learning; visual verification; inference-time steering; autonomous policy improvement", "https://openreview.net/pdf?id=lSCER7Mc61", "", ""], ["https://openreview.net/forum?id=eKIoWYRtrD", "WEAVER, Better, Faster, Longer: An Effective World Model for Robotic Manipulation", "Arnav Kumar Jain, Yilin Wu, Jesse Farebrother, Gokul Swamy, Andrea Bajcsy", "The potential impacts of world models (WMs, i.e., learned simulators) on robotics are far-reaching—policy evaluation, policy improvement, and test-time planning—all with limited real-world interaction. To unlock these downstream capabilities, a WM needs to jointly satisfy three desiderata: (i) fidelity (i.e., producing simulated trajectories that correlate with reality), (ii) consistency (i.e., producing simulated trajectories that are coherent over long horizons), and (iii) efficiency (i.e., producing simulated trajectories quickly). We propose WEAVER (World Estimation Across Views for Embodied Reasoning): a WM architecture that simultaneously achieves all three desiderata, providing state-of the-art results on robotic manipulation tasks. WEAVER is a multi-view WM trained to predict future latents and reward values via a flow-matching loss. We distill the key design decisions across model architecture, memory, and prediction objectives required to unlock the kinds of long-horizon dynamic manipulation tasks that have confounded prior world modeling approaches. We apply WEAVER in robotic hardware, demonstrating its effectiveness at policy evaluation (ρ = 0.870 correlation with real-world success rate), policy improvement (real-world success rate improvement of 38% on top of the π0.5 robot foundation model), and test-time planning (real-world success rate improvement of 14% with a 5 − 10× speedup over prior WMs). WEAVER also demonstrates better performance than prior WMs when evaluated on out-of-distribution scenarios. Website:https://weaver-world-model.github.io.", "Continually Self-Improving Robots Workshop (CSIR-2026)", "world model; test-time planning; robotic manipulation", "https://openreview.net/pdf?id=eKIoWYRtrD", "", ""], ["https://openreview.net/forum?id=GALvgShgor", "A Scene-Grounded Data Engine for Mobile Manipulation", "", "Mobile-manipulation policies are usually trained on demonstrations teleoperated in the room where the robot will be deployed, because a policy that navigates and manipulates learns the room along with the task. We present a data engine that removes the teleoperation while keeping the room: one handheld walkthrough of the deployment scene is reconstructed into a 3D Gaussian Splatting appearance model and a contact mesh, rollouts are generated and verified in Isaac Sim, and observations are rendered by compositing the simulated robot against the captured scene. We evaluate on the physical robot rather than in simulation, on a dual-arm mobile manipulator across four tasks with 30 trials per condition. At matched demonstration counts, generated and teleoperated data train equally capable policies; because generated data costs only compute, scaling it to 300 demonstrations per task raises success to 60.0% against 43.3% for the best teleoperation baseline ($p=0.013$), after 13 person-minutes of effort per scene. Controlled comparisons identify what makes the simulation predictive: the same engine run in a different scene collapses to 5% success, a reconstruction built for manipulation alone or navigation alone recovers less than half, and rendering against a textured mesh instead of the captured appearance halves success. We release the engine, the scene captures, and 10,000 generated demonstrations across five real scenes.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "sim-to-real validation; demonstration generation; mobile manipulation; isaac sim; real-to-sim-to-real; gaussian splatting", "https://openreview.net/pdf?id=GALvgShgor", "", ""], ["https://openreview.net/forum?id=DxSjwUQTbO", "AlphaNIST: Emergent Assembly Skills from Binary Task Rewards", "", "The NIST Assembly Task Board #1 remains a challenging benchmark for learning-based robotic manipulation. Demonstrations, task decomposition, and dense progress rewards have advanced research by guiding robots on how to assemble. But how much of that strategy must be specified? The progression from AlphaGo to AlphaGo Zero showed that reinforcement learning at scale can discover superhuman strategies without prescribing how to win. AlphaNIST asks whether a sparse binary task reward, together with the task diversity it permits, can similarly let a robot discover how to assemble.\n\nIn simulation, we train a single policy from scratch across all 20 assembly tasks on the NIST Assembly Task Board #1. It reaches 98.2% overall training success without demonstrations, progress shaping, scripted primitives, or per-task tuning. The framework also trains policies to complete ten assembly pairs in a single episode without a prescribed order, rewarding success only when all ten pairs are simultaneously complete.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "robotic assembly; reinforcement learning; multi-task learning; dexterous manipulation", "https://openreview.net/pdf?id=DxSjwUQTbO", "", ""], ["https://openreview.net/forum?id=Ou6gexinc9", "An Empirical Study on What Matters for Viewpoint-Generalizable Policies in Visual Imitation Learning", "", "Visual imitation learning is a promising approach to training robot manipulation policies capable of completing a wide variety of tasks. However, policies today remain brittle to viewpoint perturbations, making deployment in diverse environments a challenge. We present a controlled empirical study of which design choices allow visuomotor policies to generalize across viewpoints. We find that viewpoint generalization improves when dense visual tokens are retained and the action head participates in geometric reasoning. On a suite of simulated tasks that span a wide range of camera poses, we show that these design choices yield a policy that remains performant across viewpoints. As a practical consequence, a policy trained with these design choices also transfers zero-shot from simulation to the real world under random camera configurations.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "viewpoint generalization; visual imitation learning; sim-to-real", "https://openreview.net/pdf?id=Ou6gexinc9", "", ""], ["https://openreview.net/forum?id=GE27RKiwrk", "Beyond Task Success: Diagnostic Safety Evaluation of Robot Policies", "", "Scalable simulation evaluation is useful only when its metrics distinguish the behaviors needed for deployment. We present a diagnostic safety study of OpenVLA, OpenVLA-OFT, and $\\pi_{0.5}$ using 22,200 retained LIBERO rollouts, unsafe/safe instruction pairs, initial stop requests, and visual instruction controls. Stop requests still produce object displacement in 28.7–91.0% of episodes, while pooled unsafe/safe outcome-proxy differences are below 0.13 percentage points. Neutral, blank, and blurred signs reproduce most of OpenVLA's task-success loss under an injected command. Across 23 safety-guard configurations, template accuracy does not predict robustness to rewording or contextual risk: the best GuardianBench pair accuracy is 43.6%. A hidden-state probe reaches AUROC 0.810 on new verbs but has 28.7% false positives. Matched controls, common-input comparisons, and record audits expose distinct failures that binary task success conceals. These simulation and classification findings motivate richer benchmark reporting; they do not establish real-robot safety or sim-to-real transfer.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "robot learning; simulation benchmarks; diagnostic evaluation; safety; robustness", "https://openreview.net/pdf?id=GE27RKiwrk", "", ""], ["https://openreview.net/forum?id=C9Ugz7LftC", "Blind Precise Assembly: Proprioceptive Sim-to-Real Peg-in-Hole for Diverse Parts", "", "Every robot already carries high-resolution contact sensors: its own joints.\nLegged robots and humanoids exploit them to walk, run, and track whole-body\nmotions without vision, but there the contacts are large and forceful. Is joint sensing also enough for precise, contact-rich assembly, where the robot must\nfind a millimeter-scale opening, mesh gear teeth, or catch a thread through light\ncontact? We study this question by training blind assembly policies that observe\nonly a short history of joint positions, velocities, and their own actions, without\nvisual, force, torque, or tactile sensing. The poses of both the fixture and the part\nare unknown to the policy, and the grasp is randomized substantially. The policy must\ntherefore assemble the parts through contact, sensed exclusively through its own\nproprioception. Trained with reinforcement learning entirely in simulation over\nrandomized parts, grasps, and contacts, such policies learn peg insertion, gear\nmeshing, and nut threading. The peg insertion policy transfers zero-shot to the real\nworld and inserts pegs of different shapes and sizes in 73% of trials.\nControlled comparisons with matched visual policies in simulation show that blind policies generalize far better to unseen part shapes and sizes, though they can be slower.\nTraining such policies needs thousands of different assemblies, each\nsimulated with its clearance intact, so we also release an\nopen-source generator that builds them procedurally from exact convex pieces\nfor MuJoCo; it is more accurate and faster than convex decomposition or\nMuJoCo's signed-distance collision.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "proprioception; sim-to-real transfer; contact-rich manipulation; peg-in-hole assembly; reinforcement learning; collision geometry; mujoco", "https://openreview.net/pdf?id=C9Ugz7LftC", "", ""], ["https://openreview.net/forum?id=U7x8v6c0Bh", "CableTac: Scalable Visuo-Tactile Learning for Cable Routing", "", "Cable routing requires reasoning about both global cable geometry and local contact interactions, yet collecting large-scale visuo-tactile robot data is expensive. We present CableTac, a simulation and learning framework for scalable visuo-tactile cable manipulation. CableTac combines GPU-accelerated cable dynamics, general-purpose tactile simulation, and a full-scale replica of the ManipulationNet cable-routing benchmark. A demonstration-reuse engine expands 10 human demonstrations into more than 1,000 simulated trajectories, which we use to pretrain diffusion policies before reinforcement-learning post-training. Across three routing tasks, we find that policy performance improves with increasing amounts of generated data, while the value of tactile feedback is task dependent: tactile sensing provides little benefit for unconstrained round-peg routing, but improves success by 4.7 and 8.0 percentage points for Y- and U-clip insertion, where local contact is critical. RL post-training further improves success to 88.7% and 92.0% on Y- and U-clip routing. These results establish CableTac as a scalable testbed for studying when and how tactile feedback benefits linear-deformable-object manipulation.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "cable routing; visuo-tactile sensing; deformable-object manipulation; high-fidelity simulation; sim-to-real; reinforcement learning; agentic calibration", "https://openreview.net/pdf?id=U7x8v6c0Bh", "", ""], ["https://openreview.net/forum?id=urBMgWMjjh", "Colosseum V2: Benchmarking Generalization for Vision-Language-Action Models", "", "Vision–Language–Action (VLA) models demonstrate promising generalization in robotic manipulation, driven by advances in large-scale vision and language pre-training. This progress can be misleading. Despite the zero-shot perception and language capabilities of VLAs, their overall task performance often degrades under distribution shifts, revealing gaps in how these systems translate high-level understanding into robust behavior. To systematically study this gap, we introduce ColosseumV2, a large-scale simulation benchmark for evaluating VLA generalization in robot learning across diverse conditions. The benchmark comprises 28 tasks spanning 13 task categories and two robot morphologies, covering a wide range of manipulation primitives and long-horizon behaviors. Built on the ManiSkill simulator, ColosseumV2 enables fast, GPU-parallelized evaluation and supports both in-domain and out-of-domain testing at scale. We evaluate state-of-the-art methods, including Action Chunking Transformers (ACT) and $\\pi_{0.5}$, and reveal limitations in both base performance and generalization. We demonstrate strong correlations between simulation and real-world metrics that support the ecological validity of the benchmark. By standardizing tasks, metrics, and evaluation protocols within a unified benchmark, ColosseumV2 enables reproducible and fair comparisons, reduced evaluation overhead, and accelerated progress toward general-purpose robot policies.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "imitation learning; robot learning; benchmarking; vision-language-action models", "https://openreview.net/pdf?id=urBMgWMjjh", "", ""], ["https://openreview.net/forum?id=cstwyT14lz", "Eden: One Task Definition from Simulation to Real Robots", "", "Robot policies are increasingly trained in simulation, yet deploying one on a physical robot usually means rewriting its observation and action processing against the robot's SDK, a second implementation that can silently diverge from training. We present Eden, a robot-learning framework built on Genesis in which a task is one typed, serializable configuration whose terms declare their own parameters and access robots and objects only through entities they reference by name. Replacing the simulated robot entity with one that reads the physical robot runs the training task's observation, action, and command code on hardware; the same configuration also drives teleoperated data collection and selects the solver and contact model. Five whole-body tracking policies deployed this way succeed in 47/50 Unitree G1 trials with no observation or action code rewritten, and a vision-language-action policy fine-tuned on 100 demonstrations collected in Eden succeeds in 27/30 real pick-and-place trials. We evaluate the design with a coding-agent benchmark that holds the agent, task description, documentation, and success checker fixed and varies only the framework. Agents reach a working policy in Eden, IsaacLab, and mjlab in a similar fraction of five independent rollouts. On tasks that must be built from components, they reach it in less wall-clock time in Eden, although coding models have likely seen less Eden code; on tasks adapted from shipped code, Eden gives no clear advantage, and it does not reduce token use in general.", "From GPU-Accelerated Simulation to Scalable and Generalizable Real Robot Policy Learning", "sim-to-real deployment; robot-learning infrastructure; task specification", "https://openreview.net/pdf?id=cstwyT14lz", "", ""], ["https://openreview.net/forum?id=aLuF2Kdb7L", "Embodiment-Classifier Guidance: Transferring Frozen VLAs Across Robot Dynamics without Demonstrations", "", "Flow-based policies such as $\\pi_0$ are trained on a fixed set of embodiments, and transferring them to new ones is an open problem. To adapt a frozen $\\pi_0$ to a new embodiment without additional demonstrations or parameter updates, we train a lightweight embodiment classifier to distinguish successful action chunks on the source body from those on the target body, using a few calibration tasks. On transfer tasks that $\\pi_0$ saw on its source body but the classifier was never trained on, we nudge each denoising step of $\\pi_0$ with the classifier's gradient, which estimates the direction from the distribution of successful actions on the source body toward that on the target body. On the LIBERO simulation benchmark with four modified controllers, embodiment-classifier guidance raises $\\pi_0$'s average success on the target bodies from 72% to 80% across 12 settings, with a 31% relative reduction in failures (11 of 12 gain; 5 significant after Holm correction). In simulation, guidance is data-efficient, needing few target-body rollouts per task, which makes it promising for sim-to-real transfer, where rollouts are costly. On weak or locked wrists, guidance is mixed and can hurt when the classifier lacks data or favors infeasible motions. Collecting more target-body data with guided $\\pi_0$ can fill such gaps: on one weak-wrist arm, guided $\\pi_0$ solved a task on which unguided $\\pi_0$ had zero successes in t
