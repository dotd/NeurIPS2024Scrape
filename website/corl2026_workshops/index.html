lation: Full-Stack Robotics on Learning and Design", "representation learning; inhand manipulation", "https://openreview.net/pdf?id=aPbT1KmiK7", "", ""], ["https://openreview.net/forum?id=8aXwkwmlaB", "Scan-to-Hand: Automated Design of Personalized 20-DoF Tendon-Driven Hands", "Ruochen Hou, Feng Xu, Dennis Hong", "Transferring human demonstrations to dexterous robots requires accommodating differences in finger proportions, joint geometry, and contact surfaces. We introduce Scan-to-Hand, an automated design pipeline that personalizes robotic hand morphology from an individual’s 3D hand scan, bringing hardware adaptation into the demonstration-transfer problem. The pipeline combines parametric hand-model fitting and engineering adjustments to joint frames with reusable tendon-driven mechanisms and scan-shaped links. The generated tendon-driven hand has 20 degrees of freedom, with four per finger, including independent actuation of the distal joints. Feature-preserving geometry construction maintains tendon passages, knot access, and assembly interfaces while adding motion clearance. Constrained optimization generates smooth palm routes subject to wall-thickness, channel-separation, and bend-radius requirements. We have fabricated and assembled a first personalized prototype and demonstrate its motion, alongside geometric checks of the generated routing. Ongoing imitation-learning experiments use a crossed demonstrator-by-robot comparison to distinguish the effects of robot morphology itself from the advantage of matching a robot hand to its demonstrator. Scan-to-Hand automates the design of personalized robotic hands and supports their fabrication to study how human–robot morphology matching affects learning from human demonstrations.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous robotic hands; automated robot design; morphology personalization; tendon-driven actuation; human demonstration transfer", "https://openreview.net/pdf?id=8aXwkwmlaB", "", ""], ["https://openreview.net/forum?id=1wu17WAH9f", "Support-Constrained RL Enables Real-World Policy Improvement without Additional Real-World Experience", "Raymond Yu, William Huey, Mustafa Mukadam, Anusha Nagabandi, Abhishek Gupta", "Robots trained on real world data tend to be imprecise, slow, and brittle to perturbations. Improving these policies with reinforcement learning (RL) is an appealing alternative, but this process often requires expensive training in the real world. Performing policy improvement in simulation instead provides a far cheaper alternative, but unconstrained RL in simulation can exploit contact and dynamics mismatches, resulting in unsafe behaviors that do not transfer to hardware. Common forms of regularization can furthermore limit improvement by overconstraining to an imperfect behavior prior.  In this work, we propose Support-Constrained Off-Domain REinforcement (\\texttt{SCORE}), a real-to-sim-to-real framework that constrains RL in simulation to stay near the \\textit{support} of a generative policy pretrained on real data. We instantiate this constraint through \\textit{flow steering}, restricting \\texttt{SCORE} to explore through modes of the base policy, which ensures transferable behaviors while maximizing policy improvement. Improving a policy with \\texttt{SCORE} requires minimal effort: it learns from sparse rewards, avoids distillation, and leaves the base policy untouched. Across eight real-world dexterous multi-fingered robotic manipulation tasks, \\texttt{SCORE} improves average success rate from $38.6\\%$ to $89.3\\%$, compared to $59.8\\%$ for the best baseline, and completes tasks $36.7\\%$ faster than the base policy. Ultimately, through extensive experiments and ablations, we show that simulation can substantially improve real-world manipulation policies when policy optimization is appropriately constrained, introducing a new paradigm for real-to-sim-to-real policy improvement. Videos are available at https://score-anon.github.io.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "reinforcement learning; sim-to-real; dexterous manipulation", "https://openreview.net/pdf?id=1wu17WAH9f", "", ""], ["https://openreview.net/forum?id=RiwnwU3act", "TacSushi: Tactile-Grounded World–Action Modeling for Dexterous Food Manipulation", "Haodi Hu, Kaen Kogashi, Toshiaki Koike-Akino", "Dexterous food manipulation requires control under deformation, occlusion,\nand uncertain contact. We present TacSushi, a Cosmos3-based policy that gives current\nfingertip touch a feature-wise gated path to the deployed action head while\nusing logged future visual, tactile, progress, and contact outcomes only as\ntraining supervision. Failed demonstrations retain consequence targets, but\ntheir actions are masked from imitation. Across 600 real-robot rollouts, the\nfull model reaches 68.3\\% average success on three in-distribution tasks\nand 37.5\\% on two held-out ingredients under a per-rollout human--VLM\nvisual-quality rule. Matched ablations support complementary\nbenefits from gated tactile fusion and training-only consequence prediction,\nwhile also revealing limited ingredient-level transfer and open questions\nabout which predicted outcome matters most.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; tactile sensing; world models", "https://openreview.net/pdf?id=RiwnwU3act", "", ""], ["https://openreview.net/forum?id=tiLxS2RC4L", "TACTIC: Diagnosing Tactile Encoder and Fusion Choices for Contact-Rich Robot Manipulation", "Seongjin Bien, Débora Oliveira Makowski, Carlo Kneissl, Pankhuri Vanjani, Reihaneh Mirjalili, Rudolf Lioutikov, Gitta Kutyniok, Florian Walter, Wolfram Burgard", "Tactile sensing can reveal contact information that cameras alone miss, yet it remains unclear how tactile encoder and multimodal fusion choices affect real robot policies across tasks. We present TACTIC, a controlled real-world comparison of five tactile encoders and five fusion strategies with an Action Chunking Transformer across four contact-rich manipulation tasks. The study comprises 2,180 rollouts and tracks progress through task stages, exposing failures hidden by aggregate success rates. No encoder--fusion pair performs best across all tasks: simple concatenation is competitive, while contrastive fusion can help on some tasks and hurt on others. The results suggest that tactile representations and conditioning should be evaluated against task-specific contact demands, with stage-level outcomes used to diagnose where policies fail.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "imitation learning; tactile sensing; contact-rich manipulation; multimodal fusion", "https://openreview.net/pdf?id=tiLxS2RC4L", "", ""], ["https://openreview.net/forum?id=9FDrtuUXoN", "Tactile Sensors Are an Effective Substitute for Wrist Cameras in Contact-Rich or Occluded Manipulation", "Aijia Yang, Arsh Tangri, Sergey Zakharov, Krishna Murthy Jatavallabhula", "Learned manipulation policies often rely on wrist-mounted cameras for close-range visual feedback that complements external views of the workspace. However, contact-rich manipulation requires establishing and maintaining contacts that can remain hidden even from wrist cameras. Tactile sensors mounted on fingers can reliably and directly measure contact, without needing visual access. In this work, we show that this feedback enables policies to recover the performance advantage of wrist cameras using scene and egocentric vision together with touch. Our approach incorporates two low-cost tactile arrays into a visuotactile ACT policy, without wrist images during training or deployment. We evaluate six real-world task families spanning placement, insertion, occluded retrieval, and sustained-contact tool use. On three contact-rich tasks, we independently vary wrist-camera and tactile availability while keeping the demonstrations, policy architecture, and optimization settings fixed. Adding wrist cameras improves success by 18.3-28.3 percentage points over vision without wrist images. Adding tactile sensing instead improves success by 31.7-60.0 percentage points and yields higher observed success than vision-only policies with wrist cameras on all three tasks, with significant advantages on two under Holm-corrected tests. These results support finger-mounted tactile sensing as an effective alternative to wrist cameras in the evaluated contact-rich settings.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "tactile sensing; imitation learning; contact-rich manipulation", "https://openreview.net/pdf?id=9FDrtuUXoN", "", ""], ["https://openreview.net/forum?id=fmz1B7p1oE", "Touch Presence Is Not Touch Grounding: Testing Tactile Correspondence in VLM Grasp Understanding", "Talin Saini", "Adding touch can change a vision–language model's (VLM's) answer without showing that the model uses the tactile observation that belongs to the scene. We test four frozen VLMs on OpenTouch-derived grasp questions, using a 28-clip diagnostic set and a separately frozen 40-clip extension from the same four recordings. Holding RGB and the question fixed, we supply either matched touch or touch from eight other interactions (donors). Adding touch changes 9.8–18.1% of answers, but duplicating the RGB image changes 9.3–14.2%. Replacing matched touch with a donor changes answers about as often as swapping one donor for another (paired differences of −1.8 to +0.5 percentage points; all 95% intervals include zero), and answer changes show no clear association with global differences between the pressure maps. Accuracy against coarse taxonomy labels, whose reliability is limited, is consistent with these results. The tested models do not consistently treat the correct touch differently from touch drawn from other interactions. We recommend correspondence, duplicate-input, and repeatability controls whenever tactile grounding is claimed.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "tactile sensing; vision–language models; tactile grounding; multimodal evaluation; grasp understanding; dexterous manipulation; counterfactual controls; opentouch", "https://openreview.net/pdf?id=fmz1B7p1oE", "", ""], ["https://openreview.net/forum?id=243ZLWJrpS", "Video2Sim2Real: Full-Stack Self-Sufficient Dexterous Skill Acquisition from a Single Human Video", "Yunhai Han, Jianuo Qiu, Linhao Bai, Ziyu Xiao, Zihang Zeng, Yangcen Liu, Zhaodong Yang, Shalin Jain, Wenrui Ma, Jiaqi Fu, Yuqian Zheng, Manisha Natarajan, Muhammad Zubair Irshad, Kenneth Shaw, Matthew Craig Gombolay, Zsolt Kira, Harish Ravichandar", "Learning dexterous manipulation from a single human video requires bridging noisy motion estimates and embodiment differences. We introduce Video2Sim2Real, a self-sufficient framework that converts an RGB-D demonstration into a deployable robot skill without robot demonstrations or manual trajectory authoring. Our object-centric refinement identifies task-defining events from object motion, optimizes robot configurations in a reconstructed digital twin, and uses them to anchor the retargeted trajectory. Our factorized sim-to-real adaptation separates global perception errors from local contact-dynamics errors: a distilled geometry policy recalibrates keyframe poses before execution, while residual reinforcement learning adapts finger actions online. Across seven rigid-object tabletop tasks, refinement achieves 91.4% average simulated success, and the complete system succeeds in 67/70 real-world trials under local object-pose perturbations. Ablations support the complementary roles of geometry and contact adaptation, particularly for grasping. Rollout videos and additional materials are available on our anonymous project website: https://video2sim2real.github.io.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; learning from human video; real-to-sim-to-real", "https://openreview.net/pdf?id=243ZLWJrpS", "", ""], ["https://openreview.net/forum?id=AzKGwPLsOl", "VTAP Gripper: Synergizing Fingertip Sensing and a Visuo-Tactile Active Palm for Dexterous In-Hand Manipulation", "Yuhao Zhou, Yu She", "This paper presents a tactile-reactive gripper that integrates a Visuo-Tactile Active Palm (VTAP) and compliant, reconfigurable fingers equipped with tactile array sensors. The design exploits structured finger-palm synergy and multi-modal perception to achieve both robust grasping and fine manipulation. The actuated bi-modal palm seamlessly combines long-range visual localization with contact-rich tactile feedback, substantially extending the system's manipulation capability. To bridge the embodiment gap between human hand motion and the heterogeneous three-finger structure, we further propose a staged, gesture-conditioned retargeting framework for dexterous teleoperation. Extensive experiments validate the system across a range of challenging tasks: reactive grasping of YCB and fragile objects, in-hand syringe reorientation and plunger actuation, singulation of clustered objects down to 3 mm in diameter, and vision-tactile peg-in-hole insertion. Results demonstrate that high manipulation performance can be achieved through coordinated finger-palm interaction and multi-modal sensing, without resorting to high degrees of freedom anthropomorphic designs. The VTAP gripper and its retargeting framework offer a practical reference architecture for dexterous gripper design, manipulation, and contact-rich data collection in support of learning-based approaches. A full version of this work was accepted for publication at the 2026 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS 2026).", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "dexterous manipulation; tactile sensing; gripper design", "https://openreview.net/pdf?id=AzKGwPLsOl", "", ""], ["https://openreview.net/forum?id=0PFEpskiVZ", "Whole-Body Dexterity", "Conor Mc Gartoll, Pranay Thangeda, Carolina Higuera, An Thanh Dang, Nima Fazeli, Manikantan Nambi, Arjun Gupta, Mustafa Mukadam", "Current humanoid dexterous manipulation remains largely confined to end-effectors and simple grasps, falling short of humans’ ability to engage the entire body by bracing and sliding bulky objects against the arms and torso. We introduce Whole-Body Dexterity (WBD), a general framework that uses the robot's body and appendages as contact surfaces to grasp and manipulate objects. Our sim-to-real pipeline generates a dataset of feasible whole-body grasps, trains reinforcement-learning experts on an any-to-any repositioning objective, and distills them into a single policy that uses proprioception and object geometry. The distilled controller transfers zero-shot to a real Unitree G1, completing 90% of trials across basketball and box repositioning and a long-horizon shelf task, compared with 18% for direct retargeting and 4% for a generalist whole-body controller. Website: https://wholebodydex.com.", "3rd Workshop on Dexterous Manipulation: Full-Stack Robotics on Learning and Design", "humanoids; dexterous manipulation; reinforcement learning", "https://openreview.net/pdf?id=0PFEpskiVZ", "", ""]], "firstPage": {}, "meta": [{"c": [], "u": [], "t": [], "d": ["Thu 11/12, 8:30 AM–12:30 PM · Hilton Salon D · RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction"], "b": [], "m": [], "k": ["locomotion", "multi-agent", "reinforcement learning", "humanoid"], "r": [], "cites": null, "h": null}, {"c": [], "u": [], "t": [], "d": ["Thu 11/12, 8:30 AM–12:30 PM · Hilton Salon D · RoboLetics 3.0: Benchmarks for Agile Physical Human-Robot Interaction"], "b": [], "m": [], "k": ["humanoid robot systems", "performance evaluation and benchmarking", "se "claude2": {}}, "movies": {}, "here": "/Users/dotan.dicastro/projects/NeurIPS2024Scrape/website/corl2026_workshops", "store": "workshops", "drive": {"folder": "", "files": {}}, "arxiv": {}, "material": {"0SIsl52aer": [], "c22DjhXdnt": [["code", "https://github.com/Hebbian-Robotics/beyond-dodge-rate"], ["other", "https://huggingface.co/hebbianrobotics/g1-depth-dodge"]]}, "shortSum": {"0SIsl52aer": "• Problem: earlier SHIFT-WORLD agents cut simulated human–robot conflicts mostly by abstaining, confounding safety claims.\n• Key idea: compare intervention policies at exactly matched coverage (40%), so only which interventions are chosen matters.\n• Method: gradient-boosted regressor ranks counterfactual advantage of acting vs. yielding, trained on simulator potential-outcome labels.\n• Setup: 45k training examples; 5 held-out conditions, 120,000 episodes, 600,000 policy evaluations, 16 paired seeds.\n• High intent shift: 63.84% success, 2.52% conflict vs. Commitment heuristic 56.88%, 5.30%.\n• Linear counterfactual baseline nearly matches (64.15%, 2.65%): gains come from counterfactual supervision, not nonlinear architecture.\n• New: 20–60% budget sweep keeps gains over Commitment; synthetic only, no real-robot or collision guarantees.", "c22DjhXdnt": "• Problem: dodge rate ignores later failures; humanoid can dodge yet fall or leave its allowed area.\n• Task success requires dodge, no fall, and pelvis within 1 m of start for four seconds.\n• Method: paired camera faults (stale, blank frames) on two fixed G1 depth-dodge policies in simulation.\n• Restoring fresh frames at 2 s raises π1 success 50.0% to 95.3%; dodge rate stays 100%.\n• Under stale input, π1 dodges then exits area in 121 trials; all exits occur after throw resolution.\n• Blank input matches fresh-frame success (same 31/64 rescued), but fresh frames end 0.295 m closer to start.\n• Takeaway: report post-encounter motion alongside contact, falls, and area compliance, not dodge rate alone."}, "schedule": {"se function renderTable() {

  }));
  table.style.width = order.reduce((s, i) => s + width[i], 0) + 'px';

  table.querySelector('thead tr').replaceChildren(...order.map((ci, pos) => {
    const th = document.createElement('th');
    th.textContent = columns[ci]; th.title = columns[ci]; th.draggable = true;
    th.ondragstart = e => { dragFrom = pos; e.dataTransfer.effectAllowed = 'move'; };
    th.ondragover = e => { e.preventDefault(); th.classList.add('drag-over'); };
    th.ondragleave = () => th.classList.remove('drag-over');
    th.ondrop = e => {
      e.preventDefault();
      if (dragFrom === null || dragFrom === pos) return renderTable();
      order.splice(pos, 0, order.splice(dragFrom, 1)[0]);
      dragFrom = null;
      renderTable();
    };
    const handle = document.createElement('span');
    handle.className = 'resize';
    handle.onmousedown = e => {
      e.preventDefault(); e.stopPropagation();  // preventDefault also blocks the column drag
      const startX = e.clientX, startW = width[ci], col = table.querySelectorAll('col')[pos];

        col.style.width = width[ci] + 'px';
        table.style.width = others + width[ci] + 'px';
      };
      const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);

    mv.ontoggle = () => {  // players made on first open; preload="metadata" fetches only the first frame until played
      if (!mv.open) return box.querySelectorAll('video').forEach(v => v.pause());
      const play = () => { if (mv.dataset.autoplay) { delete mv.dataset.autoplay; box.querySelector('video')?.play().catch(() => {}); } };
      if (box.childElementCount) return play();
      box.append(...players(movs, ids));
      play();
    };
    dl.before(mv);  // right after the HTML / link buttons, before the fields
  }
  return d;
}
dets = rows.map(card);

// ---- filters ----
const picked = {d: new Set(), t: new Set(), p: new Set(), s: new Set(), k: new Set(), b: new Set(), m: new Set(), c: new Set(), u: new Set(), r: new Set()};
document.querySelectorAll('.facet').forEach(fd => {
  const key = fd.dataset.key, panel = fd.querySelector('.panel'), label = fd.querySelector('summary');
  if (!(facets[key] || []).length) return fd.hidden = true;  // nothing to pick on this site (e.g. Oral/Poster on your papers)
  const base = label.textContent;
  const search = document.createElement('input');
  search.type = 'search'; search.placeholder = '🔍 search…';
  const items = facets[key].map(f => {
    const l = document.createElement('label'), cb = document.createElement('input'), sm = document.createElement('small');
    cb.type = 'checkbox'; cb.value = f.id;
    sm.textContent = f.note;
    l.append(cb, document.createTextNode(f.name), sm);
    cb.onchange = () => {
      cb.checked ? picked[key].add(f.id) : picked[key].delete(f.id);
      label.textContent = base + (picked[key].size ? ` (${picked[key].size})` : '');
      fd.classList.toggle('on', picked[key].size > 0);
      applyFilters();
    };
    return l;
  });
  search.oninput = () => items.forEach(l => l.hidden = !l.textContent.toLowerCase().includes(search.value.toLowerCase()));
  panel.append(search, ...items);
  fd.ontoggle = () => fd.open && document.querySelectorAll('.facet').forEach(o => o !== fd && (o.open = false));
});
addEventListener('click', e => { if (!e.target.closest('.facet')) document.querySelectorAll('.facet').forEach(f => f.open = false); });
const FIELDS = ['q', 'minH', 'minC', 'sort', 'ghF', 'sumF', 'rateHas', 'rateF'];
FIELDS.forEach(id => document.getElementById(id).oninput = applyFilters);
const haystack = rows.map(r => r.join(' ').toLowerCase());  // every column, incl. companies/universities
document.getElementById('clear').onclick = () => {
  Object.values(picked).forEach(p => p.clear());
  document.querySelectorAll('.facet').forEach(fd => {
    fd.classList.remove('on'); fd.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    const l = fd.querySelector('summary'); l.textContent = l.textContent.replace(/ \(\d+\)$/, '');
  });
  FIELDS.forEach(id => document.getElementById(id).value = '');
  applyFilters();
};

// ---- remember the last filters (this browser only; file:// and http://127.0.0.1:8026/Corl2026/ keep separate copies) ----
function restoreFilters() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(store + 'Filters')); } catch (e) {}
  if (!saved) return;
  FIELDS.forEach(id => { if (saved.fields?.[id] != null) document.getElementById(id).value = saved.fields[id]; });
  document.querySelectorAll('.facet').forEach(fd => fd.querySelectorAll('input[type=checkbox]').forEach(cb => {
    if ((saved.picked?.[fd.dataset.key] || []).includes(cb.value)) { cb.checked = true; cb.onchange(); }
  }));
}
function saveFilters() {
  const fields = Object.fromEntries(FIELDS.map(id => [id, document.getElementById(id).value]));
  const pk = Object.fromEntries(Object.entries(picked).map(([k, v]) => [k, [...v]]));
  try { localStorage.setItem(store + 'Filters', JSON.stringify({fields, picked: pk})); } catch (e) {}
}

// ---- Workshops site: the papers view is one dropdown per workshop (in time, then room order), papers inside ----
const GROUPS = store !== 'workshops' ? null : schedule.sessions.map(s => {
  const g = document.createElement('details'), sm = document.createElement('summary'), body = document.createElement('div'),
        b = document.createElement('b'), info = document.createElement('small'), n = document.createElement('small');
  const [when, where, ...t] = s.split(' · ');
  g.className = 'wsgroup'; b.textContent = '🛠️ ' + t.join(' · '); info.textContent = `🕒 ${when} · 📍 ${where}`;
  sm.append(b, info, n);
  if (schedule.links[s]) {
    const a = document.createElement('a');
    a.href = schedule.links[s]; a.target = '_blank'; a.textContent = '🌐 website'; a.style.marginLeft = '8px';
    a.onclick = e => { e.preventDefault(); open(a.href, '_blank'); };  // don't toggle the dropdown
    sm.append(a);
  }
  g.append(sm, body);
  return {s, g, body, n, total: (schedule.order[s] || []).length};
});
if (GROUPS) document.querySelector('.facet[data-key=d] > summary').textContent = '🛠️ Workshop';
function renderPapers(idx) {
  const box = document.getElementById('papers');
  if (!GROUPS) return box.replaceChildren(...idx.map(i => dets[i]));
  const filtered = idx.length < rows.length;
  for (const G of GROUPS) {
    const list = idx.filter(i => meta[i].d[0] === G.s);  // ponytail: a paper in two workshops is listed under its first
    G.body.replaceChildren(...list.map(i => dets[i]));
    if (!G.total) G.body.textContent = 'No public papers on OpenReview for this workshop: see its website.';
    G.n.textContent = filtered ? `📄 ${list.length} / ${G.total}` : `📄 ${G.total}`;
    G.g.hidden = filtered && !list.length;
  }
  box.replaceChildren(...GROUPS.map(G => G.g));
}

function applyFilters() {
  if (!dets.length) return;  // first renderTable() runs before the papers view exists
  const minH = +document.getElementById('minH').value || 0, minC = +document.getElementById('minC').value || 0;
  const sort = document.getElementById('sort').value;
  const hit = (key, ri) => !picked[key].size || meta[ri][key].some(x => picked[key].has(x));
  const terms = document.getElementById('q').value.toLowerCase().split(/\s+/).filter(Boolean);  // all must match
  const ghSel = document.getElementById('ghF').value, gh = i => !ghSel || (ghSel === 'y') === !!rows[i][ghIdx];
  const sumSel = document.getElementById('sumF').value,  // live: summaries changes as you summarize / erase
        sm = i => !sumSel || (sumSel === 'y') === !!summaries[rows[i][idIdx].split('id=').pop()];
  const hasSel = document.getElementById('rateHas').value, rateSel = document.getElementById('rateF').value, rt = i => {
    const v = ratings[rows[i][idIdx].split('id=').pop()] || 0, n = +rateSel.slice(1);
    return (!hasSel || (hasSel === 'y') === v > 0) && (!rateSel || v > 0 && (rateSel[0] === 'g' ? v > n : v < n));
  };
  let idx = rows.map((_, i) => i).filter(i => gh(i) && sm(i) && rt(i) &&
    terms.every(t => haystack[i].includes(t)) &&
    hit('d', i) && hit('t', i) && hit('p', i) && hit('s', i) && hit('k', i) && hit('b', i) && hit('m', i) && hit('c', i) && hit('u', i) && hit('r', i) && (meta[i].h || 0) >= minH && (meta[i].cites || 0) >= minC);
  if (sort === 'az') idx.sort((a, b) => rows[a][titleIdx].localeCompare(rows[b][titleIdx], undefined, {sensitivity: 'base'}));
  else if (sort) idx.sort((a, b) => (meta[b][sort] || 0) - (meta[a][sort] || 0));
  table.querySelector('tbody').replaceChildren(...idx.map(i => trs[i]));
  renderPapers(idx);
  shown = new Set(idx);
  if (document.getElementById('bytime').classList.contains('active')) renderByTime();
  document.querySelector('.count').textContent = idx.length === rows.length
    ? `📄 ${rows.length} papers` : `📄 ${idx.length} / ${rows.length} papers`;
  saveFilters();
  updateStats();
}

// ---- top-bar statistics over all papers (not just the filtered ones) ----
function updateStats() {
  const costOf = o => Object.values(o).reduce((t, x) => t + (x.cost || 0), 0);
  const rated = Object.values(ratings), avg = rated.length ? rated.reduce((a, b) => a + b, 0) / rated.length : 0;
  const spent = costOf(summaries) + costOf(htmlv.claude) + costOf(htmlv.claude2) + costOf(links);
  document.querySelector('nav .stats').textContent = [
    `📝 ${Object.keys(summaries).length} summaries`,
    `🌐 ${Object.keys(htmlv.claude).length} HTML (Claude)`,
    `🐍 ${Object.keys(htmlv.python).length} HTML (python)`,
    `🔗 ${Object.values(links).filter(v => v.url).length} links`,
    `⭐ ${rated.length} rated` + (rated.length ? ` (avg ${avg.toFixed(1)})` : ''),
    `💲 $${spent.toFixed(2)} Claude spend`,
  ].join('  ·  ');
}

// ---- by-time view: one session's papers in presentation order (talk order / poster number), same filters ----
const btSel = document.getElementById('btSession'), posterIdx = columns.indexOf('🖼️ poster session');
const rowOf = Object.fromEntries(rows.map((r, i) => [r[idIdx].split('id=').pop(), i]));
let shown = null;  // rows passing the filters, set by applyFilters
if (!schedule.sessions.length) document.querySelector('nav button[data-view=bytime]').hidden = true;  // no schedule (your papers)
btSel.append(...schedule.sessions.map(x => new Option(x, x)));
// ponytail: "Mon 11/9, 5:00–6:30 PM" read as this year in this computer's time zone (not converted from the venue's)
const endOf = x => {
  const m = x.match(/(\d+)\/(\d+),.*–(\d+):(\d+)\s*([AP]M)/);
  return m && new Date(new Date().getFullYear(), m[1] - 1, +m[2], m[3] % 12 + (m[5] === 'PM' ? 12 : 0), +m[4]);
};
btSel.value = schedule.sessions.find(x => endOf(x) > new Date()) || schedule.sessions[0] || '';  // the next session
function renderByTime() {
  const ids = schedule.order[btSel.value] || [], poster = btSel.value.startsWith('Poster');
  const list = ids.map((pid, k) => [rowOf[pid], k]).filter(([i]) => i != null && (!shown || shown.has(i)));
  document.getElementById('btCount').textContent = `📄 ${list.length} / ${ids.length} papers` +
    (list.length < ids.length ? ' (the rest are hidden by your filters)' : '');
  document.getElementById('btList').replaceChildren(...list.map(([i, k]) => {
    const d = card(rows[i], i), n = document.createElement('span');
    n.className = 'btnum';
    n.textContent = poster ? (rows[i][posterIdx].match(/#\d+$/) || [''])[0] + ' ' : `${k + 1}. `;
    d.querySelector('summary').prepend(n);
    return d;
  }));
}
btSel.onchange = renderByTime;
const step = by => { btSel.selectedIndex = Math.min(Math.max(btSel.selectedIndex + by, 0), btSel.options.length - 1); renderByTime(); };
document.getElementById('btPrev').onclick = () => step(-1);
document.getElementById('btNext').onclick = () => step(1);

// ---- random view: papers with a movie in a shuffled order; ⏭ Next drops the one you watched and opens the next.
// The order and what you watched are kept in this browser (localStorage) until 🔀 Reset random ----
const rdKey = store + 'Random', rdList = document.getElementById('rdList');
const pdfIdx = columns.indexOf('local_pdf'), webIdx = columns.indexOf('pdf');
const withMovies = rows.map(r => r[idIdx].split('id=').pop()).filter(pid => (movies[pid] || []).length);
if (!withMovies.length) document.querySelector('nav button[data-view=random]').hidden = true;
let rd = null;
try { rd = JSON.parse(localStorage.getItem(rdKey)); } catch (e) {}
const saveRd = () => { try { localStorage.setItem(rdKey, JSON.stringify(rd)); } catch (e) {} };
function shuffle() {  // Fisher-Yates
  const a = [...withMovies];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  rd = {order: a, seen: []}; saveRd();
}
if (!rd?.order) shuffle();
else {  // papers added or dropped since: new ones go in at random places
  const have = new Set(withMovies), known = new Set(rd.order);
  rd.order = rd.order.filter(p => have.has(p));
  withMovies.filter(p => !known.has(p)).forEach(p => rd.order.splice(Math.floor(Math.random() * (rd.order.length + 1)), 0, p));
  saveRd();
}
const rdCount = () => document.getElementById('rdCount').textContent = rdList.childElementCount
  ? `🎲 ${rdList.childElementCount} movies left of ${rd.order.length}` : `🎉 All ${rd.order.length} movies watched`;
function rdEntry(pid) {
  const r = rows[rowOf[pid]], e = document.createElement('div'), h = document.createElement('div');
  e.className = 'rd'; h.className = 'rdtitle'; h.textContent = r[titleIdx];
  const link = (href, text, title) => {
    const a = document.createElement('a'); a.href = encodeURI(href); a.target = '_blank'; a.textContent = text; a.title = title; h.append(a);
  };
  if (pdfIdx >= 0 && r[pdfIdx]) link(r[pdfIdx], '📄 PDF', 'Local PDF');
  if (webIdx >= 0 && r[webIdx]) link(r[webIdx], '🌐 OpenReview', 'PDF on OpenReview');
  const movs = movies[pid], ids = movs.map(p => drive.files[p.split('/').pop()]);
  const mv = document.createElement('details'), ms = document.createElement('summary'),
        box = document.createElement('div'), nx = document.createElement('button');
  ms.textContent = movs.length > 1 ? `🎬 Movies (${movs.length})` : '🎬 Movie';
  box.className = 'movies'; nx.className = 'nextmov'; nx.textContent = '⏭ Next';
  nx.title = 'Done with this one: remove it and open the next movie';
  mv.append(ms, nx, box);
  mv.ontoggle = () => {
    if (!mv.open) return box.replaceChildren();  // players only while open, so only one movie holds memory
    box.replaceChildren(...players(movs, ids));
    if (mv.dataset.autoplay) { delete mv.dataset.autoplay; box.querySelector('video')?.play().catch(() => {}); }
  };
  nx.onclick = () => {
    rd.seen.push(pid); saveRd();
    const next = e.nextElementSibling;
    e.remove(); rdCount();
    if (!next) return;
    const m = next.querySelector('details');
    m.dataset.autoplay = '1'; m.open = true;
    next.scrollIntoView({block: 'start'});
  };
  e.append(h);
  if (WA) e.append(waButton(pid));
  e.append(mv);
  return e;
}
function renderRandom() {
  const seen = new Set(rd.seen);
  rdList.replaceChildren(...rd.order.filter(p => !seen.has(p)).map(rdEntry));
  rdCount();
}
document.getElementById('rdReset').onclick = ev => {
  ev.preventDefault();
  if (!confirm('Start a new random order? The movies you already watched will come back.')) return;
  shuffle(); renderRandom();
};

restoreFilters();
renderTable();
show('papers');
// ---- #<paper id> in the address scrolls to that paper, closed (the Add box on the papers site jumps to the one it added) ----
// #<paper id>/movie (the WhatsApp link) also opens the paper and its movie
const [target, want] = decodeURIComponent(location.hash.slice(1)).split('/'),
      ti = target ? rows.findIndex(r => r[idIdx].split('id=').pop() === target) : -1;
if (ti >= 0) {
  if (!dets[ti].isConnected) document.getElementById('clear').click();  // hidden by saved filters: show everything
  const m = want === 'movie' && dets[ti].querySelector(':scope > details.movie');
  if (m) { dets[ti].open = true; m.open = true; }
  dets[ti].scrollIntoView();
}
if (location.hash) history.replaceState(null, '', location.pathname + location.search);  // a refresh starts at the top
</script>
