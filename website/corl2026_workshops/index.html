s a first step towards such a model, given demonstrations of existing tasks, we learn to predict the next high-level symbolic action, and deploy FRAME together with a motion planner as a heuristic to guide high-level search. \n\nApplied to 2D manipulation tasks based on the KinDER benchmark, our approach solves more instances than the planner that provided its demonstrations, and its next-action predictions adapt to several held-out task families from as few as 20 demonstrations, indicating high generalization potential of training on various task families over a unified symbolic vocabulary. We plan to extend FRAME  to predict high-level and low-level action dynamics, working towards a single model for both the task and motion levels.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "task and motion planning; neuro-symbolic learning; world models", "https://openreview.net/pdf?id=YOmlZrbwsb", "", ""], ["https://openreview.net/forum?id=TPgII7ldC6", "From Graphical Manuals to Robot Execution: Task and Skill-Level Behavior Trees for Assembly", "Praveen Kumar Menaka Sekar, Charles A Meehan, ION MATEI, HON YUNG WONG, John Baras", "Robots that assemble products from instructions written for humans face\ntwo errors that often remain unnoticed until a later assembly step fails: the visionlanguage\nmodel (VLM) that reads the instructions can misread a step, and the\nrobot can execute a step imperfectly. We study where such a robot should inspect\nits work and when it should query a human operator. Experienced workers ask a\nsupervisor when a drawing does not show which part goes where, check connectors\nbefore the next part covers them, and look closely before a tight insertion. We\nencode these behaviors in a hierarchical behavior tree (BT). Before execution, an\noff-the-shelf VLM answers one yes/no question per part and manual step, and a\ndecoder combines the answers into an assembly plan with an error probability\nfor each step. A task-level planner, a dynamic program, then synthesizes the\ntask-level BT, which places inspections and operator queries at minimum expected\ncost under a bound on the expected number of undetected failures. Each assembly\naction of this BT expands into a skill-level subtree whose skills execute only inside\nsuccess regions measured in simulation. On 21 products with an 8B VLM, the\ndecoder recovers 42% of the annotated assembly operations, against 21% for a\nsingle plan query, and its mean error probability matches the fraction of operations\nthat it decodes incorrectly. Querying the operator about uncertain steps reduces\nthe expected number of undetected failures over the 21 products from 20.5 to 4.0.\nAt the same risk, the synthesized BT costs 14–21% less than inspecting only the\nfinished product or every operation, and up to 0.7% less than simple query rules\nthat use the same error probabilities. In simulation, a Franka Panda completes\nan IKEA chair frame in 35 of 39 runs, with no undetected failure. Project page:\nhttps://praveen1098.github.io/IKEA-Assembly-Planning/.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "behavior trees; robotic assembly; instruction following; vision language models; planning under uncertainty", "https://openreview.net/pdf?id=TPgII7ldC6", "", ""], ["https://openreview.net/forum?id=NpgQtQTORa", "Guava: Distilling Frontier VLMs into a Compact Agent through a Robotic Manipulation Harness", "Haowen Liu, Xirui Li, Shaoxiong Yao, Peng Shi, Tianyi Zhou, Jia-Bin Huang, Furong Huang, Jiayuan Mao", "Frontier vision–language models (VLMs) can perform robotic manipulation by interpreting visual observations, invoking robot tools, and adapting to execution feedback, but repeated model calls incur high costs and latency. In this paper, we study the problem of distilling these capabilities into compact VLMs. The key challenges are designing an interaction interface that enables efficient and generalizable distillation, and a data collection protocol that captures diverse scenarios. We present $\\texttt{Guava}$, a framework built around a manipulation harness and a simulation-based data generation pipeline. We first study how harness design affects both frontier and compact models, and use the resulting interface for teacher data generation and student deployment. Through this harness, a frontier VLM generates physically executed and validated interaction trajectories in simulation, which we augment with perturbation branches that expose the teacher to execution deviations and recovery trajectories. Using $\\texttt{GPT-5.4}$ as the teacher, we collect 2,268 interaction trajectories and fine-tune $\\texttt{Qwen3.5-4B}$ to obtain $\\texttt{Guava-4B}$. $\\texttt{Guava-4B}$ substantially outperforms its base model and approaches $\\texttt{GPT-5.4}$ performance across simulated and real-world manipulation tasks, while generalizing to unseen objects, instructions, and task compositions. Perturbation trajectories particularly improve unseen-task generalization. With substantially lower inference latency and token usage compared to a frontier model, $\\texttt{Guava-4B}$ enables efficient local deployment.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "embodied agent; agentic harness; robot manipulation", "https://openreview.net/pdf?id=NpgQtQTORa", "", ""], ["https://openreview.net/forum?id=x6WSoDx3im", "H-JEPA: End-to-End Learning of Hierarchical World Models for Visual Planning", "Wancong Zhang, Basile Terver, Michael Rabbat, Yann LeCun, Randall Balestriero", "Long-horizon planning with latent world models requires reasoning across timescales and levels of abstraction. Existing task-agnostic JEPA world models predict and plan in a single latent space, often at a single timescale. We introduce H-JEPA, an end-to-end recipe for training a hierarchy of action-conditioned JEPAs in which each level predicts farther ahead in its own learned latent space. Planning proceeds top-down: the top level optimizes progress toward the goal, and each level's predictions become subgoals for the planner below it. When factors in the data evolve at separated timescales, higher levels discard fast, unpredictable detail and retain slower task-relevant state. Across four simulated navigation and manipulation environments, hierarchical planning improves over a flat JEPA; on Visual AntMaze, a three-level hierarchy raises success from 18% to 73% using less planner compute. Ablations attribute these gains to both temporal decomposition and higher-level goal representations. With inverse-dynamics supervision, the approach extends to diverse real-robot videos from DROID, where hierarchy improves offline planning fidelity at lower planner compute.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "hierarchical world models; visual planning; representation learning", "https://openreview.net/pdf?id=x6WSoDx3im", "", ""], ["https://openreview.net/forum?id=Z5aG3kttiF", "How Long, Not How Close: Blending a Learned Temporal Embedding into Latent World Model Planning", "Lama Moukheiber, Haotian Xue, Yongxin Chen", "Latent world models plan by choosing actions whose predicted end state is closest to the goal. This works one plan from the goal but fails several plans away, because latent distance measures how closely a state resembles the goal, not how long it takes to reach it: two positions can look alike yet be separated by a wall or a long sequence of contacts. We hypothesise that the planning cost, not only the model’s predictions, contributes to this failure. We therefore propose TEMPO, which blends a learned temporal embedding into the planner’s existing latent cost, so that plans are ranked by how long they take to reach the goal as well as by how visually close they are. It leaves the world model untouched, learns from the recorded trajectories already used to train it, and adds negligible cost to the planner’s search. The embedding is a small map of the frozen latent and requires no rewards, policies or success labels. We evaluate TEMPO on eleven simulated environments (e.g., maze navigation, tabletop pushing, robotic arm control and three-dimensional manipulation) with the LeWM and PLDM planners. With a 0.13M-parameter map that adds at most 0.3% to a plan’s arithmetic, TEMPO improves both planners at every goal distance, including the one-plan setting of their evaluations, raises LeWM from 36% to 99% on TwoRoom three plans from the goal, and remains competitive on a broad range of 2D and 3D navigation, reaching and manipulation tasks.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "latent world models; jepa; planning", "https://openreview.net/pdf?id=Z5aG3kttiF", "", ""], ["https://openreview.net/forum?id=dOmYraWbU7", "Incorporating Natural Language Preferences in Deep Hierarchical Reinforcement Learning", "Zachary Alan Daniels, Aswin Raghavan, James Zachary Hare, Daniel N. Cassenti", "Deep Hierarchical Reinforcement learning (DHRL) enables end-to-end learning of policies that use temporally extended skills. This paper addresses DHRL with natural language preference feedback. Preferences allow flexible annotation of higher levels of the hierarchy without restricting the possible policies. We propose an end-to-end learning method that incorporates preferences into language-augmented termination functions in the Options framework. Our method does not assume that a complete set of skills is provided. Rather, the method learns an additional ``bridge policy'', that helps complete the task and satisfies the preferences by connecting the terminating states of one skill to the appropriate starting states of another skill. We discuss applications where preference feedback arises naturally. We validate the method in sparse reward problems: BabyAI tasks and a micromanagement task in StarCraft-2. Our method demonstrates lower sample complexity and stronger task performance, when compared to prior DHRL methods and reward-shaping baselines. Further, our method shows transfer learning to out-of-distribution tasks. We examine scalability with number of preferences and skills and find that handling many preferences with low skill coverage is challenging.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "hierarchical reinforcement learning; option-critic; natural language preferences; skill composition; language-guided reinforcement learning", "https://openreview.net/pdf?id=dOmYraWbU7", "", ""], ["https://openreview.net/forum?id=tM70M4QE78", "Knowing Where to Look: Interactive Object Search via Spatial-Semantic Fusion", "Aditya Agarwal, Lucy Cai, Kelly Lu, Travis Manderson, Nicholas Roy, Tomás Lozano-Pérez, Leslie Pack Kaelbling", "When searching for an object, humans naturally combine semantic intuition – reasoning about where the object is likely to be stored – with geometric awareness of what parts of the space are visible, occluded, or unexplored. Effective robot object search requires the same joint reasoning, yet existing methods rely on only one: geometric methods maintain principled spatial beliefs but lack deep semantic understanding, while language-model based methods leverage commonsense knowledge but maintain no explicit belief over space. We argue that jointly reasoning over semantic and geometric evidence in an explicit 3D belief enables human-like interactive object search that outperforms either modality alone. To test this claim, we build a system that accumulates per-object VLM plausibility scores and geometric occupancy evidence via Bayesian log-odds filtering into a unified 3D voxel belief field. High-belief regions in the combined belief field drive action selection at each step: taking a closer look from a different viewpoint, navigating toward an unexplored region of the workspace, or physically interacting with a closed cabinet. We deploy this system end-to-end on a bimanual mobile humanoid and find that it outperforms geometry-only search and LLM-based planning methods. Project website https://skymanaditya1.github.io/objsearch-website/", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "interactive object search; belief-driven action selection; mobile manipulation", "https://openreview.net/pdf?id=tM70M4QE78", "", ""], ["https://openreview.net/forum?id=jRpRFHdh8d", "Koopman World Model: Structured Dynamics for Efficient Planning", "Qianhong Zhao, Yunfu Deng, Peng Wang", "Latent model predictive control plans through a learned world model, and with an unconstrained neural transition the planner relies on sampling, which requires many rollouts of the model at every control step.\nThis paper introduces the Koopman World Model (KWM), a latent world model for continuous control in which the encoder output is a vector of learned observables and the latent dynamics are an enhanced linear approximation of the Koopman evolution of these observables.\nKWM is trained within the online learning framework of TD-MPC2, and planning is performed on the frozen model at evaluation.\nThe bilinear form makes the one-step prediction and its Jacobians available in closed form, and a hybrid planner uses them to refine policy-generated action sequences by local quadratic updates instead of scoring a population of sampled rollouts.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "koopman operator; world model; representation learning", "https://openreview.net/pdf?id=jRpRFHdh8d", "", ""], ["https://openreview.net/forum?id=zC6xSGkG5l", "Latent Skill Acquisition and Composition for Contact-Rich Manipulation", "Wenlong Huang, Jiayuan Mao, Tomás Lozano-Pérez, Leslie Pack Kaelbling, Li Fei-Fei", "Human-level generalization in manipulation requires composing known behaviors to reach novel goals in scenarios never seen in training. The challenge sharpens in contact-rich settings, where behaviors must be recomposed at the granularity of contact rather than of a semantic subtask. Without relying on per-task demonstrations, a promising approach is to leverage test-time compute to perform physical reasoning that searches for novel solutions and improves them incrementally during deployment. To effectively perform search in the large space of motions, we propose SkillReasoner, which learns temporal abstractions of actions (i.e., skills) from unstructured offline interactions, and then reasons over and recomposes them at test time. Crucial to the formulation is a latent skill space learned with varying temporal horizons, so that composition can happen at varying granularity, as required by different stages of the task, while minimizing the number of decisions. To realize a novel goal at test time, the robot searches over latent skill sequences in its imagination, decodes a chosen skill into low-level actions, and replans in closed loop, up to 30 Hz. We demonstrate on a series of contact-rich real-world and simulated tasks that the robot chains behaviors to achieve novel goals that require far longer behaviors than those seen in training, and adapts zero-shot to unseen perturbations, changing dynamics, and constraints, all trained purely from unstructured play data without task-specific demonstrations.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "skill learning; robotic manipulation; manipulation planning", "https://openreview.net/pdf?id=zC6xSGkG5l", "", ""], ["https://openreview.net/forum?id=NIKVkZBCSZ", "Learn2Search: A Contextual Transformer Model of a Planner's Search Procedure", "Ashwin Misra, Stephen F Smith, Zachary B. Rubinstein", "Scalability to problems with large numbers of tasks remains a significant challenge for heuristic search approaches to planning, particularly in multi-agent domains where tasks must be assigned to specific agents in addition to being sequenced and situated in time. This is often addressed by restricting the amount of search performed, at the expense of an increasingly sub-optimal solution. We instead explore shifting computation offline: using a baseline planner's domain model to learn a model of its search procedure, substituted at runtime as a surrogate search that gains efficiency without sacrificing performance. We solve randomly generated problems with the baseline procedure and autoregressively train a contextual transformer-based decision model on these solutions to predict how the plan should be extended with a new task. Applied to a timeline-based HTN planner generating multi-robot pick-and-place plans, the learned model predicts the planner's decision 85\\% of the time, with almost an order of magnitude speedup; evaluating its top $k$ choices before deciding brings accuracy to nearly 100\\% while still substantially reducing search time.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "contextual transformer; multi-agent planning; timeline-based planning; learning search heuristics", "https://openreview.net/pdf?id=NIKVkZBCSZ", "", ""], ["https://openreview.net/forum?id=6t1RDvnoja", "Learning Coarser Markov State Abstractions", "Fatih Dogangun, Cameron Allen, George Konidaris, Alper Ahmetoglu", "State abstractions in reinforcement learning create compact representations, and increase sample-efficiency, by keeping information in observations that is relevant for decision-making while discarding other regularities. Recently introduced Markov state abstractions (MSAs) define reward-free sufficient conditions under which the learned representation is Markov. However, current implementations of the MSA objectives satisfy a stronger (kinematic inseparability) condition, which results in over-refined abstractions that preserve all transition regularities in the observation. We show for the first time how to align the training objective with the original theoretical MSA conditions and thus build coarser abstractions. This objective drives the representation to satisfy sufficient Markov conditions, but does not, by itself, guarantee minimality. We therefore provide an additional heuristic to push the representation towards minimality. Our experiments in pixel-based domains show that the learned abstractions recover the underlying complexity of the problem, which improves downstream performance.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "state abstraction; reinforcement learning", "https://openreview.net/pdf?id=6t1RDvnoja", "", ""], ["https://openreview.net/forum?id=eOc1MqyEV8", "Learning Dexterous Action Representations from Human Videos", "Hongyi Zhou, Maximilian Arnold, Mohamed Omran, Pietro Mazzaglia, Rudolf Lioutikov, Daniel Dijkman", "We introduce DexVAE, a latent action representation pretrained on human motion that transfers dexterous motion priors from egocentric human videos to robot policies. \nAlthough dexterous robot hands promise human-like manipulation, learning to control them requires large and costly robot datasets. Human videos provide dexterous experience at scale, but differences in morphology and action spaces prevent their direct use for robot control. DexVAE bridges this gap by compressing temporally extended hand trajectories, expressed in a shared canonical representation, into compact latent action tokens. We transfer knowledge through a staged pipeline consisting of human-motion pretraining followed by human–robot co-training. We adapt a pretrained VLA model to generate actions in this latent space using flow matching. \nWe evaluate our approach on six real-world manipulation tasks using a Unitree H1-2 humanoid with dexterous hands. With only 25 robot demonstrations per task, our method improves average task progression from $38.5\\%$ to $49.1\\%$, with the largest gain on high-dexterity tasks—from $35.7\\%$ to $58.6\\%$. Overall, DexVAE matches the raw-action baseline using $1/2$ the robot data and, on high-dexterity tasks, outperforms it using only $1/4$ the data.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "dexterous manipulation; action representation; human videos; vision-language-action models", "https://openreview.net/pdf?id=eOc1MqyEV8", "", ""], ["https://openreview.net/forum?id=Y3Mn29j1aC", "Learning Generative Motion Manifolds for World Models", "Renhao Zhang, Bruno Castro da Silva", "We introduce Parameterized Latent Motions for Model-Based Reinforcement Learning (PaLMR), a framework that learns generative motion manifolds as reusable action interfaces for world models. From task-independent motion experience, PaLMR learns behavior-aligned latent coordinates and a parameterized flow model for executing and interpolating motions. The learned interface remains fixed during model-based RL, providing shared coordinates for predicting motion outcomes and composing motion sequences. We establish conditions for predictive generalization and show how denser motion coverage tightens planning-error bounds, supported by controlled experiments demonstrating more accurate prediction and effective use of interpolated motions. Across navigation and robotic manipulation benchmarks, PaLMR outperforms primitive-action and generative-policy RL baselines in overall task performance and online sample efficiency.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "model-based reinforcement learning; skill discovery; flow matching policy", "https://openreview.net/pdf?id=Y3Mn29j1aC", "", ""], ["https://openreview.net/forum?id=LuxsPk6Zvg", "Learning to Drive on Mars: Visual Multimodal Traversability Estimation for Off-World Navigation", "Darren Chiu, Cole Wilson, Andrei Tumbar, Gaurav S. Sukhatme, Steven Myint", "Autonomous navigation on Mars requires vehicles to distinguish between traversable terrains across diverse and visually challenging environments. However, progress in learning-based navigation for off-world environments has been limited by the lack of large-scale datasets. Since landing in Jezero Crater, the Mars 2020 Perseverance rover has traversed terrain ranging from sandy dunes, rocky patches, and flat bedrocks. As a result, this paper presents a dataset spanning 500 sols and 45km of trajectories driven by both human operators and the onboard planner, ENav. Our dataset contains grayscale stereo image pairs, poses, accelerometer readings, rocker-bogie angles, and estimates of tilt and wheel slip. Building on this dataset, we introduce an uncertainty-aware traversability-estimation framework that learns terrain representations from multimodal driving experience. We compare our proposed method against existing approaches on the Mars 2020 dataset and show that our method achieves an AUROC of 0.874 and an F1 score of 0.758, outperforming the strongest baseline by 0.058 and 0.156, respectively, while also achieving the highest average precision and recall. Finally, we show that the visual representations can be integrated into path planners, such as ENav, on a physical rover test bed.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "field robotics; navigation; visual representations", "https://openreview.net/pdf?id=LuxsPk6Zvg", "", ""], ["https://openreview.net/forum?id=HoSt0Ayish", "LeWAM: A JEPA World Action Model with Diffusion-Steering-Based MPC", "Shashank Hegde, Alexander Popov, Elie Aljalbout, Nikolai Smolyanskiy", "World action models (WAMs) predict actions and future observations, typically from a reconstruction-based representation that carries noisy, redundant information which can complicate downstream predictions. We introduce LeWAM, a bidirectional transformer for forward, backward, inverse dynamics and policy prediction, on a decoder-free JEPA latent trained end-to-end through all four modes. We see the following benefits. 1) Alignment: linear probing better reads robot and object state over a regular Le World Model (a forward-only JEPA world model), while successfully ignoring distractors, which a regular WAM considerably reconstructs. 2) Acting: Closed-loop evaluations of LeWAM match or exceeds a regular policy (without a world model) on the same encoder and at matched size. 3) Planning: While sampling raw actions in planning with WAMs allows MPC to exploit dynamic model inaccuracies, we show that planning in the noise space of these WAMs improves their closed-loop performance.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world-action-models; mpc; jepa", "https://openreview.net/pdf?id=HoSt0Ayish", "", ""], ["https://openreview.net/forum?id=ZjQmIjxoOQ", "Matryoshka World Models: Test-Time Scaling Beyond Search", "Jianing Qian, Ethan Yu, Siddharth Ancha, Nicholas Roy, Dinesh Jayaraman", "Planning with learned world models requires trading off predictive fidelity against computational cost. Existing approaches typically vary search effort while keeping the latent representation fixed, or train separate models for different representation sizes. We introduce Matryoshka World Models (MWM), a framework for training world models to operate at multiple nested predictive fidelities. Unlike independently trained fixed-dimensional models, MWM learns a shared hierarchy of predictive representations that can be truncated or expanded at test time without retraining. This variable-fidelity world model enables a new form of planning-time flexibility: predictive fidelity can change across episode-level replanning steps, CEM optimization iterations, and rollout depth. The planner can therefore allocate high-fidelity computation selectively while using cheaper representations where fine-grained prediction is unnecessary. We evaluate variable-fidelity planning against standard fixed-fidelity planning baselines across navigation and manipulation tasks. MWM matches the success rate of the full-fidelity baseline at up to 108.8$\\times$ less compute and exceeds the best baseline by up to 59% at the same compute budget. By making predictive fidelity a resource that can be dynamically allocated across different stages of planning, MWM establishes a new axis of test-time scaling for world models.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; model-based planning; matryoshka representation learning; test-time scaling; latent dynamics; efficient inference; model predictive control; visual planning; multi-resolution representations; robotics", "https://openreview.net/pdf?id=ZjQmIjxoOQ", "", ""], ["https://openreview.net/forum?id=6eF9XQkWQT", "Memory from Mistakes: Self-Improving Robot Memory through Policy Feedback", "Sooyoung Ryu, Yinpei Dai, Yuejiang Liu", "For long-horizon manipulation, high-level policies are often trained to remember relevant information through textual summaries or visual keyframes. Existing approaches formulate this as supervised learning from fixed memory annotations provided by human experts or LLMs. However, these annotations may be suboptimal: they may omit critical information, specify memory that the policy cannot reliably reproduce, or retain irrelevant content. We introduce MeMi, an offline self-improvement LLM framework for robot memory annotation. At its core are three principles of effective memory: (1) sufficiency, retaining the information needed for future decision-making; (2) predictability, ensuring that the policy can reliably reproduce the annotated memory; and (3) necessity, removing information that does not contribute to downstream decisions. MeMi jointly optimizes a reusable memory annotation rule and the instruction prompt of a high-level LLM policy using textual feedback from evaluating the policy against these principles. Across 16 RoboMME tasks, LLM policies using the optimized instructions improve mean rollout success by 19.9% points with textual memory and 20.9% points with visual keyframes over policies using the initial instructions. Moreover, separate vision-language model (VLM) policies trained on the optimized memory annotations outperform those trained on the initial annotations, demonstrating that the benefits of annotation optimization transfer to a different policy class.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "robot memory; memory abstraction; self-improvement", "https://openreview.net/pdf?id=6eF9XQkWQT", "", ""], ["https://openreview.net/forum?id=uXSeu0eVk9", "MoMa-NMP: Scene-Scale Neural Motion Planning for Mobile Manipulators", "Adam Kan, Jason Jingzhou Liu, Jim Jiahui Yang, Kenneth Shaw, Deepak Pathak", "Mobile manipulators operating in homes and other complex environments must coordinate their base and arm over long horizons, navigating around obstacles, through narrow passages, and between constrained workspaces. Neural motion planners can provide fast closed-loop planning from partial observations, but scaling them to room-sized environments is difficult because generating high-quality training trajectories is itself a challenging motion-planning problem. To address this, we introduce MoMa-DemoSmith, a demonstration-generation pipeline that separates the problem into global path discovery for large complex scenes and local motion refinement for collision avoidance. This key separation enables the generation of millions of challenging whole-body trajectories across our procedurally generated scenes. These demonstrations are used to train MoMa-NMP in two stages: behavior cloning (BC) followed by privileged on-policy distillation. The resulting policy plans from depth-camera and LiDAR observations, achieving 87.0\\% success without environment collisions in simulation and 77.5\\% across 80 trials in unseen physical scenes. See video results at https://adamhkan.com/moma-nmp/.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "mobile manipulation; neural motion planning; imitation learning", "https://openreview.net/pdf?id=uXSeu0eVk9", "", ""], ["https://openreview.net/forum?id=EaFj5ACTKC", "Normalizing Flows are Capable World Models", "Zijia Li, Yong-Hyun Park, Jiatao Gu", "We study goal-conditioned planning with world models that preserve\nobservation information. Normalizing-Flow World Model (NFWM) combines an\ninvertible encoder with a probabilistic latent predictor. We train both components\njointly by maximizing the exact observation likelihood. An auxiliary inverse-\ndynamics objective encourages action-sensitive coordinates. We evaluate candidate\nactions directly in latent space using a fixed Euclidean goal-distance cost. NFWM\nachieves competitive or improved performance relative to deterministic JEPA-\nbased baselines on deterministic control, stochastic navigation, and LIBERO action\nselection. Ablations show improved planning with inverse-dynamics supervision,\nwhile representation probes provide complementary evidence of more accessible\nand locally regular action-related variation. A ranking analysis on LIBERO reveals\na remaining gap between goal distance and task success. These results demonstrate\nthat information-preserving world models can learn representations useful for\nplanning.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; abstractions for planning; normalizing flows", "https://openreview.net/pdf?id=EaFj5ACTKC", "", ""], ["https://openreview.net/forum?id=AWZAN0VA0q", "Particle Belief Representations for Reinforcement Learning under Partial Observability", "Himanshu Gupta, Brendan Crowe, Chris Heckman, Bradley Hayes, Zachary Sunberg", "Particle filters flexibly represent complex, multimodal beliefs but expose them as weighted, unordered sets incompatible with conventional fixed-dimensional policies. We study particle-belief encodings as inputs to reinforcement-learning policies while holding belief estimation and policy optimization fixed. We compare statistical summaries, cumulant-generating-function (CGF) features, and permutation-invariant\nset encoders. Trainable encoders are learned end-to-end or pretrained through belief reconstruction or task-specific prediction. Across eight tasks, pooling-based set encoders and gradient CGF features are reliable end-to-end, while the Set Transformer achieves the highest performance with appropriate pretraining. Task-specific pretraining helps when its target captures decision-relevant belief structure, whereas reconstruction and latent alignment provide more selective benefits. These findings provide practical guidance for selecting and training encoders for particle-filter beliefs in continuous-space partially observable Markov decision processes.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "pomdp; particle filter; reinforcement learning", "https://openreview.net/pdf?id=AWZAN0VA0q", "", ""], ["https://openreview.net/forum?id=jFPFss9lsg", "Physical Agency: Better Robot Performance Through Better Interfaces", "Liane Galanti, Dhruv Shah, Tri Dao", "Frontier models increasingly act as robot-use agents, calling a robot's motor skills as tools much as they interact with a browser or code editor. But exposing skills as tools leaves open how the model should use them: what it emits, what feedback it receives, and when it decides again. We study the interface through controlled comparisons with the robot, cameras, scenes, and motor-policy weights held fixed, and separately measure the benefit of adding a complementary frozen skill. We introduce Pigey (Physical Agency), an agent that (1) issues language-level actions one at a time over a persistent task state, (2) uses verified execution, checking post-action images and robot state and recovering when it detects failure, and (3) draws on an open set of skills exposed as tools it selects for each subgoal. No additional policy training or demonstrations are required. On 30 real-robot tasks designed to probe decisions over existing motor skills, the same frozen π0.5 policy succeeds in 16.7% of trials when called directly and 84.0% through Pigey. Adding a frozen motion planner as a second skill raises success to 97.3%. Removing verification and recovery lowers success by 28 percentage points, the largest ablation drop. Gains also hold in simulation and across Claude, Gemini, and Qwen reasoners. Most of what the policy was missing was an interface, not a skill.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "language-level abstractions; embodied ai; reasoning models; physical agents; agent interfaces; multi-modal reasoning; task and motion planning", "https://openreview.net/pdf?id=jFPFss9lsg", "", ""], ["https://openreview.net/forum?id=krdSzlzUam", "Predicting What Matters: interaction-Centric 4D World-Action Models", "Luoxin Ye, Baichuan Huang, Kai Gao, Dylan Randle, Jeroen Vanbaar, Alan Yuille, Manikantan Nambi, Jose Barreiros", "Robotic manipulation requires anticipating the evolution of task-relevant entities and translating these predictions into actions. We introduce a compact world-action model that grounds control in functional semantic entities and their 3D motion, without dense RGB reconstruction. A capable System-2 model reasons about task-relevant entities and subtask structure, guiding the construction of dense semantic masks, 3D point tracks, and subtask goals. This structured supervision trains a compact System-1 model to jointly predict goal semantics, interaction-centric scene evolution, and robot actions. By concentrating future prediction on entities and motion that matter for interaction, the model supports reactive control with approximately 0.3B trainable parameters (1.3B total). It achieves a 98.6% success rate on LIBERO and averages 86.0% across seven LIBERO-Plus categories. On real-world dexterous tool use and sequential object removal, it achieves an average success rate of 87.5%, exceeding the strongest baseline by 27.5 percentage points. Controlled ablations examine the choice of future supervision targets and the importance of a capable System-2 model. These results support task-centric semantic and geometric prediction as an effective basis for compact world-action modeling.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; robotic manipulation; task-centric representation", "https://openreview.net/pdf?id=krdSzlzUam", "", ""], ["https://openreview.net/forum?id=z5p66Kha58", "Rational Inverse Reasoning: Few-Shot Imitation by Inferring Programmatic Intent through Planning", "Ben Zandonati, Tomás Lozano-Pérez, Leslie Pack Kaelbling", "Humans learn a manipulation task from one or two demonstrations, and perform it in a new room, with new objects, under new constraints. This requires identifying which object roles, subgoal orderings, and constraints should persist when the scene changes, as opposed to cloning object motions. We present Rational Inverse Reasoning (RIR), which infers this task structure as an explanation program: a compact, executable description of intent that maps an object-centric scene to a task-and-motion planning (TAMP) specification of goals, subgoals and constraints. This allows the robot to generate new actions for new objects and layouts, while preserving the demonstrator's intent. A vision-language model proposes candidate programs, a planner-derived score evaluates whether each candidate makes the demonstrated behavior rational, relative to alternative strategies. These scores guide iterative program refinement. We evaluate RIR on 30 simulated, and four real-world tabletop tasks (using a Franka FR3), and 35 two-dimensional reasoning tasks. In all cases, RIR recovers transferable task structure from only 1-3 demonstrations. Generalizing to new layouts and object sets, it outperforms VLM, planning and few-shot learning baselines that lack explicit rationality and planning-grounded inference. See our interactive supplementary material and videos: https://rir-project-f3a281.pages.dev", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "planning; few-shot learning; rationality", "https://openreview.net/pdf?id=z5p66Kha58", "", ""], ["https://openreview.net/forum?id=6ydZ7SJP4W", "Remembering What You Don’t Know: Planning with Persistent Identity Beliefs under Perceptual Aliasing", "Brendon T. Murphy, Keonyoung Koh, Woobean Seo, Hoseong Kwak, CHUNG HUN HA, Du Hyun Ro", "Robots that share tools with people must preserve object identity across occlusions and unobserved human manipulation, even when multiple instances are visually aliased. We present a persistent identity belief that maintains competing joint entity--observation hypotheses instead of collapsing to a single assignment, augments them with relocation uncertainty after human interaction, and exposes probabilistic identity marginals to a belief-aware planner. The planner chooses between acting on the current belief and inspecting a candidate when the expected cost of disambiguation is lower than the risk of a wrong handover. We evaluate the critical human-intervention event from a closed-loop Allen-key handover task over 99 replayed real episodes. Joint hypotheses and relocation modeling substantially reduce confidently wrong beliefs, while belief-aware planning reduces wrong handovers relative to maximum a posteriori (MAP) action and avoids the fixed overhead of always inspecting. Project page: https://keonyoungkoh.github.io/PIB/", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "robot memory; persistent object identity; belief-space planning; active perception; perceptual aliasing", "https://openreview.net/pdf?id=6ydZ7SJP4W", "", ""], ["https://openreview.net/forum?id=ZTGTv7B0Rp", "Retriever: Composing the Perception-Reasoning-Action Loop for Long-Horizon Manipulation", "Linfeng Zhao, Haojie Huang, Jiayuan Mao, Weiyu Liu, Lawson L.S. Wong, Mykel Kochenderfer", "Building long-horizon robot agents requires composing closed-loop pipelines for perception, belief update, planning, and control whose components run at different clocks and with variable latency. Today, these systems are often assembled with ad-hoc concurrency and pub/sub conventions that make timing and input-consumption semantics implicit, yielding schedule-dependent behavior that is hard to reproduce, debug, and reuse. Current solutions typically solve parts of this problem at either the algorithmic or the systems layer, but not both. In this work, we propose Retriever, which spans the entire stack: an asynchronous decision model, a programming model, a runtime, and an example closed-loop agent pipeline. Retriever represents an agent as a graph of stateful causal stream functions executed on explicit run clocks. We formalize this view via an asynchronous environment-agent loop over continuous-time streams and show that finite-memory causal policies can be represented by compositions of these operators. Retriever compiles these graphs to multiple backends and provides a deterministic replay contract when consumed inputs, clock/commit traces, and stochastic outputs are logged. We evaluate Retriever through a real-robot case study.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "planning; programming; agent", "https://openreview.net/pdf?id=ZTGTv7B0Rp", "", ""], ["https://openreview.net/forum?id=VWvW5GdIEs", "RoboRSI: Stable, efficient, and reusable robot self-evolution in complex real-world environments.", "Zimo Wen, Yijin Chen, Yuxuan Cao, Wendi Chen, Yanwen Zou, Wenye Yu, Fuhang Kuang, Han Xue, Jun Lv, Chuan Wen, Cewu Lu", "A generalist robot should not only perform diverse tasks but also improve through experience, turning what it learns during execution into capabilities that later tasks can reuse. Robot agents that act through code can already repair programs from execution feedback, yet it remains a central challenge to organize this experience around the task structure that gives it meaning, so that each repair is attributed to the responsible capability, supported by execution evidence, and validated before it is reused. We introduce RoboRSI, a robot self-improvement system built on Top-Down Skill Refinement (TSR). TSR decomposes tasks into compound, atomic, and base skills with scoped responsibilities and explicit input--output contracts, attributes each execution outcome to the responsible branch, and confines revision to that branch. Building upon this structure, a Manager, Planner, Engineer, and Reviewer coordinate planning, execution, diagnosis, and the validated release of new skills, while people steer the process through objectives and corrections; stable skill sequences are further consolidated into reusable compound skills. On a mobile manipulator, RoboRSI develops multi-object household cleanup over 104 rounds. In simulation, it achieves the highest success rate on LIBERO, LIBERO-PRO, LIBERO-Plus, and RoboTwin, exceeding the strongest baseline by 2.7 to 11.0 percentage points.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "self-evolution; agentic robot", "https://openreview.net/pdf?id=VWvW5GdIEs", "", ""], ["https://openreview.net/forum?id=Pk5ogqJbfj", "SHAPE: Scaling Collaborative Planning in LLM-Powered Heterogeneous Multi-Robot Systems", "Hanqing Yang, ZixuanWeng, JunJia Guo, Jingdi Chen, Carlee Joe-Wong", "Planning in heterogeneous robot teams requires agents to coordinate work allocation based on task requirements and their capability compositions. Adding robots to heterogeneous teams can enable concurrent work and combine complementary capabilities, but coordination overhead may limit performance gains. Understanding this trade-off requires distinguishing opportunities within a task from how effectively a planning method uses them. We systematically study how collaboration scales across task configurations, collaboration patterns, and team compositions. We characterize tasks with two measures: parallel participation, which captures opportunities for additional robots to work concurrently; and heterogeneous participation, which captures the need for contributions from different robot types. These measures guide the construction of eight embodied tasks across four configurations and two scenarios. We propose SHAPE (SHared Asynchronous Planning with Evolving tasks), which supports adaptive, asynchronous multi-robot planning through a shared, evolving, agent-built task graph and selective notifications. The graph provides a shared task-level representation that agents update as they plan and execute. We evaluate teams of 3, 9, and 15 robots, comparing SHAPE with Individual, Centralized, and Chain in task performance and coordination overhead. Results highlight a trade-off: shared task understanding and timely agreement support effective collaboration, but synchronization costs can limit scaling. SHAPE achieves higher average completion with lower overhead across scales. A shared-channel ablation examines the role of structured task state, and a case study assesses the effect of grouping robots by type.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "collaborative planning; heterogeneous multi-robot systems; llm agents", "https://openreview.net/pdf?id=Pk5ogqJbfj", "", ""], ["https://openreview.net/forum?id=WioPsk5AUH", "SIR: Structured Image Representations for Explainable Robot Learning", "Paul Mattes, Jan Schwab, Jens Oliver Bosch, Nils Blank, Maximilian Xiling Li, Rudolf Lioutikov", "Existing robot policies based on learned visual embed-\ndings lack explicit structure and are sensitive to visual dis-\ntractions. Thus, the representations that drive their be-\nhaviour are often opaque, making their decision-making\nprocess difficult to interpret. To address this, we intro-\nduce Structured Image Representations (SIR), a method\nthat leverages Scene Graphs (SGs) as an intermediate rep-\nresentation for robot policy learning. Our approach first\nconstructs a fully connected graph, using image-derived\nfeatures as initial node representations. Then, a module\nlearns to sparsify this graph end-to-end, creating a task-\nrelevant sub-graph that is passed to the action generation\nmodel. This process makes our model intrinsically explain-\nable. Evaluations on RoboCasa show that our sparse graph\npolicies outperform image-based baselines on average with\n19.5% vs 14.81% success rate. Most importantly, we show\nthat the learned sparse graphs are a powerful tool for model\nanalysis. By analysing when the model’s sub-graph devi-\nates from human expectation, such as by including distrac-\ntor nodes or omitting key objects, we successfully uncover\ndataset biases, including spurious correlations and posi-\ntional biases.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "imitation learning; representation learning; robot learning; explainability; scene graphs", "https://openreview.net/pdf?id=WioPsk5AUH", "", ""], ["https://openreview.net/forum?id=2XvNWy8Mnf", "Structure over Latent Maps: A Neuro-Symbolic World Model for Interactive Object Navigation", "Owen Bluman, Maxfield Ma, Thao Nguyen", "Interactive object navigation agents can leverage natural language feedback from users to find personalized goal objects in unseen environments. Existing frameworks such as ORION pair a large language model (LLM) controller with a voxel-level vision-language map, but this mapping carries no explicit notion of rooms or global scene structure. When search stalls, the system falls back to prompting the user with questions. We present a system that layers a symbolic scene graph, built automatically from the robot's own scans and self-supervised object labels, on top of this voxel-level map, enriching the controller's existing retrieval with room membership and nearby-object context. This reduces the agent's dependence on the user: across five independent trials on 10 HM3D scenes, our approach lowers average interaction rounds per goal from 1.93 to 1.72 while raising success weighted by interaction turns from 42.5\\% to 53.5\\% under mixed feedback and from 39.2\\% to 49.8\\% under confirmation-only feedback. The scene graph also improves task performance, raising navigation success rate from 63.1\\% to 71.1\\% under mixed feedback, and from 58.8\\% to 67.5\\% under confirmation-only feedback, compared to the baseline ORION model. We further compare the automatically constructed graphs against reference graphs built from ground-truth semantic annotations to assess how graph quality affects this improvement.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "interactive object navigation; scene graph; llm planning", "https://openreview.net/pdf?id=2XvNWy8Mnf", "", ""], ["https://openreview.net/forum?id=nLArgtsCYy", "Synthesizing Uncertain World Models as Probabilistic Programs for Planning", "Zachary S Siegel, Xianda Sun, Nitay Alon, Joshua B. Tenenbaum, Tomás Lozano-Pérez, Leslie Pack Kaelbling", "How should intelligent agents plan to achieve their goals when they are uncertain about how the world works? We argue that world models should represent this uncertainty so that agents can plan actions that help them learn about the world. Because world models cannot generally anticipate every mechanism of the world, agents must also be able to revise their hypotheses when experience contradicts their model. We propose Planning over Uncertain World Models (PLUM), a system that meets these desiderata by representing its world model as a probabilistic program that it updates through inference, plans over, and revises. PLUM uses a language model to synthesize its programs online without prior demonstrations, revises them within an episode, and uses a belief-space planner to choose actions. Across simple games and a simulated robot task, we show that planning over uncertainty and revising programs each improve reward over ablations without them. PLUM also outperforms the same language model prompted to select actions directly. These results suggest that agents should construct approximate probabilistic models suited to their tasks, plan over the uncertainty those models represent, and revise their hypotheses through interaction.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; planning under uncertainty; probabilistic programming", "https://openreview.net/pdf?id=nLArgtsCYy", "", ""], ["https://openreview.net/forum?id=znnQvLbsl7", "TAMPAgent: Agentic Belief-Space Planning for Mobile Manipulation", "Utkarsh Aashu Mishra, Alperen Degirmenci, Yongxin Chen, Danfei Xu, Tucker Hermans, Caelan Reed Garrett", "Open-world robotic mobile manipulation requires acting in physical environments with only partial information. While recent Large Vision-Language Model (LVLM) agents show strong open-world reasoning capabilities, existing architectures that rely on direct tool calling struggle with geometric uncertainty and thus are limited to fully-observable tabletop environments. In contrast, Task and Motion Planning (TAMP) systems can solve long-horizon tasks under partial observability but incur high computational costs and require closed worlds. We propose \\textbf{TAMPAgent}, an agentic planning framework that unifies the reasoning of LVLMs with the structured constraint satisfaction of TAMP systems. We endow an LVLM agent with a belief-space planning model operating over an extensible API of perception, planning, and control tools. The agent formulates a partial task plan composed of parameterized observation and execution actions, which is subsequently completed using classical search algorithms. After extracting the plan's geometric constraints, the agent leverages its tool API to bind valid parameter values, satisfying feasibility requirements and producing an executable motion plan. Upon execution, the agent continuously updates its belief history and repeats this closed-loop process by interleaving observation and manipulation actions. Evaluated across complex household mobile manipulation tasks on Rainbow Y1 and Unitree G1 platforms, TAMPAgent significantly outperforms direct tool-calling agentic baseline, demonstrating that integrating TAMP constraint satisfaction into agentic planning loops is essential for unstructured, partially observable environments. More information: \\url{tampagent.github.io}.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "task and motion planning; agentic robotics; mobile manipulation", "https://openreview.net/pdf?id=znnQvLbsl7", "", ""], ["https://openreview.net/forum?id=jh4hcshrPS", "TaskScape: Planner-Guided Difficulty Spectra for Robot Policy Evaluation", "Yan Zhuang, Jiawei Ren, Xuhui Kang, Sung-Wook Lee, Yen-Ling Kuo", "A central challenge in constructing such evaluations is how to define and measure task difficulty. Existing benchmarks often introduce variations in lighting, obstacle configurations, or robot initial positions. While these variations provide useful robustness tests, their effects on task difficulty is hard to quantify. For example, randomly placed obstacles may block critical paths and require substantial replanning, or may serve as a background object without having impacts on task execution. We observe that planners provide a principled way to estimate task difficulty: given a task abstraction, planning metrics such as solution length and search effort offer measurable difficulty proxies that can guide the generation of progressively challenging tasks. Building on this insight, we introduce TaskScape, an open-source framework for planner-guided evolution of embodied tasks and environments. TaskScape adopts a generator–validator architecture, where a generator proposes task–environment variations and a planner-based validator assesses their feasibility and difficulty. By iteratively accepting variations that satisfy feasibility constraints and increase the targeted difficulty measure, TaskScape constructs progressively challenging evaluation sequences. Its decoupled architecture supports different generators and planners, enabling difficulty evolution across diverse task abstractions and evaluation objectives.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "robot policy evaluation; task generation and evaluation", "https://openreview.net/pdf?id=jh4hcshrPS", "", ""], ["https://openreview.net/forum?id=QQFq2HGyGl", "Toward Planning Representations That Separate Task Structure from Visual Content", "Aarav Srivastava, Vishwas Sathish, Rajesh P. N. Rao", "Effective planning requires representations that preserve task-relevant geometry and object identity while ignoring visual variation that does not alter the task.\nExisting evaluations of visual generalization often change several factors simultaneously, making the source of a failure difficult to identify.\nWe introduce a controlled evaluation of object-goal navigation (ObjectNav), the task of reaching an instance of a named object category, in procedurally generated ProcTHOR houses. Training and evaluation houses share floor plans, object locations, goals, and start states, while visual factors are changed individually or in combination.\nAcross model-free reinforcement learning (RL), model-based RL, and agents using frozen pretrained visual representations, our results show that appearance changes impair navigation, but their effects differ sharply by factor.\nSurface-material changes account for most of the average change in success, whereas clutter and lighting have little effect.\nThe magnitude of a global image-statistics shift does not reliably predict performance: changing only the goal object's appearance can substantially impair an end-to-end agent despite a small image-level change.\nWe found that a model-based agent that plans over frozen features from the pretrained DINOv2 image encoder achieves the highest success (0.83) under the full shift, but remains sensitive to surface appearance.\nOur experiments reveal an important requirement for planning representations: they must separate invariant spatial task structure from appearance.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "world models; state abstraction; visual generalization; embodied navigation", "https://openreview.net/pdf?id=QQFq2HGyGl", "", ""], ["https://openreview.net/forum?id=eLTh89JM1i", "Unifying Deep Predicate Invention with Pre-trained Foundation Models", "Qianwei Wang, Bowen Li, Zhanpeng Luo, Yifan Xu, Vineet Kamat, Carol Menassa, Alexander G. Gray, Tom Silver, Sebastian Scherer, Katia P. Sycara, Yaqi Xie", "Long-horizon robot planning requires abstractions that are both grounded in observations and useful for choosing actions. Foundation models provide semantic priors for proposing symbolic predicates, but their proposals can be inconsistent with a robot's environment. Learning predicates from demonstrations grounds them in data, yet searching for their symbolic effects is expensive. We present UniPred, which combines these approaches through an iterative loop: a language model proposes predicate effects, neural classifiers learn from the resulting transition constraints, and validation feedback guides subsequent proposals. A derived-aware selection procedure then evaluates predicates for planning while recomputing quantified conditions from basic atoms. Across five simulated and two real-robot domains, the resulting abstractions support generalization to new object configurations and longer tasks. UniPred reduces total learning time by approximately $3$–$4\\times$ relative to IVNTR in three shared simulated domains. On held-out real-image planning tasks, it achieves $92\\%$ and $98\\%$ success in table cleaning and cluttered retrieval. These results support combining foundation-model priors with data-grounded evaluation to learn task-relevant symbolic world models.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "abstraction learning; predicate invention; robot planning; foundation models", "https://openreview.net/pdf?id=eLTh89JM1i", "", ""], ["https://openreview.net/forum?id=Z5ZdkoxJyq", "UniWALM: Unified World Action Language Model for Embodied Robot Control", "Rahul Sajnani, Diego Romeres, Mingyuan Zhang, Kai Gao, Carl Qi, Baichuan Huang, Srinath Sridhar, Dylan Randle, Lillian J. Ratliff, Jose Barreiros, Manikantan Nambi, Jeroen Vanbaar", "We introduce UniWALM, a unified world-action-language model in which the policy itself produces three learned, in-loop abstractions inside a single mixture-of-transformers backbone: (i) generated language that emits, at every control step, a subtask (what to do next) and a textual memory (what has been done so far), re-consumed as the prompt on the next step; (ii) a task-completion channel that signals subtask boundaries and gates when the textual memory is updated; (iii) a visual-memory anchor frame that preserves past visual context after occlusion. All three are co-denoised with video and action by per-modality diffusion heads in one forward pass, with no external VLM, planner, or retrieval buffer. Together they give the policy a learned plan, memory, and decision boundary, replacing the hand-specified keyframes, retrieval buffers, and within-step chain-of-thought that prior memory-augmented policies rely on. We study: (i) does this generated-language abstraction improve manipulation? and (ii) does it drive memory-dependent tasks such as counting button presses, trial-and-error ordering, and recovering hidden objects? On MolmoSpaces, UniWALM leads the three compositional Pick&Place variants, improving over FastWAM by +13.4% on average. On RMBench's memory-dependent M(n) subset (Press Button, Blocks Ranking Try, Cover Blocks, Battery Try) UniWALM reaches 34.5% without any pretrained language or reasoning model, +21.2 points over same-backbone FastWAM (13.3%), and above Mem-0's keyframe-equipped setup (28.5%) using a single anchor frame instead of per-task privileged keyframes. On a real-world Find-the-Item task, textual memory lifts success from 11.1% (FastWAM, no language) to 61.1%, while VLA and WAM baselines stay at or below chance.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "unified world-action-language model; learned in-loop abstraction; language as working memory; diffusion policy; memory-dependent manipulation", "https://openreview.net/pdf?id=Z5ZdkoxJyq", "", ""], ["https://openreview.net/forum?id=RcljTi36NQ", "Watch, Infer, Coordinate: Inferring Robot Partner Constraints for Zero-Shot Coordination", "Suyu Ye, Zheyuan Zhang, Vaishnav Tadiparthi, Hossein Nourkhiz Mahjoub, Ehsan Moradi Pari, Tianmin Shu, Homanga Bharadhwaj, Nakul Agarwal", "Robots operating in the physical world will increasingly need to coordinate with other robots, particularly in manipulation tasks where an object may be too large or heavy for a single robot to carry alone. Physical limitations caused by hardware degradation or actuator faults can restrict the actions a robot can reliably execute, yet these limitations may be unknown to its partner. We study whether a helper can infer a robot partner's physical constraints from observing it coordinate with another robot, then use the inferred capability to coordinate with the same partner on a new task. This is difficult because a demonstration shows what the constrained robot did, but not what it could have done. In physically coupled tasks, the other robot may also compensate for its limitations, making those limitations difficult to identify from the constrained robot's behavior alone. Our key insight is that these constraints shape the joint behavior of the team, making the actions of both robots informative about the constrained partner’s capability. We introduce Watch, Infer, Coordinate, a benchmark spanning three physically coupled manipulation settings, together with an inference approach that scores candidate constraints using observed joint behavior. Across all three settings, our method substantially improves constraint inference and zero-shot coordination, approaching an oracle with access to the true constraints.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "multi-robot coordination; capability inference; physical constraint inference; physically coupled manipulation", "https://openreview.net/pdf?id=RcljTi36NQ", "", ""], ["https://openreview.net/forum?id=jxMdDMGtHJ", "What If? Counterfactual Simulation for Sample-Efficient Visual Reward Learning", "Minyoung Hwang", "Pretrained visual robot reward models capture generic notions of task success, not necessarily a person's specific preferences for how their task should be done. The robot can learn these preferences from user demonstrations, but with only a few demonstrations, a reward model may latch onto spurious correlations without learning what the person actually wants. To better express their preferences, a person could directly specify a preference axis—or an aspect of the task that they care about—in language. But a language-conditioned reward model may still reward the wrong behavior when training demonstrations don't fully cover the entire preference axis. Our key idea is to use the person's instruction to cover this axis by imagining what they don't want. We introduce COVER, which uses a video world model to generate counterfactual trajectories: alternatives that are not preferred along the preference axis but keep the rest of the behavior and scene the same. Comparing the original demonstration against its counterfactual isolates the quality that should make the reward different, without asking the person to demonstrate both versions. We train the reward to score each demonstration higher than its corresponding counterfactual, alongside learning from the demonstrations directly. Across four simulated and two real-robot tasks, COVER learns rewards that capture user preferences better than language-conditioned baselines under the same demonstration budgets, matching the strongest baseline's accuracy with up to 10× fewer demonstrations. On a real robot, selecting training demonstrations with these rewards yields policies that follow both stated preferences of each task more closely than training on unfiltered demonstrations.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "reward learning; inverse reinforcement learning; preference learning; personalization; world models; counterfactual generation; robot manipulation", "https://openreview.net/pdf?id=jxMdDMGtHJ", "", ""], ["https://openreview.net/forum?id=cW6YVaGb73", "Where Should a Skill End? Discovering Skills from How the Robot's Action Moves Objects", "Sujosh Nag, Momotaz Begum", "Bottom-up skill discovery segments demonstrations into reusable skills for planning, but where a segment should end and how many skills a task has remain open questions. Existing methods place segment boundaries at changes in pretrained visual embeddings or robot motion, with the number of skills fixed a priori or chosen by likelihood-based model selection. We argue that, in manipulation, a skill is a recurring effect of the robot's action on objects, and a segment boundary marks a change in that effect. The number of skills should follow out-of-sample prediction: two candidate skills merge when one effect model predicts held-out demonstrations within a region of practical equivalence of two. Discovery should be evaluated jointly by held-out prediction, cross-demonstration consistency and agreement with annotated boundaries, since a timing prior alone already agrees well with annotation. We instantiate this position with a label-free method that fits switched linear models of object motion given the gripper's motion and aligns each task's demonstrations to a shared transcript. On real-robot demonstrations with a parallel gripper and a five-finger hand, its boundaries reach an F1 of 0.85 at a 1 s tolerance on the gripper tasks without observing gripper events, and it recovers about the annotated number of segments, whereas likelihood-based criteria double it. Whether an object follows the gripper explains most of this agreement, while merging determines which effects warrant separate skills. Effect models learned on other tasks also segment held-out tasks without refitting.", "4th CoRL Workshop on Learning Effective Abstractions for Planning (LEAP)", "bottom-up skill discovery; learning from demonstration; temporal segmentation; action abstraction; switched linear models; state merging; held-out prediction; robot manipulation", "https://openreview.net/pdf?id=cW6YVaGb73", "", ""], ["https://openreview.net/forum?id=aRnYWh9YDW", "$k$-WM: Predicting $k$ Steps at Once for Long-Horizon Planning with World Models", "Xiaole Alex Jiang, Yinuo Wang, Lerrel Pinto, Yann LeCun, Gaoyue Zhou", "Latent world models enable goal-conditioned optimization at test time, but in practice planning success remains limited to short horizons, and gradient-based planners driven by autoregressive rollouts still underperform sampling-based methods. We attribute this to two properties of next-step prediction: autoregressive rollouts compound errors, and planning gradients must traverse a chain of nested model calls. We introduce $k$-WM, a minimal extension to transformer-based JEPA world models whose multi-horizon training objective and input layout let the predictor map an action sequence to the future latent states in a single forward pass. Across three classes of JEPA world models and four environments, $k$-WM improves gradient-based planning by 37\\% and sampling-based planning by 15\\% over the next-step world models it extends, and reduces long-horizon inference cost. The gains cannot be explained by parallel rollout alone: they persist under autoregressive inference and coincide with substantial changes in the learned representation. Videos are available at https://anon-k-wm.github.io.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; jepa; planning", "https://openreview.net/pdf?id=aRnYWh9YDW", "", ""], ["https://openreview.net/forum?id=w5njU39M9b", "ActiveAlign: Aligning Egocentric Manipulation via Active Perception", "Ri-Zhao Qiu, Bowen Wen, Yifeng Jiang, Chen Tessler, Eric Heiden, Xue Bin Peng, Xiaolong Wang, Stan Birchfield, Erwin Coumans", "Real-to-Sim-to-Real (Real2Sim2Real) enables structured world representations for planning, interpretability, and safe execution. Most existing approaches rely on passive perception, which creates gaps in real2sim2real transfer. In contrast, humans perceive actively through actions. Inspired by this observation, we propose ActiveAlign, a framework that leverages active perception to align the Real2Sim2Real gap from active robot interactions. ActiveAlign introduces two complementary modules: (i) ActiveAlign-Waving, which performs hand-eye calibration by exploiting active hand motions and differentiable rendering, and (ii) ActiveAlign-Touching, which refines object alignment through tactile feedback to achieve millimeter-level precision. Together, these capabilities enable simulation representations accurate to millimeter scale or calibrating unknown cameras on open-sourced datasets. We demonstrate that ActiveAlign-Waving can be used to curate simulation environment of open-sourced uncalibrated robot manipulation datasets, and demonstrate on a real Unitree G1 robot that ActiveAlign enables fine manipulation of millimeter-scale objects such as pressing buttons and moving sliders.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "real2sim; real2sim2real; calibration", "https://openreview.net/pdf?id=w5njU39M9b", "", ""], ["https://openreview.net/forum?id=TuauQxZrHE", "ACTS: Learning Visuo-TactileWorld Models from Human Physical Interaction", "Yuxiang Ma, Weihan Xu, Pengfei YE, Anna Mei, Yuxin Ray Song, Tingle Li, Haonan Chen, Edward H Adelson", "Action-conditioned world models for contact-rich manipulation must learn how\ncontact forms and breaks as the applied force changes, yet they are mostly trained\non robot teleoperation, which is slow and gives the operator little force\nfeedback. We train ACTS, a visuo-tactile world model,\nonly on human interaction. Operators move handheld GelSight sensors over three\nobjects while we record scene and wrist video, tactile images, 6-DoF sensor\nposes, and tactile-estimated normal force; the resulting dataset, React, spans\n4.9 hours. Each action is defined at the sensor as its relative motion plus a\ndisplacement proportional to the change in normal force, so a human hand and a\nrobot arm carrying the sensor share one action space. On held-out human data,\nACTS improves scene-view PSNR by 0.7--2.0\\,dB over two visuo-tactile world\nmodels trained on the same data. Applied to robot teleoperation without\nfine-tuning, its predicted tactile imprints appear and disappear with the\nrecorded contact, while its wrist-view predictions blur or add structure that\nis not in the scene. Videos: https://acts-anon.github.io/.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; tactile sensing; learning from human data", "https://openreview.net/pdf?id=TuauQxZrHE", "", ""], ["https://openreview.net/forum?id=fJfSDfwY4U", "Branching Fidelity: Do World Models Branch Where Physics Does?", "Alikasim Budhwani, Soo Jeon", "World models for manipulation are usually judged by average prediction error or by the task success of policies trained or planned with them, yet\npicking from a stack, pushing a tall object or inserting a peg can succeed or fail on\na few millimetres of error in the start or the action. We call a state whose futures,\nsampled over the robot’s own small errors, split into separate outcomes a fork,\nand propose the fork probe to evaluate a world model’s branching ﬁdelity: does it\nbranch where physics branches? With a physics engine as the upper reference, the\nprobe catches 88% of forks with 9% false alarms. In an example evaluation, two\nworld models with similar average error, 3–4× lower than predicting that nothing\nmoves, differ sharply: a stochastic one catches 18% of forks, a deterministic one\n60%, and 72% with uncertain starts. The probe’s split test also curates training\ndata: oversampling the rare branches it ﬁnds lifts the deterministic model from\n72 to 82% of forks. Finally, in rigid-body tasks where one branch is irreversible,\na fork marks the edge of the safe set, so the probe doubles as a label-free safety\nsignal, much as people judge a stack precarious by imagining it fall.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; physical ﬁdelity; evaluation; intuitive physics", "https://openreview.net/pdf?id=fJfSDfwY4U", "", ""], ["https://openreview.net/forum?id=cDazPj3tcm", "CableTac: Scalable Visuo-Tactile Learning for Cable Routing", "Zhuo Chen, Jie Xu, Elie Aljalbout, Yixuan Wang, Alperen Degirmenci, Fabio Ramos, Yashraj Narang, Iretiayo Akinola", "Cable routing requires reasoning about both global cable geometry and local contact interactions, yet collecting large-scale visuo-tactile robot data is expensive. We present CableTac, a simulation and learning framework for scalable visuo-tactile cable manipulation. CableTac combines GPU-accelerated cable dynamics, general-purpose tactile simulation, and a full-scale replica of the ManipulationNet cable-routing benchmark. A demonstration-reuse engine expands 10 human demonstrations into more than 1,000 simulated trajectories, which we use to pretrain diffusion policies before reinforcement-learning post-training. Across three routing tasks, we find that policy performance improves with increasing amounts of generated data, while the value of tactile feedback is task dependent: tactile sensing provides little benefit for unconstrained round-peg routing, but improves success by 4.7 and 8.0 percentage points for Y- and U-clip insertion, where local contact is critical. RL post-training further improves success to 88.7% and 92.0% on Y- and U-clip routing. These results establish CableTac as a scalable testbed for studying when and how tactile feedback benefits linear-deformable-object manipulation.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "cable routing; visuo-tactile sensing; deformable-object manipulation; high-fidelity simulation; sim-to-real; reinforcement learning; agentic calibration", "https://openreview.net/pdf?id=cDazPj3tcm", "", ""], ["https://openreview.net/forum?id=SShpr1qMfl", "CLAW: Continuous Latent Action World Models via Adversarial Regularization", "Tewodros W. Ayalew, Samuel Wheeler, Matthew Jeung, Xiao Zhang, Andre de la Cruz Arce, Kaylene Caswell Stocking, Michael Maire, Matthew Walter", "We introduce CLAW, an end-to-end framework for learning continuous latent actions and a predictive world model from action-free video. CLAW uses reciprocal supervision to jointly learn the latent action model and world model, with adversarial regularization preventing the latent from taking the shortcut of encoding the future frame rather than the action. The learned latent actions support imitation learning, model-based planning, cross-context action transfer, and real-robot pretraining. Across simulated and real-world manipulation tasks, CLAW achieves strong overall performance.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "latent action world model; generative world model; adversarial regularization", "https://openreview.net/pdf?id=SShpr1qMfl", "", ""], ["https://openreview.net/forum?id=VqqILc2b1e", "Constraint prioritization for world model planning", "Francisco Roldan Sanchez, Pau de las Heras Molins, David Fridovich-Keil, Georgios Bakirtzis", "Learned world models enable model-based planning by predicting the consequences of candidate trajectories, but planning becomes challenging when task objectives and constraints conflict. In such settings, planners must determine which requirements to preserve and which to relax, while penalty-based formulations can produce solutions that violate intended priorities depending on the choice of weights. We introduce TierCEM, a variant of the cross-entropy method that incorporates strict constraint priorities directly into elite selection, without requiring per-constraint importance weights, by sequentially filtering candidate trajectories according to their constraint priorities. We evaluate TierCEM for planning with a learned world model in contact-rich pushing, showing that changing constraint priorities changes which requirements are violated under conflict.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "constrained planning; cross-entropy method; trajectory optimization.", "https://openreview.net/pdf?id=VqqILc2b1e", "", ""], ["https://openreview.net/forum?id=QVvS7Z2bQh", "ContactWorld: What Representations Matter for Vision-Tactile Latent World Models in Contact-Rich Manipulation", "Zhiyuan Zhang, Pokuang Zhou, Kaidi Zhang, Adeesh Desai, Temitope Ibrahim Amosa, Davood Soleymanzadeh, Jiuzhou Lei, Yuhao Zhou, Minghui Zheng, Yu She", "Contact-rich manipulation poses a fundamental challenge for world models: visual and tactile observations capture different aspects of physical interaction, and their utility depends critically on how this information is represented. We introduce ContactWorld, a controlled benchmark and empirical study of vision-tactile representations across 12 contact-rich manipulation tasks. Using a fixed world-model architecture, training procedure, and planning framework, we examine representation effects through three complementary properties: spatial fidelity, motion coherence, and predictive stability. Point clouds preserve task-relevant geometry and track physical motion more reliably than image observations, helping explain their higher average planning success of 32.1%, compared with 20.7% and 22.0% for wrist- and front-view RGB, respectively. Tactile observations generally reduce long-horizon prediction-error accumulation, but these gains do not translate uniformly into task success. Structured tactile force fields provide the most consistent downstream improvements, with PointCloud+TacFF achieving the highest overall simulated success rate of 36.1%. We further validate these trends through 900 physical trials spanning six tasks, two robot platforms, and three tactile sensing systems. Together, ContactWorld identifies sensory representation as a central design factor in vision-tactile world models and provides empirical guidance for predictive planning in contact-rich manipulation.", "Bringing Physics Simulation and World Models Together for Robotic Manipulation", "world models; contact-rich manipulation; vision-tactile learning; tactile sensing; predictive control", "https://openreview.net/pdf?id=QVvS7Z2bQh", "", ""], ["https://openreview.net/forum?id=E8268t87nn", "Data-Free Continual Learning for World Action Model with Rectified Generative Replay", "Kaipeng Fang, Hangxu Liu, Chaojian Shi, Yunsong Zhou, Jingkuan Song, Lianli Gao", "World action models (WAMs) built on pretrained video generation models adapt quickly to new robotic tasks, but they forget previously learned tasks under sequential fine-tuning. Experience replay (ER) mitigates forgetting by rehearsing data of previous tasks, yet this data is often unavailable in robotics, where a policy is deployed as weights only and its training data is not shared along with it. In this work, we ask whether a WAM can achieve data-free continual learning by regenerating its own past. We observe that a WAM can indeed autoregressively regenerate complete rollouts of previously learned tasks and replay them to mitigate forgetting, yet such raw rollouts still lag far behind rea
