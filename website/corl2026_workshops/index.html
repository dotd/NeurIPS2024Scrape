ation generation; dexterous manipulation", "https://openreview.net/pdf?id=0Y6nde4ZbP", "", ""], ["https://openreview.net/forum?id=7K2bVb0jp2", "DreamVLA: From Generated Human Motions to Humanoid Vision-Language-Action Policies", "Kevin Park, Izat Rasyad, Dvij Rajesh Kalaria, S. Shankar Sastry", "Training vision-language-action (VLA) policies typically depends on substantial robot demonstration data, making human teleoperation a costly and cumbersome bottleneck, particularly for whole-body humanoid interaction. Reinforcement learning in simulation offers an alternative for scaling this data, but designing task-specific rewards remains challenging. To address this, we propose DreamVLA, which uses generated motion trajectories to guide reinforcement learning (RL) in simulation, converting them into reliable task execution trajectories. These trajectories train VLA models in simulation without new task-specific teleoperation data. Our central contribution is a reference-conditioned DAgger distillation procedure: after a failed learner rollout, we restart the RL expert from a sampled learner state with the same reference suffix and aggregate successful corrective trajectories, addressing the distribution shift left by offline imitation. We evaluate picking from a platform, opening a drawer, and pressing a button, with ablations of DAgger iterations, residual RL, and generated dataset scale", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "humanoid loco-manipulation; vision-language-action models; robot learning", "https://openreview.net/pdf?id=7K2bVb0jp2", "", ""], ["https://openreview.net/forum?id=9PZhZHGqL3", "EqC: Equilibrium Energy Control for Introspective Lifelong Robot Learning", "Haodong Yang, Runhan Huang, Bowen Zhang, Iofai Lei, Zunzhe Zhang, XiangCheng Zhang, Shaoting Zhu, Linzhan Mou, Yicheng Liu, Hang Zhao", "Long-term robot autonomy depends on more than effective action generation: a policy must recognize when its behavior is no longer sufficiently supported and use assistance to improve. We introduce **Equilibrium Energy Control (EqC)**, a framework for introspective lifelong robot learning built around an explicit conditional energy landscape. EqC casts generative action refinement as equilibrium-seeking optimization, while the geometry of the refinement process reveals whether the generated behavior remains consistent with the learned landscape. This competence signal enables Energy-Gated DAgger, where persistent energy-consistency violations trigger expert takeover and the resulting recovery trajectories are aggregated for subsequent policy updates. EqC integrates naturally into both Diffusion Transformer policies and flow-matching-based vision-language-action (VLA) policies. Across simulation and real-world bimanual manipulation, EqC improves task performance and robustness while enabling timely intervention near the policy's competence boundary. A real-world study further shows how these interventions progressively expand the range of situations handled autonomously, providing a practical path from static generative controllers toward self-improving robot systems.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robotics; embodied ai; generative control; vla", "https://openreview.net/pdf?id=9PZhZHGqL3", "", ""], ["https://openreview.net/forum?id=u2VRZwRMGZ", "FLEX-π: A Multi-Stream World-Action Model with Compute Flexibility", "Ge Yan, Jinghao Liu, Yuzhi Fan, Lei Cai, Minwen Liao, Jesse Zhang, Dieter Fox", "World-action models (WAMs) predict the future to act better, but nearly all of them predict only RGB latents—trained purely for pixel reconstruction, with no explicit signal for the 3D geometry or object semantics manipulation needs. We find a surprising free lunch: the same frozen video-generation VAE that encodes RGB also encodes 3D pointmaps almost losslessly, with no pointmap-specific training at all. This lets us supervise FLEX-π, a 6B-parameter WAM, on 3D geometry and object-centric DINO semantics alongside RGB—at no cost in new sensors, new pre-training, or inference latency. Every visual signal is projected into this shared latent space and denoised jointly with actions inside a Mixture-of-Transformers backbone; per-stream dropout with cross-modality forcing then lets a single trained checkpoint run on any subset of these streams, from a fast action-only mode to full joint generation. The result is a policy that is exceptionally demonstration-efficient and generalizes well, beating the strongest baselines by 2-6× on dexterous, precise, real-world bimanual tasks both in and out of distribution—all while running faster than π0.5. Videos in https://anony-flex-pi.github.io/.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world-action models; multimodal learning; robot manipulation", "https://openreview.net/pdf?id=u2VRZwRMGZ", "", ""], ["https://openreview.net/forum?id=WPHcKrbaso", "FOCUS: Action-Conditioned Partial Rollout for World Action Models", "Feiyang You, Shuaijun Liu, Chenglong Zhang, Shuyang Hao, Chengyu Wu, Ningxin Su", "Future-conditioned World Action Models generate robot actions from predicted visual states, but dense rollout updates the entire latent scene even when manipulation centers on a localized interaction. The challenge is to select action-relevant changes while preserving the\ncontext needed for control and decoding. We introduce \\focus{}, an action-conditioned partial-rollout method that updates selected latent regions and preserves the remaining state through an identity path. Teacher-derived latent change and forward/inverse action relevance supervise support selection, while a residual head calibrates the accepted updates. The complete lattice remains available to downstream action modules and video decoders. Selective updates operate at early denoising steps, followed by dense refinement of the resulting state. We instantiate the same rule in two Fast-WAM interfaces: coupled video--action rollout (Joint) and video rollout followed by inverse dynamics (IDM). Across 40 LIBERO tasks, \\focus{}-Joint and \\focus{}-IDM attain average success rates of 96.3\\% and 96.8\\% at 0.49s and 0.58s per policy call, respectively, reducing latency by 13.0\\% and 9.7\\% relative to their dense baselines. Support-recovery and allocation studies examine the selection rule and the trade-off between control success and policy-call latency.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world action models; selective rollout; robot manipulation", "https://openreview.net/pdf?id=WPHcKrbaso", "", ""], ["https://openreview.net/forum?id=JALnEhDNA0", "FOCUS: Flow-Matching with Offline Critical-Interaction Update Supervision for Robot World Models", "Weiyi Hong, Chenjun Bai", "Robotic visual world models learn physical dynamics and interaction strategies through dense video prediction. However, existing methods generally employ spatiotemporally uniform supervision mechanisms; consequently, large static background areas dominate the learning signals, severely diluting supervision for the sparse yet critical regions of interaction.\nWe introduce a fine-grained loss reweighting method\nthat converts offline region and motion annotations into spatial weights,\nconcentrating supervision on interaction-relevant changes while retaining\ncoverage of the full scene. It requires no modification to the architecture or\ninference pipeline and applies to any spatial prediction loss. On Fast-WAM\npolicy evaluation with LIBERO-Plus and DreamDojo video prediction,\npreliminary checkpoints match or exceed the policy success and\nmotion-magnitude alignment of their respective 20k-step baselines with 40\\%\nand 75\\% fewer post-training steps. These results indicate that offline priors\ncan reduce redundant supervision and improve post-training step efficiency.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world models; robot learning", "https://openreview.net/pdf?id=JALnEhDNA0", "", ""], ["https://openreview.net/forum?id=5kCxiubF0f", "From Reasoning to Action: Consequence-Grounded Alignment for Vision-Language-Action Models", "Yixue Zhang, Wenke Xia, Kun Wu, Wenbo Yu, Pei Ren, Junnan Nie, Di Hu, Zhengping Che, Chang Liu", "Reasoning informs decision-making by connecting intended actions with their expected consequences. Building on this principle, recent vision-language-action models incorporate embodied chains of thought (ECoTs) as an intermediate stage in action generation. However, such guidance remains implicit, as actions are conditioned on the generated ECoTs rather than explicitly optimized to align with them.\nTo bridge this gap, we introduce the Consequence-grounded Reasoning-to-Action alignment method called CoRAct, an offline training framework that explicitly aligns reasoning and action through reward-guided optimization in action noise space.\nSpecifically, CoRAct formulates two physically grounded ECoT components as verifiable signals: movement specifies the intended motion, whereas waypoints encode the expected spatial consequence of execution. By jointly modeling ECoT reasoning, action generation, and action-conditioned future prediction, a unified Mixture-of-Transformers explicitly couples each action with its articulated intent and predicted consequence. For action candidates generated from sampled noise, CoRAct computes alignment rewards based on motion consistency with the described movement and agreement between predicted outcomes and the specified waypoints. These rewards drive group-relative optimization of the initial noise distribution, steering action generation toward consistency with the articulated intent and expected consequence.\nExtensive experiments across RoboCasa, VLABench, and real-world manipulation tasks demonstrate consistent gains in task success and generalization over strong ECoT-based VLA baselines. Further analyses reveal improved reasoning–execution alignment and show that our method can ground externally provided ECoTs in executable behavior, supporting zero-shot adaptation to novel scenarios by leveraging knowledge from powerful VLMs.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vision-language-action models; embodied chain-of-thought; reasoning–action alignment; action-conditioned future prediction; policy post-training", "https://openreview.net/pdf?id=5kCxiubF0f", "", ""], ["https://openreview.net/forum?id=aLjh7TyU1s", "FurnitureVLA: Learning Long-Horizon Bimanual Furniture Assembly with Vision-Language-Action Model", "Chenyang Ma, Yue Yang, Radu Corcodel, Siddarth Jain, Andrew Wu, Chiori Hori, Diego Romeres", "Current work on robot furniture assembly mostly focuses on toy-scale settings or single-arm manipulation. We introduce FurnitureVLA, the first systematic study of real-scale bimanual furniture assembly using Vision-Language-Action models (VLAs). We formalize the task, develop a scalable simulation pipeline for expert data generation and evaluation, and build a VR teleoperation system for single-operator bimanual control to collect high-quality real-world demonstrations. To address extreme long-horizon assembly with up to 7 subtasks and 1550 control steps, we propose a progress-enhanced VLA that jointly predicts actions and a continuous progress signal, enabling automatic subtask transitions and reducing compounding errors. FurnitureVLA improves average simulation success from 48% to 80% over baselines across three furniture types, with a further 21% gain from our study of perception and control design factors, and transfers to a real Kinova Gen3 platform with only 16% drop on the hardest task. Project page: https://dannymcy.github.io/furniturevla/", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vlas; bimanual manipulation; furniture assembly", "https://openreview.net/pdf?id=aLjh7TyU1s", "", ""], ["https://openreview.net/forum?id=FOed6cqAoM", "GOTT: Object-centric Dexterous Manipulation with a Reusable Cross-Embodiment Primitive", "Yulin Liu, Lai Wei, Yen-Jen Wang, Akash Sharma, Pieter Abbeel, Henrik I Christensen, Haozhi Qi", "Foundation models and large-scale human data provide rich sources of manipulation intent, but translating this intent into multi-fingered robot behavior remains difficult. Dexterous hands still lack a reusable low-level primitive that reliably establishes contact across tasks and embodiments. We propose GOTT, a reach-acquire-move framework built around a single cross-embodiment contact-acquisition primitive. Given a robot-agnostic object trajectory and a reach specification, GOTT first brings the hand near a task-relevant contact region. The shared closed-loop primitive then establishes stable contact from this approximate initialization, and a pose-conditioned controller tracks the desired object motion. Reach specifications may come from future-aware planning, external models, or human demonstrations, while the primitive and tracking backend remain unchanged. Simulation and real-world experiments show that GOTT is able to establish robust contact across diverse objects, arm-hand platforms, and seen and unseen hand morphologies. It also consistently improves end-to-end task success over open-loop grasp execution.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "dexterous manipulation; cross-embodiment learning; object trajectory tracking", "https://openreview.net/pdf?id=FOed6cqAoM", "", ""], ["https://openreview.net/forum?id=2APlGcTrI2", "GRAIL: Generating Humanoid Loco-Manipulation from 3D Assets and Video Priors", "Tianyi Xie, Haotian Zhang, Zi Wang, Jinhyung Park, Bowen Wen, Jiefeng Li, Xueting Li, Qingwei Ben, Haoyang Weng, Yufei Ye, David Minor, Tingwu Wang, Chenfanfu Jiang, Sanja Fidler, Jan Kautz, Linxi Fan, Yuke Zhu, Zhengyi Luo, Umar Iqbal, Ye Yuan", "Scaling humanoid loco-manipulation requires robot-compatible demonstrations across diverse objects, whole-body motions, and scene geometries, but teleoperation and motion capture are difficult to scale because each collection depends on physical setups, instrumented actors, and robot operation. We present GRAIL, a digital generation pipeline that remains fully virtual until deployment: it composes 3D assets, simulator-ready scenes, and video foundation model (VFM) priors to synthesize interactions without physical scene rebuilds or robot teleoperation. GRAIL starts from fully specified 3D configurations with known object geometry, camera parameters, metric scale, environment depth, and a robot-proportioned character. This privileged setup conditions interaction-aware reconstruction of metric 4D human-object interaction (HOI) trajectories with reduced depth ambiguity and morphology mismatch. We retarget the recovered motions to a humanoid and train complementary task-general trackers: an object-aware latent adaptor for manipulation and a scene-aware tracker for terrain traversal. GRAIL produces over 20,000 sequences spanning pick-up, whole-body manipulation, sitting, and terrain traversal. Egocentric visual policies trained on this generated task data achieve 84% real-world object pick-up success and 90% stair-climbing success on a Unitree G1.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "humanoid loco-manipulation; robot demonstration generation; video foundation models; physics-based motion tracking; sim-to-real transfer", "https://openreview.net/pdf?id=2APlGcTrI2", "", ""], ["https://openreview.net/forum?id=D2FKtmx0bl", "Grounded Action Model: 3D Grounding as a Foundation for Robotics", "Gehao Zhang, Weikai Huang, Shailesh Shailesh, Yiyan Peng, Jiafei Duan, Ranjay Krishna", "Manipulation policies must know which objects matter and where they are, yet the pretrained backbones that current robot foundation models build on, from language in vision-language-action models (VLAs) to video generation in world-action models (WAMs), do not directly require this metric grounding, leaving it to be learned implicitly from robot demonstrations. We propose Grounded Action Models (GAMs), a new paradigm of robot foundation models built with 3D grounding. GAM can be conditioned using language, points, or box prompts, which are first transformed into a shared object-centric representation of the selected objects. This representation captures target-focused visual features and metric object geometry, which is mixed with robot state history through a multi-stream transformer to predict action chunks. Although GAMs can be run autonomously, they can also serve as a low-level controller that a high-level planner controls using its various input modalities, allowing for long-horizon and memory-dependent manipulation. On RoboTwin 2.0, GAM achieves an average success rate of 55.3% across 50 tasks (vs. 52.0% for Spatial Forcing), including 47.6% under scene randomization (vs. 30.4% for Abot-M0), with its action policy trained only on clean-scene demonstrations. On LIBERO-PRO, it achieves a state-of-the-art average success rate of 61% (vs. 53% for π0.5) across 16 perturbation settings, with the largest gains when targets are relocated or newly designated. On two real robots, GAM retains 17/20 successes under visual shift on a bimanual YAM versus 4/20 for π0.5, while its composition with a Molmo2 planner on a Franka achieves 64.7% ID and 49.8% OOD step completion on long-horizon and memory-dependent tasks.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot foundation models; 3d grounding; object-centric representations", "https://openreview.net/pdf?id=D2FKtmx0bl", "", ""], ["https://openreview.net/forum?id=1sc4tQWDgY", "Guava: Distilling Frontier VLMs into a Compact Agent through a Robotic Manipulation Harness", "Haowen Liu, Xirui Li, Shaoxiong Yao, Peng Shi, Tianyi Zhou, Jia-Bin Huang, Furong Huang, Jiayuan Mao", "Frontier vision–language models (VLMs) can perform robotic manipulation by interpreting visual observations, invoking robot tools, and adapting to execution feedback, but repeated model calls incur high costs and latency. In this paper, we study the problem of distilling these capabilities into compact VLMs. The key challenges are designing an interaction interface that enables efficient and generalizable distillation, and a data collection protocol that captures diverse scenarios. We present $\\texttt{Guava}$, a framework built around a manipulation harness and a simulation-based data generation pipeline. We first study how harness design affects both frontier and compact models, and use the resulting interface for teacher data generation and student deployment. Through this harness, a frontier VLM generates physically executed and validated interaction trajectories in simulation, which we augment with perturbation branches that expose the teacher to execution deviations and recovery trajectories. Using $\\texttt{GPT-5.4}$ as the teacher, we collect 2,268 interaction trajectories and fine-tune $\\texttt{Qwen3.5-4B}$ to obtain $\\texttt{Guava-4B}$. $\\texttt{Guava-4B}$ substantially outperforms its base model and approaches $\\texttt{GPT-5.4}$ performance across simulated and real-world manipulation tasks, while generalizing to unseen objects, instructions, and task compositions. Perturbation trajectories particularly improve unseen-task generalization. With substantially lower inference latency and token usage compared to a frontier model, $\\texttt{Guava-4B}$ enables efficient local deployment.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "action abstraction; vision-languag model; agentic manipulation", "https://openreview.net/pdf?id=1sc4tQWDgY", "", ""], ["https://openreview.net/forum?id=ble6LMrmKz", "HIGenNTO: Scalable Humanoid Interaction Generation via Noise-Space Trajectory Optimization", "Lalit Jayanti, Kashu Yamazaki, Yuto Shibata, Kotaro Amaya, Katerina Fragkiadaki", "Humanoid robots can acquire complex skills by imitating kinematic humanoid motion references, yet reliable references for contact-rich interactions remain difficult to obtain: motion capture deteriorates under occlusion and close physical contact, while retargeting introduces additional contact and geometric inconsistencies. We present HIGenNTO, a framework that synthesizes humanoid–scene interaction motion references by optimizing the initial noise of a pretrained text-conditioned motion model under sparse spatiotemporal and scene constraints. The same formulation satisfies desired contacts, avoids collisions, and maintains stable support while retaining the prior's realism and temporal coherence, generating interaction motions from scratch and composing long-horizon behaviors stage-wise. Across robot–environment and robot–object tasks, HIGenNTO produces motions that can be executed by tracking policies in simulation and used to train depth-conditioned visuomotor policies operating solely from onboard sensing. We deploy these policies on a Unitree G1 across four contact-rich tasks. Finally, the task specifications themselves can be written by a coding agent, which proposes interaction tasks and compiles them into prompt, constraint, and scene programs, authoring three of our eight evaluated tasks and four further behaviors. Together, these results establish a scalable path from high-level task descriptions to physically executable humanoid interactions.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "humanoid robots; motion generation; diffusion models", "https://openreview.net/pdf?id=ble6LMrmKz", "", ""], ["https://openreview.net/forum?id=OoI6kXUw6b", "How Much of Your VLA Is kNN", "Denis Grachev, Damien LaRocque, Omar Moured", "Vision-language-action (VLA) models now exceed 95 % success on the LIBERO simulation benchmark, yet it remains unclear how much of this performance requires generalization beyond the training demonstrations. In this work, we show that retrieving nearby demonstrations and reusing their action chunks achieves a success rate of 91.7 % on LIBERO without policy training. Under LIBERO-Plus perturbations, retrieval shows the smallest drop of all evaluated policies. Across nine publicly available VLAs, fine-tuning mostly makes the vision-language backbone a better retrieval key, and the actions of the VLAs remain close to the demonstrations. In addition, we introduce Local Action Consistency (LAC), an offline metric that measures whether nearby observations in representation space are also associated with similar future actions. We show that LAC tracks the success rate of retrieval and can guide the training of a retrieval key. Our evaluation and source code are available at https://github.com/sereact/lerobot_knn.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vision-language-action models; robustness; generalization; retrieval", "https://openreview.net/pdf?id=OoI6kXUw6b", "", ""], ["https://openreview.net/forum?id=D901c0AIXX", "IMPLY: Physically Anchored Consistency for World-Model Rollouts", "Aman Mehta", "A world model asked what happens if an object is pushed at several speeds produces several futures. If the model has the object in mind, those futures agree about it: each implies the same mass and friction. The consistency checks now used to vet world-action models ask whether a model's futures agree with each other, and none of them knows any physics. We show that this is not enough, and what to do instead. IMPLY reads the physics each rollout implies by inverting a simulator and scores a set of rollouts by how well one object explains all of them, anchored to two calibration pushes the model has observed. In a controlled setting, a model that ignores the object and always predicts a typical push is as self-consistent as the truth (AUROC 0.70 against the oracle); anchoring exposes it (1.00). On a real model, V-JEPA 2-AC adapted to the scene, the same thing happens. Given its own calibration pushes the model tracks the object (per-object correlation with the truth 0.91); given another object's, it does not (0.05). Self-consistency cannot tell these apart, preferring the right evidence on 52% of objects, chance level, while anchored disagreement prefers it on 73% and correlates 0.92-0.99 with the rollouts' error. Used to choose among candidate rollout sets, it comes within 0.003 of an oracle that sees the truth. A model that has internalised the wrong object is exactly as self-consistent as one that has internalised the right one; consistency has to be anchored to evidence.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world models; consistency; verification; physical reasoning; hallucination; rollout selection; robot manipulation", "https://openreview.net/pdf?id=D901c0AIXX", "", ""], ["https://openreview.net/forum?id=4DMJ6qRQ1X", "Indistinguishable from a Resize Filter: What LIBERO Can Resolve About the Action Gap", "Adnan Khan, Sam Jeffrey M, SriCharan Ganta", "Under a symmetric null calibrated to the discordance we measure, a configuration change that does nothing, evaluated at LIBERO's standard 500 rollouts per suite, returns an apparent improvement of at least 0.8 percentage points about 15% of the time, and across three such changes at least one does so with probability about 0.38 under an independence about approximation. We know because we were fooled by exactly that pattern. Sweeping seven settings of OpenVLA-OFT's evaluation harness, three image-pipeline knobs appeared to improve success at n=500 by +0.8, +0.8 and +0.4 points, with consistent signs and a plausible mechanism: each deviates from a pipeline the released code deliberately matches to training. At n=2500 with paired per-episode analysis on matched initial states, all three are equivalent to baseline within ±1 point (+0.04, -0.12, -0.28; paired 95% CIs within [-0.88,+0.59]; exact McNemar p = 1.00, 0.79, 0.44), and the result directionally repeats on a second, less saturated suite, though with an interval too wide to claim equivalence there. The instrument is validated in both directions: three configurations reproduce byte-identical outcome vectors, while removing the wrist camera costs 88.8 points. Beneath the flat aggregates, 2-5% of individual episodes silently change outcome. For the perturbations and the single policy we study, the standard protocol cannot separate these harness changes from a one-point effect, and we give the rollout budgets that can. Progress toward the action gap is settled by deltas of exactly this size. This is a negative result and a reporting proposal, submitted to Track 2.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "position and negative-result paper; evaluation of the action gap; benchmarking; negative results", "https://openreview.net/pdf?id=4DMJ6qRQ1X", "", ""], ["https://openreview.net/forum?id=ePZHQLddx0", "Inference Latency and Chunk Transitions in Whole-Body Humanoid Loco-Manipulation", "Chuan Qin, Shaoting Zhu, Sadeep Thilakarathna, Priyan Mendis, Kasun Shanaka Kristombu Baduge", "Inference latency delays the renewal of coordinated whole-body references while a humanoid continues balancing and interacting with objects. We study this effect using WB-WAM and a fixed motion tracker on four HumanoidArena contact tasks. Across 6,400 simulated episodes, we compare synchronous execution, time-aligned asynchronous execution, and training-time real-time chunking (Training-RTC) under controlled delays of 0–200 ms. At 200 ms, Async maintains a four-task mean success rate of 68.63%, close to the zero-delay baseline of 68.75%, while Sync achieves 64.25%. Training-RTC improves the joining of successive plans: mean boundary reference increments decrease by 10.4–21.8% and post-switch measured velocity increments by 3.4–10.6% across all eight task–delay comparisons, with aggregate success broadly comparable to Async. Applying a common physical deadline increases the mean Async–Sync success gap from 4.38 to 7.88 percentage points. Asynchronous execution continues the outgoing motion plan during inference, while Training-RTC improves transitions between successive action chunks. Their respective roles support task completion and whole-body motion continuity under delay.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "humanoid robots; inference latency; loco-manipulation", "https://openreview.net/pdf?id=ePZHQLddx0", "", ""], ["https://openreview.net/forum?id=HOTY4KNjwD", "InfiNoVA: ∞ Novel View Augmentation for Viewpoint Invariant Robot Policies", "Sai Puneeth Reddy Gottam, Elmar Rueckert, Vedant Dave", "Vision-Language-Action (VLA) policies often rely strongly on the camera viewpoints seen during training, causing substantial performance degradation when deployed from unseen perspectives. Collecting demonstrations from sufficiently diverse physical viewpoints is expensive and still provides only sparse coverage of the viewpoint space. We introduce InfiNoVA, a data-augmentation framework that converts synchronized multi-camera demonstrations into a dense distribution of geometrically consistent training views. InfiNoVA reconstructs each manipulation trajectory as a time-varying 3D Gaussian representation and renders novel observations from sampled camera poses while preserving the original state--action correspondence. This explicit scene representation improves frame-level fidelity and temporal consistency while reducing task-critical hallucinations observed in generative novel-view synthesis. Across four real-world manipulation tasks, policies trained with InfiNoVA achieve $5.4\\times$ higher average success under unseen randomized viewpoints than both VISTA-based augmentation and the unaugmented policy. InfiNoVA further achieves $1.7\\times$ higher success than training directly on all five physical camera views. These results show that dense, geometrically grounded viewpoint augmentation provides a practical route toward camera-robust robot policies without modifying the underlying policy architecture.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot learning; novel view synthesis; viewpoint invariant policies", "https://openreview.net/pdf?id=HOTY4KNjwD", "", ""], ["https://openreview.net/forum?id=gHB1d45TXJ", "Iterative Reasoning About Clues that Matter for Navigation", "Arthur Zhang, Carl Qi, Donne Su, Xiangyun Meng, Amy Zhang, Joydeep Biswas", "Scalable mapless navigation from sparse language instructions requires resolving underspecified goals and routes from open-set environmental cues like ramps, signs, or detours. Prior work assumes either a closed set of factor categories or ignore test time motion planning errors. In this work, we argue that pretrained Vision-Language Models (VLMs) can overcome these limitations by discovering novel instruction-relevant cues to iteratively refine prior motion plans, but require adaptation to focus on which cues matter and their influence on motion planning. We propose Foresight, the first online self-refinement framework for continuous motion planning. Foresight finetunes a single VLM to alternate between proposing image-space motion plans and critiquing them using the language goal and visual context. We introduce a simple, effective recipe using supervised (SFT) pre-training and reinforcement learning (RL) post-training to enhance cue-goal discovery for motion refinement. We validate these contributions on 56 real-world sparse language goals with unseen sign, structural, and detour cues, and find that Foresight's plan-critique architecture reduces the interventions per mission by 52% relative to state-of-the-art test-time reasoning and foundation-model baselines while running onboard a Jetson AGX Orin. In extensive offline evaluations, our proposed contributions improve expert behavior alignment by 37% on average compared to state-of-the-art test-time reasoning and foundation model baselines. We will release code, data, and training details to support future work on test-time reasoning for robot motion refinement. Additional anonymized robot deployment videos at: https://foresightplanner.github.io/foresight", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "mapless navigation; vision-language-models; test-time reasoning", "https://openreview.net/pdf?id=gHB1d45TXJ", "", ""], ["https://openreview.net/forum?id=ytYkhQwgsQ", "JAMB: Joint Action–Motion Diffusion for Bimanual Manipulation", "Chuyang Xiao, Peilin Meng, David Held", "Coordinated bimanual manipulation is challenging because the motion of either arm can alter the shared 3D scene and thereby affect the other arm. Yet most diffusion policies generate actions without explicitly modeling these future geometric consequences, while predictive variants typically use future state only as auxiliary supervision or fixed conditioning. We address this limitation by proposing JAMB, a diffusion policy that jointly denoises bimanual actions and future 3D point tracks. By allowing action and track hypotheses to evolve together within a shared Transformer, each can inform and refine the other throughout denoising. We further ground multimodal representations in a shared spatiotemporal coordinate system to facilitate geometry-aware interaction during joint denoising. We evaluate JAMB on diverse bimanual manipulation tasks in RoboTwin 2.0 and on a real-world robot, comparing it with action-only policies and alternative future-prediction approaches spanning different state representations and learning objectives. Across 16 simulation tasks, JAMB achieves an average success rate of 83.4%, outperforming the strongest baseline by 23.9 percentage points. On three real-world tasks, it outperforms the action-only and auxiliary geometry prediction methods by 50.0 and 21.2 percentage points, respectively. Beyond these performance gains, JAMB shows stronger generalization to cluttered scenes and out-of-distribution backgrounds than the evaluated baselines. Together, these results demonstrate the effectiveness of our joint action-motion modeling framework for coordinated bimanual manipulation. Our project website is available at https://ja-mb.github.io/.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world model; bimanual manipulation; 3d point tracking; diffusion policy", "https://openreview.net/pdf?id=ytYkhQwgsQ", "", ""], ["https://openreview.net/forum?id=1HkY73V8Pl", "JEVA: Joint Encoders for Variational Action World Models", "Aditya Pratap Singh, Sanyam Mehta, Yixin Wang, Nima Fazeli, Bernadette Bucher", "Learning world models for robotic control typically requires large\namounts of action-labeled data, which is expensive to collect, whereas action-\nfree demonstrations such as video are abundant. Latent action models address this\nimbalance by inferring the actions that explain observed transitions, but training\nthe inverse dynamics model (IDM) jointly with the forward model is unstable.\nExisting methods therefore fix the latent action space before training the world\nmodel, or add a separate inverse-dynamics warm-up stage. We introduce JEVA, a\nlatent-action world model that co-trains an IDM and a forward world model end-\nto-end from scratch in a single stage, on a pool of trajectories in which only a\nsmall fraction of transitions carry action labels. JEVA treats the action between\ntwo visual states as a continuous Gaussian latent that can be planned over and\ndecoded into continuous controls. Variance-reduced routing (VRR) makes single-\nstage training work. On labeled transitions, VRR conditions the forward predictor\non the posterior mean instead of a sample. With a warm-up stage and no VRR,\nevery latent-action dimension collapses. With 5% of episodes labeled, a policy in\nJEVA’s latent action space matches or exceeds every baseline trained with 20% of\nlabels on OGBench Cube-Double and Cube-Triple. Under CEM planning, JEVA\nleads the best world-model baseline by 11–22 points on every Cube task.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world models; latent action models; semi-supervised learning", "https://openreview.net/pdf?id=1HkY73V8Pl", "", ""], ["https://openreview.net/forum?id=l7EUpXm16e", "Latent Memory Palace: Reasoning for Control as Autoregressive Variational Inference", "Chuning Zhu, Eva Xu, Jose Barreiros, Krishnan Srinivasan, Paarth Shah, Abhishek Gupta", "Human decision-making is highly flexible -- some actions are taken immediately; others require longer deliberation. Language models have exhibited a similar capacity for adaptive \"reasoning.\" However, transferring this capability to continuous control policies has been challenging, as directly reasoning in language space may lack the granularity for spatial understanding and precise motions. In this work, we show that reasoning for control policies can emerge by organizing information in an autoregressive latent space reminiscent of a memory palace, where retrieval is iterative and adaptive. Our method, Latent Memory Palace (LMP), formulates reasoning as variational inference with an autoregressive latent distribution. We derive a latent-space reinforcement learning technique to tractably optimize its variational lower bound. The resulting policy, LMP-$\\pi$, achieves strong empirical performance in simulation and real-world domains while exhibiting interpretable, adaptive allocation of test-time compute. We further show that the same framework yields a variable-length action tokenizer, LMP-$\\texttt{tok}$, which significantly improves the performance of downstream autoregressive policies. Together, these results present a new perspective on latent reasoning for control through the lens of variational inference.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "generative control policies; latent reasoning; variational inference; reinforcement learning", "https://openreview.net/pdf?id=l7EUpXm16e", "", ""], ["https://openreview.net/forum?id=i2T2S39Zcm", "LeWAM: A JEPA World Action Model with Diffusion-Steering-Based MPC", "Shashank Hegde, Alexander Popov, Elie Aljalbout, Nikolai Smolyanskiy", "World action models (WAMs) predict actions and future observations, typically from a reconstruction-based representation that carries noisy, redundant information which can complicate downstream predictions. We introduce LeWAM, a bidirectional transformer for forward, backward, inverse dynamics and policy prediction, on a decoder-free JEPA latent trained end-to-end through all four modes. We see the following benefits. 1) Alignment: linear probing better reads robot and object state over a regular Le World Model (a forward-only JEPA world model), while successfully ignoring distractors, which a regular WAM considerably reconstructs. 2) Acting: Closed-loop evaluations of LeWAM match or exceeds a regular policy (without a world model) on the same encoder and at matched size. 3) Planning: While sampling raw actions in planning with WAMs allows MPC to exploit dynamic model inaccuracies, we show that planning in the noise space of these WAMs improves their closed-loop performance.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world-action-models; mpc; jepa", "https://openreview.net/pdf?id=i2T2S39Zcm", "", ""], ["https://openreview.net/forum?id=b7wZqqQzON", "Meaning Reaches Object Choice but Not Completion: Where Is a VLA Vulnerable to Landmark Synonyms?", "RYOICHI KURIHARA, Kota Sunamoto", "VLA policies are fragile to rewording. Success rates alone cannot say whether a policy fails to choose the object or to complete the task, nor where in the policy to intervene. We study the released GR00T N1.7 on two LIBERO-Spatial tasks differing only in the landmark word telling which of two bowls to take. Synonyms absent from the training instructions send the policy to the bowl they name, unlike made-up words, yet complete 67.6% of one task's closed-loop episodes, against the original word's 100%. Before the connector between the vision-language model and the action generator, replacing only the landmark tokens' vectors with the other landmark's (pasting) sends nearly every episode to the other bowl. After the connector, pasting at the landmark, the remaining instruction, or the image tokens alone rarely moves the choice, but any two do. Hiding the landmark tokens from the action generator after the connector still lowers completion for the synonyms that fall short. Finetuning on diversified landmark words repairs that one task's completion for synonyms absent from finetuning; finetuning on the original instructions does not. Training only the connector on the diversified words suffices, as does copying the connector of a policy fully finetuned on them into one finetuned on the original instructions. An open-loop score on starting frames misses that weights outside the connector also carry part of the repair. For now, on this evidence, robustness to rewording should be judged in closed loop, with actions executed, intervening on both sides of the connector, scoring choice and completion separately.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vision-language-action models; action gap; language grounding; causal intervention; paraphrase robustness", "https://openreview.net/pdf?id=b7wZqqQzON", "", ""], ["https://openreview.net/forum?id=6Mvoxqkmtx", "MimicShape: From One Real Object to Many via Real-to-Sim-to-Real Trajectory Replay for Manipulation Policy Learning", "Yalcin Tur, Wensi Ai, Chen Geng, Arthur Ilyasov, Cem Gokmen, Jiajun Wu, Yunzhu Li, Li Fei-Fei, Ruohan Zhang", "Generalizing imitation-learned manipulation policies to unseen objects requires demonstrations across many object instances, making real-world data collection costly. Demonstration augmentation can reduce this collection burden, but demonstrated motions are tied to the source object’s geometry, making object diversity difficult to expand while reusing recorded trajectories. We present MimicShape, a real-to-sim-to-real system that expands object diversity in demonstration data by keeping real-world trajectories unchanged and generating compatible objects in simulation. A synchronized digital twin extracts contact and clearance constraints from the recorded trajectories, and an agentic system generates diverse, textured objects that satisfy these constraints. Simulation replay verifies that the original actions succeed on each candidate, yielding new visual observations paired with unchanged real-world actions. Across eight tasks on rigid, articulated, and deformable objects, four real and four simulated, MimicShape improves success rates on unseen objects over the strongest applicable baseline on every task by 15.5 percentage points on average. On real-world mug hanging, augmenting 50 demonstrations on one mug raises success on unseen mugs from 19% to 51%, against 63% for 250 demonstrations collected on five real mugs.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "imitation learning; real-to-sim-to-real transfer; object generalization; synchronized digital twins; trajectory replay; object generation", "https://openreview.net/pdf?id=6Mvoxqkmtx", "", ""], ["https://openreview.net/forum?id=1kmPjIZRNs", "MolmoAct2: Action Reasoning Models for Real-World Deployment", "Haoquan Fang, Jiafei Duan, Donovan Clay, Sam Wang, Shuo Liu, Weikai Huang, Xiang Fan, Wei-Chuan Tsai, Shirui Chen, Yi Ru Wang, Shanli Xing, Jaemin Cho, Jae Sung Park, Ainaz Eftekhar, Peter Sushko, Karen Farley, Angad Wadhwa, Cole Harrison, Winson Han, Ying-Chun Lee, Eli VanderBilt, Rose Hendrix, Suveen Ellawela, Lucas Ngoo, Joyce Chai, Jason Ren, Ali Farhadi, Dieter Fox, Ranjay Krishna", "Vision-Language-Action (VLA) models aim to provide a single generalist controller for robots, but today's systems fall short on the criteria that matter for real-world deployment. Frontier models are closed, open-weight alternatives are tied to expensive hardware, reasoning-augmented policies pay prohibitive latency for their grounding, and fine-tuned success rates remain below the threshold for dependable use. We present MolmoAct2, a fully open action reasoning model built for practical deployment, advancing its predecessor, MolmoAct along five axes. We introduce Molmo2-ER, a VLM backbone specialized for spatial and embodied reasoning, trained on a 3.3M-sample corpus with a specialize-then-rehearse recipe. We release three new datasets spanning low-to-medium cost platforms: MolmoAct2-BimanualYAM Dataset, 720 hours of teleoperated bimanual trajectories that constitute the largest open bimanual dataset to date; MolmoAct2-DROID Dataset, a quality-filtered Franka subset of DROID; and MolmoAct2-SO100/101 Dataset, a quality-filtered SO-100/101 subset. We provide OpenFAST Tokenizer, an open-weight, open-data action tokenizer trained on millions of trajectories across five embodiments. We redesign the architecture to graft a flow-matching continuous-action expert onto a discrete-token VLM via per-layer KV-cache conditioning. Finally, we propose MolmoAct2-Think, an adaptive-depth reasoning variant that re-predicts depth tokens only for scene regions that change between timesteps, retaining geometric grounding at a fraction of prior latency. In the most extensive empirical study of any open VLA to date, spanning 7 simulation and real-world benchmarks, MolmoAct2 outperforms strong baselines including π0.5, while Molmo2-ER surpasses GPT-5 and Gemini Robotics ER-1.5 across 13 embodied-reasoning benchmarks. We release model weights, training code, and complete training data.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "open science models; robotics foundation models; imitation learning; robot learning", "https://openreview.net/pdf?id=1kmPjIZRNs", "", ""], ["https://openreview.net/forum?id=m9avyXDP2i", "MOMASPLAT: Dynamic Novel-View Demonstration Augmentation for Mobile Manipulation", "Sateesh Kumar, Arnav Balaji, Arpit Bahety, Skand Peri, Georgios Pavlakos, Roberto Martín-Martín", "Visuomotor policies trained through imitation learning are highly sensitive to changes in camera viewpoint. This is particularly problematic for mobile manipulation (MoMa), where robots rarely execute manipulation from the exact same base pose used during demonstration collection due to navigation uncertainty, localization drift, and environmental constraints. Recent approaches use novel-view synthesis (NVS) to augment demonstrations with unseen viewpoints, but they assume static scenes and therefore fail to re-render the manipu8 lated object during contact-rich interactions, leaving the most critical parts of the demonstration unaugmented. We present MOMASPLAT, a novel-view demonstration augmentation framework for mobile manipulation that synthesizes full manipulation trajectories from unseen robot base poses, including dynamic object interactions. Our key insight is that standard MoMa data collection naturally provides the multi-view observations needed to reconstruct both the static scene and the manipulated object in 3D. MOMASPLAT combines 3D Gaussian Splatting, feed-forward 3D foundation models, and kinematics-based action retargeting to separately reconstruct the scene and manipulated object, render them from novel viewpoints, and generate geometrically consistent synthetic demonstrations paired with transformed actions. We evaluate MOMASPLAT on five real-world mobile manipulation tasks involving both rigid and articulated objects across three scenes. MOMASPLAT substantially improves robustness to unseen base poses, achieving non-trivial success beyond 25 cm where all baselines fail, while reducing the need for large-scale real-world data collection.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "real2sim2real; mobile manipulation; imitation learning", "https://openreview.net/pdf?id=m9avyXDP2i", "", ""], ["https://openreview.net/forum?id=k671debnN4", "NF-VLA: A Normalizing-Flow Baseline for Vision-Language-Action Learning", "Ruichen Deng, Qinyu Zhao, Yong-Hyun Park, Mutian Tong, Liang Zheng, Jiatao Gu", "Autoregressive normalizing flows (NFs) provide a tractable density for learning and sampling continuous robot actions. We show that a single maximum-likelihood objective can train vision--language--action (VLA) policies competitive with leading methods on manipulation benchmarks. We present NF-VLA, which combines conditional autoregressive normalizing flows with score-based action refinement. Its deep--shallow architecture concentrates visual, language, and proprioceptive prefix conditioning in a high-capacity deep block, while unconditioned shallow blocks provide a shared invertible action transformation. The vision--language backbone and flow are jointly trained by exact maximum likelihood on Gaussian-smoothed action chunks. The same learned density supplies a single score-based correction at inference, refining generated actions to account for training-time smoothing without a separately trained denoiser. Trained on LIBERO from a pretrained vision--language backbone without robot pretraining, NF-VLA achieves 98.35\\% success across the four standard suites and 72.6\\% on LIBERO-Plus using the same checkpoint without further fine-tuning. Ablations show that deep-only prefix conditioning and score-based refinement both improve closed-loop success. Together, these results establish carefully structured autoregressive flows as a competitive approach to VLA control, with one learned density supporting policy training, action generation, and refinement.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vision-language-action models; autoregressive normalizing flows; imitation learning; robot manipulation", "https://openreview.net/pdf?id=k671debnN4", "", ""], ["https://openreview.net/forum?id=TLBjMBWUmO", "One from Infinity: Actualizing Futures from Pretrained World Models into Robot Actions", "Bang Du, Yichen Xie, Shuqi Zhao, Yuxin Chen, Menglin Wu, Masayoshi Tomizuka", "A pretrained video world model admits many plausible futures for a scene, but a robot must realize the exact task-conditioned one. To turn world models into executable robot policies, existing methods fine-tune the heavy world model backbone using large-scale robot data and computational resources. Challenging this status quo, we argue that the expensive part has already been paid in the world model pretraining since the representation space of a video world model lays out the diverse potential futures. In this case, what remains is to select the future that accomplishes the task and to read out the actions that realize it. We formalize this task as actualization, which learns a task-conditioned selection and realization on top of a prior supplied by a frozen world model. This can be solved by a tiny actualizer model. We implement RoboActualizer with as few as 60M parameters on top of a frozen world model encoder. The actualizer is composed of two lightweight DiT experts that jointly predict future latents and actions by flow matching. The model can be trained entirely on a single GPU with 32 GB peak memory. With up to 100x fewer trainable parameters than existing WAMs and VLAs, RoboActualizer reaches great performance on simulation benchmarks including LIBERO, LIBERO-Plus, RoboTwin 2.0 and five tasks on two real-world platforms, with a low latency of 39 ms that allows real-time control.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot learning; video world models; world action model", "https://openreview.net/pdf?id=TLBjMBWUmO", "", ""], ["https://openreview.net/forum?id=GpQjVyrHdQ", "One Trajectory, Two Requirements: Accuracy and  Local Stability in Euler Sampling for Flow Matching Policies", "Mahindra Singh Rautela", "Flow matching robot policies commonly use a fixed Euler step count selected from offline accuracy sweeps. At inference time, however, each policy input (visual observation, robot state, and language instruction) together with a source-noise draw defines a different ODE trajectory and sequence of local Jacobians. We ask whether a step count that accurately follows the nominal noise-to-action trajectory can still be too coarse for strongly contracting directions around it. An exact two-coordinate system and a controlled augmentation of six trained flow models show that trajectory accuracy and local Euler stability can impose different step requirements even when the original learned transport is unchanged. We then study a frozen $\\pi_{0.5}$-LIBERO checkpoint without modifying its weights or action dynamics. Across 30 policy inputs from 10 LIBERO-10 tasks, the Jacobian exhibits strong contracting directions near the action endpoint, yet no sampled mode violates the Euler non-expansion condition. On five of those inputs, accuracy sweeps require 4-9 Euler steps at 5\\% terminal error and 87-112 at 1\\%. These five paired cases are therefore consistent with accuracy-limited rather than stability-limited sampling under this local criterion, while the controlled experiments show why endpoint accuracy alone cannot rule out a separate stability requirement.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "flow matching policy; vla; stiffness; stability; euler sampling", "https://openreview.net/pdf?id=GpQjVyrHdQ", "", ""], ["https://openreview.net/forum?id=Q2ZkhLAFo5", "OpenWAM: An Open, Modular Exploration Towards Systematic World–Action Model Pretraining", "Yuran Wang, Siqiao Huang, Mingleyang Li, Chenhao Zhang, Jiaqi Liang, Weiyang Jin, Yue Chen, Xuemin Chi, Donghao Zhou, Qize Yu, Yu-Kai Wang, Yuhan Rui, Shenzhe Yao, Zhen Yuan, Zhenhao Shen, Kefei Zhu, Zijie Zhu, Ning Gao, Xiaowei Chi, Guanqi He, Shanghang Zhang, Hao Dong, Lin Shao, Hang Zhao", "World–Action Models inherit world knowledge from video-generative priors, and channel it into executable control signals through embodied experience. Existing systems, however, are monolithic: the generative backbone, visual representation, architecture, information flow, inference procedure, and training data are tightly coupled, obscuring which design choices matter and why. We introduce OpenWAM, an open research stack that turns world–action pretraining into a controlled experimental program. OpenWAM-Infra factorizes the WAM design space into composable modules with unified training, inference, deployment, and evaluation. On this substrate, OpenWAM-Study examines three questions through controlled experiments: what to inherit, how world and action learning interact, and how their synergy scales; and distills three principles: upstream knowledge transfers through a sufficiently capable generative backbone and a compact, information-rich latent space; world–action synergy requires dedicated action capacity, explicit world-to-action information flow, and synchronized joint denoising; and embodied pretraining principally improves out-of-domain generalization, with one-stage co-training over egocentric and robot data integrating world coverage and action grounding. Composing these principles, we build OpenWAM-α, an open WAM pretrained on roughly 6,400 hours of egocentric human and robot data and evaluated across simulation and real-world benchmarks. Across the eight simulation benchmarks and the real-robot experiments, which together span embodiments from single-arm and bimanual manipulation to dexterous hands, OpenWAM-α delivers consistently excellent performance, sustaining its top-tier standing from simulation to the physical world. We release the full stack, including infrastructure, evaluation protocols, pretrained models, and data recipes, to facilitate future research.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world–action models; robot learning", "https://openreview.net/pdf?id=Q2ZkhLAFo5", "", ""], ["https://openreview.net/forum?id=VcS0dE1Aoz", "Parvulus: A 10M-Scale World Action Model for Robot Manipulation", "Abdullah Ali Sivas, Peter Cho-Ho Lam, Zirui Zhou, Yong Zhang", "Vision-based robot manipulation increasingly relies on multi-billion parameter models. However, standard imitation learning uses capacity inefﬁciently. In this work, we show that latent physical grounding improves policy representations. Auxiliary generative decoders ground representations in spatial geometry and dynamics during training. These decoders detach entirely at inference. Trained from scratch on the LIBERO corpus, our 9.9M parameter policy, Parvulus, achieves a 90-92% success rate. It operates at > 100 Hz with < 10 ms latency. By matching models over 100× larger, Parvulus advances the Pareto frontier of parameter efﬁciency among language-conditioned policies.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot manipulation; world action models; parameter efﬁciency; flow matching", "https://openreview.net/pdf?id=VcS0dE1Aoz", "", ""], ["https://openreview.net/forum?id=aJaH4nEfmC", "PhysicsMind: Sim and Real Mechanics Benchmarking for Physical Reasoning and Prediction in Foundational VLMs and World Models", "Chak-Wing Mak, Guanyu Zhu, Boyi Zhang, Hongji Li, Kevin Zhang, Xiaowei Chi, Yichen Wu, Yangfan He, Chun-Kai Fan, Wentao Lu, Kuangzhi Ge, Xinyu Fang, Hongyang He, Kuan Lu, Li Zhang, Yongxin Ni, Zhanhua Zhang, Youhua Li, Shanghang Zhang", "Foundation vision--language and video-generative models can produce plausible answers and videos without consistently respecting physical laws, making their suitability for world-to-action grounding difficult to assess. We introduce \\textbf{PhysicsMind}, a controlled mechanics benchmark with 480 videos balanced between real and simulated Center of Mass, Lever Equilibrium, and Newton's First Law scenarios. The VQA track evaluates multiple-choice inference from initial frames; the video-generation track evaluates rollouts conditioned on an initial frame and a description of the setup. Scenario-specific metrics measure mask geometry, lever terminal states, and reference-trajectory agreement rather than combining distinct physical signals into a single score. Evaluating 21 VLMs and seven video-generative models reveals uneven performance across mechanics subtasks and no uniformly strong model. In a targeted five-model VQA diagnostic, spatial/geometric grounding and physical reasoning account for 68.4\\% of categorized incorrect responses. An eight-model Lever comparison supplies exact masses and lever-arm positions as text, yielding accuracy gains of 0.0--44.2 percentage points while leaving residual errors in several models. Video generators reach 4.76--47.62\\% Lever final-state accuracy and show differing strengths across geometric and motion metrics. PhysicsMind provides interpretable diagnostics of mechanics prerequisites relevant to robotics; predictive validity for downstream policies and closed-loop control remains to be established.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "physical reasoning; vision-language models; world models; video generation; mechanics benchmark; real and simulated data", "https://openreview.net/pdf?id=aJaH4nEfmC", "", ""], ["https://openreview.net/forum?id=tDsKr7Z5TP", "Pre-trained Image Generators for Adaptive Robot Simulation", "Jiong Lin, Yihong Liu, Judah Goldfeder, Hod Lipson", "Action-conditioned generative models of robots usually use egocentric views from the robot's cameras, which limit the view to the gripper and its workspace and leave the rest of the body unseen. We study the third-person view: given one image of a robot with its end-effector and camera poses, render the whole robot at a new end-effector pose, from a new camera pose, or both. At test time, the model needs no URDF, joint angles or simulator. We fine-tune the image generator FLUX.2 with LoRA on image pairs streamed from MuJoCo, and give it the end-effector and camera poses as condition tokens together with a per-pixel end-effector ray heatmap. On a 5-DoF WidowX 200 in two render styles and a 7-DoF Franka FR3, the predicted arm reaches a body IoU, the mean IoU of the arm links below the wrist, of 0.27–0.53, against at most 0.08 for nearest-neighbor retrieval and 0.19 for large language models that write rendering code. When the robot's upper arm is bent, continuing to train the model on 30–300 trajectories of the modified robot adapts it toward the new body.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "robot simulation; world models; image generation; robot self-modeling; morphology adaptation", "https://openreview.net/pdf?id=tDsKr7Z5TP", "", ""], ["https://openreview.net/forum?id=MwnWdUaeBJ", "Predicting What Matters: interaction-Centric 4D World-Action Models", "Luoxin Ye, Baichuan Huang, Kai Gao, Ruolin Ye, Dylan Randle, Jeroen Vanbaar, Alan Yuille, Manikantan Nambi, Jose Barreiros", "Robotic manipulation requires anticipating the evolution of task-relevant entities and translating these predictions into actions. We introduce a compact world-action model that grounds control in functional semantic entities and their 3D motion, without dense RGB reconstruction. A capable System-2 model reasons about task-relevant entities and subtask structure, guiding the construction of dense semantic masks, 3D point tracks, and subtask goals. This structured supervision trains a compact System-1 model to jointly predict goal semantics, interaction-centric scene evolution, and robot actions. By concentrating future prediction on entities and motion that matter for interaction, the model supports reactive control with approximately 0.3B trainable parameters (1.3B total). It achieves a 98.6% success rate on LIBERO and averages 86.0% across seven LIBERO-Plus categories. On real-world dexterous tool use and sequential object removal, it achieves an average success rate of 87.5%, exceeding the strongest baseline by 27.5 percentage points. Controlled ablations examine the choice of future supervision targets and the importance of a capable System-2 model. These results support task-centric semantic and geometric prediction as an effective basis for compact world-action modeling.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "world-action models; robotic manipulation; task-centric representation", "https://openreview.net/pdf?id=MwnWdUaeBJ", "", ""], ["https://openreview.net/forum?id=QQEU5dmT7w", "ReasonDPO: Failure-Aware Preference Optimization for Vision-Language-Action Models", "Udita Ghosh, Jingzong Zhou, Konstantinos Karydis, Mike Grosskopf, Amit Roy-Chowdhury", "Vision-Language-Action (VLA) models map multimodal observations and language instructions directly to control actions, bringing foundation-model capabilities to robotics. However, these models being trained with behavioral cloning from successful trajectories limits generalization capabilities by ignoring diverse failure modes. Preference-based fine-tuning like Direct Preference Optimization (DPO) addresses this by contrasting successful and failed trajectories, but whole-trajectory comparisons are often noisy, as failures can occur at different times and for different reasons. We propose ReasonDPO, a failure-aware preference learning framework that leverages both the timing and cause of failures to localize where execution diverges from success. Instead of applying DPO over entire trajectories, ReasonDPO restricts supervision to segments where meaningful behavioral differences arise, masking earlier portions that are largely indistinguishable and increasing the weight of more severe failures. This avoids penalizing correct actions and focuses learning on informative decision points that determine task success. Experiments on the LIBERO benchmark show that our approach gives significant improvements in both success rates and failure severity on all the tasks suits over standard baselines, highlighting the importance of localized failure reasoning for improving performance in VLA models.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "preference based rl; embodied ai; vision language action models", "https://openreview.net/pdf?id=QQEU5dmT7w", "", ""], ["https://openreview.net/forum?id=hDF65o5uoJ", "Reliability-Aware Future Conditioning for Grounding Generated Videos in Robot Actions", "Mike Degany, Mohammad Khoshnazar, Deyuan Qu, Qing Yang", "Generative video models can show how a manipulation task should unfold, providing visual guidance for robot policies.\nHowever, a generated video may show the correct task while progressing faster or slower than the robot, making its guidance unreliable.\nOn CALVIN, shifting a generated future by five frames reduces success from 69.8\\% to 34.2\\%, below the 54.0\\% achieved without future guidance.\nWe introduce \\emph{Reliability-Aware Future Conditioning} (RAFC), which learns how strongly to rely on a generated future and which nearby temporal version to use at each control step.\nRAFC combines a static fallback with temporally shifted versions of the future through a learned gate, while a bounded residual policy adjusts the resulting action.\nThe gate and residual policy learn jointly from task reward, without timing labels, alignment supervision, or online video regeneration.\nAcross off-grid temporal shifts, RAFC increases average success from 51.8\\% to 73.7\\%, exceeding uniform averaging of the same candidates by 7.0 percentage points.\nAdditional tests use independently generated video windows, changes in video playback rate, and sudden timing shifts during execution.\nOn three physical Franka tasks, aggregate success improves from 26.7\\% to 56.7\\%.\nThese results show that adapting how a policy uses generated futures helps translate visual predictions into reliable robot actions.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "generative video models; world-to-action grounding; future-conditioned control; reinforcement learning", "https://openreview.net/pdf?id=hDF65o5uoJ", "", ""], ["https://openreview.net/forum?id=icPZndFvQI", "Retriever: Composing the Perception-Reasoning-Action Loop for Long-Horizon Manipulation", "Linfeng Zhao, Haojie Huang, Jiayuan Mao, Weiyu Liu, Lawson L.S. Wong, Mykel Kochenderfer", "Building long-horizon robot agents requires composing closed-loop pipelines for perception, belief update, planning, and control whose components run at different clocks and with variable latency. Today, these systems are often assembled with ad-hoc concurrency and pub/sub conventions that make timing and input-consumption semantics implicit, yielding schedule-dependent behavior that is hard to reproduce, debug, and reuse. Current solutions typically solve parts of this problem at either the algorithmic or the systems layer, but not both. In this work, we propose Retriever, which spans the entire stack: an asynchronous decision model, a programming model, a runtime, and an example closed-loop agent pipeline. Retriever represents an agent as a graph of stateful causal stream functions executed on explicit run clocks. We formalize this view via an asynchronous environment-agent loop over continuous-time streams and show that finite-memory causal policies can be represented by compositions of these operators. Retriever compiles these graphs to multiple backends and provides a deterministic replay contract when consumed inputs, clock/commit traces, and stochastic outputs are logged. We evaluate Retriever through a real-robot case study.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "planning; agent; long-horizon manipulation", "https://openreview.net/pdf?id=icPZndFvQI", "", ""], ["https://openreview.net/forum?id=EtgHh96v9D", "RoboCurate: Harnessing Diversity with Action-Verified Synthetic Data for Robot Learning", "Seungku Kim, Suhyeok Jang, Byungjun Yoon, Dongyoung Kim, John Won, Jinwoo Shin", "Synthetic data generated by video generative models has shown promise for robot learning as a scalable pipeline, but it often suffers from noisy action labels due to imperfect video generation or inaccurate action prediction. Recently, vision-language models (VLMs) have been leveraged to validate video quality, but they cannot directly evaluate the generated actions themselves. To tackle this issue, we introduce RoboCurate,  a novel framework for action-verified synthetic robot data that addresses inconsistencies between generated videos and annotated actions. Specifically, RoboCurate executes the actions predicted by an inverse dynamics model (IDM) in a simulator and verifies action consistency by measuring the motion agreement between the simulator rollout and the generated video. To better leverage such a framework, we further expand the scene diversity of synthetic data beyond the available dataset through off-the-shelf generative models with structured editing axes. We then use a VLM to pre-filter physically implausible generated videos before verifying their action labels. Across diverse manipulation scenarios, RoboCurate yields substantial relative improvements in success rates compared to using only real data, achieving +90.3\\% on GR-1 Tabletop (300 demos), +29.1\\% on DexMimicGen in the pre-training setup on simulation benchmarks, and  +179.9\\% and +42.9\\% in the co-finetuning setup on challenging real-world ALLEX and OpenArm humanoid benchmarks, respectively.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "synthetic data generation; data curation; robotic manipulation", "https://openreview.net/pdf?id=EtgHh96v9D", "", ""], ["https://openreview.net/forum?id=iHQ7qhCOUl", "RoboJudge: Multimodal Language Models as Judges for Embodied Video Generation", "Siyuan Ma, Yu Qi, Cheng Ye, Ruotian Peng, Xinyi Xu, Zitiantao Lin, Zedong Cai, Yijian Huang, Weiyang Liu, Siyuan Wang, Yandong Wen", "Video generation models are promising foundations for embodied world models, but only if their generated rollouts are physically valid and faithful to task instructions. Multimodal large language models (MLLMs) are increasingly used to judge these properties, yet their agreement with human judgments on embodied videos has not been systematically evaluated. To address this gap, we introduce ROBOJUDGE-BENCH, a benchmark for evaluating MLLMs as judges of embodied video generation. The benchmark measures two fundamental dimensions, Physical Adherence and Instruction Alignment, across 800 human-annotated videos from 8 source corpora and 10 video generators, spanning grippers, human hands, and dexterous hands. Experiments reveal uneven alignment between existing judges and human ratings: general-purpose MLLMs show lower agreement on physical adherence, while specialized video judges designed for general-domain physical reasoning do not consistently transfer to embodied scenarios. Motivated by these findings, we construct ROBOJUDGE-TRAIN, comprising 12K videos annotated with 25K human-verified scores and model-assisted rationales for Physical Adherence and Instruction Alignment. We fine-tune a 9B MLLM on this dataset with supervised learning followed by reinforcement learning, yielding ROBOJUDGE-9B. Among the model judges evaluated on ROBOJUDGE-BENCH, ROBOJUDGE-9B achieves the highest overall agreement, reaching a Pearson correlation of 0.719 with a statistically significant 0.089 gain over Gemini-3.7-Flash, the best-performing proprietary baseline in our evaluation. Training on ROBOJUDGE-TRAIN also yields gains on external benchmarks, including VideoPhy2 and Physion-Eval. We further use ROBOJUDGE-9B as a downstream evaluator to benchmark video generation models according to Physical Adherence and Instruction Alignment.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "multimodal large language models; generated video evaluation; embodied ai", "https://openreview.net/pdf?id=iHQ7qhCOUl", "", ""], ["https://openreview.net/forum?id=izlS0omws9", "RoboRender: Robot-Oriented Video Generation for Visual Sim-to-Real Transfer", "Huang Huang, Wensi Ai, Ziyu Chen, Youhui Wang, Zijian Du, Yang Liu, Jiaolong Yang, Li Fei-Fei, Jiajun Wu", "Simulation enables large-scale, low-cost robot data generation, but policies trained in simulation often fail to transfer to the real world due to the sim-to-real visual discrepancies. Existing approaches often rely on intermediate representations, which can discard rich semantic information or require additional perception modules at deployment. We address this visual sim-to-real gap with RoboRender, a framework that converts simulated trajectories into photorealistic RGB videos for policy learning. RoboRender trains a robot-oriented video generation model conditioned on simulated depth videos, language instructions, and robot RGB mask videos, preserving simulator geometry, robot motion, and action labels while synthesizing realistic textures, backgrounds, and distractors. The generated RGB videos are paired with simulator-provided states and actions to train policies for zero-shot real-world deployment. On robot video test sets, our video model outperforms depth-conditioned video generation baselines in generation quality. In real-world experiments across pick-and-place, articulated-object manipulation, and mobile manipulation tasks, policies trained on RoboRender-generated data achieve a 71% average success rate, outperforming raw simulation renderings and conventional visual domain randomization by approximately 7.1×and 3.6×, respectively. We further show that policy performance improves with more generated videos per simulation trajectory, increasing opening-task success by 65 percentage points. These results demonstrate that generative video rendering mitigates the visual sim-to-real gap for zero-shot policy transfer.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "sim-to-real transfer; video generation models", "https://openreview.net/pdf?id=izlS0omws9", "", ""], ["https://openreview.net/forum?id=XHGXh4cerN", "Robotic VLA Benefits from Joint Learning with Motion Image Diffusion", "Yu Fang, Kanchana Ranasinghe, Le Xue, Honglu Zhou, Juntao Tan, Ran Xu, Shelby Heinecke, Caiming Xiong, silvio savarese, Daniel Szafir, Mingyu Ding, Michael S Ryoo, Juan Carlos Niebles", "Vision-Language-Action (VLA) models have achieved remarkable progress in robotic manipulation by mapping multimodal observations and instructions directly to actions. However, standard VLA training primarily optimizes action prediction and does not explicitly exploit the rich future visual motion available in robot demonstrations. To address this limitation, we propose joint\naction-motion learning with motion image diffusion, where action generation and future visual motion generation are optimized together through a shared VLM backbone. Our method extends a pretrained VLA with two parallel generative pathways: the original action head predicts future action in control space, while a motion head, implemented as a Diffusion Transformer (DiT), predicts optical-flow-based future motion images in pixel space. Joint optimization couples action prediction with dense visual-motion supervision, encouraging the shared VLM representation to capture temporally structured and motion-aware information useful for control. Importantly, the resulting policy preserves the original VLA action-generation pathway at deployment and introduces no additional inference-time latency. Experiments in both simulation and real-world manipulation demonstrate the benefits of joint action-motion learning: our method achieves an average success rate of 97.5% on LIBERO, including a substantial improvement on LIBERO-Long, reaches 58.0% on RoboTwin, and improves average real-world success from 50.0% to 66.7% under limited demonstration data. More details can be found at: https://anonymous.4open.science/w/anonymous-6F813R/", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "vla; joint learning; motion image diffusion", "https://openreview.net/pdf?id=XHGXh4cerN", "", ""], ["https://openreview.net/forum?id=2Z84lmClzu", "SCAR: Self-Supervised Continuous Action Representation Learning", "Hongjia Liu, Fan Feng, Minghao Fu, Xinyue Wang, Haofei Lu, Biwei Huang", "Despite the central role of action in embodied intelligence, learning transferable action representations from visual transitions remains a fundamental challenge, particularly when world models must generalize across embodiments under limited data. We argue that action is not merely an auxiliary conditioning signal, but a distinct representational factor that decouples the controllable change from embodiment-specific actuation. In this work, we propose SCAR, a joint inverse–forward dynamics framework for learning unified action representations across embodiments from visual transitions. Built on a pretrained generative backbone, SCAR uses an inverse dynamics model (IDM) to infer latent actions from latent observation pairs and a forward dynamics model (FDM) to predict future dynamics conditioned on them. To make the latent space transferable rather than a generic visual bottleneck, we regularize the latent action posterior toward a standard Gaussian prior to limit arbitrary visual encoding, and introduce adversarial invariance to suppress embodiment- and environment-specific nuisance factors. Experiments on the Procgen and Robotwin dataset show that the learned unified latent action representation serves as a stronger conditioning interface for world modeling than embodiment-specific raw actions, yielding improved cross-embodiment low-data adaptation and cross-task transfer. Taken together, these results suggest that action can be learned as a shared representation of controllable change across embodiments, providing an interface for more transferable and generalizable world models.", "The action gap: large generative models (video, image, 3D) learn rich knowledge", "latent action; world model; generative model", "https://openreview.net/pdf?id=2Z84lmClzu", "", ""], ["https://openreview.net/forum?id=0jBljtvW7F", "Seeing Through the Illusion: Test-Time Scaling for World Action Models", "Cheikh Ahmed, Mahdi Mostajabdaveh, Milad Yazdani, Zirui Zhou", "World action models (WAMs) jointly generate robot actions and imagined future observations, creating an opportunity to improve control at test time by sampling and selecting among multiple candidate rollouts. The key challenge is determining which rollout constitutes the most reliable control proposal before execution. We introduce WISE (World Action Inference Scaling through Evaluation), a process-level selector that evaluates each candidate using three signals: (i) an embodiment-aware prior over action validity and temporal regularity, (ii) an inverse-dynamics consistency score that measures agreement between the co-generated action and imagined transition, and (iii) an instruction-conditioned estimate of task progress or value. These signals are fused to rank native WAM rollouts within a receding-horizon control loop, while keeping the underlying model frozen. We evaluate WISE across two WAM-embodiment settings: Cosmos3 Edge on RoboLab and DreamZero on LIBERO. WISE improves closed-loop success from 6.0% to 24.0% on RoboLab, achieving the highest observed performance among the evaluated
